/* Agrega al catálogo lo que falte.
   Los cuartos y componentes se buscan POR NOMBRE, no por id: cada instalación
   generó sus propios ids al sincronizar, y apuntar a un id fijo hacía que una
   tipología de turbo quedara ligada a "Regulador" en unas bases y a otra cosa
   en otras. Si el destino no existe, el campo queda vacío — que significa
   "sirve para cualquier componente" y no rompe nada. */
function idPorNombre(lista, nombre){
  if(!nombre) return "";
  const x = sinTildes(nombre).trim().toUpperCase();
  const t = lista.find(o=>sinTildes(o.nombre).trim().toUpperCase()===x);
  return t ? t.id : "";
}
var NOMBRE_DE_ID = {
  cu_elec:"Electrónico", cu_unit:"Unitario", cu_mec:"Mecánico", cu_turbo:"Turbos",
  tc_iny_cr:"Inyector Common Rail", tc_bomba_alta:"Bomba de alta presión CR",
  tc_edc:"Bomba electrónica EDC", tc_turbo:"Turbo", tc_iny_mec:"Inyector mecánico",
  tc_iny_unit:"Inyector unitario", tc_riel:"Riel Common Rail",
  tc_bomba_b7:"Bomba B7", tc_bomba_pld:"Bomba PLD"
};

function sembrarTipologias(){
  const porNombre = {};
  DB.tipologias.forEach(t=>{ porNombre[sinTildes(t.nombre).trim().toUpperCase()] = t; });
  let n=0;
  TIPOLOGIAS_BASE.forEach(([id,nombre,cuartoId,tipoComponenteId,alias])=>{
    if(DB.tipologias.some(t=>t.id===id)) return;
    const clave = sinTildes(nombre).trim().toUpperCase();
    const ya = porNombre[clave];
    if(ya){
      /* Ya existe con ese nombre: no se duplica. Solo se le suman los alias
         nuevos, que es lo único que aporta la semilla. */
      if(alias){
        const tiene = new Set(String(ya.alias||"").split(/[,;|]/).map(x=>sinTildes(x).trim().toUpperCase()).filter(Boolean));
        const suma = alias.split(",").map(x=>x.trim()).filter(a=>a && !tiene.has(sinTildes(a).trim().toUpperCase()));
        if(suma.length){ ya.alias = [String(ya.alias||"").trim(), ...suma].filter(Boolean).join(", "); n++; }
      }
      return;
    }
    const t = {
      id, nombre, alias: alias||"",
      cuartoId: idPorNombre(DB.cuartos, NOMBRE_DE_ID[cuartoId]||""),
      tipoComponenteId: idPorNombre(DB.tiposComponente, NOMBRE_DE_ID[tipoComponenteId]||"")
    };
    DB.tipologias.push(t);
    porNombre[clave] = t;
    n++;
  });
  return n;
}

/* Repara lo que sembré mal en la versión anterior: tipologías con ids fijos
   que en esta base apuntaban a otro componente, y las que quedaron repetidas
   sin haberse usado nunca. */
function repararSemilla(){
  let n=0;
  const idsSemilla = new Set(TIPOLOGIAS_BASE.map(x=>x[0]));
  const uso = id => DB.componentes.filter(c=>c.tipologiaId===id).length;

  /* 1. Las sembradas que nunca se usaron y repiten un nombre existente, sobran. */
  const fuera = new Set();
  DB.tipologias.forEach(t=>{
    if(!idsSemilla.has(t.id) || uso(t.id)) return;
    const gemela = DB.tipologias.find(o=>o.id!==t.id && !idsSemilla.has(o.id)
      && sinTildes(o.nombre).trim().toUpperCase()===sinTildes(t.nombre).trim().toUpperCase());
    if(gemela){
      /* Antes de borrarla se le heredan los alias a la que se queda. */
      if(t.alias){
        const tiene = new Set(String(gemela.alias||"").split(/[,;|]/).map(x=>sinTildes(x).trim().toUpperCase()).filter(Boolean));
        const suma = String(t.alias).split(",").map(x=>x.trim()).filter(a=>a && !tiene.has(sinTildes(a).trim().toUpperCase()));
        if(suma.length) gemela.alias = [String(gemela.alias||"").trim(), ...suma].filter(Boolean).join(", ");
      }
      fuera.add(t.id); n++;
    }
  });
  if(fuera.size) DB.tipologias = DB.tipologias.filter(t=>!fuera.has(t.id));

  /* 2. A las sembradas que quedan se les vuelve a resolver el destino por
        nombre, por si apuntaban a un id que aquí significa otra cosa. */
  const mapa = {};
  TIPOLOGIAS_BASE.forEach(([id,,cu,tc])=>{ mapa[id]={cu,tc}; });
  DB.tipologias.forEach(t=>{
    const m = mapa[t.id]; if(!m) return;
    const cu = idPorNombre(DB.cuartos, NOMBRE_DE_ID[m.cu]||"");
    const tc = idPorNombre(DB.tiposComponente, NOMBRE_DE_ID[m.tc]||"");
    if(t.cuartoId!==cu || t.tipoComponenteId!==tc){ t.cuartoId=cu; t.tipoComponenteId=tc; n++; }
  });
  return n;
}


/* =========================================================================
   LIMPIEZA DE ARRASTRE
   Corrige de una vez lo que se fue acumulando entre versiones. Todo lo que
   hace es reversible desde un respaldo, y nada borra horas de trabajo:
   los registros siempre se reapuntan antes de eliminar nada.
   ========================================================================= */
function limpiezaDeArrastre(){
  let n = 0;
  const N = x => sinTildes(String(x||"")).trim().toUpperCase();

  /* 1. Tipos de componente repetidos por nombre.
        Gana el que tenga componentes colgando; el otro cede los suyos. */
  const porNombreTC = {};
  DB.tiposComponente.forEach(t=>{ (porNombreTC[N(t.nombre)] = porNombreTC[N(t.nombre)]||[]).push(t); });
  Object.values(porNombreTC).forEach(g=>{
    if(g.length<2) return;
    const carga = t => DB.componentes.filter(c=>c.tipoComponenteId===t.id).length;
    g.sort((a,b)=>carga(b)-carga(a));
    const queda = g[0];
    g.slice(1).forEach(v=>{
      DB.componentes.forEach(c=>{ if(c.tipoComponenteId===v.id) c.tipoComponenteId=queda.id; });
      DB.tipologias.forEach(t=>{ if(t.tipoComponenteId===v.id) t.tipoComponenteId=queda.id; });
      DB.tiposComponente = DB.tiposComponente.filter(x=>x.id!==v.id);
      n++;
    });
  });

  /* 2. Tipologías repetidas por nombre: se funden y se heredan los alias. */
  const porNombreTG = {};
  DB.tipologias.forEach(t=>{ (porNombreTG[N(t.nombre)] = porNombreTG[N(t.nombre)]||[]).push(t); });
  Object.values(porNombreTG).forEach(g=>{
    if(g.length<2) return;
    const carga = t => DB.componentes.filter(c=>c.tipologiaId===t.id).length;
    g.sort((a,b)=>carga(b)-carga(a));
    const queda = g[0];
    g.slice(1).forEach(v=>{
      DB.componentes.forEach(c=>{ if(c.tipologiaId===v.id) c.tipologiaId=queda.id; });
      const tiene = new Set(String(queda.alias||"").split(/[,;|]/).map(x=>N(x)).filter(Boolean));
      const suma = String(v.alias||"").split(/[,;|]/).map(x=>x.trim())
        .filter(a=>a && !tiene.has(N(a)));
      if(suma.length) queda.alias = [String(queda.alias||"").trim(), ...suma].filter(Boolean).join(", ");
      if(!queda.cuartoId && v.cuartoId) queda.cuartoId = v.cuartoId;
      if(!queda.tipoComponenteId && v.tipoComponenteId) queda.tipoComponenteId = v.tipoComponenteId;
      DB.tipologias = DB.tipologias.filter(x=>x.id!==v.id);
      n++;
    });
  });

  /* 3. Alias que no describen la tipología.
        "ATEGO" quedó como alias de STH y de PLD a la vez: cualquier orden de
        un Atego resolvía a una de las dos por azar. Un alias que aparece en
        más de una tipología no distingue nada, así que se retira. */
  const cuenta = {};
  DB.tipologias.forEach(t=>{
    String(t.alias||"").split(/[,;|]/).map(x=>N(x)).filter(Boolean)
      .forEach(a=>{ cuenta[a] = (cuenta[a]||0)+1; });
  });
  DB.tipologias.forEach(t=>{
    const partes = String(t.alias||"").split(/[,;|]/).map(x=>x.trim()).filter(Boolean);
    const buenos = partes.filter(a=>cuenta[N(a)]===1 && N(a)!==N(t.nombre));
    if(buenos.length!==partes.length){ t.alias = buenos.join(", "); n++; }
  });

  /* 4. Componentes de una orden que ya no existe. Sus registros quedan sin
        componente, no se borran: las horas trabajadas son un hecho. */
  const ordenes = new Set(DB.ordenes.map(o=>o.id));
  const sueltos = DB.componentes.filter(c=>!ordenes.has(c.ordenId));
  if(sueltos.length){
    const ids = new Set(sueltos.map(c=>c.id));
    DB.registros.forEach(r=>{ if(ids.has(r.componenteId)) r.componenteId = ""; });
    DB.componentes = DB.componentes.filter(c=>ordenes.has(c.ordenId));
    n += sueltos.length;
  }

  /* 5. Registros que apuntan a un componente inexistente. */
  const comps = new Set(DB.componentes.map(c=>c.id));
  DB.registros.forEach(r=>{ if(r.componenteId && !comps.has(r.componenteId)){ r.componenteId=""; n++; } });

  /* 6. Los tiempos estándar y el reparto por peso ya no se usan: el técnico
        escribe su propio tiempo. Se sueltan para no arrastrarlos en cada
        sincronización entre veinte dispositivos. */
  if((DB.estandares||[]).length){ n += DB.estandares.length; DB.estandares = []; }
  if((DB.repartos||[]).length){   n += DB.repartos.length;   DB.repartos = []; }

  return n;
}

/* =========================================================================
   REGLAS DE DESGLOSE
   La hoja de bodega tiene UNA columna para bombas, pero al laboratorio no
   siempre llega una sola clase. En el sistema B7 una cantidad de 3 casi
   siempre son 2 bombas B7 + 1 de transferencia (verificado en 11 órdenes;
   nunca aparecen 4 ni 5, y las observaciones de almacén lo confirman).
   La app aplica esa lectura, pero MARCA LA ORDEN PARA REVISAR: si algún día
   llegan 3 bombas B7 de verdad, coordinación lo corrige desde la orden.
   Es una costumbre del taller, no una verdad del componente: por eso se
   avisa en vez de darlo por hecho.
   ========================================================================= */
/* "7 / 6" significa 7 de una tipología y 6 de otra — la convención que ya se
   usa en PROGRAMACION (ver OT 36588). Sin esto, quitar todo lo que no es
   dígito convertía "7 / 6" en 76: sumaba las dos cantidades como si fueran
   una sola cifra. Mismo mecanismo que ya corre en el Panel de indicadores,
   para que las dos apps lean la hoja exactamente igual. */
function partirCantidadHoja(raw){
  const texto = String(raw==null?"":raw).trim();
  if(!texto) return [];
  if(texto.indexOf("/")<0) return [parseInt(texto.replace(/[^\d]/g,""),10)||0];
  return texto.split("/").map(p=>parseInt(String(p).replace(/[^\d]/g,""),10)||0);
}
const DESGLOSES = [
  /* En un motor B7 la columna BOMBAS nunca trae bombas de alta presión.
     Son bombas B7, y cuando la cantidad es 3 una de ellas es la de
     transferencia (verificado en 11 órdenes: nunca aparecen 4 ni 5, y las
     observaciones de almacén lo confirman: "BOMB TRANSF OK Y REGULADOR B7").
     Las de alta presión quedan para ISB, CP3, CP4, HP3, Denso y las demás. */
  { cuarto:"Electrónico", desde:"Bomba de alta presión CR", palabra:/\bb7\b/i,
    partir: function(n){
      return n===3
        ? [{nombre:"Bomba B7", cant:2}, {nombre:"Transferencia", cant:1}]
        : [{nombre:"Bomba B7", cant:n}];
    },
    nota: function(n){
      return n===3
        ? "3 bombas en un motor B7: se leyeron como 2 bombas B7 + 1 de transferencia. Verifica."
        : n+" bomba(s) en un motor B7: se leyeron como bombas B7, no de alta presión.";
    } }
];
/* Devuelve las partes en que se abre un componente, o null si no aplica. */
function desglosarComponente(tipo, cantidad, tipoTexto, cuartoOT){
  const nomCuarto = nom(DB.cuartos, cuartoOT, "");
  const n = +cantidad || 0;
  if(!n) return null;
  for(const d of DESGLOSES){
    if(d.cuarto!==nomCuarto) continue;
    if(nom(DB.tiposComponente,tipo.id,"")!==d.desde) continue;
    if(!d.palabra.test(String(tipoTexto||""))) continue;
    const partes=[];
    for(const p of d.partir(n)){
      if(!p.cant) continue;
      const t=DB.tiposComponente.find(x=>sinTildes(x.nombre)===sinTildes(p.nombre));
      if(!t) return null;                    /* falta ese tipo: mejor no partir */
      partes.push({tipo:t, cant:p.cant});
    }
    if(!partes.length) return null;
    return {partes, nota:d.nota(n)};
  }
  return null;
}
function resolverTipo(tipoBase, tokens, usados, cuartoOT){
  const fam=familiaDe(tipoBase.nombre);
  /* Motores híbridos que traen su propia bomba: si TIPO trae dos motores
     juntos (ej. "ISB / B7") y la columna BOMBAS llega sin partir en un solo
     número, ningún token la "reclama" explícitamente y por defecto ganaba el
     primero que aparece en el texto — casi siempre el motor equivocado.
     Cuando se busca justo una bomba, se prueba primero el motor que se sabe
     que trae bomba propia, sin importar en qué orden esté escrito.
     Real: OT 36588, 2 bombas B7 quedaban asignadas a ISB. */
  const PRIORIDAD_BOMBA = new Set(["B7"]);
  const tokens_ = (fam==="bomba")
    ? tokens.slice().sort((a,b)=>(PRIORIDAD_BOMBA.has(b)?1:0)-(PRIORIDAD_BOMBA.has(a)?1:0))
    : tokens;
  const familia=[tipoBase].concat(DB.tiposComponente.filter(t=>t.id!==tipoBase.id && familiaDe(t.nombre)===fam));
  const delCuarto = cuartoOT ? familia.filter(t=>t.cuartoId===cuartoOT) : [];
  const pref = delCuarto.length ? delCuarto : familia;
  /* 1) Tipología que TÚ ataste a ese componente: manda sobre todo.
        Así "VE → Bomba rotativa" gana a una tipología suelta creada sola. */
  for(const t of pref){
    for(const tk of tokens_){
      if(usados.has(tk)) continue;
      const ok=DB.tipologias.find(x=>x.tipoComponenteId===t.id && coincideTipologia(x,tk));
      if(ok) return {tipo:t, tip:ok, token:tk};
    }
  }
  /* 2) Tipología sugerida para ese componente por su cuarto, o libre. */
  for(const t of pref){
    for(const tk of tokens_){
      if(usados.has(tk)) continue;
      const ok=tipologiasDe(t.id).find(x=>coincideTipologia(x,tk));
      if(ok) return {tipo:t, tip:ok, token:tk};
    }
  }
  /* 3) Solo las tipologías que NO están atadas a otro componente.
        ISB puede cruzar a un turbo; "Lineal" no puede cruzar a un inyector. */
  for(const t of pref){
    for(const tk of tokens_){
      if(usados.has(tk)) continue;
      const ok=DB.tipologias.find(x=>!x.tipoComponenteId && coincideTipologia(x,tk));
      if(ok) return {tipo:t, tip:ok, token:tk};
    }
  }
  /* Última oportunidad: cualquier tipología cuyo nombre o alias coincida.
     Si el usuario ya dijo "esto es una tipología", debe valer siempre. */
  for(const t of pref){
    for(const tk of tokens_){
      if(usados.has(tk)) continue;
      const ok=DB.tipologias.find(x=>coincideTipologia(x,tk));
      if(ok){
        const suyo = ok.tipoComponenteId ? byId(DB.tiposComponente,ok.tipoComponenteId) : null;
        /* si está atada a otro componente de la misma familia, se respeta esa */
        if(suyo && familiaDe(suyo.nombre)===fam && (!cuartoOT || suyo.cuartoId===cuartoOT))
          return {tipo:suyo, tip:ok, token:tk};
        if(!suyo) return {tipo:t, tip:ok, token:tk};
      }
    }
  }
  /* Ninguna tipología del cuarto calzó. Antes se devolvía SIN tipología y el
     componente quedaba como "Sin tipología" aunque el TIPO lo dijera claro:
     ATEGO K16 en Turbos se perdía porque esa tipología estaba sugerida en
     Electrónico. El cuarto SUGIERE el componente, pero no debe borrar el
     nombre del motor. Se acepta cualquier tipología que calce por nombre. */
  for(const tk of tokens_){
    if(usados.has(tk)) continue;
    const tp=DB.tipologias.find(x=>coincideTipologia(x,tk));
    if(tp) return {tipo:pref[0]||tipoBase, tip:tp, token:tk};
  }
  /* Ni siquiera existe como tipología: se deja el componente del cuarto. */
  return {tipo:pref[0]||tipoBase, tip:null, token:null};
}
/* Tus OT vienen como "36059-Unitario": el número es el mismo trabajo y el
   sufijo es el cuarto. Una misma OT genera una fila por cuarto, cada una con
   su propio estado. Estas funciones las relacionan sin fusionarlas. */
function otBase(ot){
  const t=String(ot==null?"":ot).trim();
  const m=t.match(/^([^-\s]+)/);
  return m? m[1] : t;
}
function hermanasDe(o){
  const b=otBase(o.ot);
  return DB.ordenes.filter(x=>x.id!==o.id && otBase(x.ot)===b);
}
/* Etiqueta visible: "36059 · Unitario" cuando la OT vive en varios cuartos. */
function etiquetaOT(o){
  const cu=o.cuartoDeclaradoId?nom(DB.cuartos,o.cuartoDeclaradoId):"";
  let t = cu && sinTildes(o.ot).indexOf(sinTildes(cu))<0 ? o.ot+" · "+cu : o.ot;
  /* Si la misma OT entró al mismo cuarto en fechas distintas, se distingue por
     la fecha: puede ser una pieza que llegó después o un reingreso por garantía. */
  const gemelas=DB.ordenes.filter(x=>x.ot===o.ot && (x.cuartoDeclaradoId||"")===(o.cuartoDeclaradoId||""));
  if(gemelas.length>1) t += " · ingresó "+fmtFecha(o.fechaIngreso);
  return t;
}
/* Cuarto al que pertenece un componente: manda el que declara la orden en la
   hoja. Si el tipo de componente está configurado en otra sala, la hoja gana. */
function cuartoDeComponente(c){
  const o=byId(DB.ordenes,c.ordenId);
  return (o && o.cuartoDeclaradoId) || c.cuartoId || "";
}
function cuartosDeOrden(o){
  /* Si la hoja declara el cuarto, esa es la verdad: la orden pertenece a ese
     cuarto aunque alguno de sus componentes esté mal configurado en otra sala. */
  if(o.cuartoDeclaradoId) return new Set([o.cuartoDeclaradoId]);
  const set = new Set(DB.componentes.filter(c=>c.ordenId===o.id).map(c=>c.cuartoId).filter(Boolean));
  const t = sinTildes(o.ot);
  DB.cuartos.forEach(c=>{ const nb=sinTildes(c.nombre); if(nb && t.indexOf(nb)>=0) set.add(c.id); });
  return set;
}
function cuartoDeOrden(o){ const s=cuartosDeOrden(o); return s.size? [...s][0] : ""; }

/* ---------- persistencia (lee-modifica-escribe para no pisar datos) -------- */
/* Actualiza la estructura de una base ya existente SIN tocar los datos.
   Corre sola al abrir: los campos nuevos se agregan vacíos y todo sigue igual. */
function migrar(){
  let n=0;
  if(!DB.meta.horario){ DB.meta.horario={dias:{0:0,1:480,2:540,3:480,4:540,5:480,6:0},breakMin:15,descontarBreak:false}; n++; }
  if(DB.meta.pin===undefined){ DB.meta.pin=""; n++; }
  if(!DB.meta.conexion){ DB.meta.conexion={modo:"",csvUrl:"",gsUrl:"",autoMin:10,mapa:null,desdeFecha:"",ultimaSync:"",ultimoError:""}; n++; }
  if(DB.meta.conexion.desdeFecha===undefined){ DB.meta.conexion.desdeFecha=""; n++; }
  if(DB.meta.conexion.clave===undefined){ DB.meta.conexion.clave=""; n++; }
  /* El diccionario técnico crece con el tiempo: cada vez que llega una versión
     nueva se agregan las tipologías que falten, sin tocar las que ya están. */
  /* Los duplicados que ya se crearon se funden en uno.
     Gana el que tenga trabajo registrado; si ninguno lo tiene, el primero.
     Los registros del que se va se reapuntan al que queda, así no se pierde
     ni una hora de nadie. */
  (function fusionarComponentes(){
    const grupos={};
    DB.componentes.forEach(c=>{
      const k=c.ordenId+"|"+c.tipoComponenteId;
      (grupos[k]=grupos[k]||[]).push(c);
    });
    const fuera=new Set();
    Object.values(grupos).forEach(g=>{
      if(g.length<2) return;
      const conTrabajo=c=>DB.registros.filter(r=>r.componenteId===c.id).length;
      g.sort((a,b)=>conTrabajo(b)-conTrabajo(a));
      const queda=g[0];
      g.slice(1).forEach(v=>{
        DB.registros.forEach(r=>{ if(r.componenteId===v.id) r.componenteId=queda.id; });
        /* La cantidad de la hoja manda, así que se toma la mayor de las dos:
           una copia vieja pudo quedarse con un número desactualizado. */
        queda.cantidad=Math.max(+queda.cantidad||0, +v.cantidad||0);
        if(!queda.tipologiaId && v.tipologiaId) queda.tipologiaId=v.tipologiaId;
        fuera.add(v.id); n++;
      });
    });
    if(fuera.size) DB.componentes=DB.componentes.filter(c=>!fuera.has(c.id));
  })();

  n += sembrarTipologias();
  n += repararSemilla();
  if(!DB.meta.limpiezaArrastre){ n += limpiezaDeArrastre(); DB.meta.limpiezaArrastre = true; }

  /* Mientras la columna ESTADO se leyó desplazada (ver sincronizar()), cada
     nombre de técnico que pasó por esa celda se aprendió como si fuera un
     estado real de orden. Se retiran los que coinciden exactamente con el
     nombre de un técnico: ningún estado legítimo de PROGRAMACION puede
     coincidir con eso. Se corre una sola vez. */
  if(!DB.meta.limpiezaEstadosPolutos){
    const nombresTec = new Set(DB.tecnicos.map(t=>sinTildes(t.nombre).trim().toUpperCase()));
    const antes = DB.estados.length;
    DB.estados = DB.estados.filter(e=>!nombresTec.has(sinTildes(e).trim().toUpperCase()));
    n += antes - DB.estados.length;
    DB.meta.limpiezaEstadosPolutos = true;
  }

  /* Un componente marcado tipMezcla=true nunca debería tener tipologiaId a la
     vez — son mutuamente excluyentes por diseño: "mezcla real, no se elige
     una etiqueta al azar" es justo lo que tipMezcla=true significa. Si esa
     combinación inválida aparece (por ejemplo, un guardado que quedó a medio
     camino entre una versión vieja del código y la nueva, por caché del
     navegador), se corrige sola en vez de esperar a que alguien note el dato
     raro y tenga que forzar una resincronización. */
  DB.componentes.forEach(c=>{
    if(c.tipMezcla && c.tipologiaId){ c.tipologiaId=null; n++; }
  });

  /* Textos de la celda TIPO que no describen ningún componente. Se ignoran al
     leer la hoja para que no nazcan tipologías fantasma como "FILTROS" o un
     número de serie. Si alguno resulta ser real, se quita de esta lista. */
  (function ignorarBasura(){
    const basura = ["FILTROS","FILTRO","FILTROS ELECTROMOTORES","N-A","NA","EGR",
      "CATALIZADOR","CATALIZADORES","4 CILINDROS","GRADO CERO"];
    const ya = new Set(DB.meta.tokensIgnorados||[]);
    let cambio = false;
    basura.forEach(b=>{ const k=sinTildes(b); if(!ya.has(k)){ ya.add(k); cambio=true; n++; } });
    if(cambio) DB.meta.tokensIgnorados = [...ya];
    /* Y las tipologías fantasma que ya se crearon con esos textos, si nadie
       las usó, sobran. Las que sí tengan componentes se dejan: alguien pudo
       registrar trabajo real contra ellas. */
    const esBasura = t => basura.includes(sinTildes(t.nombre).trim().toUpperCase())
      || /^[A-Z]{2,}\s+[A-Z0-9]{6,}$/i.test(String(t.nombre).trim());   /* número de serie pegado */
    const fuera = DB.tipologias.filter(t=>esBasura(t)
      && !DB.componentes.some(c=>c.tipologiaId===t.id));
    if(fuera.length){
      const ids = new Set(fuera.map(t=>t.id));
      DB.tipologias = DB.tipologias.filter(t=>!ids.has(t.id));
      n += fuera.length;
    }
  })();

  /* Tipos de componente que faltaban: sin ellos, las columnas TRANS., REGULA.
     y MICROFILTROS de la hoja no tenían dónde caer y se ignoraban.
     Bomba B7 y Bomba PLD se agregan como tipos propios, no como variantes de
     "Bomba de alta presión CR": es lo que hace posible que, cuando TIPO trae
     dos motores juntos (ISB / B7) y la columna BOMBAS llega sin partir en un
     solo número, el sistema sepa que esas bombas son del B7, no del primer
     motor que aparece en el texto. Real: OT 36588, 2 bombas B7 caían en ISB. */
  [{id:"tc_transf",     nombre:"Bomba de transferencia", cuartoId:"cu_elec", tambien:["Transferencia"]},
   {id:"tc_regulador",  nombre:"Regulador de presión",   cuartoId:"cu_elec", tambien:["Regulador"]},
   {id:"tc_microfiltro",nombre:"Microfiltro",            cuartoId:"cu_elec", tambien:[]},
   {id:"tc_bomba_b7",   nombre:"Bomba B7",               cuartoId:"cu_elec", tambien:[]},
   {id:"tc_bomba_pld",  nombre:"Bomba PLD",              cuartoId:"cu_unit", tambien:[]}]
  .forEach(t=>{
    /* Se compara por NOMBRE, no por id: la sincronización ya pudo haber creado
       "Transferencia" o "Regulador" con su propio id, y agregarlos otra vez
       dejaba dos tipos que significan lo mismo. */
    const nombres = [t.nombre, ...(t.tambien||[])].map(x=>sinTildes(x).trim().toUpperCase());
    const existe = DB.tiposComponente.some(x=>nombres.includes(sinTildes(x.nombre).trim().toUpperCase()));
    if(!existe && !DB.tiposComponente.some(x=>x.id===t.id)){
      DB.tiposComponente.push({id:t.id, nombre:t.nombre, cuartoId:t.cuartoId}); n++;
    }
  });
  if(!DB.meta.conexion.sinFecha){ DB.meta.conexion.sinFecha="omitir"; n++; }
  if(DB.meta.jornadaMin!==undefined){ delete DB.meta.jornadaMin; n++; }
  if(!DB.meta.capturaTiempo){ DB.meta.capturaTiempo="simple"; n++; }
  if(!Array.isArray(DB.repartos)){ DB.repartos=[]; n++; }
  if(!DB.estadosCerrados){ DB.estadosCerrados=["Entregado","Dado de baja","No autorizado"]; n++; }
  if(DB.meta.diasRetro===undefined){ DB.meta.diasRetro=2; n++; }
  if(!Array.isArray(DB.meta.tokensIgnorados)){ DB.meta.tokensIgnorados=[]; n++; }
  if(!Array.isArray(DB.motivos)){ DB.motivos=["Reparación","Garantía","Diagnóstico","Mantenimiento"]; n++; }
  if(DB.meta.inicioSemana===undefined){ DB.meta.inicioSemana=5; n++; }
  if(!Array.isArray(DB.festivos)){ DB.festivos=["2026-01-01","2026-01-12","2026-03-23","2026-04-02",
    "2026-04-03","2026-05-01","2026-05-18","2026-06-08","2026-06-15","2026-06-29","2026-07-20",
    "2026-08-07","2026-08-17","2026-10-12","2026-11-02","2026-11-16","2026-12-08","2026-12-25"]; n++; }
  DB.actividades.forEach(a=>{ if(a.porOrden===undefined){ a.porOrden=/informe|cotiza/i.test(a.nombre); n++; } });
  DB.actividades.forEach(a=>{ if(a.noProductiva===undefined){
    a.noProductiva = /aseo|5s|capacit|reuni|mantenimiento de equipo/i.test(a.nombre); n++; } });
  DB.cuartos.forEach(c=>{ if(c.grupo===undefined){c.grupo="";n++;} });
  DB.tecnicos.forEach(t=>{ if(!t.rol){t.rol="tecnico";n++;} if(t.pin===undefined){t.pin="";n++;} });
  DB.actividades.forEach(a=>{ if(!Array.isArray(a.cuartos)){a.cuartos=[];n++;} });
  DB.tipologias.forEach(t=>{ if(t.cuartoId===undefined){t.cuartoId="";n++;} if(t.tipoComponenteId===undefined){t.tipoComponenteId="";n++;} if(t.alias===undefined){t.alias="";n++;} });
  DB.registros.forEach(r=>{ if(!Array.isArray(r.historial)){r.historial=[];n++;} });
  /* Registros cuyo componente desapareció por una sincronización anterior:
     se reconectan al componente equivalente de la misma orden. */
  DB.registros.forEach(r=>{
    if(r.sinOrden) return;
    /* Copia legible: sobrevive aunque la orden o el componente desaparezcan. */
    if(!r.otTexto && r.ordenId){ const o=byId(DB.ordenes,r.ordenId); if(o){ r.otTexto=o.ot; n++; } }
    if(!r.compTexto && r.componenteId){ const c=fotoComponente(r);
      if(c){ r.compTexto=nom(DB.tiposComponente,c.tipoComponenteId,""); n++; } }
    if(!r.ordenId) return;
    /* Equivalencias que compartieron otros equipos al renumerar. */
    const eq=DB.meta.remapeoIds||{};
    if(!byId(DB.ordenes,r.ordenId) && eq[r.ordenId]){ r.ordenId=eq[r.ordenId]; n++; }
    if(r.componenteId && !byId(DB.componentes,r.componenteId) && eq[r.componenteId]){ r.componenteId=eq[r.componenteId]; n++; }
    /* Si la orden se recreó con otro id, se reengancha por el número de OT. */
    if(!byId(DB.ordenes,r.ordenId) && r.otTexto){
      const o=DB.ordenes.find(x=>x.ot===r.otTexto && (!r.cuartoId || (x.cuartoDeclaradoId||"")===r.cuartoId))
           || DB.ordenes.find(x=>x.ot===r.otTexto);
      if(o){ r.ordenId=o.id; n++; }
    }
    if(r.componenteId && byId(DB.componentes,r.componenteId)) return;
    const cands=DB.componentes.filter(c=>c.ordenId===r.ordenId);
    if(!cands.length) return;
    const porNombre = r.compTexto ? cands.find(c=>nom(DB.tiposComponente,c.tipoComponenteId)===r.compTexto) : null;
    const mismo = r.cuartoId ? cands.find(c=>c.cuartoId===r.cuartoId) : null;
    r.componenteId = (porNombre||mismo||cands[0]).id; n++;
  });
  /* --- Ordena las actividades: une duplicados exactos y deja la estructura
     de diagnóstico desglosado. Se ejecuta una sola vez. No toca registros:
     los traslada a la actividad que se conserva. --- */
  if((DB.meta.version||0) < 6){
    const norm=x=>sinTildes(x).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
    /* 1) duplicados con el mismo nombre: gana el primero, el resto se fusiona */
    const porNom={};
    DB.actividades.slice().forEach(a=>{
      const k=norm(a.nombre);
      if(porNom[k]){
        const destino=porNom[k];
        DB.registros.forEach(r=>{ if(r.actividadId===a.id) r.actividadId=destino.id; });
        DB.estandares.forEach(e=>{ if(e.actividadId===a.id) e.actividadId=destino.id; });
        DB.repartos=DB.repartos.filter(r=>r.actividadId!==a.id);
        DB.actividades=DB.actividades.filter(x=>x.id!==a.id); n++;
      } else porNom[k]=a;
    });
    /* 2) estructura canónica */
    const canon=[
      {id:"ac_desarme",  nombre:"Desarme",                      fase:"Diagnóstico", cuartos:[], alias:[]},
      {id:"ac_test",     nombre:"Prueba en banco",              fase:"Diagnóstico", cuartos:["cu_elec"], alias:["diagnostico","prueba inicial en banco","prueba en el banco"]},
      {id:"ac_tobera",   nombre:"Prueba inyector / tobera",     fase:"Diagnóstico", cuartos:["cu_unit","cu_mec"], alias:["prueba inyector","prueba de tobera","prueba en tester"]},
      {id:"ac_t_inspec", nombre:"Inspección y medición",        fase:"Diagnóstico", cuartos:["cu_turbo","cu_sold","cu_torno"], alias:["inspeccion visual","medicion de juegos"]},
      {id:"ac_lavado",   nombre:"Lavado / limpieza",            fase:"Diagnóstico", cuartos:[], alias:["lavado","limpieza","lavado limpieza ultrasonido"]},
      {id:"ac_informe",  nombre:"Informe técnico",              fase:"Diagnóstico", cuartos:[], alias:["informe","cotizacion"], porOrden:true},
      {id:"ac_mtto_comp",nombre:"Mantenimiento del componente", fase:"Reparación",  cuartos:["cu_elec","cu_unit","cu_mec"], alias:["armado","cambio de repuestos","reparacion general"]},
      {id:"ac_calibra",  nombre:"Calibración en banco",         fase:"Reparación",  cuartos:["cu_elec"], alias:["calibracion","calibracion y prueba en banco"]},
      {id:"ac_calibra_t",nombre:"Calibración en tester",        fase:"Reparación",  cuartos:["cu_unit","cu_mec"], alias:[]},
      {id:"ac_alist",    nombre:"Alistamiento y entrega",       fase:"Entrega",     cuartos:[], alias:["alistamiento","empaque y entrega"]}
    ];
    const intocables=new Set(DB.actividades.filter(a=>
      (a.cuartos||[]).indexOf("cu_turbo")>=0 || a.noProductiva).map(a=>a.id));
    const ids={};
    canon.forEach(c=>{
      let destino=DB.actividades.find(a=>a.id===c.id) ||
                  DB.actividades.find(a=>!intocables.has(a.id) && norm(a.nombre)===norm(c.nombre));
      if(!destino){ destino={id:c.id,nombre:c.nombre,orden:1,fase:c.fase,cuartos:c.cuartos,noProductiva:false,porOrden:!!c.porOrden};
        DB.actividades.push(destino); n++; }
      destino.nombre=c.nombre; destino.fase=c.fase; destino.cuartos=c.cuartos;
      destino.porOrden=!!c.porOrden; destino.noProductiva=false;
      ids[c.id]=destino.id;
      DB.actividades.filter(a=>a.id!==destino.id && !intocables.has(a.id) && c.alias.indexOf(norm(a.nombre))>=0)
        .forEach(vieja=>{
          DB.registros.forEach(r=>{ if(r.actividadId===vieja.id) r.actividadId=destino.id; });
          DB.estandares.forEach(e=>{ if(e.actividadId===vieja.id) e.actividadId=destino.id; });
          DB.repartos=DB.repartos.filter(r=>r.actividadId!==vieja.id);
          DB.actividades=DB.actividades.filter(a=>a.id!==vieja.id); n++;
        });
    });
    DB.actividades=DB.actividades.filter(a=>{
      if(/apoyo a otro cuarto/i.test(a.nombre) && !DB.registros.some(r=>r.actividadId===a.id)){ n++; return false; }
      return true;
    });
    /* 3) los tiempos por actividad se recargan del CSV; se conservan los totales */
    DB.estandares=DB.estandares.filter(e=>e.actividadId===ACT_TOTAL);
    /* 4) reparto: solo la hora de reparación */
    const turbo=DB.tiposComponente.find(t=>familiaDe(t.nombre)==="turbo");
    DB.repartos=[{id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_mtto_comp,porcentaje:60},
                 {id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_calibra,porcentaje:40}];
    const bt=f=>{const a=DB.actividades.find(x=>sinTildes(x.nombre).indexOf(f)>=0 && (x.cuartos||[]).indexOf("cu_turbo")>=0); return a?a.id:null;};
    if(turbo) [[bt("sandblast"),18],[bt("balanceo"),27],[bt("armado"),42],[bt("prueba final"),13]]
      .forEach(([a,p])=>{ if(a) DB.repartos.push({id:uid("rp"),tipoComponenteId:turbo.id,actividadId:a,porcentaje:p}); });
    ["cu_unit","cu_mec"].forEach(cu=>{
      DB.tiposComponente.filter(t=>t.cuartoId===cu).forEach(t=>{
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_mtto_comp,porcentaje:60});
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_calibra_t,porcentaje:40});
      });
    });
    n++;
  }
  /* --- Reparto de la bolsa de reparación, componente por componente.
     El peso refleja cuánto del trabajo real se lleva cada paso. --- */
  if((DB.meta.version||0) < 7){
    const act=(frag,cu)=>{
      const a=DB.actividades.find(x=>sinTildes(x.nombre).indexOf(sinTildes(frag))>=0 &&
        (!cu || !(x.cuartos||[]).length || (x.cuartos||[]).indexOf(cu)>=0));
      return a?a.id:null;
    };
    const nuevos=[];
    DB.tiposComponente.forEach(t=>{
      const cu=t.cuartoId, cuNom=sinTildes(nom(DB.cuartos,cu)), nb=sinTildes(t.nombre);
      const fam=familiaDe(t.nombre);
      const mtto=act("mantenimiento del componente",cu);
      const cal = cuNom.indexOf("electronico")>=0 ? act("calibracion en banco",cu)
                : (cuNom.indexOf("unitario")>=0||cuNom.indexOf("mecanico")>=0) ? act("calibracion en tester",cu) || act("calibracion mecanica",cu)
                : null;
      let pares=[];
      if(fam==="turbo"){
        pares=[[act("sandblast",cu),18],[act("balanceo",cu),27],[act("armado",cu),42],[act("prueba final",cu),13]];
      } else if(cuNom.indexOf("soldadura")>=0){
        pares=[[act("soldadura",cu),100]];
      } else if(cuNom.indexOf("torno")>=0){
        pares=[[act("torneado",cu)||act("rectific",cu),100]];
      } else if(/regulador|transferencia|microfiltro|filtro/.test(nb)){
        /* no pasan por banco: todo el tiempo es del mantenimiento */
        pares=[[mtto,100]];
      } else if(/riel/.test(nb)){
        pares=[[mtto,70],[cal,30]];
      } else if(/bomba/.test(nb)){
        pares=[[mtto,65],[cal,35]];
      } else if(/inyector/.test(nb) && cuNom.indexOf("mecanico")>=0){
        /* inyector mecánico: calibrar la tobera es la mitad del trabajo */
        pares=[[mtto,50],[cal,50]];
      } else {
        pares=[[mtto,60],[cal,40]];
      }
      const validos=pares.filter(([a,pc])=>a && pc>0);
      const suma=validos.reduce((x,[,pc])=>x+pc,0);
      if(!suma) return;
      let acum=0;
      validos.forEach(([a,pc],k)=>{
        const v = k===validos.length-1 ? 100-acum : Math.round(pc*100/suma);
        acum+=v; nuevos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:a,porcentaje:v});
      });
    });
    if(nuevos.length){
      const mt=act("mantenimiento del componente"), cb=act("calibracion en banco","cu_elec");
      DB.repartos=nuevos;
      if(mt&&cb) DB.repartos.push({id:uid("rp"),tipoComponenteId:"*",actividadId:mt,porcentaje:60},
                                  {id:uid("rp"),tipoComponenteId:"*",actividadId:cb,porcentaje:40});
      n++;
    }
  }
  /* --- Estructura definitiva de Electrónico y los bancos:
     DIAGNÓSTICO (desarme + montaje a banco + informe) · LAVADO · REPARACIÓN
     (armado + calibración mecánica + calibración en banco) · ALISTAMIENTO --- */
  if((DB.meta.version||0) < 8){
    const norm=x=>sinTildes(x).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
    const BANCOS=["cu_elec","cu_unit","cu_mec"];
    const canon=[
      {id:"ac_diag",     nombre:"Diagnóstico",           fase:"Diagnóstico", cuartos:[],
       alias:["desarme","prueba en banco","montaje a banco","prueba inicial","diagnostico"]},
      {id:"ac_lavado",   nombre:"Lavado / limpieza",     fase:"Diagnóstico", cuartos:[], alias:["lavado","limpieza"]},
      {id:"ac_informe",  nombre:"Informe técnico",       fase:"Diagnóstico", cuartos:[], alias:["informe","cotizacion"], porOrden:true},
      {id:"ac_armado",   nombre:"Armado",                fase:"Reparación",  cuartos:BANCOS,
       alias:["armado","mantenimiento del componente","mantenimiento componente","cambio de repuestos"]},
      {id:"ac_calibra_m",nombre:"Calibración mecánica",  fase:"Reparación",  cuartos:BANCOS,
       alias:["calibracion mecanica","calibracion componente"]},
      {id:"ac_calibra",  nombre:"Calibración en banco",  fase:"Reparación",  cuartos:["cu_elec"],
       alias:["calibracion en banco","calibracion"]},
      {id:"ac_calibra_t",nombre:"Calibración en tester", fase:"Reparación",  cuartos:["cu_unit","cu_mec"], alias:["calibracion en tester"]},
      {id:"ac_alist",    nombre:"Alistamiento y entrega",fase:"Entrega",     cuartos:[], alias:["alistamiento","empaque y entrega"]}
    ];
    const intocables=new Set(DB.actividades.filter(a=>
      (a.cuartos||[]).indexOf("cu_turbo")>=0 || a.noProductiva).map(a=>a.id));
    const ids={};
    canon.forEach(c=>{
      let d=DB.actividades.find(a=>a.id===c.id) ||
            DB.actividades.find(a=>!intocables.has(a.id) && norm(a.nombre)===norm(c.nombre));
      if(!d){ d={id:c.id,nombre:c.nombre,orden:1,fase:c.fase,cuartos:c.cuartos,noProductiva:false,porOrden:!!c.porOrden};
        DB.actividades.push(d); n++; }
      d.nombre=c.nombre; d.fase=c.fase; d.cuartos=c.cuartos; d.porOrden=!!c.porOrden; d.noProductiva=false;
      ids[c.id]=d.id;
      DB.actividades.filter(a=>a.id!==d.id && !intocables.has(a.id) && c.alias.indexOf(norm(a.nombre))>=0)
        .forEach(v=>{
          DB.registros.forEach(r=>{ if(r.actividadId===v.id) r.actividadId=d.id; });
          DB.estandares.forEach(e=>{ if(e.actividadId===v.id) e.actividadId=d.id; });
          DB.repartos=DB.repartos.filter(r=>r.actividadId!==v.id);
          DB.actividades=DB.actividades.filter(a=>a.id!==v.id); n++;
        });
    });
    /* el diagnóstico vuelve a ser UNA actividad con su tiempo completo */
    DB.tiposComponente.forEach(t=>{
      const dg=DB.estandares.filter(e=>e.tipoComponenteId===t.id && e.actividadId===ids.ac_diag);
      if(dg.length>1){ const suma=dg.reduce((a,e)=>a+e.minutos,0);
        DB.estandares=DB.estandares.filter(e=>!(e.tipoComponenteId===t.id && e.actividadId===ids.ac_diag));
        DB.estandares.push({id:uid("es"),tipoComponenteId:t.id,tipologiaId:"*",actividadId:ids.ac_diag,minutos:suma}); n++; }
    });
    /* reparto de la hora: armado, calibración mecánica y calibración en banco */
    const turbo=DB.tiposComponente.find(t=>familiaDe(t.nombre)==="turbo");
    const rpTurbo=DB.repartos.filter(r=>turbo && r.tipoComponenteId===turbo.id);
    DB.repartos=rpTurbo.concat([
      {id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_armado,porcentaje:40},
      {id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_calibra_m,porcentaje:25},
      {id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_calibra,porcentaje:35}
    ]);
    ["cu_unit","cu_mec"].forEach(cu=>{
      DB.tiposComponente.filter(t=>t.cuartoId===cu).forEach(t=>{
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_armado,porcentaje:40});
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_calibra_m,porcentaje:25});
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_calibra_t,porcentaje:35});
      });
    });
    n++;
  }
  /* --- Lavado pasa a ser su propia fase; el diagnóstico se abre en
     desarme + prueba en banco + informe, y su tiempo se reparte. --- */
  if((DB.meta.version||0) < 9){
    const norm=x=>sinTildes(x).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
    const buscar=nb=>DB.actividades.find(a=>norm(a.nombre)===norm(nb));
    const lav=buscar("Lavado / limpieza"); if(lav) lav.fase="Lavado";
    const diag=buscar("Diagnóstico");
    const crear=(nombre,fase,cuartos,extra)=>{
      let a=buscar(nombre);
      if(!a){ a={id:uid("ac"),nombre,orden:1,fase,cuartos:cuartos||[],noProductiva:false,porOrden:false};
        DB.actividades.push(a); n++; }
      a.fase=fase; a.cuartos=cuartos||[]; Object.assign(a, extra||{});
      return a;
    };
    const des=crear("Desarme","Diagnóstico",[]);
    const test=crear("Prueba en banco","Diagnóstico",["cu_elec"]);
    const tob=crear("Prueba inyector / tobera","Diagnóstico",["cu_unit","cu_mec"]);
    const inf=crear("Informe técnico","Diagnóstico",[],{porOrden:true});
    /* el tiempo del diagnóstico se convierte en el reparto de sus tres pasos */
    if(diag){
      DB.tiposComponente.forEach(t=>{
        const e=DB.estandares.find(x=>x.tipoComponenteId===t.id && x.actividadId===diag.id);
        if(!e) return;
        const prueba = /electronico/.test(sinTildes(nom(DB.cuartos,t.cuartoId))) ? test : tob;
        const total=e.minutos;
        DB.estandares=DB.estandares.filter(x=>x!==e);
        /* desarme 40% · prueba 45% · informe 15%, redondeando al total */
        const d=Math.round(total*0.40), p=Math.round(total*0.45), i=total-d-p;
        if(d) DB.estandares.push({id:uid("es"),tipoComponenteId:t.id,tipologiaId:"*",actividadId:des.id,minutos:d});
        if(p) DB.estandares.push({id:uid("es"),tipoComponenteId:t.id,tipologiaId:"*",actividadId:prueba.id,minutos:p});
        if(i>0 && !DB.estandares.some(x=>x.tipoComponenteId===t.id && x.actividadId===inf.id))
          DB.estandares.push({id:uid("es"),tipoComponenteId:t.id,tipologiaId:"*",actividadId:inf.id,minutos:i});
        n++;
      });
      /* los registros que usaban "Diagnóstico" pasan al desarme */
      DB.registros.forEach(r=>{ if(r.actividadId===diag.id){ r.actividadId=des.id; n++; } });
      DB.actividades=DB.actividades.filter(a=>a.id!==diag.id);
      DB.repartos=DB.repartos.filter(r=>r.actividadId!==diag.id);
    }
    n++;
  }
  /* --- v23: foto del componente en cada registro ---------------------------
     Hasta v22 el registro solo guardaba ids. Si la orden se recreaba (import,
     depuración, sincronización desde otro equipo), el registro quedaba huérfano:
     sin OT, sin componente y con 0 horas estándar. Aquí se rellena la foto de
     todos los que todavía tienen su componente vivo. --------------------- */
  (DB.registros||[]).forEach(r=>{
    const c = byId(DB.componentes, r.componenteId);
    if(c){
      if(!r.tipoComponenteId){ r.tipoComponenteId=c.tipoComponenteId; n++; }
      if(r.tipologiaId===undefined){ r.tipologiaId=c.tipologiaId||null; n++; }
      if(!r.compTexto){ r.compTexto=nom(DB.tiposComponente,c.tipoComponenteId,""); n++; }
    }
    const o = byId(DB.ordenes, r.ordenId);
    if(o && !r.otTexto){ r.otTexto=o.ot; n++; }
    if(!r.cuartoId && c && c.cuartoId){ r.cuartoId=c.cuartoId; n++; }
  });
  /* --- v23: nombres de maestros sin espacios sobrantes ----------------------
     "Balanceo " y "Balanceo" se veían como dos actividades distintas en los
     informes. Se recortan una sola vez. ---------------------------------- */
  if(!Array.isArray(DB.ausencias)){ DB.ausencias=[]; n++; }
  /* --- Tipologías que apuntan a la nada -----------------------------------
     Al fusionar o borrar tipologías, los componentes quedaron apuntando a un
     identificador que ya no existe y se mostraban como "Sin tipología". Se
     vuelve a buscar por el nombre que trae el TIPO de la orden. --------- */
  {
    const vivas=new Set((DB.tipologias||[]).map(t=>t.id));
    (DB.componentes||[]).forEach(c=>{
      if(c.tipologiaId && vivas.has(c.tipologiaId)) return;
      const o=byId(DB.ordenes,c.ordenId);
      if(!o || !o.tipoTexto){ if(c.tipologiaId){ c.tipologiaId=null; n++; } return; }
      let hallada=null;
      String(o.tipoTexto).split(/[\/;|,]+/).map(x=>x.trim()).filter(Boolean).forEach(tk=>{
        if(hallada) return;
        const tp=(DB.tipologias||[]).find(x=>coincideTipologia(x,tk));
        if(tp) hallada=tp;
      });
      if(hallada){ c.tipologiaId=hallada.id; n++; }
      else if(c.tipologiaId){ c.tipologiaId=null; n++; }
    });
  }
  /* --- v31: fases coherentes con la estructura acordada -------------------
     El lavado va DENTRO de la hora de reparación (así se pactó con turbos) y
     la prueba de toberas es parte del diagnóstico. Estaban al revés, y por eso
     los subtotales no cuadraban con el estándar de la empresa.
     Se corrige una sola vez; después se cambia desde Maestros → Tiempos. --- */
  if(!DB.meta.fasesV31){
    const arreglo={"lavado / limpieza":"Reparación","prueba inyector / toberas":"Diagnóstico",
                   "prueba inyector / tobera":"Diagnóstico"};
    (DB.actividades||[]).forEach(a=>{
      const k=String(a.nombre||"").trim().toLowerCase();
      if(arreglo[k] && a.fase!==arreglo[k]){ a.fase=arreglo[k]; n++; }
    });
    DB.meta.fasesV31=true; n++;
  }
  /* --- v25: renumerar órdenes y componentes con identificadores estables ---
     Se recalcula el id de cada orden y componente a partir de su contenido y
     se arrastran las referencias de registros y componentes. A partir de aquí
     todos los equipos coinciden y los registros dejan de quedar "sin OT". */
  if(!DB.meta.idsEstables){
    const mapaO={}, mapaC={}, usadosO=new Set(), usadosC=new Set();
    DB.ordenes.forEach(o=>{
      let nid=idOrden(o.ot,o.cuartoDeclaradoId||"",o.fechaIngreso||"");
      while(usadosO.has(nid)) nid=nid+"x";          /* choque: se desempata */
      usadosO.add(nid); if(nid!==o.id){ mapaO[o.id]=nid; o.id=nid; n++; }
    });
    DB.componentes.forEach(c=>{
      if(mapaO[c.ordenId]) c.ordenId=mapaO[c.ordenId];
      let nid=idComponente(c.ordenId,c.tipoComponenteId);
      while(usadosC.has(nid)) nid=nid+"x";
      usadosC.add(nid); if(nid!==c.id){ mapaC[c.id]=nid; c.id=nid; n++; }
    });
    /* Cada equipo arregla SUS registros: los que nacieron aquí conocen la orden
       y quedan apuntando al identificador estable. Se marca la hora para que,
       al sincronizar, esta versión corregida le gane a la rota que tengan los
       demás equipos. Así el arreglo viaja solo y nadie corrige a mano. */
    const ahora=new Date().toISOString();
    DB.registros.forEach(r=>{
      let toco=false;
      if(r.ordenId && mapaO[r.ordenId]){ r.ordenId=mapaO[r.ordenId]; toco=true; }
      if(r.componenteId && mapaC[r.componenteId]){ r.componenteId=mapaC[r.componenteId]; toco=true; }
      if(toco){
        const c=byId(DB.componentes,r.componenteId), o=byId(DB.ordenes,r.ordenId);
        if(c && !r.tipoComponenteId){ r.tipoComponenteId=c.tipoComponenteId; r.tipologiaId=c.tipologiaId||null;
          r.compTexto=r.compTexto||nom(DB.tiposComponente,c.tipoComponenteId,""); }
        if(o && !r.otTexto) r.otTexto=o.ot;
        r.actualizado=ahora;                /* para que gane en la sincronización */
        n++;
      }
    });
    /* Se guarda la equivalencia viejo -> nuevo. Este equipo sabe que su
       or_msonz3w3wymdl era la OT 4854; los demás equipos no tienen forma de
       adivinarlo. Compartiendo el mapa, cada uno repara los registros ajenos
       que le llegaron rotos. */
    DB.meta.remapeoIds = Object.assign({}, DB.meta.remapeoIds||{}, mapaO, mapaC);
    DB.meta.idsEstables=true; n++;
  }
  ["cuartos","tecnicos","tiposComponente","tipologias","actividades","clientes"].forEach(k=>{
    (DB[k]||[]).forEach(x=>{ if(typeof x.nombre==="string" && x.nombre!==x.nombre.trim()){ x.nombre=x.nombre.trim(); n++; } });
  });
  ["estados","estadosCerrados","motivos","tiposNovedad"].forEach(k=>{
    if(Array.isArray(DB[k])){
      const antes=DB[k].join("|");
      DB[k]=[...new Set(DB[k].map(x=>String(x).trim()).filter(Boolean))];
      if(DB[k].join("|")!==antes) n++;
    }
  });
  /* v24: cada tipo de componente recuerda cuánto dice la empresa que vale su
     reparación, para poder avisar cuando los minutos no cuadran. */
  (DB.tiposComponente||[]).forEach(t=>{ if(t.estandarReparacion===undefined){ t.estandarReparacion=0; n++; } });
  DB.meta.version=11;
  return n;
}
async function cargar(){
  const raw = await Store.get(KEY, true);
  DB = raw && raw.meta ? raw : semilla();
  ["ordenes","componentes","registros","cuartos","tecnicos","tiposComponente","tipologias","actividades","estandares","repartos","clientes","estados","estadosCerrados","motivos","festivos","tiposNovedad"].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
  if(!DB.meta.conexion) DB.meta.conexion={modo:"",csvUrl:"",gsUrl:"",autoMin:10,mapa:null,ultimaSync:"",ultimoError:""};
  const ajustes = migrar();
  if(ajustes) await guardar();
  YO = await Store.get(KEY_ME, false);
  /* La coordinación no queda abierta: si hay clave, se vuelve a pedir al abrir. */
  const me = YO ? byId(DB.tecnicos, YO) : null;
  if(me && me.rol==="coordinador" && DB.meta.pin){ YO=null; }
}
async function guardar(){ guardando=true; const ok = await Store.set(KEY, DB, true); guardando=false; if(!ok) toast("No se pudo guardar. Exporta un respaldo."); return ok; }
async function commit(fn, msg){
  const remoto = await Store.get(KEY, true);
  if(remoto && remoto.meta){ DB = remoto; migrar(); }                       // trae lo último del taller
  ["ordenes","componentes","registros"].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
  fn();
  await guardar();
  if(msg) toast(msg);
  render();
}

/* ---- maestros: se guardan sin redibujar (si no, el botón se va antes del clic) ---- */
const MAESTROS=["cuartos","tecnicos","tiposComponente","tipologias","actividades","estandares","repartos","clientes","estados","estadosCerrados","motivos","festivos","tiposNovedad","ausencias"];
/* Las órdenes que vienen de la hoja se reconstruyen igual en cada equipo
   (por eso los identificadores estables). Pero las que alguien crea A MANO
   —porque el componente llegó antes de que bodega lo anotara— solo existen
   en ese equipo. Estas sí tienen que viajar. Son pocas, así que van con la
   configuración y se MEZCLAN por id en vez de reemplazar: así nadie borra
   lo que agregó otro. */
function paqueteMaestros(){
  const p={ts:DB.meta.configTs||0, horario:DB.meta.horario, pin:DB.meta.pin||""};
  MAESTROS.forEach(k=>p[k]=DB[k]);
  p.ordenesManuales   = DB.ordenes.filter(o=>o.origen==="manual");
  p.componentesManuales = DB.componentes.filter(c=>c.origen==="manual");
  /* El mapa de equivalencias crece sin techo. Se conservan las últimas 400:
     de sobra para reparar, y no infla el paquete. */
  const eq=DB.meta.remapeoIds||{}, claves=Object.keys(eq);
  p.remapeoIds = claves.length>400
    ? claves.slice(-400).reduce((o,k)=>(o[k]=eq[k],o),{}) : eq;
  /* El puente v2 reparte la configuración en 10 celdas de 40.000, así que el
     tope real es 400.000. Si aun así se acercara, se sueltan primero las
     piezas menos críticas para que la configuración siga viajando. */
  const LIMITE=48000;   /* margen para el puente v1; el v2 admite 400.000 */
  /* Se quitan campos vacíos, nulos y falsos: no aportan nada y ocupan la
     mitad del paquete. "tipologiaId":null en 400 registros son 8.000 letras. */
  const podar=o=>{
    if(Array.isArray(o)) return o.map(podar);
    if(o && typeof o==="object"){
      const r={};
      Object.keys(o).forEach(k=>{ const v=o[k];
        if(v===null||v===undefined||v===""||v===false) return;
        if(Array.isArray(v) && !v.length) return;
        r[k]=podar(v); });
      return r;
    }
    return o;
  };
  if(JSON.stringify(p).length>LIMITE){
    ["cuartos","tecnicos","tiposComponente","tipologias","actividades","estandares","repartos","ausencias","ordenesManuales","componentesManuales"]
      .forEach(k=>{ if(Array.isArray(p[k])) p[k]=podar(p[k]); });
  }
  if(JSON.stringify(p).length>LIMITE) p.remapeoIds={};
  if(JSON.stringify(p).length>LIMITE) p.clientes=[];
  DB.meta.tamConfig = JSON.stringify(p).length;
  return p;
}
function mezclarPorId(lista, entrantes){
  const hay=new Set(lista.map(x=>x.id));
  let n=0;
  (entrantes||[]).forEach(x=>{ if(x && x.id && !hay.has(x.id)){ lista.push(x); hay.add(x.id); n++; } });
  return n;
}
function aplicarMaestros(p){
  if(!p) return false;
  /* Lo creado a mano se mezcla SIEMPRE, aunque la configuración no sea más
     nueva: son datos que se suman, nunca se pisan entre sí. */
  let sumadas = mezclarPorId(DB.ordenes, p.ordenesManuales)
              + mezclarPorId(DB.componentes, p.componentesManuales);
  if(p.remapeoIds){                       /* las equivalencias se suman entre equipos */
    const mio=DB.meta.remapeoIds||{}; let nuevas=0;
    Object.keys(p.remapeoIds).forEach(k=>{ if(!mio[k]){ mio[k]=p.remapeoIds[k]; nuevas++; } });
    if(nuevas){ DB.meta.remapeoIds=mio; sumadas+=nuevas; migrar(); }
  }
  if(!p.ts || (DB.meta.configTs||0)>=p.ts) return sumadas>0;
  MAESTROS.forEach(k=>{ if(Array.isArray(p[k])) DB[k]=p[k]; });
  if(p.horario) DB.meta.horario=p.horario;
  if(p.pin!==undefined) DB.meta.pin=p.pin;
  DB.meta.configTs=p.ts;
  return true;
}
async function commitMaestro(fn, msg, quieto){
  const remoto = await Store.get(KEY, true);
  if(remoto && remoto.meta){ DB = remoto; migrar(); }
  fn();
  /* Un cuarto que vuelve a existir deja de estar ignorado. */
  if(Array.isArray(DB.meta.cuartosIgnorados))
    DB.meta.cuartosIgnorados = DB.meta.cuartosIgnorados.filter(nm=>
      !DB.cuartos.some(c=>sinTildes(c.nombre)===sinTildes(nm)));
  /* Los avisos son una foto de la última sincronización: al cambiar un
     maestro dejan de ser ciertos y se limpian para no confundir. */
  if(DB.meta.conexion && DB.meta.conexion.ultimoResumen) DB.meta.conexion.ultimoResumen.avisos=[];
  DB.meta.configTs = Date.now();
  await guardar();
  empujarConfig().catch(()=>{});
  if(msg) toast(msg);
  if(!quieto) render();
}

/* =========================================================================
   DIÁLOGOS PROPIOS
   Los confirm() y prompt() del navegador se pueden desactivar ("impedir que
   esta página cree más diálogos") y entonces fallan en silencio. Estos no.
   ========================================================================= */
function dialogo(op){
  return new Promise(res=>{
    const conInput = !!op.input;
    const d=document.createElement("div");
    d.className="modal dlg"; d.style.zIndex="90";
    d.innerHTML=`<div class="box" style="max-width:440px">
      <header><h3>${esc(op.titulo||"Confirmar")}</h3></header>
      <div class="bd">
        ${op.mensaje?`<div style="white-space:pre-line;font-size:14px;line-height:1.5;margin-bottom:14px">${esc(op.mensaje)}</div>`:""}
        ${conInput?`<label class="f"><span>${esc(op.input.etiqueta||"")}</span>
          <input type="${op.input.tipo||"text"}" id="dlgIn" value="${esc(op.input.valor||"")}" placeholder="${esc(op.input.placeholder||"")}"></label>`:""}
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
          <button class="btn" data-no>${esc(op.cancelar||"Cancelar")}</button>
          <button class="btn ${op.peligro?"warn":"primary"}" data-si>${esc(op.ok||"Confirmar")}</button>
        </div></div></div>`;
    document.body.appendChild(d);
    const salir=v=>{ d.remove(); res(v); };
    d.querySelector("[data-no]").onclick=()=>salir(conInput?null:false);
    d.querySelector("[data-si]").onclick=()=>salir(conInput?d.querySelector("#dlgIn").value:true);
    d.addEventListener("click",e=>{ if(e.target===d) salir(conInput?null:false); });
    const inp=d.querySelector("#dlgIn");
    if(inp){ setTimeout(()=>{inp.focus();inp.select();},60);
      inp.onkeydown=e=>{ if(e.key==="Enter") d.querySelector("[data-si]").click(); }; }
    else setTimeout(()=>d.querySelector("[data-si]").focus(),60);
  });
}
const confirmar = (titulo,mensaje,ok)=>dialogo({titulo,mensaje,ok:ok||"Eliminar",peligro:true});
const pedirTexto = (titulo,etiqueta,valor,tipo)=>dialogo({titulo,ok:"Aceptar",input:{etiqueta,valor,tipo}});

const TABS = [
  ["registro","Mi registro","todos"],
  ["misemana","Mi semana","todos"],
  ["dashboard","Dashboard","coord"],
  ["semanal","Informe semanal","coord"],
  ["maestros","Maestros","coord"],
  ["conexion","Conexión","coord"],
  ["datos","Datos","coord"]
];
function tabsVisibles(){ return esCoordinador()? TABS : TABS.filter(t=>t[2]==="todos"); }
function pintarTabs(){
  const vis=tabsVisibles();
  $("#tabs").innerHTML = vis.map(([k,l])=>`<button data-t="${k}" class="${VISTA===k?"on":""}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ VISTA=b.dataset.t; window.scrollTo(0,0); render(); });
}
function render(){
  try{ renderInterno(); }
  catch(err){
    console.error(err);
    $("#app").innerHTML = `<div class="card"><header><h2>Algo falló al dibujar esta pantalla</h2></header>
      <div class="body">
        <div style="border:1px solid #eec4c1;background:#fbecea;color:var(--red);padding:10px 12px;border-radius:var(--r);font-size:13.5px">
          <b>${esc(String(err && err.message || err))}</b></div>
        <p class="hint" style="margin-top:12px">Tus datos están a salvo. Vuelve a otra pestaña y sigue trabajando; si se repite, cuéntame este mensaje.</p>
        <button class="btn primary" id="volverInicio" style="margin-top:6px">Volver a Mi registro</button>
        <details style="margin-top:12px"><summary class="hint" style="cursor:pointer">Detalle técnico</summary>
          <pre style="font-size:11px;overflow:auto;white-space:pre-wrap">${esc(String(err && err.stack || ""))}</pre></details>
      </div></div>`;
    const b=$("#volverInicio"); if(b) b.onclick=()=>{ VISTA="registro"; render(); };
  }
}
function renderInterno(){
  if(!tabsVisibles().some(t=>t[0]===VISTA)) VISTA="registro";
  pintarTabs();

  $("#hoy").textContent = "· " + fmtFecha(hoyISO()) + " · " + VERSION_APP;
  const me = YO ? byId(DB.tecnicos, YO) : null;
  $("#whoami").innerHTML = `<span class="dot ${me?"":"off"}"></span>${me?esc(me.nombre):"Elegir técnico"}`;
  $("#salir").style.display = me ? "" : "none";
  const v = {registro:vRegistro, misemana:vMiSemana, ordenes:vOrdenes, dashboard:vDashboard, ingresos:vIngresos, semanal:vSemanal, maestros:vMaestros, conexion:vConexion, datos:vDatos}[VISTA];
  $("#app").innerHTML = v();
  const post = {registro:pRegistro, misemana:pMiSemana, ordenes:pOrdenes, dashboard:pDashboard, ingresos:pIngresos, semanal:pSemanal, maestros:pMaestros, conexion:pConexion, datos:pDatos}[VISTA];
  if(post) post();
}
document.addEventListener("click", async e=>{
  if(e.target.closest("#salir")){ YO=null; await Store.set(KEY_ME,null,false); VISTA="registro"; render(); modalTecnico(); return; }
  if(e.target.closest("#whoami")) modalTecnico();
});

/* =========================================================================
   VISTA 1 · MI REGISTRO  (3 pasos)
   ========================================================================= */
let R = { paso:1, fecha:hoyISO(), ordenId:null, componenteId:null, sel:{}, novedad:"", tipoNovedad:"", busca:"", todas:false, estadoOrden:"", tecnicoId:"" };

function vRegistro(){
  const me = YO ? byId(DB.tecnicos,YO) : null;
  if(!me) return `<div class="card"><div class="body"><div class="empty">Primero elige quién eres. Toca el botón <b>Elegir técnico</b> arriba a la derecha.</div></div></div>`;
  const paso = R.paso;
  const head = avisoVersion() + barraSync() + `
  <div class="steps">
    <div class="${paso===1?"on":(paso>1?"done":"")}"><b>1</b>Orden</div>
    <div class="${paso===2?"on":(paso>2?"done":"")}"><b>2</b>Actividades</div>
    <div class="${paso===3?"on":""}"><b>3</b>Novedades</div>
  </div>`;
  return head + (paso===1?pasoOrden():paso===2?pasoActividades():pasoNovedades()) + barraRegistro() + hoyDelTecnico();
}

function pasoOrden(){
  const q = R.busca.trim(); const ql=q.toLowerCase();
  /* Si coordinación registra por otro técnico, se listan las órdenes del cuarto
     de ESE técnico: es lo que él vería en su propio celular. */
  const quien = (esCoordinador() && R.tecnicoId) ? R.tecnicoId : YO;
  const me = quien? byId(DB.tecnicos,quien):null;
  const miCuarto = me? me.cuartoId : "";
  const cerr = cerrados();

  const abiertas = DB.ordenes.filter(o=>!cerr.has(o.estado));
  const filtradoPorCuarto = !R.todas && !!miCuarto;
  const base = filtradoPorCuarto ? abiertas.filter(o=>cuartosDeOrden(o).has(miCuarto)) : abiertas;
  const lista = base
    .filter(o=> !q || sinTildes(o.ot+" "+(o.cliente||"")+" "+(o.tipoTexto||"")).indexOf(sinTildes(ql))>=0)
    .sort((a,b)=> (b.fechaIngreso||"").localeCompare(a.fechaIngreso||"") );

  const cerradas = DB.ordenes.length - abiertas.length;
  const minFecha = (esCoordinador()||!DB.meta.diasRetro) ? "" :
    restarDias(hoyISO(), DB.meta.diasRetro);

  return `
  <div class="card">
    <header><h2>Paso 1 · Elige la orden</h2>
      <span class="sub mono">${lista.length} abiertas${filtradoPorCuarto?" · "+esc(nom(DB.cuartos,miCuarto)):""}</span>
      <div class="push"><button class="btn sm" id="nuevaOT">+ Orden nueva</button></div>
    </header>
    <div class="body">
      <label class="f"><span>Fecha del registro</span>
        <input type="date" id="fechaReg" value="${R.fecha}" max="${hoyISO()}" min="${minFecha||"2026-01-01"}"></label>
      ${minFecha&&R.fecha<minFecha?`<p class="hint" style="color:var(--signal);margin-top:-6px">Solo puedes registrar hasta ${DB.meta.diasRetro} día(s) atrás. Para fechas anteriores, pídeselo a coordinación.</p>`:""}
      ${esCoordinador()?`<label class="f"><span>Registrar a nombre de</span>
        <select id="regTecnico">
          ${DB.tecnicos.filter(t=>t.activo!==false).map(t=>`<option value="${t.id}" ${(R.tecnicoId||YO)===t.id?"selected":""}>${esc(t.nombre)}${t.cuartoId?" · "+esc(nom(DB.cuartos,t.cuartoId)):""}</option>`).join("")}
        </select></label>
      ${(R.tecnicoId&&R.tecnicoId!==YO)?`<p class="hint" style="color:var(--signal);margin-top:-6px">
        Este registro quedará a nombre de <b>${esc(nom(DB.tecnicos,R.tecnicoId))}</b>, y en el historial se verá que lo capturaste tú.</p>`
        :`<p class="hint" style="margin-top:-6px">Puedes registrar por otro técnico cuando él no alcance a hacerlo. Queda la huella de quién capturó.</p>`}`:""}
      <label class="f"><span>Buscar OT, cliente o tipología</span><input type="search" id="buscaOT" placeholder="Ej: 36093, Umbarela o ISB" value="${esc(R.busca)}"></label>
      ${miCuarto&&!(esCoordinador()&&R.tecnicoId&&R.tecnicoId!==YO)?`<p class="hint" style="margin-top:-6px">Estás registrando como <b>${esc(nom(DB.tecnicos,YO))}</b>, del cuarto <b>${esc(nom(DB.cuartos,miCuarto))}</b>. Si no es tu cuarto, avísale a coordinación.</p>`:""}
      <button class="btn" id="sinOrden" style="margin-bottom:12px;width:100%">Registrar algo que no es de una orden</button>
      <p class="hint" style="margin-top:-6px">Aseo, capacitación, mantenimiento de equipos, apoyo a otra sede.</p>
      ${miCuarto?`<label class="hint" style="display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;padding:9px 11px;border:1px solid ${R.todas?"var(--prussian)":"var(--line)"};border-radius:var(--r);background:${R.todas?"#f2f7fb":"#fff"}">
        <input type="checkbox" id="verTodas" ${R.todas?"checked":""} style="width:18px;height:18px;accent-color:var(--prussian)">
        <span><b>Hoy estoy apoyando otro cuarto</b><br>
        Muestra las órdenes de todo el laboratorio. Registra la actividad real que hiciste allá: esas horas son tuyas y la producción se le acredita a ese cuarto.</span></label>`:""}
      ${!DB.ordenes.length?`<div class="empty">
        Todavía no hay órdenes en la app.<br><br>
        ${esCoordinador()?`Cárgalas desde <b>Conexión</b> o <b>Datos</b>.`:`Avísale a coordinación para que sincronice las órdenes del día.`}
      </div>`
      :lista.length?`<div class="pick">${lista.slice(0,60).map(o=>{
        const comps = DB.componentes.filter(c=>c.ordenId===o.id);
        const cus = [...cuartosDeOrden(o)];
        return `<button data-ot="${o.id}" class="${R.ordenId===o.id?"sel":""}">
          <div><div class="ot">OT ${esc(etiquetaOT(o))}</div>
          <div class="meta">${esc(o.cliente||"Sin cliente")} · ingresó ${fmtFecha(o.fechaIngreso)}${cus.length?" · "+cus.map(x=>esc(nom(DB.cuartos,x))).join(" + "):""}</div>
          ${o.tecnicoHoja?`<div class="meta">Sugerido: <b>${esc(o.tecnicoHoja)}</b>${sinTildes(o.tecnicoHoja).toUpperCase()!==sinTildes(nom(DB.tecnicos,quien)).toUpperCase()?" · cualquiera puede registrarla igual":""}</div>`:""}
          ${o.novedadHoja?`<div class="meta" style="color:var(--amber)">Novedad: ${esc(o.novedadHoja)}</div>`:""}
          ${(()=>{const h=hermanasDe(o); if(!h.length) return "";
            return `<div class="meta" style="color:var(--muted)">La OT ${esc(otBase(o.ot))} también tiene: ${h.map(x=>esc(x.ot.replace(otBase(x.ot)+"-",""))+" ("+esc(x.estado)+")").join(" · ")}</div>`;})()}
          ${o.revisar?`<div class="meta" style="color:var(--signal)">Falta ubicar: ${esc(o.revisar.join(" / "))}</div>`:""}
          ${(()=>{const h=hermanasDe(o); return h.length?`<div class="meta">También hay ${h.map(x=>esc(x.ot)).join(", ")} de la misma orden</div>`:"";})()}
          <div class="meta">${comps.length
            ? comps.map(c=>{
                const tip = c.desglose && c.desglose.length
                  ? " "+c.desglose.map(d=>`${d.cantidad} ${esc(nom(DB.tipologias,d.tipologiaId,"?"))}`).join(" + ")
                  : (c.tipologiaId?" "+esc(nom(DB.tipologias,c.tipologiaId,"")):"");
                return `${c.cantidad}× ${esc(nom(DB.tiposComponente,c.tipoComponenteId))}${tip}`;
              }).join(" · ")
            : (o.tipoTexto?`<span class="tag">TIPO: ${esc(o.tipoTexto)}</span>`:`<span class="tag">sin componentes cargados</span>`)}</div></div>
          <div class="r">${chipEstado(o.estado)}</div>
        </button>`;}).join("")}</div>`
      :`<div class="empty">${q
          ? `Ninguna orden abierta de ${esc(nom(DB.cuartos,miCuarto))} coincide con “${esc(q)}”.<br><br>
             <button class="btn primary" id="crearBuscada">Crear la orden ${esc(q)}</button>`
          : `No hay órdenes abiertas asignadas a <b>${esc(nom(DB.cuartos,miCuarto))}</b>.<br><br>
             ${(()=>{const porCu=DB.cuartos.map(c=>({c, n:abiertas.filter(o=>cuartosDeOrden(o).has(c.id)).length})).filter(x=>x.n);
               const sinCu=abiertas.filter(o=>!cuartosDeOrden(o).size).length;
               if(!abiertas.length) return "No hay ninguna orden abierta en el laboratorio. Avísale a coordinación para que sincronice.";
               return `Hay ${abiertas.length} órdenes abiertas repartidas así:<br>
                 <span class="tag">${porCu.map(x=>esc(x.c.nombre)+": "+x.n).join(" · ")}${sinCu?` · sin cuarto: ${sinCu}`:""}</span><br><br>

    </div>
  </div>`;
}
function pasoActividades(){
  const o = byId(DB.ordenes, R.ordenId);
  const me2 = YO? byId(DB.tecnicos,YO):null;
  const todosComps = DB.componentes.filter(c=>c.ordenId===R.ordenId);
  /* El técnico ve los componentes de su cuarto; si la orden es de otro cuarto
     los ve todos, para que un componente mal clasificado no lo deje sin registrar. */
  const comps = (!R.todas && me2 && todosComps.some(c=>cuartoDeComponente(c)===me2.cuartoId))
    ? todosComps.filter(c=>cuartoDeComponente(c)===me2.cuartoId) : todosComps;
  const c = R.componenteId ? byId(DB.componentes,R.componenteId) : null;
  const acts = c ? actividadesDeComponente(c.tipoComponenteId, c.cuartoId) : [];
  return `
  <div class="card">
    <header><h2>Paso 2 · ¿Qué hiciste?</h2><span class="sub mono">OT ${esc(o?etiquetaOT(o):"")}</span></header>
    <div class="body">
      ${R.recienGuardado?`<div style="border:1px solid #b6ddc6;background:#eaf6ef;color:var(--green);padding:10px 12px;border-radius:var(--r);margin-bottom:12px;font-size:13.5px">
        <b>Guardado.</b> Esta orden tiene más componentes: elige otro abajo para seguir registrando, o pulsa <b>Atrás</b> si ya terminaste con ella.</div>`:""}
      <label class="f"><span>Componente trabajado</span>
        <select id="compSel">
          <option value="">— Selecciona —</option>
          ${comps.map(x=>{
            /* El <option> solo admite texto plano, así que el desglose se
               escribe en la misma línea: "7 ISB + 6 B7" en vez de una sola
               tipología. Sigue siendo UN componente seleccionable — el
               técnico registra contra el total, no contra cada parte. */
            const etiquetaTip = x.desglose && x.desglose.length
              ? x.desglose.map(d=>`${d.cantidad} ${esc(nom(DB.tipologias,d.tipologiaId,"?"))}`).join(" + ")
              : esc(nom(DB.tipologias,x.tipologiaId,"—"));
            return `<option value="${x.id}" ${R.componenteId===x.id?"selected":""}>${esc(nom(DB.tiposComponente,x.tipoComponenteId))} · ${etiquetaTip}${x.tipSupuesta?" (?)":""} · ${x.cantidad} und · ${esc(nom(DB.cuartos,x.cuartoId))}</option>`;
          }).join("")}
          <option value="__nuevo__">+ Agregar componente a esta OT…</option>
        </select>
      </label>
      ${c?`
      ${(me2 && c.cuartoId!==me2.cuartoId)?`<div style="border:1px solid #bcd0e2;background:#eaf1f8;color:var(--prussian);padding:9px 11px;border-radius:var(--r);margin:12px 0;font-size:13px">
        Estás registrando en <b>${esc(nom(DB.cuartos,c.cuartoId))}</b>, que no es tu cuarto base.
        Las horas se te acreditan a ti; la producción, a ${esc(nom(DB.cuartos,c.cuartoId))}.</div>`:""}
      ${(()=>{
        /* Medidor de jornada en vivo. Avisar al guardar llega tarde: el técnico
           ya escribió los tiempos. Verlo mientras los escribe evita el error,
           que es mejor que corregirlo después. */
        const cap = capacidadTecnicoDia(YO, R.fecha);
        if(!cap) return `<div style="border:1px solid #f3ccb0;background:#fdefe5;color:var(--signal);padding:9px 11px;border-radius:var(--r);margin-top:14px;font-size:13px">
          <b>Ese día no tienes jornada.</b> Es festivo, fin de semana o estás marcado como ausente.
          Si trabajaste, regístralo igual y coordinación lo revisa.</div>`;
        const ya  = minutosDia(YO, R.fecha);
        const voy = Object.values(R.sel).reduce((a,x)=>a+(+x.minutos||0),0);
        const tot = ya + voy;
        const pct = Math.min(100, Math.round(tot/cap*100));
        const color = tot>cap ? "var(--signal)" : tot>=cap*0.9 ? "var(--amber)" : "var(--green)";
        return `<div style="margin-top:14px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:#fafbfc">
          <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px">
            <span>Tu jornada del ${fmtFecha(R.fecha)}</span>
            <span class="mono" style="color:${color};font-weight:600">${hrs(tot)} / ${hrs(cap)} h</span></div>
          <div style="height:6px;background:#eef1f3;border-radius:3px;overflow:hidden;margin-top:6px">
            <div style="height:100%;width:${pct}%;background:${color}"></div></div>
          ${tot>cap?`<div style="margin-top:6px;font-size:12.5px;color:var(--signal)">
            Te estás pasando por <b>${hrs(tot-cap)} h</b>. Si fueron horas extra está bien; si no, revisa los tiempos antes de guardar.</div>`
           :`<div style="margin-top:6px;font-size:12.5px;color:var(--ink-2)">Te quedan ${hrs(cap-tot)} h por registrar ese día.</div>`}
        </div>`;
      })()}
      <div class="eyebrow" style="margin:14px 0 7px">Actividades de ${esc(nom(DB.cuartos,c.cuartoId))} · marca las que realizaste</div>
      ${(()=>{ /* las marcadas "aparte" van en su propio bloque, no mezcladas
                   con las fases del proceso normal */
        const esAp=a=>{ const e=estandarDe(c.tipoComponenteId,a.id); return !!(e && e.aparte); };
        return ["Diagnóstico","Lavado","Reparación","Entrega","Apoyo","Aparte"];})()
       .map(fase=>{
        const esAp=a=>{ const e=estandarDe(c.tipoComponenteId,a.id); return !!(e && e.aparte); };
        const grupo = fase==="Aparte" ? acts.filter(esAp) : acts.filter(a=>a.fase===fase && !esAp(a));
        if(!grupo.length) return "";
        return `<div class="tag" style="margin:11px 0 5px">${fase==="Aparte"
          ? 'APARTE · solo si aplica en este trabajo' : fase.toUpperCase()}</div>` + grupo.map(a=>{
          const s = R.sel[a.id];
          const cant = s? s.cantidad : c.cantidad;
          /* El tiempo lo pone el técnico. No hay estándar que precargue ni
             contra el cual comparar: la cifra es la que él midió. */
          const uni = (s && s.unidad) || R.unidad || "min";
          const valor = s ? (uni==="h" ? redondea2(s.minutos/60) : s.minutos) : "";
          return `<div class="act ${s?"on":""}" data-act="${a.id}">
            <div class="hd"><input type="checkbox" ${s?"checked":""} data-chk="${a.id}">
              <span class="nm">${esc(a.nombre)}</span>
              <span class="std">${esPorOrden(a.id)?"por orden":"por unidad"}</span></div>
            <div class="det">
              <label><span>${esPorOrden(a.id)?"Órdenes":"Unidades"}${(()=>{
                const ya=yaRegistrado(c.id,a.id); if(!ya) return "";
                const queda=topeActividad(c,a.id)-ya;
                const quienes=[...new Set(RA().filter(r=>r.componenteId===c.id && r.actividadId===a.id)
                  .map(r=>nom(DB.tecnicos,r.tecnicoId)))];
                return ` <span style="text-transform:none;letter-spacing:0;color:${queda<=0?"var(--red)":"var(--amber)"}">· ya van ${ya} de ${c.cantidad}${quienes.length?" · las registró "+esc(quienes.join(", ")):""}${queda>0?" · quedan "+queda:""}</span>`;})()}</span>
                <input type="number" min="0" step="1" max="${Math.max(0,topeActividad(c,a.id)-yaRegistrado(c.id,a.id))}" data-cant="${a.id}" value="${cant}"></label>
              ${esPorOrden(a.id)?`<p class="hint" style="margin:2px 0 6px;grid-column:1/-1">
                Se hace <b>una vez por orden</b>, no por pieza: un informe cubre los ${c.cantidad} ${esc(nom(DB.tiposComponente,c.tipoComponenteId).toLowerCase())}
                y lo demás de la OT. Deja <b>1</b> y escribe el tiempo total.</p>`:""}
              ${(()=>{
                const falta=Math.max(0,(c.cantidad||0)-yaRegistrado(c.id,a.id));
                if(falta>0 || !s) return "";
                return `<p class="hint" style="margin:2px 0 6px;grid-column:1/-1">
                  Las <b>${c.cantidad}</b> unidades ya las registró alguien más. Deja las unidades en <b>0</b>
                  y escribe tu tiempo: tus horas quedan guardadas sin contar las piezas dos veces.</p>`;
              })()}
              <label><span>Tiempo que gastaste</span>
                <div style="display:flex;gap:6px">
                  <input type="number" min="0" step="${uni==="h"?"0.25":"5"}" inputmode="decimal"
                         data-tiempo="${a.id}" value="${valor}" placeholder="${uni==="h"?"0.5":"30"}"
                         style="flex:1 1 auto${(s && !(+s.minutos||0))?";border-color:var(--signal);background:#fdefe5":""}">
                  <select data-unidad="${a.id}" style="flex:0 0 90px">
                    <option value="min" ${uni==="min"?"selected":""}>minutos</option>
                    <option value="h" ${uni==="h"?"selected":""}>horas</option>
                  </select>
                </div></label>
            </div></div>`;
        }).join("");
      }).join("")}
      `:`<div class="empty">Elige el componente para ver sus actividades.</div>`}
    </div>
  </div>`;
}

  return `
  <div class="card">
    <header><h2>Paso 3 · Cierre del registro</h2><span class="sub">Estado y novedades</span></header>
    <div class="body">
      ${(()=>{
        /* El estado lo pone coordinación en PROGRAMACION, no el técnico.
           Antes cualquiera podía escribir que la orden quedaba "Entregado" y

          return `<div class="f"><span class="eyebrow">Estado de la orden</span>

      <label class="f"><span>Tipo de novedad</span>
