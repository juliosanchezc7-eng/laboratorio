/* -------------------------------------------------------------------------
   REPARAR REGISTROS
   Un registro vale horas solo si sabe QUÉ componente se trabajó y QUÉ
   actividad se hizo. Si una de las dos se perdió (la orden se recreó, la
   actividad se borró), el registro sigue ahí pero suma cero.
   Aquí se ven y se arreglan en bloque.
------------------------------------------------------------------------- */
/* --------------------------------------------------------------------------
   LECTURA DEL BLOQUE DE REGISTROS_APP
   Google Sheets no siempre deja copiar la fila de encabezados (sobre todo
   desde el historial de versiones). Por eso, si no aparecen, las columnas se
   reconocen por su CONTENIDO:
     · la de id     -> celdas que empiezan por "rg_"
     · la de crudo  -> celdas que empiezan por "{"
     · la de OT     -> números de 3 a 7 cifras que no son fechas ni cantidades
     · la de comp.  -> textos que coinciden con un tipo de componente conocido
   Siempre se muestra lo detectado antes de aplicar nada.
-------------------------------------------------------------------------- */
function detectarColumnasRegistros(filas){
  const enc = (filas[0]||[]).map(h=>sinTildes(String(h||"")).trim());
  const tiene = n=>enc.indexOf(n);
  if(tiene("id")>=0 && tiene("ot")>=0){
    return {desdeFila:1, id:tiene("id"), ot:tiene("ot"), componente:tiene("componente"),
            cliente:tiene("cliente"), crudo:tiene("crudo"), como:"por los encabezados"};
  }
  /* --- sin encabezados: se mira el contenido --- */
  const nCols = Math.max(...filas.map(f=>f.length));
  const muestra = filas.slice(0, 200);
  const frac = (i, test)=>{
    let vistos=0, ok=0;
    muestra.forEach(f=>{ const v=String(f[i]==null?"":f[i]).trim(); if(!v) return; vistos++; if(test(v)) ok++; });
    return vistos? ok/vistos : 0;
  };
  const nombresTipo = new Set(DB.tiposComponente.map(t=>sinTildes(t.nombre)));
  let id=-1, crudo=-1, ot=-1, componente=-1, cliente=-1;
  for(let i=0;i<nCols;i++){
    if(id<0    && frac(i,v=>/^rg_/i.test(v))>0.6) id=i;
    if(crudo<0 && frac(i,v=>v.charAt(0)==="{")>0.6) crudo=i;
    if(componente<0 && frac(i,v=>nombresTipo.has(sinTildes(v)))>0.3) componente=i;
  }
  /* OT: columna de números largos que no sea fecha ni cantidad */
  let mejor=-1, mejorLargo=0;
  for(let i=0;i<nCols;i++){
    if(i===id||i===crudo||i===componente) continue;
    if(frac(i,v=>/^\d{4}-\d{2}-\d{2}/.test(v))>0.3) continue;          /* fecha */
    const f=frac(i,v=>/^[A-Za-z0-9\-]{3,12}$/.test(v) && (v.match(/\d/g)||[]).length>=3);
    if(f<0.5) continue;
    let sum=0,c=0;
    muestra.forEach(x=>{ const v=String(x[i]==null?"":x[i]).trim(); if(v){ sum+=(v.match(/\d/g)||[]).length; c++; } });
    const largo=c?sum/c:0;
    if(largo>mejorLargo){ mejorLargo=largo; mejor=i; }                  /* la de cifras más largas */
  }
  ot=mejor;
  if(id<0 || ot<0) return null;
  return {desdeFila:0, id, ot, componente, cliente, crudo, como:"por el contenido de las columnas (no venían encabezados)"};
}
/* Rescata el número de OT desde un pegado de REGISTROS_APP (por ejemplo, de
   una versión anterior de la hoja). Solo rellena lo que está vacío: nunca
   pisa un dato bueno que ya tenga la app, así que se pueden pegar varias
   versiones seguidas y cada una tapa los huecos que dejó la anterior.

   Además usa la columna "crudo" como puente: ahí viaja el ordenId interno.
   Si UNA fila de la hoja dice que el ordenId X es la OT 34390, entonces
   TODOS los registros de la app que apunten a X recuperan su número,
   aunque su propia fila haya salido vacía. */
function recuperarOTPegado(txt){
  const t=String(txt||"").trim();
  if(!t) return {error:"Pega primero el bloque de la hoja"};
  const sep = t.split("\n")[0].includes("\t") ? "\t" : ",";
  const filas = (sep==="\t" ? t.replace(/\r/g,"").split("\n").map(l=>partir(l,"\t")) : csvAFilas(t))
    .filter(f=>f.some(x=>String(x||"").trim()!==""));
  if(!filas.length) return {error:"No se reconoció ninguna fila"};
  const M = detectarColumnasRegistros(filas);
  if(!M) return {error:'No encuentro la columna del id (celdas que empiezan por "rg_") ni la del OT. Copia el bloque incluyendo la columna id y la columna ot.'};
  const iId=M.id, iOt=M.ot, iComp=M.componente, iCli=M.cliente, iCru=M.crudo;

  /* --- paso 1: lo que dice cada fila, y el puente por ordenId --- */
  const porFila=new Map();            /* id de registro  -> {ot, cliente, comp} */
  const porOrden=new Map();           /* ordenId interno -> {ot, cliente} */
  const porComp=new Map();            /* componenteId    -> nombre del componente */
  let vacios=0;
  filas.slice(M.desdeFila).forEach(f=>{
    const id=String(f[iId]||"").trim(); if(!id) return;
    const vOt=String(f[iOt]||"").trim();
    const vComp=iComp>=0?String(f[iComp]||"").trim():"";
    const vCli=iCli>=0?String(f[iCli]||"").trim():"";
    if(!vOt && !vComp) vacios++;
    if(vOt||vComp) porFila.set(id,{ot:vOt, cliente:vCli, comp:vComp});
    if(iCru>=0){
      let cr=null; try{ cr=JSON.parse(String(f[iCru]||"")); }catch(e){}
      if(cr){
        if(cr.ordenId && vOt && !porOrden.has(cr.ordenId)) porOrden.set(cr.ordenId,{ot:vOt, cliente:vCli});
        if(cr.componenteId && vComp && !porComp.has(cr.componenteId)) porComp.set(cr.componenteId, vComp);
      }
    }
  });

  /* --- paso 2: qué le sirve a cada registro de la app --- */
  let ot=0, otPuente=0, comp=0, noEstan=0;
  const vistos=new Set(DB.registros.map(r=>r.id));
  porFila.forEach((v,id)=>{ if(!vistos.has(id)) noEstan++; });
  const cambios=[];
  DB.registros.forEach(r=>{
    const c={id:r.id};
    const propia=porFila.get(r.id);
    if(!r.otTexto){
      if(propia && propia.ot){ c.otTexto=propia.ot; ot++; }
      else if(r.ordenId && porOrden.has(r.ordenId)){ c.otTexto=porOrden.get(r.ordenId).ot; otPuente++; }
    }
    if(!r.compTexto){
      if(propia && propia.comp){ c.compTexto=propia.comp; comp++; }
      else if(r.componenteId && porComp.has(r.componenteId)){ c.compTexto=porComp.get(r.componenteId); comp++; }
    }
    if(Object.keys(c).length>1) cambios.push(c);
  });
  const ejemplo = filas.slice(M.desdeFila).find(f=>String(f[iOt]||"").trim());
  return {ot, otPuente, comp, noEstan, vacios, cambios, filas:filas.length-M.desdeFila,
          puentes:porOrden.size, como:M.como,
          ejemploOT: ejemplo? String(ejemplo[iOt]).trim() : "",
          ejemploId: ejemplo? String(ejemplo[iId]).trim() : ""};
}
/* Reconecta a su orden todos los registros sueltos que ya tengan número de OT.
   Devuelve el plan; no toca nada hasta que se confirma. */
function planReenganche(){
  return registrosRotos().sinComponente.filter(r=>r.otTexto).map(r=>{
    const o=DB.ordenes.find(x=>x.ot===r.otTexto && (!r.cuartoId||(x.cuartoDeclaradoId||"")===r.cuartoId))
         || DB.ordenes.find(x=>x.ot===r.otTexto);
    if(!o) return null;
    const cands=DB.componentes.filter(c=>c.ordenId===o.id);
    if(!cands.length) return null;
    /* Se prefiere el componente que coincide en nombre; si no, el del cuarto
       donde trabajó el técnico; si no, el único que haya. */
    const c = (r.compTexto && cands.find(x=>nom(DB.tiposComponente,x.tipoComponenteId)===r.compTexto))
           || (r.cuartoId && cands.find(x=>x.cuartoId===r.cuartoId)) || cands[0];
    return {id:r.id, ordenId:o.id, componenteId:c.id};
  }).filter(Boolean);
}
function aplicarReenganche(plan){
  const m={}; plan.forEach(p=>m[p.id]=p);
  DB.registros.forEach(r=>{
    const p=m[r.id]; if(!p) return;
    r.ordenId=p.ordenId; r.componenteId=p.componenteId;
    const c=byId(DB.componentes,p.componenteId);
    const o=byId(DB.ordenes,p.ordenId);
    if(o) r.otTexto=o.ot;                         /* queda escrito: no se vuelve a perder */
    if(c){ r.tipoComponenteId=c.tipoComponenteId; r.tipologiaId=c.tipologiaId||null;
           r.compTexto=r.compTexto||nom(DB.tiposComponente,c.tipoComponenteId,""); }
    r.minutosStd=stdRegistro(fotoComponente(r), r.actividadId, r.cantidad);
    r.actualizado=new Date().toISOString();
  });
}
/* Componentes que alguien agregó a mano y que la hoja ya trae por su cuenta.
   La sincronización nunca los borra —fue una decisión humana— pero si la hoja
   ya aporta ese mismo componente, quedan duplicados e inflan los ingresos. */
function manualesSobrantes(){
  const conReg=new Set(DB.registros.filter(r=>!r.anulado).map(r=>r.componenteId));
  return DB.componentes.filter(c=>{
    if(c.origen!=="manual") return false;
    if(conReg.has(c.id)) return false;                 /* tiene horas: no se toca */
    const o=byId(DB.ordenes,c.ordenId);
    if(!o || o.origen==="manual") return false;        /* la orden también es a mano */
    /* ¿la hoja ya trae ese mismo tipo de componente en esta orden? */
    return DB.componentes.some(x=>x.ordenId===c.ordenId && x.id!==c.id
      && x.tipoComponenteId===c.tipoComponenteId && x.origen!=="manual");
  });
}

}

/* Aprende las equivalencias comparando con el respaldo de OTRO equipo.
   El mismo registro tiene el mismo id en los dos; si allá apunta a una orden
   que aquí existe y la nuestra no, ya sabemos que los dos números son la
   misma orden. No depende de la sincronización ni de esperar a nadie. */
function aprenderDeRespaldo(txt){
  let d; try{ d=JSON.parse(limpiarJson(txt)); }catch(e){ return {error:"Ese archivo no es un respaldo válido"}; }
  if(!d || !Array.isArray(d.registros)) return {error:"El respaldo no trae registros"};
  const ordAlla=new Map((d.ordenes||[]).map(o=>[o.id,o]));
  const compAlla=new Map((d.componentes||[]).map(c=>[c.id,c]));
  const mio=new Map(DB.registros.map(r=>[r.id,r]));
  const eq={}; const campos=[];
  let pareados=0;
  d.registros.forEach(rf=>{
    const rj=mio.get(rf.id); if(!rj) return;
    pareados++;
    if(rf.ordenId && rj.ordenId && rf.ordenId!==rj.ordenId
       && byId(DB.ordenes,rf.ordenId) && !byId(DB.ordenes,rj.ordenId)) eq[rj.ordenId]=rf.ordenId;
    if(rf.componenteId && rj.componenteId && rf.componenteId!==rj.componenteId
       && byId(DB.componentes,rf.componenteId) && !byId(DB.componentes,rj.componenteId)) eq[rj.componenteId]=rf.componenteId;
    /* Texto que allá sí quedó guardado y aquí no. */
    if(rf.otTexto && !rj.otTexto) campos.push([rj.id,"otTexto",rf.otTexto]);
    if(rf.compTexto && !rj.compTexto) campos.push([rj.id,"compTexto",rf.compTexto]);
    if(rf.tipoComponenteId && !rj.tipoComponenteId) campos.push([rj.id,"tipoComponenteId",rf.tipoComponenteId]);
  });
  return {eq, campos, pareados, equipo:(d.meta&&d.meta.version)||"?", total:d.registros.length};
}
function pRepararRegistros(){

  if(eng) eng.onclick=async()=>{

    if(!sueltos.length){ toast("Ninguno guarda el número de OT todavía"); return; }
    const plan=planReenganche();
    if(!plan.length){ toast("Ninguna de esas OT está hoy en la app"); return; }
    if(!await confirmar("Reenganchar registros",
      `Se van a reconectar ${plan.length} de ${sueltos.length} registros a su orden por el número de OT.\n\nDespués se recalculan sus horas estándar.`,
      "Reenganchar")) return;

    empujarRegistros().catch(()=>{});
  };
  const ro=$("#repOtro");
  if(ro) ro.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=async()=>{
      const res=aprenderDeRespaldo(rd.result);
      if(res.error){ toast(res.error); return; }
      const nEq=Object.keys(res.eq).length;
      if(!nEq && !res.campos.length){
        toast(`Se compararon ${res.pareados} registros, pero ese equipo no aporta nada que aquí falte`); return; }
      if(!await confirmar("Reparar con otro equipo",
        `Se compararon ${res.pareados} registros en común.\n\n`+
        (nEq?`• ${nEq} equivalencias de orden/componente\n`:"")+
        (res.campos.length?`• ${res.campos.length} datos de texto que aquí faltaban\n`:"")+
        `\nSe reconectan los registros y se recalculan sus horas. Nada se borra.`,
        "Reparar")) return;
      let antes=0, despues=0;
      await commit(()=>{
        antes=registrosRotos().sinComponente.length;
        DB.meta.remapeoIds=Object.assign({}, DB.meta.remapeoIds||{}, res.eq);
        const m=new Map(DB.registros.map(r=>[r.id,r]));
        res.campos.forEach(([id,k,v])=>{ const r=m.get(id); if(r && !r[k]) r[k]=v; });
        migrar();
        DB.registros.forEach(r=>{ const c=fotoComponente(r);
          if(c) r.minutosStd=stdRegistro(c, r.actividadId, r.cantidad); });
        despues=registrosRotos().sinComponente.length;
      }, "Reparado");
      toast(`Registros sin componente: ${antes} → ${despues}`);
      empujarRegistros().catch(()=>{});
    };
    rd.readAsText(f);
  };
  const rs=$("#reenviarTodo");

    if(!await confirmar("Reenviar todos los registros",
      "Se vuelven a subir los "+RA().length+" registros de este equipo a la hoja.\n\nNo se borra nada: los que ya estén se actualizan.",
      "Reenviar")) return;
    try{ await empujarRegistros(true); toast("Registros reenviados"); }
    catch(e){ toast("No se pudo: "+e.message); }
    render();
  };
  const rec=$("#recOTgo");
  if(rec) rec.onclick=async()=>{
    const res=recuperarOTPegado($("#recOT").value);
    if(res.error){ toast(res.error); return; }
    if(!res.ot && !res.otPuente && !res.comp){ toast(`Se leyeron ${res.filas} filas, pero no aportan nada que le falte a la app`); return; }
    if(!await confirmar("Recuperar el OT",
      `Se leyeron ${res.filas} filas · columnas reconocidas ${res.como}.\n`+
      (res.ejemploOT?`Ejemplo leído: el registro ${res.ejemploId} es la OT ${res.ejemploOT}. Si eso no cuadra, cancela.\n`:"")+
      `\n`+
      `• ${res.ot} registros recuperan su OT de su propia fila\n`+
      (res.otPuente?`• ${res.otPuente} más lo recuperan por la columna "crudo" (misma orden)\n`:"")+
      (res.comp?`• ${res.comp} recuperan el nombre del componente\n`:"")+
      (res.vacios?`• ${res.vacios} venían con el OT vacío (se ignoran)\n`:"")+
      (res.noEstan?`• ${res.noEstan} no están en esta app (se ignoran)\n`:"")+
      `\nDespués se reenganchan a su orden y se recalculan las horas.`,
      "Recuperar")) return;
    let enganchados=0;
    await commit(()=>{
      const m=new Map(DB.registros.map(r=>[r.id,r]));
      res.cambios.forEach(c=>{ const r=m.get(c.id); if(!r) return;
        if(c.otTexto && !r.otTexto) r.otTexto=c.otTexto;
        if(c.compTexto && !r.compTexto) r.compTexto=c.compTexto;
        r.actualizado=new Date().toISOString(); });
      const plan=planReenganche(); enganchados=plan.length;
      aplicarReenganche(plan);
    }, `${res.ot} OT recuperados · ${enganchados} registros reenganchados`);
    empujarRegistros().catch(()=>{});
  };
  const ra=$("#repActividades");
  if(ra) ra.onclick=async()=>{
    const mapa={};
    document.querySelectorAll("[data-repact]").forEach(sel=>{ if(sel.value) mapa[sel.dataset.repact]=sel.value; });
    if(!Object.keys(mapa).length){ toast("Elige primero a qué actividad pasan"); return; }
    const afectados=RA().filter(r=>mapa[r.actividadId]).length;
    if(!await confirmar("Cambiar la actividad",
      `${afectados} registros pasan a: ${[...new Set(Object.values(mapa))].map(id=>nom(DB.actividades,id)).join(", ")}.\n\nSe recalculan sus horas estándar.`,
      "Cambiar")) return;
    await commit(()=>{
      DB.registros.forEach(r=>{
        const destino=mapa[r.actividadId]; if(!destino) return;
        r.actividadId=destino;
        r.minutosStd=stdRegistro(fotoComponente(r), destino, r.cantidad);
        r.actualizado=new Date().toISOString();
      });
    }, afectados+" registros corregidos");
    empujarRegistros().catch(()=>{});
  };
}

function partir(linea,sep){
  if(sep==="\t") return linea.split("\t").map(s=>s.trim());
  const out=[]; let cur="",q=false;
  for(let i=0;i<linea.length;i++){ const ch=linea[i];
    if(ch==='"'){ if(q&&linea[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===sep&&!q){ out.push(cur.trim()); cur=""; }
    else cur+=ch; }
  out.push(cur.trim()); return out;
}
function normFechaEstricta(v){
  const t=String(v==null?"":v).trim();
  if(!t) return "";
  if(/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0,10);
  const m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let[,d,mo,y]=m; if(y.length===2)y="20"+y;
    if(+mo>12 && +d<=12){ const x=d; d=mo; mo=x; }   /* tolera mm/dd */
    return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
  const p=Date.parse(t);
  if(!isNaN(p)) return new Date(p).toISOString().slice(0,10);
  return "";
}
function normFecha(s){
  if(!s) return hoyISO();
  s=s.trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){ let[,d,mo,y]=m; if(y.length===2)y="20"+y; return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  return hoyISO();
}
function buscarOCrear(col, nombre, extra){
  if(!nombre) return null;
  const n=nombre.trim().toLowerCase();
  let o=DB[col].find(x=>String(x.nombre||"").trim().toLowerCase()===n);
  if(!o){ o={id:uid(col.slice(0,2)),nombre:nombre.trim(),...extra}; DB[col].push(o); }
  return o;
}
/* autodetección de columnas a partir del encabezado */
/* v8: se agregaron TRANS., REGULA. y MICROFILTROS. Al subir este número todos
   los equipos vuelven a detectar las columnas: los mapas guardados apuntaban a
   posiciones viejas desde que la hoja cambió de estructura. */
/* v9: reconoce TECNICO y NOVEDAD, y ahora el mapa se reconstruye solo cuando
   la hoja cambia de estructura, aunque esté fijado a mano. */
const DETECTOR = 9;
function detectarMapa(enc, filasMuestra){
  const map={};
  const porNombre=n=>{ const t=DB.tiposComponente.find(x=>x.nombre.toLowerCase().indexOf(n)>=0); return t?("comp:"+t.id):null; };
  enc.forEach((h,i)=>{
    const k=String(h||"").toLowerCase().replace(/\./g,"").trim();
    let v="ignorar";
    const esCumplimiento = /cumplim|a\s*tiempo|atras|oportun|sla|vencim/.test(k);
    if(/^garant/.test(k)){ map[i]="garantia"; return; }
    if(/^cuarto|^secci|^area$|^área$|^taller/.test(k)){ map[i]="cuarto"; return; }   /* sale del forEach */
    if(/^tecnico|^t[eé]cnico\s*asignado/.test(k)){ map[i]="tecnicoHoja"; return; }
    if(/^novedad/.test(k)){ map[i]="novedadHoja"; return; }
    if(/^ot$|orden|n[°o]\s*orden|numero/.test(k)) v="ot";
    else if(/cliente|empresa/.test(k)) v="cliente";
    else if(/entregad/.test(k)) v="fechaEntrega";              /* FECHA ENTREGADO = real */
    else if(/compromiso|pactad|prometid|fecha de entrega|fecha entrega/.test(k)) v="ignorar"; /* compromiso */
    else if(/diag|repues|compra|autoriz|pir|\bsol\b|solicit|promes|compromis/.test(k)) v="ignorar";
    else if(/fecha.*ingres|ingres.*fecha|^fecha$|^fecha /.test(k)) v="fechaIngreso";
    else if(/estado\s*real/.test(k)) v="estado";
    else if(/^estado|status/.test(k) && !esCumplimiento) v="estado";
    else if(/^tipo$/.test(k)) v="tipologias";
    else if(/^motivo|motivo|raz[oó]n|causa|tipo de ingreso|ingresa por|concepto/.test(k)) v="motivo";
    else if(/^garant|garantia/.test(k)) v="garantia";
    /* columnas de cantidad por componente, tal como vienen en la hoja */
    else if(/inyect/.test(k)) v=porNombre("inyector common rail")||porNombre("inyector")||"ignorar";
    else if(/riel/.test(k)) v=porNombre("riel")||"ignorar";
    /* TRANS. va antes que bomba: "bomba de transferencia" contiene las dos
       palabras y sin este orden la transferencia se leía como bomba de alta. */
    else if(/^trans|transfer/.test(k)) v=porNombre("transferencia")||"ignorar";
    else if(/bomba/.test(k)) v=porNombre("bomba de alta")||porNombre("bomba")||"ignorar";
    else if(/turbo/.test(k)) v=porNombre("turbo")||"ignorar";
    /* El regulador de presión del riel es del cuarto Electrónico. Antes caía en
       "Actuador / VGT", que es del cuarto de Turbos: la pieza terminaba en el
       cuarto equivocado. */
    else if(/regula/.test(k)) v=porNombre("regulador")||"ignorar";
    else if(/microfiltro|filtro/.test(k)) v=porNombre("microfiltro")||porNombre("filtro")||"ignorar";
    else if(/obs|nota|coment/.test(k)) v="obs";
    map[i]=v;
  });
  /* Detección por contenido: si una columna ignorada trae sobre todo motivos
     (Reparación, Garantía, Mantenimiento…), se asigna aunque el título no lo diga. */
  if(!Object.keys(map).some(i=>map[i]==="motivo") && filasMuestra && filasMuestra.length){
    const cand=Object.keys(map).filter(i=>map[i]==="ignorar").map(i=>{
      let ok=0, tot=0;
      filasMuestra.forEach(f=>{ const v=sinTildes(f[i]||"").trim(); if(!v) return; tot++;
        if(/reparacion|garantia|diagnostico|mantenimiento|reproceso|revision/.test(v)) ok++; });
      return {i, r: tot? ok/tot : 0, tot};
    }).filter(x=>x.tot>=3 && x.r>=0.7).sort((a,b)=>b.r-a.r)[0];
    if(cand) map[cand.i]="motivo";
  }
  if(!Object.keys(map).some(i=>map[i]==="garantia") && filasMuestra && filasMuestra.length){
    const cand=Object.keys(map).filter(i=>map[i]==="ignorar").map(i=>{
      let ok=0, tot=0;
      filasMuestra.forEach(f=>{ const v=sinTildes(f[i]||"").trim(); if(!v) return; tot++;
        if(/aplica/.test(v)) ok++; });
      return {i, r: tot? ok/tot : 0, tot};
    }).filter(x=>x.tot>=3 && x.r>=0.7).sort((a,b)=>b.r-a.r)[0];
    if(cand) map[cand.i]="garantia";
  }
  /* Si más de una columna quedó como Estado, se conserva la que diga "estado real"
     (o la primera). Las otras se ignoran: una columna de cumplimiento no es un estado. */
  /* Dos columnas no pueden alimentar el mismo componente: la de nombre más
     parecido se queda con él, la otra se ignora hasta que la asignes a mano. */
  const porComp={};
  Object.keys(map).forEach(i=>{
    const v=String(map[i]);
    if(v.indexOf("comp:")!==0) return;
    const id=v.slice(5);
    if(!porComp[id]) porComp[id]=[];
    porComp[id].push(i);
  });
  Object.entries(porComp).forEach(([id,cols])=>{
    if(cols.length<2) return;
    const t=byId(DB.tiposComponente,id); const nb=t?sinTildes(t.nombre):"";
    const mejor=cols.slice().sort((a,b)=>{
      const ka=sinTildes(String(enc[a]||"")), kb=sinTildes(String(enc[b]||""));
      const pa=nb.indexOf(ka.replace(/[^a-z]/g,""))>=0?0:1, pb=nb.indexOf(kb.replace(/[^a-z]/g,""))>=0?0:1;
      return pa-pb;
    })[0];
    cols.forEach(i=>{ if(i!==mejor) map[i]="ignorar"; });
  });
  /* Ajustes que fijó el usuario: se aplican al final y mandan sobre todo. */
  const fijos=(DB.meta.conexion&&DB.meta.conexion.fijos)||null;
  if(fijos) enc.forEach((h,i)=>{ const k=sinTildes(String(h||"")); if(fijos[k]) map[i]=fijos[k]; });
  const co=Object.keys(map).filter(i=>map[i]==="ot");
  if(co.length>1){
    const buena = co.find(i=>/^(ot|orden)$/.test(sinTildes(enc[i]).trim()))
               || co.find(i=>!/id|cuarto|clave|llave/.test(sinTildes(enc[i])))
               || co[0];
    co.forEach(i=>{ if(i!==buena) map[i]="ignorar"; });
  }
  const cols=Object.keys(map).filter(i=>map[i]==="estado");
  if(cols.length>1){
    const real=cols.find(i=>/estado\s*real/.test(sinTildes(enc[i]))) || cols[0];
    cols.forEach(i=>{ if(i!==real) map[i]="ignorar"; });
  }
  /* Si hay "FECHA DE ENTREGA" (compromiso) y "FECHA ENTREGADO" (real),
     manda la real: la promesa no dice cuándo salió la pieza. */
  const fe=Object.keys(map).filter(i=>map[i]==="fechaEntrega");
  if(fe.length>1){
    const real=fe.find(i=>/entregad/.test(sinTildes(enc[i]))) || fe[fe.length-1];
    fe.forEach(i=>{ if(i!==real) map[i]="ignorar"; });
  }
  /* Varias columnas de fecha: manda la que diga "ingreso"; si no, la primera. */
  const fi=Object.keys(map).filter(i=>map[i]==="fechaIngreso");
  if(fi.length>1){
    const buena=fi.find(i=>/ingres/.test(sinTildes(enc[i]))) || fi[0];
    fi.forEach(i=>{ if(i!==buena) map[i]="ignorar"; });
  }
  return map;
}
/* núcleo compartido: convierte filas + mapa en órdenes y componentes */
function aplicarFilas(filas, mapa){
  const datos=filas.slice(1);
  const idx={}; Object.entries(mapa).forEach(([i,c])=>{ if(c!=="ignorar") idx[c]=+i; });
  if(idx.ot===undefined) return {error:"Falta la columna de OT"};
  const desde = (DB.meta.conexion && DB.meta.conexion.desdeFecha) || "";
  const omitirSF = (DB.meta.conexion.sinFecha||"omitir")==="omitir";
  let nOT=0,nC=0,nAct=0,omitidas=0,sinFecha=0,porRevisar=0,depurados=0,multi=0,repetidas=0,adoptadas=0,reasignadas=0;
  const sinComponente=[];
  const avisos=[];
  const nuevosEstados=[];
  /* Si el mapeo apunta a un componente que ya no existe (lo borraste o
     renombraste), se busca el equivalente por el nombre de la columna. */
  /* La fila de encabezados no siempre es la primera. El puente hace
     IMPORTRANGE de A:Z y arrastra la fila en blanco que tiene la hoja arriba,
     así que llegaba una fila vacía como encabezado. Sin nombres, el mapeo se
     hacía por POSICIÓN — y bastaba una columna nueva para correrlo todo.
     Se aplica a cualquier fuente: puente, CSV o pegado. */
  filas = recortarEncabezado(filas);
  const enc = filas[0]||[];
  DB.meta.encabezadosVistos = enc.map(x=>String(x==null?"":x).trim());
  const compCols = Object.entries(mapa)
    .filter(([,v])=>String(v).indexOf("comp:")===0)
    .map(([i,v])=>{
      let tipoId=String(v).slice(5);
      if(!byId(DB.tiposComponente,tipoId)){
        const k=sinTildes(String(enc[+i]||""));
        const buscar=(...fr)=>DB.tiposComponente.find(t=>{const nb=sinTildes(t.nombre); return fr.some(f=>nb.indexOf(f)>=0);});
        let t=null;
        if(/riel/.test(k))            t=buscar("riel");
        else if(/inyect/.test(k))     t=buscar("inyector");
        else if(/bomba/.test(k))      t=buscar("bomba");
        else if(/regula/.test(k))     t=buscar("regulador");
        else if(/turbo/.test(k))      t=buscar("turbo");
        else if(/microfiltro|filtro/.test(k)) t=buscar("microfiltro","filtro");
        /* no reutilizar un componente que ya tiene su propia columna */
        const ocupados=new Set(Object.entries(mapa)
          .filter(([j,v])=>+j!==+i && String(v).indexOf("comp:")===0).map(([,v])=>String(v).slice(5)));
        if(t && ocupados.has(t.id)) t=null;
        if(t){ tipoId=t.id; mapa[i]="comp:"+t.id; reasignadas++; }
        else { mapa[i]="ignorar"; sinComponente.push(String(enc[+i]||"columna "+(+i+1))); }
      }
      return {i:+i, tipoId};
    })
    .filter(x=>byId(DB.tiposComponente,x.tipoId));

  /* La misma OT puede venir en varias filas (una por cuarto). Se agrupan para
     que los componentes se sumen en vez de pisarse. */
  const grupos=new Map();
  datos.forEach(f=>{
    const ot=String(f[idx.ot]||"").trim(); if(!ot) return;
    const fIso = idx.fechaIngreso!==undefined ? normFechaEstricta(f[idx.fechaIngreso]) : "";
    if(desde){
      if(fIso && fIso < desde){ omitidas++; return; }
      if(!fIso){ sinFecha++; if(omitirSF) return; }
    }
    /* Identidad = OT + cuarto. La misma OT en dos cuartos son DOS órdenes,
       cada una con su estado y sus componentes. */
    const cuId = idx.cuarto!==undefined ? cuartoPorNombre(f[idx.cuarto]) : cuartoDeclarado(ot);
    /* Identidad = OT + cuarto + fecha de ingreso. Si la misma OT vuelve a
       entrar otro día, es otra entrada y cuenta en su propio período. */
    const clave = ot+"|"+(cuId||"")+"|"+(fIso||"");
    if(!grupos.has(clave)) grupos.set(clave,{ot, cuId, fIso, filas:[]});
    grupos.get(clave).filas.push({f, fIso});
  });
  const porOT={}; grupos.forEach(g=>{ porOT[g.ot]=(porOT[g.ot]||0)+1; });
  Object.values(porOT).forEach(v=>{ if(v>1) multi++; });

  const usadas=new Set();
  grupos.forEach(({ot, cuId, fIso:fGrupo, filas:filasOT})=>{
    let o=DB.ordenes.find(x=>x.ot===ot && (x.cuartoDeclaradoId||"")===(cuId||"")
       && x.fechaIngreso===fGrupo && !usadas.has(x.id));
    /* Órdenes de versiones anteriores: sin cuarto, o con el cuarto pegado al
       número ("35548-Electrónico"). Se adoptan y renombran, no se duplican. */
    /* Órdenes de versiones anteriores: mismo OT y cuarto pero con otra fecha,
       sin cuarto, o con el cuarto pegado al número. Se adoptan, no se duplican. */
    if(!o){
      const cuNom = cuId? sinTildes(nom(DB.cuartos,cuId)) : "";
      o = DB.ordenes.find(x=>x.ot===ot && (x.cuartoDeclaradoId||"")===(cuId||"") && !usadas.has(x.id))
       || (cuId && DB.ordenes.find(x=>x.ot===ot && !x.cuartoDeclaradoId && !usadas.has(x.id)))
       || DB.ordenes.find(x=>{
            if(usadas.has(x.id)) return false;
            const t=sinTildes(x.ot);
            return t!==sinTildes(ot) && otBase(t)===sinTildes(otBase(ot))
                && (!cuNom || t.indexOf(cuNom)>=0);
          });
      if(o){ o.ot=ot; o.cuartoDeclaradoId=cuId||o.cuartoDeclaradoId||""; o.fechaIngreso=fGrupo||o.fechaIngreso; adoptadas++; }
    }
    const primera=filasOT[0];
    if(!o){ const fIng=fGrupo||hoyISO();
      o={id:idOrden(ot,cuId||"",fIng),ot,cuartoDeclaradoId:cuId||"",cliente:"",fechaIngreso:fIng,estado:"Ingresada",obs:""};
      DB.ordenes.push(o); nOT++; }
    else { o.cuartoDeclaradoId=cuId||o.cuartoDeclaradoId||""; nAct++; }
    usadas.add(o.id);
    o.vigente = true;              /* la hoja la trae: cuenta en Ingresos */

    const creados=[]; const pendientes=[]; const acum={};
    /* Guarda de cuánto es cada tipología dentro de un componente mezclado
       (13 inyectores = 7 ISB + 6 B7). Vive al mismo nivel que "acum" porque
       una orden puede llegar en varias filas y hay que seguir sumando. */
    const acumDesglose={};
    filasOT.forEach(({f,fIso})=>{
      if(idx.cliente!==undefined && f[idx.cliente]) o.cliente=f[idx.cliente];
      if(fIso) o.fechaIngreso=fIso;
      if(idx.estado!==undefined && f[idx.estado]){
        const e=String(f[idx.estado]).trim();
        const basura = !e || /^#(ref|n\/a|value|name|div|null|num|¡)/i.test(e)
          || /^(atrasado|a tiempo|si|no|ok|-|0)$/i.test(sinTildes(e).replace(/[^\wáéíóúñ\s\/]/g,"").trim());
        if(!basura){
          let m=DB.estados.find(x=>x.toLowerCase()===e.toLowerCase());
          if(!m){ DB.estados.push(e); m=e; nuevosEstados.push(e); }
          o.estado=m;
        }
      }
      if(idx.obs!==undefined && f[idx.obs]) o.obs=f[idx.obs];
      /* Solo se guardan como referencia: es lo que la hoja SUGIERE, nunca
         restringe quién puede registrar. Coordinación decidió que cualquiera
         puede trabajar cualquier orden; esto solo preselecciona el nombre. */
      if(idx.tecnicoHoja!==undefined && f[idx.tecnicoHoja]) o.tecnicoHoja=String(f[idx.tecnicoHoja]).trim();
      if(idx.novedadHoja!==undefined && f[idx.novedadHoja]) o.novedadHoja=String(f[idx.novedadHoja]).trim();
      if(idx.fechaEntrega!==undefined){ const fe=normFechaEstricta(f[idx.fechaEntrega]); if(fe) o.fechaEntrega=fe; }
      if(idx.motivo!==undefined && f[idx.motivo]){
        const mv=String(f[idx.motivo]).trim();
        if(mv && !/^#/.test(mv)){
          let mm=DB.motivos.find(x=>sinTildes(x)===sinTildes(mv));
          if(!mm){ DB.motivos.push(mv); mm=mv; }
          o.motivo=mm;
        }
      }
      if(idx.garantia!==undefined){
        const g=String(f[idx.garantia]||"").trim();
        if(g && !/^#/.test(g)) o.garantia = /^no/i.test(sinTildes(g)) ? "No aplica"
          : (/^s[ií]/i.test(sinTildes(g)) ? "Sí aplica" : g);
      }

      /* --- componentes de ESTA fila --- */
      if(!compCols.length) return;
      const crudo = idx.tipologias!==undefined ? String(f[idx.tipologias]||"").trim() : "";
      /* La hoja manda: si en NUEVA PROGRAMACIÓN corrigen el TIPO (de FUSO a
         TD04, por ejemplo), esa es la verdad. Antes se iba acumulando
         "FUSO / TD04" y la corrección nunca se veía. */
      if(crudo) o.tipoTexto = crudo;
      const ignorar=new Set(DB.meta.tokensIgnorados||[]);
      const protegido = crudo.replace(/(\d)\s*,\s*(\d)/g, "$1\u0001$2");
      const tokens = protegido.split(/[\/;|]+|,/)
        .map(x=>x.replace(/\u0001/g, ",").trim())
        .filter(Boolean)
        .filter(x=>!/^[\d.,\-\s]+$/.test(x) && x.length>1)
        .filter(x=>!esNombreDeComponente(x))
        .filter(x=>!ignorar.has(sinTildes(x)));
      const usados=new Set();
      const cuartoOT=o.cuartoDeclaradoId || cuartoDeclarado(o.ot);
      /* Se guardan las PARTES de cada celda, no solo el total: así se sabe si
         "7 / 6" trae dos números o si "3" es uno solo sin partir. */
      const conCantidad = compCols.map(cc=>{
        const partes = partirCantidadHoja(f[cc.i]);
        return {cc, partes, cant: partes.reduce((a,x)=>a+x,0)};
      }).filter(x=>x.cant>0);
      conCantidad.forEach(({cc,cant,partes})=>{
        const base = byId(DB.tiposComponente, cc.tipoId); if(!base) return;

        /* CASO EXPLÍCITO: la celda trae tantos números como tipologías hay en
           TIPO ("7 / 6" con "ISB / B7"). No se adivina nada — el operador ya
           dijo cuánto es de cada una.
           Los tokens se agrupan por su destino REAL: si dos tokens apuntan al
           mismo tipo de componente (los inyectores ISB y B7 son ambos
           "Inyector Common Rail" — la pieza es igual, solo cambia el motor),
           se suman en un componente. Si apuntan a destinos distintos (BOMBAS:
           B7 tiene su propio tipo "Bomba B7", separado de la bomba de alta),
           quedan en componentes separados.
           Los tokens NO se marcan como "usados": partir una columna no debe
           impedir que OTRA columna sin partir (como BOMBAS con un solo "2")
           siga encontrando su tipología normalmente. */
        if(partes.length>1 && partes.length===tokens.length){
          const porDestino = new Map();
          tokens.forEach((tk,i)=>{
            const n = partes[i]; if(!n) return;
            const tip = DB.tipologias.find(x=>coincideTipologia(x,tk));
            const tipoDestino = (tip && tip.tipoComponenteId && byId(DB.tiposComponente,tip.tipoComponenteId)
              && familiaDe(byId(DB.tiposComponente,tip.tipoComponenteId).nombre)===familiaDe(base.nombre))
              ? byId(DB.tiposComponente,tip.tipoComponenteId) : base;
            const entry = porDestino.get(tipoDestino.id) || {tipo:tipoDestino, cant:0, tipologias:new Set(), porTip:{}};
            entry.cant += n;
            if(tip){
              entry.tipologias.add(tip.id);
              entry.porTip[tip.id] = (entry.porTip[tip.id]||0) + n;
            }
            porDestino.set(tipoDestino.id, entry);
          });
          porDestino.forEach(entry=>{
            acum[entry.tipo.id]=(acum[entry.tipo.id]||0)+entry.cant;
            /* Una sola tipología entre los tokens que cayeron aquí: se
               etiqueta con ella. Si son dos tipologías distintas mezcladas
               en el mismo componente (los 13 inyectores del ejemplo), no se
               elige una al azar — se deja sin tipología específica antes
               que mostrar una etiqueta que es solo la mitad de la verdad.
               Pero SÍ se guarda el desglose: 7 ISB + 6 B7, para que se pueda
               mostrar aunque el componente sea uno solo para el técnico. */
            const tipUnico = entry.tipologias.size===1 ? [...entry.tipologias][0] : null;
            const esMezcla = entry.tipologias.size>1;
            const dAcum = acumDesglose[entry.tipo.id] = acumDesglose[entry.tipo.id] || {};
            Object.entries(entry.porTip).forEach(([tid,n])=>{ dAcum[tid]=(dAcum[tid]||0)+n; });
            const desgloseArr = Object.entries(dAcum)
              .map(([tid,n])=>({tipologiaId:tid, cantidad:n}))
              .sort((a,b)=>b.cantidad-a.cantidad);
            let c2=DB.componentes.find(c=>c.ordenId===o.id && c.tipoComponenteId===entry.tipo.id);
            if(c2){ c2.cantidad=acum[entry.tipo.id];
              if(c2.origen!=="manual"){
                if(tipUnico){ c2.tipologiaId=tipUnico; c2.tipMezcla=false; c2.desglose=null; }
                else if(esMezcla){ c2.tipologiaId=null; c2.tipMezcla=true; c2.desglose=desgloseArr; }
              }
            } else { c2={id:idComponente(o.id,entry.tipo.id),ordenId:o.id,tipoComponenteId:entry.tipo.id,
              tipologiaId:tipUnico, tipMezcla:esMezcla, desglose:esMezcla?desgloseArr:null,
              cantidad:acum[entry.tipo.id], cuartoId:entry.tipo.cuartoId,
              estado:o.estado, serie:"", origen:"hoja"}; DB.componentes.push(c2); nC++; }
            c2.origen=c2.origen||"hoja";
            creados.push(c2);
          });
          return;
        }

        const r = resolverTipo(base, tokens, usados, cuartoOT);
        if(r.aviso && avisos.indexOf(r.aviso)<0) avisos.push(r.aviso);
        /* Si la celda TIPO trae un solo texto, describe toda la orden y lo
           pueden usar todos los componentes: no se consume. */
        if(r.token && tokens.length>1) usados.add(r.token);
        let tipo = r.tipo;
        /* ¿Esa cantidad esconde más de una clase de bomba? */
        /* El texto de la celda TIPO ya viene troceado en tokens; con eso basta
           para saber si la orden es de un motor B7. */
        const dg = desglosarComponente(tipo, cant, tokens.join(" ")+" "+(o.tipoTexto||""), cuartoOT);
        if(dg){
          dg.partes.forEach(p=>{
            acum[p.tipo.id]=(acum[p.tipo.id]||0)+p.cant;
            let c2=DB.componentes.find(c=>c.ordenId===o.id && c.tipoComponenteId===p.tipo.id);
            if(c2){ c2.cantidad=acum[p.tipo.id]; c2.cuartoId=p.tipo.cuartoId; }
            else { c2={id:idComponente(o.id,p.tipo.id),ordenId:o.id,
              tipoComponenteId:p.tipo.id, tipologiaId:r.tip?r.tip.id:null, cantidad:acum[p.tipo.id],
              cuartoId:p.tipo.cuartoId, estado:o.estado, serie:"", origen:"hoja"};
              DB.componentes.push(c2); nC++; }
            c2.origen=c2.origen||"hoja";
            creados.push(c2);
          });
          /* Queda marcada en la orden para que coordinación la confirme, pero
             NO va a la lista de avisos: no es un error de configuración, es
             una lectura correcta que conviene verificar. */
          o.revisar = dg.nota;
          return;
        }
        /* Varias filas de la misma OT y cuarto son entradas sucesivas de la
           misma orden (llegó un riel el martes, una bomba el jueves): se suman. */
        if(acum[tipo.id]!==undefined) repetidas++;
        acum[tipo.id]=(acum[tipo.id]||0)+cant;
        let comp = DB.componentes.find(c=>c.ordenId===o.id && c.tipoComponenteId===tipo.id);
        if(comp){ comp.cantidad=acum[tipo.id];
          /* La tipología también la manda la hoja, salvo que el componente lo
             haya agregado alguien a mano. */
          if(r.tip && comp.origen!=="manual" && comp.tipologiaId!==r.tip.id) comp.tipologiaId=r.tip.id;
          else if(r.tip && !comp.tipologiaId) comp.tipologiaId=r.tip.id;
          comp.cuartoId=tipo.cuartoId; }
        else { comp={id:idComponente(o.id,tipo.id),ordenId:o.id,tipoComponenteId:tipo.id,tipologiaId:r.tip?r.tip.id:null,
          cantidad:acum[tipo.id], cuartoId:tipo.cuartoId, estado:o.estado, serie:"", origen:"hoja"}; DB.componentes.push(comp); nC++; }
        comp.origen = comp.origen || "hoja";
        creados.push(comp);
      });
      const libres = tokens.filter(t=>!usados.has(t));
      /* No se les asigna una tipología única a los que quedaron marcados como
         mezcla real (varios tokens en el mismo componente, por ejemplo los
         13 inyectores ISB+B7): ya se decidió a propósito no elegir una al
         azar, y esta limpieza no debe deshacer esa decisión. */
      const sinTip = creados.filter(c=>!c.tipologiaId && !c.tipMezcla);
      const ponerTip=(c,tk,sup)=>{
        const tipo=byId(DB.tiposComponente,c.tipoComponenteId);
        const tp = buscarTipologia(c.tipoComponenteId, tk)
                || buscarOCrear("tipologias", tk, {cuartoId: tipo?tipo.cuartoId:cuartoOT, tipoComponenteId:""});
        c.tipologiaId=tp.id; if(sup) c.tipSupuesta=true;
      };
      if(libres.length===1 && sinTip.length){ sinTip.forEach(c=>ponerTip(c, libres[0], false)); }
      else if(libres.length && libres.length===sinTip.length){ sinTip.forEach((c,k)=>ponerTip(c, libres[k], true)); }
      else {
        /* Un token que YA existe como tipología no es "sin ubicar": el usuario
           ya dijo qué es. Solo se marcan los que la app no conoce. */
        pendientes.push(...libres.filter(tk=>!DB.tipologias.some(x=>coincideTipologia(x,tk))));
      }
    });

    /* Si algún componente quedó sin tipología y hay un token que la app ya
       conoce, se le aplica: es lo que el usuario indicó antes. Los marcados
       como mezcla real quedan fuera a propósito. */
    creados.filter(c=>!c.tipologiaId && !c.tipMezcla).forEach(c=>{
      const txt=(o.tipoTexto||"").split(/[\/;|]+|,/).map(x=>x.trim()).filter(Boolean);
      for(const tk of txt){
        const tp=DB.tipologias.find(x=>coincideTipologia(x,tk));
        if(tp && (!tp.tipoComponenteId || tp.tipoComponenteId===c.tipoComponenteId)){ c.tipologiaId=tp.id; break; }
      }
    });

    /* La hoja manda, pero contando TODAS las filas de esa OT juntas. */
    if(creados.length){
      const ok=new Set(creados.map(c=>c.id));
      DB.componentes.filter(c=>c.ordenId===o.id && !ok.has(c.id) && c.origen!=="manual"
          && !DB.registros.some(r=>r.componenteId===c.id))
        .forEach(c=>{ DB.componentes = DB.componentes.filter(x=>x.id!==c.id); depurados++; });
    }
    const sobra=[...new Set(pendientes)];
    o.revisar = sobra.length ? sobra : null;
    if(sobra.length) porRevisar++;
  });

  /* Ingresos es un ESPEJO de la hoja, no un acumulado.
     Si una fila cambió de cuarto o de fecha, la orden vieja sigue existiendo
     aquí pero YA NO ESTÁ en NUEVA PROGRAMACIÓN. Contarla infla los ingresos
     con órdenes fantasma. Se marca fuera de vigencia: no se borra —conserva
     los registros de los técnicos— pero deja de sumar en Ingresos. */
  let fueraVigencia=0;
  DB.ordenes.forEach(o=>{
    if(o.origen==="manual"){ o.vigente=true; return; }
    const corte=(DB.meta.conexion||{}).desdeFecha||"";
    if(corte && o.fechaIngreso && o.fechaIngreso < corte) return;   /* fuera del corte: no se juzga */
    if(!usadas.has(o.id) && o.vigente!==false){ o.vigente=false; fueraVigencia++; }
  });

  if(sinComponente.length) avisos.push("Estas columnas quedaron sin componente porque no existe uno equivalente: "+
    [...new Set(sinComponente)].join(", ")+". Créalos en Maestros → Tipos de componente y asígnalos en Probar conexión.");
  return {nOT,nC,nAct,omitidas,sinFecha,porRevisar,depurados,multi,repetidas,adoptadas,reasignadas,avisos,fueraVigencia,
    nuevosEstados:[...new Set(nuevosEstados)]};
}
function importar(){
  const filas = IMP.filas.slice();
  const mapa = Object.assign({}, IMP.map);
  if(!Object.values(mapa).includes("ot")){ toast("Falta asignar la columna de OT"); return; }
  let res;
  commitMaestro(()=>{ res = aplicarFilas(filas, mapa); }).then(()=>{
    toast(res && !res.error
      ? `${res.nOT} órdenes nuevas · ${res.nAct} actualizadas · ${res.nC} componentes`
        + (res.omitidas?` · ${res.omitidas} anteriores al corte`:"")
      : (res && res.error) || "Importado");
    IMP={texto:"",filas:[],map:{},sep:"\t"};
    render();
  });
}
/* Quita el BOM y espacios que agregan el Bloc de notas o Excel al copiar. */
function limpiarJson(t){ return String(t==null?"":t).replace(/^\uFEFF/,"").trim(); }
function csvCell(v){ v=String(v==null?"":v); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
/* En una vista previa dentro de un iframe el navegador bloquea las descargas.
   Ahí mostramos el contenido para copiarlo y guardarlo a mano. */

function descargaDirecta(nombre, contenido, mime){
  try{
    /* El BOM (\ufeff) es lo que hace que Excel abra bien las tildes del CSV.
       En un JSON ese mismo BOM rompe JSON.parse: por eso solo va en CSV. */
    const esJson = /json/i.test(mime||"") || /\.json$/i.test(nombre);
    const b=new Blob([esJson?contenido:("\ufeff"+contenido)],{type:(mime||"text/csv")+";charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    return true;
  }catch(e){ return false; }
}

/* =========================================================================
   CONEXIÓN AUTOMÁTICA CON GOOGLE SHEETS
   Modo CSV  : la hoja publicada en la web se lee sola (una vía).
   Modo Script: Apps Script hace de puente (dos vías: lee órdenes, devuelve
                registros y los comparte entre todos los dispositivos).
   ========================================================================= */
let SYNC = {corriendo:false, timer:null, timerVer:null};

/* Lector de CSV que respeta los saltos de línea DENTRO de una celda.
   Antes se cortaba por "\n" antes de mirar las comillas: una observación
   escrita en dos renglones partía la fila y descuadraba todas las columnas. */
function csvAFilas(txt){
  const t=String(txt||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const filas=[]; let fila=[], cur="", q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){
      if(ch==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    } else if(ch==='"') q=true;
    else if(ch===","){ fila.push(cur.trim()); cur=""; }
    else if(ch==="\n"){ fila.push(cur.trim()); cur="";
      if(fila.some(x=>x!=="")) filas.push(fila);
      fila=[]; }
    else cur+=ch;
  }
  fila.push(cur.trim());
  if(fila.some(x=>x!=="")) filas.push(fila);
  return filas;
}
/* Arma la URL del puente con sus parámetros y la clave. */
function urlPuente(cx, extra){
  const u = new URL(cx.gsUrl);
  Object.entries(extra||{}).forEach(([k,v])=>u.searchParams.set(k,v));
  if(cx.clave) u.searchParams.set("clave", cx.clave);
  return u.toString();
}

/* El puente devuelve la hoja tal cual, y en PROGRAMACION la fila 1 está en
   blanco: los encabezados están en la 2. Se busca la fila que más columnas
   conocidas reconoce y se descarta todo lo que haya encima. */
const PISTAS_ENCABEZADO = ["ORDEN","CUARTO","ESTADO","CLIENTE","TIPO","MOTIVO","PIR","FECHA"];
function recortarEncabezado(filas){
  if(!filas || filas.length<2) return filas||[];
  let mejor=0, punta=-1;
  for(let i=0; i<Math.min(filas.length,12); i++){
    const txt = filas[i].map(c=>sinTildes(String(c||"")).toUpperCase());
    const n = PISTAS_ENCABEZADO.filter(p=>txt.some(t=>t.indexOf(p)>=0)).length;
    if(n>mejor){ mejor=n; punta=i; }
  }
  return (punta>0 && mejor>=3) ? filas.slice(punta) : filas;
}

async function leerFuente(){
  const cx = DB.meta.conexion;
  if(cx.modo==="csv"){
    if(!cx.csvUrl) throw new Error("Falta la URL publicada");
    const r = await fetch(cx.csvUrl, {redirect:"follow"});
    if(!r.ok) throw new Error("HTTP "+r.status+" — revisa que la hoja esté publicada");
    return {filas: csvAFilas(await r.text()), registros:null};
  }
  if(cx.modo==="script" || cx.modo==="panel"){
    if(!cx.gsUrl) throw new Error("Falta la URL del Apps Script");
    /* El puente del Panel atiende varios clientes en el mismo enlace: hay que
       decirle que quien pregunta es la app, y llevar la clave. */
    const url = cx.modo==="panel" ? urlPuente(cx, {app:"1"}) : cx.gsUrl;
    const r = await fetch(url, {redirect:"follow"});
    if(!r.ok) throw new Error("HTTP "+r.status+" — revisa la URL del puente en Conexión");
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||"El puente respondió con error");
    return {filas: j.filas||[], registros: j.registros||null, config: j.config||null};
  }
  throw new Error("No hay conexión configurada");
}

  DB.meta.configSubido = new Date().toISOString();

}
async function empujarRegistros(todo){
  const cx = DB.meta.conexion;
  if((cx.modo!=="script" && cx.modo!=="panel") || !cx.gsUrl) return;
  /* La marca de "subido" se pone SOLO si el envío sale bien (más abajo).
     Ponerla aquí hacía que un fallo de red se diera por bueno y el registro
     no se volviera a intentar nunca. */
  DB.registros.forEach(r=>{ if(!r.actualizado) r.actualizado=r.anuladoEn||new Date().toISOString(); });
  /* NO subir lo que este equipo no entiende.
     Antes se subían TODOS los registros. Si aquí llegaba uno de otro técnico
     cuya orden este equipo no conoce, se subía con la OT vacía y BORRABA en la
     hoja el número que sí había puesto el equipo donde nació. El coordinador
     terminaba destruyendo el dato bueno cada vez que sincronizaba.
     Ahora, si no podemos aportar la OT ni el componente, nos callamos: el
     registro se queda como está en la hoja. */
  const puedoAportar = r => r.sinOrden || byId(DB.ordenes,r.ordenId) || r.otTexto || fotoComponente(r);
  /* Solo lo que CAMBIÓ desde la última subida buena.
     Antes se reenviaban los 242 registros cada 10 minutos desde cada equipo.
     Con 20 dispositivos son miles de escrituras diarias en la hoja, y Google
     corta el Apps Script por cuota: ahí aparece "Failed to fetch". */
  /* Con el puente v2 cada registro se actualiza por su id, así que enviar
     solo lo que cambió es seguro. La primera vez tras cambiar de puente se
     manda todo, para dejar la hoja completa. */
  if(!DB.meta.subidaCompletaV2){ todo=true; }
  const desde = todo ? "" : (DB.meta.registrosSubidos||"");
  const aSubir = DB.registros.filter(r=>puedoAportar(r) &&
    (r.pendienteSubir || !desde || (r.actualizado||r.creado||"")>desde));
  DB.meta.registrosOmitidos = DB.registros.length - aSubir.length;
  if(!aSubir.length) return true;                 /* nada nuevo: no molestamos al puente */
  const cuerpo = JSON.stringify({accion:"registros", registros: aSubir.map(r=>{
    const o=byId(DB.ordenes,r.ordenId), c=fotoComponente(r), a=byId(DB.actividades,r.actividadId);
    return {id:r.id, fecha:r.fecha, semana:semanaDe(r.fecha), tecnico:nom(DB.tecnicos,r.tecnicoId),
      cuarto:nom(DB.cuartos,r.cuartoId), ot:o?o.ot:(r.otTexto||""), cliente:o?o.cliente:"",
      componente:c?nom(DB.tiposComponente,c.tipoComponenteId):(r.compTexto||""), tipologia:c?nom(DB.tipologias,c.tipologiaId,""):"",
      actividad:a?a.nombre:"", fase:a?a.fase:"", unidades:r.cantidad,
      minutos:r.minutos, horas:+hrs(r.minutos), minutosStd:r.minutosStd, horasStd:+hrs(r.minutosStd),
      tipoNovedad:r.tipoNovedad||"", novedad:r.novedad||"", crudo:JSON.stringify({
        tecnicoId:r.tecnicoId, ordenId:r.ordenId, componenteId:r.componenteId, cuartoId:r.cuartoId,
        actividadId:r.actividadId, estadoNuevo:r.estadoNuevo||"", creado:r.creado,
        /* v23: lo que antes se perdía al volver de la hoja */
        tipoComponenteId:r.tipoComponenteId||"", tipologiaId:r.tipologiaId||null,
        cantidad:r.cantidad, minutos:r.minutos, minutosStd:r.minutosStd,
        otTexto:r.otTexto||"", compTexto:r.compTexto||"", tiempoMedido:!!r.tiempoMedido,
        creadoPor:r.creadoPor||"", editadoPor:r.editadoPor||"", editadoEn:r.editadoEn||"",
        historial:r.historial||[], actualizado:r.actualizado||"",
        anulado:!!r.anulado, anuladoPor:r.anuladoPor||"", anuladoEn:r.anuladoEn||"",
        motivoAnulacion:r.motivoAnulacion||"", sinOrden:!!r.sinOrden})};
  })});
  /* text/plain evita el preflight CORS que Apps Script no responde */
  const destino = cx.modo==="panel" ? urlPuente(cx, {app:"1"}) : cx.gsUrl;
  const r = await fetch(destino, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:cuerpo, redirect:"follow"});
  if(!r.ok) throw new Error("HTTP "+r.status+" al subir los registros");
  /* El puente responde 200 aunque falle, con el motivo dentro. Antes se
     ignoraba y el error quedaba invisible. */
  const txt = await r.text().catch(()=>"");
  DB.meta.ultimaRespuesta = String(txt).slice(0,400);
  let resp=null; try{ resp=JSON.parse(txt); }catch(e){}
  if(resp && resp.ok===false) throw new Error("El puente respondió: "+(resp.error||"error sin detalle"));
  DB.meta.subidaError="";
  DB.meta.registrosSubidos=new Date().toISOString();
  DB.meta.subidaCompletaV2=true;
  const subidos=new Set(aSubir.map(r=>r.id));
  DB.registros.forEach(r=>{ if(subidos.has(r.id) && r.pendienteSubir) delete r.pendienteSubir; });
  return true;
}
async function sincronizar(silencioso){
  const cx = DB.meta.conexion;
  if(!cx.modo || SYNC.corriendo) return;
  SYNC.corriendo=true; if(!silencioso) toast("Sincronizando…");
  try{
    const {filas, registros, config} = await leerFuente();
    let remapeado=false;

    /* Si alguien inserta o quita una columna en PROGRAMACION, el mapa
       guardado —fijado a mano o no— pasa a apuntar a la columna equivocada,
       y lo hace EN SILENCIO: nada avisa, los datos simplemente empiezan a
       leerse mal. Esto es lo que pasó al insertar TECNICO y NOVEDAD: el mapa
       tenía 24 columnas, la hoja pasó a tener 26, y "estado" empezó a leer
       nombres de técnicos.
       La defensa: se compara el encabezado de HOY contra el que se usó la
       última vez que se construyó el mapa. Si cambió —así sea una sola
       columna— se reconstruye todo por nombre, sin importar que estuviera
       fijado a mano. Un ajuste manual hecho para una hoja de 24 columnas no
       sirve para una de 26; es preferible perderlo y detectar de nuevo que
       seguir leyendo silenciosamente mal. Los ajustes en "fijos" no se
       pierden: se aplican por el NOMBRE de la columna, no por su posición,
       así que sobreviven intactos a cualquier reordenamiento. */
    const normEnc = arr => (arr||[]).map(h=>sinTildes(String(h||"")).trim().toUpperCase());
    const encActual = normEnc(filas[0]);
    const encAnterior = normEnc(cx.mapaEncabezados);
    const cambioEstructura = !!(filas.length && (
      encActual.length !== encAnterior.length ||
      encActual.some((h,i)=>h!==encAnterior[i])
    ));

    if(filas.length) cx.encabezados = filas[0];

    if(filas.length && (!cx.mapa || cambioEstructura || (cx.mapaVersion!==DETECTOR && !cx.mapaManual))){
      const eraManual = cx.mapaManual;
      cx.mapa = detectarMapa(filas[0], filas.slice(1,40));
      cx.mapaVersion = DETECTOR;
      cx.mapaEncabezados = filas[0];
      remapeado=true;
      if(cambioEstructura && eraManual){
        cx.mapaManual = false;
        cx.avisoRemapeoEstructural = { fecha: new Date().toISOString(),
          antes: (cx.mapaEncabezados||[]).length, ahora: filas[0].length };
      }
    }
    /* Tus ajustes manuales mandan siempre, se detecte lo que se detecte.
       Se aplican por nombre de columna, así que siguen valiendo aunque la
       hoja se haya reordenado. */
    if(filas.length && cx.fijos){
      filas[0].forEach((h,i)=>{ const k=sinTildes(String(h||"")); if(cx.fijos[k]) cx.mapa[i]=cx.fijos[k]; });
    }
    let res={nOT:0,nAct:0}, adopto=false;
    await commit(()=>{
      DB.meta.conexion = cx;
      if(config && aplicarMaestros(config)) adopto=true;   // maestros más nuevos ganan
      if(filas.length) res = aplicarFilas(filas, cx.mapa);
      if(registros && registros.length){
        /* La hoja puede traer varias versiones del mismo registro (cada push
           agrega una fila). Se queda la más reciente, y las correcciones o
           anulaciones hechas aquí no se pierden. */
        const local = new Map(DB.registros.map(r=>[r.id, r]));
        const aprendidas = {};
        registros.forEach(r=>{
          if(!r || !r.id) return;
          /* La hoja guarda los campos internos dentro de "crudo". Se vuelven a
             abrir aquí para no perder anulaciones, correcciones ni la foto
             del componente al traer un registro hecho en otro equipo. */
          if(typeof r.crudo==="string" && r.crudo){
            try{ Object.assign(r, JSON.parse(r.crudo)); }catch(e){}
          }
          delete r.crudo;
          if(r.cantidad==null && r.unidades!=null) r.cantidad=+r.unidades||0;
          if(!Array.isArray(r.historial)) r.historial=[];
          /* Drive guarda la OT y el componente como texto: se recuperan aunque
             la orden ya no exista en la app. */
          if(r.ot && !r.otTexto) r.otTexto=String(r.ot);
          if(r.componente && !r.compTexto) r.compTexto=String(r.componente);
          const mio = local.get(r.id);
          if(mio){
            if(!mio.otTexto && r.otTexto) mio.otTexto=r.otTexto;
            if(!mio.compTexto && r.compTexto) mio.compTexto=r.compTexto;
            /* APRENDER EQUIVALENCIAS.
               Es el mismo registro visto por dos equipos. Si el de allá apunta
               a una orden que aquí SÍ existe, y el de acá apunta a una que no,
               acabamos de descubrir que el número viejo y el nuevo son la misma
               orden. Se anota y sirve para reparar todos los demás registros
               que hayan quedado colgando del mismo número viejo. */
            if(r.ordenId && mio.ordenId && r.ordenId!==mio.ordenId
               && byId(DB.ordenes, r.ordenId) && !byId(DB.ordenes, mio.ordenId)){
              aprendidas[mio.ordenId] = r.ordenId;
            }
            if(r.componenteId && mio.componenteId && r.componenteId!==mio.componenteId
               && byId(DB.componentes, r.componenteId) && !byId(DB.componentes, mio.componenteId)){
              aprendidas[mio.componenteId] = r.componenteId;
            }
          }
          if(!mio){ local.set(r.id, r); return; }
          const tR = r.actualizado || r.anuladoEn || "";
          const tL = mio.actualizado || mio.anuladoEn || "";
          if(tR && tR > tL) local.set(r.id, r);           // el remoto es más nuevo
        });
        DB.registros = [...local.values()];
        /* Autocuración: si un registro nuestro NO volvió de la hoja, es que
           nunca llegó a subir. El envío incremental se guía por la fecha de
           última subida, así que uno que quedó atrás jamás se reintentaba.
           Al detectarlo se marca para que el siguiente envío lo incluya. */
        const enHoja=new Set(registros.map(r=>r.id));
        let faltantes=0;
        DB.registros.forEach(r=>{ if(!enHoja.has(r.id)){ r.pendienteSubir=true; faltantes++; } });
        res.faltantes=faltantes;
        if(Object.keys(aprendidas).length){
          DB.meta.remapeoIds = Object.assign({}, DB.meta.remapeoIds||{}, aprendidas);
          res.aprendidas = Object.keys(aprendidas).length;
        }
        migrar();          /* reengancha por OT y por las equivalencias aprendidas */
      }
      DB.meta.conexion.remapeado = remapeado;
      DB.meta.conexion.ultimaSync = new Date().toISOString();
      DB.meta.conexion.ultimoError = res && res.error ? res.error : "";
      DB.meta.conexion.ultimoResumen = {filas:(filas.length-1), nOT:res.nOT||0, nAct:res.nAct||0,
        nC:res.nC||0, omitidas:res.omitidas||0, sinFecha:res.sinFecha||0, multi:res.multi||0, repetidas:res.repetidas||0, adoptadas:res.adoptadas||0, reasignadas:res.reasignadas||0, corte:cx.desdeFecha||"",
        nuevosEstados:res.nuevosEstados||[], porRevisar:res.porRevisar||0, depurados:res.depurados||0, aprendidas:res.aprendidas||0,
        avisos:res.avisos||[]};
    });
    await empujarRegistros();
    if(!adopto) await empujarConfig();                     // los míos son más nuevos: los subo
    if(!silencioso) toast(res&&!res.error
      ? `Sincronizado · ${res.nOT} OT nuevas, ${res.nAct} actualizadas`
        + (res.omitidas?` · ${res.omitidas} anteriores al corte`:"")
        + (adopto?" · maestros actualizados":"")
      : (res.error||"Sincronizado"));
  }catch(e){
    DB.meta.conexion.ultimoError = e.message;
    await guardar();
    if(!silencioso) toast("No se pudo sincronizar: "+e.message);
    render();
  }
  SYNC.corriendo=false;
}
/* =========================================================================
   AVISO DE VERSIÓN NUEVA
   El navegador guarda la app en caché. Si el coordinador publica una versión
   y el técnico no cierra del todo su navegador, sigue trabajando con la vieja
   y genera datos que no encajan. Aquí la app se revisa a sí misma: descarga
   su propio archivo y compara el número de versión.
   No recarga en mitad de un registro: si hay algo a medias, avisa y espera.
   ========================================================================= */
let VER_NUEVA = "";
function hayTrabajoAMedias(){
  if(document.querySelector(".modal")) return true;
  if(VISTA==="registro" && (R.paso>1 || R.ordenId || Object.keys(R.sel||{}).length)) return true;
  return false;
}
async function revisarVersion(){
  try{
    const r = await fetch(location.pathname+"?_v="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const t = await r.text();
    const m = t.match(/const VERSION_APP = "([^"]+)"/);
    if(!m || m[1]===VERSION_APP) return;
    VER_NUEVA = m[1];
    /* Si ya recargamos por esta versión y seguimos viendo la vieja, es caché
       del servidor: no insistimos en bucle, solo avisamos. */
    const ya = sessionStorage.getItem("labdiesel_recarga");
    if(ya!==VER_NUEVA && !hayTrabajoAMedias()){
      sessionStorage.setItem("labdiesel_recarga", VER_NUEVA);
      toast("Actualizando a la versión "+VER_NUEVA+"…");
      setTimeout(()=>location.reload(true), 900);
      return;
    }
    render();                       /* deja el aviso visible para que decida */
  }catch(e){ /* sin red: se reintenta luego */ }
}
/* Aviso que ve el técnico: si está a medias, actualiza cuando él quiera. */
function avisoVersion(){
  if(!VER_NUEVA) return "";
  return `<div class="card noprint" style="border-color:#f3ccb0;background:#fdefe5">
    <div class="body" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <b style="color:var(--signal)">Hay una versión nueva de la app (${esc(VER_NUEVA)}).</b>
      <span class="hint" style="margin:0">Termina lo que estás registrando y actualiza.</span>
      <button class="btn sm primary" id="recargarYa" style="margin-left:auto">Actualizar ahora</button>
    </div></div>`;
}
/* =========================================================================
   ESTADO DE SINCRONIZACIÓN VISIBLE PARA EL TÉCNICO
   Antes, si el puente fallaba, el técnico seguía guardando sin enterarse.
   ========================================================================= */
function pendientesSubida(){
  const t = DB.meta.registrosSubidos||"";
  return DB.registros.filter(r=>(r.actualizado||"")>t).length;
}
function barraSync(){
  const cx=DB.meta.conexion||{};
  if(!cx.modo) return "";
  const err = cx.ultimoError || DB.meta.subidaError || "";
  const pend = pendientesSubida();
  const cuando = cx.ultimaSync ? new Date(cx.ultimaSync) : null;
  const mins = cuando ? Math.round((Date.now()-cuando.getTime())/60000) : null;
  const hace = mins===null ? "nunca" : (mins<1?"hace un momento":(mins<60?`hace ${mins} min`:`hace ${Math.round(mins/60)} h`));
  const mal = !!err || (pend>0 && mins!==null && mins>30);
  return `<div class="card noprint" style="border-color:${mal?"#eec4c1":"#dfe3e8"}">
    <div class="body" style="padding:9px 13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px">
      <span style="width:9px;height:9px;border-radius:50%;background:${mal?"var(--red)":"var(--green)"};flex:0 0 auto"></span>
      ${mal
        ? `<b style="color:var(--red)">No se está guardando en el servidor.</b>
           <span class="hint" style="margin:0">Tu trabajo queda en este equipo${pend?` · ${pend} registro(s) por subir`:""}. Avísale a coordinación.</span>`
        : `<span>Sincronizado <b>${hace}</b>${pend?` · subiendo ${pend}`:""}</span>`}
    </div></div>`;
}
function programarSync(){
  clearInterval(SYNC.timer);
  const cx=DB.meta.conexion;
  /* Separación aleatoria: si los 20 equipos sincronizan en el mismo segundo,
     el Apps Script se satura. Cada uno arranca con un desfase propio. */
  if(cx.modo && cx.autoMin>0){
    /* El coordinador consulta, no registra: necesita ver lo último y son pocos
       equipos. El técnico registra desde su celular y son muchos, así que se
       le deja el ritmo normal para no agotar la cuota de Apps Script. */
    const minutos = esCoordinador() ? Math.min(cx.autoMin, 2) : cx.autoMin;
    const base=minutos*60000, jitter=Math.floor(Math.random()*90000);
    SYNC.timer=setInterval(()=>sincronizar(true), base+jitter);
  }
  /* Al volver a la pestaña o desbloquear el celular, traer lo último de una vez.
     Es el momento en que alguien QUIERE ver los datos frescos: esperar al
     siguiente turno del reloj es justo lo que hacía sentir la app desactualizada. */
  if(!SYNC.alVolver){
    SYNC.alVolver = true;
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState!=="visible") return;
      const c=DB.meta.conexion; if(!c || !c.modo) return;
      const ult = c.ultimaSync ? Date.parse(c.ultimaSync) : 0;
      if(Date.now()-ult > 45000) sincronizar(true);   /* sin martillar al puente */
    });
    window.addEventListener("online", ()=>{ if(DB.meta.conexion && DB.meta.conexion.modo) sincronizar(true); });
  }
  clearInterval(SYNC.timerVer);
  SYNC.timerVer=setInterval(revisarVersion, 15*60000);
  setTimeout(revisarVersion, 20000);        /* una primera revisión al arrancar */
}

/* Vuelve a leer la hoja y quita de la app las órdenes que ya no cumplen el
   corte. Nunca borra una orden que tenga producción registrada. */
async function depurarOrdenes(){
  const cx=DB.meta.conexion;
  if(!cx.modo){ toast("Configura primero la conexión"); return; }
  abrirModal("Depurando…", `<div class="empty">Comparando con la hoja…</div>`);
  const pinta=h=>{ const b=document.querySelector(".modal:not(.dlg) .bd"); if(b) b.innerHTML=h; };
  try{
    const {filas} = await leerFuente();
    if(!filas.length) throw new Error("La hoja llegó vacía");
    const mapa = cx.mapa || detectarMapa(filas[0], filas.slice(1,40));
    const iOT = Object.keys(mapa).find(k=>mapa[k]==="ot");
    const iF  = Object.keys(mapa).find(k=>mapa[k]==="fechaIngreso");
    if(iOT===undefined) throw new Error("No hay columna de OT asignada");
    const desde = cx.desdeFecha||"";
    const omitirSinFecha = (cx.sinFecha||"omitir")==="omitir";
    /* OT que SÍ deben existir según las reglas actuales */
    const validas=new Set();
    filas.slice(1).forEach(f=>{
      const ot=String(f[iOT]||"").trim(); if(!ot) return;
      const fIso = iF!==undefined ? normFechaEstricta(f[iF]) : "";
      if(desde){
        if(fIso && fIso<desde) return;
        if(!fIso && omitirSinFecha) return;
      }
      validas.add(ot);
    });
    /* duplicados: misma OT y mismo cuarto declarado */
    const vistas=new Map(); const duplicadas=[];
    DB.ordenes.forEach(o=>{
      const k=o.ot+"|"+(o.cuartoDeclaradoId||"");
      if(vistas.has(k)) duplicadas.push(o); else vistas.set(k,o);
    });
    const dupSinProd=duplicadas.filter(o=>!DB.registros.some(r=>r.ordenId===o.id));
    const sobrantes = DB.ordenes.filter(o=>!validas.has(o.ot));
    const conProduccion = sobrantes.filter(o=>DB.registros.some(r=>r.ordenId===o.id));
    const borrables = sobrantes.filter(o=>!DB.registros.some(r=>r.ordenId===o.id));
    if(!sobrantes.length && !dupSinProd.length){
      pinta(`<div style="border:1px solid #b6ddc6;background:#eaf6ef;color:var(--green);padding:10px 12px;border-radius:var(--r);font-size:13.5px">
        <b>Todo en orden.</b> Las ${DB.ordenes.length} órdenes de la app cumplen el corte.</div>
        <button class="btn" id="okDep" style="margin-top:12px">Cerrar</button>`);
      document.querySelector("#okDep").onclick=cerrarModal; return;
    }
    pinta(`
      <p class="hint" style="margin-top:0">La hoja tiene ${validas.size} órdenes que cumplen el corte${desde?" desde "+fmtFecha(desde):""}. En la app hay ${DB.ordenes.length}.</p>
      <div class="tw" style="margin-bottom:12px"><table><tbody>
        ${dupSinProd.length?`<tr style="background:#fbecea"><td><b>Órdenes duplicadas</b> <span class="tag">misma OT y mismo cuarto, de versiones anteriores</span></td><td class="num mono"><b>${dupSinProd.length}</b></td></tr>`:""}
        <tr style="background:#fdefe5"><td><b>Se pueden quitar</b> <span class="tag">sin producción registrada</span></td><td class="num mono"><b>${borrables.length}</b></td></tr>
        ${conProduccion.length?`<tr style="background:#fdf5e3"><td>Se conservan <span class="tag">tienen horas registradas</span></td><td class="num mono">${conProduccion.length}</td></tr>`:""}
      </tbody></table></div>
      ${borrables.length?`<div class="eyebrow" style="margin-bottom:6px">Ejemplos de lo que se quitaría</div>
        <div class="tw" style="max-height:170px;overflow:auto;margin-bottom:12px"><table><tbody>
        ${borrables.slice(0,25).map(o=>`<tr><td class="mono">OT ${esc(o.ot)}</td><td>${esc(o.cliente||"—")}</td><td class="mono">${fmtFecha(o.fechaIngreso)}</td></tr>`).join("")}
        ${borrables.length>25?`<tr><td colspan="3" class="tag">…y ${borrables.length-25} más</td></tr>`:""}
        </tbody></table></div>`:""}
      ${conProduccion.length?`<p class="hint">Las que tienen horas registradas no se tocan. Si de verdad sobran, anúlalas una por una desde Órdenes.</p>`:""}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${(borrables.length+dupSinProd.length)?`<button class="btn warn" id="okDep">Quitar ${borrables.length+dupSinProd.length} órdenes</button>`:""}
        <button class="btn" id="noDep">Cancelar</button></div>`);
    document.querySelector("#noDep").onclick=cerrarModal;
    const ok=document.querySelector("#okDep");
    if(ok) ok.onclick=async()=>{
      const ids=new Set([...borrables,...dupSinProd].map(o=>o.id));
      cerrarModal();
      await commit(()=>{
        DB.ordenes = DB.ordenes.filter(o=>!ids.has(o.id));
        DB.componentes = DB.componentes.filter(c=>!ids.has(c.ordenId));
      }, `${ids.size} órdenes quitadas`);
    };
  }catch(e){
    pinta(`<div style="border:1px solid #eec4c1;background:#fbecea;color:var(--red);padding:10px 12px;border-radius:var(--r);font-size:13.5px">${esc(String(e.message||e))}</div>
      <button class="btn" id="okDep" style="margin-top:11px">Cerrar</button>`);
    document.querySelector("#okDep").onclick=cerrarModal;
  }
}

        ${cx.avisoRemapeoEstructural?`<div style="border:1px solid #f3ccb0;background:#fdefe5;color:var(--signal);padding:10px 12px;border-radius:var(--r);margin:12px 0;font-size:13px">

function pConexion(){
  document.querySelectorAll("[data-modo]").forEach(b=>b.onclick=()=>{
    commit(()=>{ DB.meta.conexion.modo=b.dataset.modo; },"Modo cambiado");
  });
  const g=$("#cxGuardar");
  if(g) g.onclick=async()=>{
    const csv=$("#cxCsv"), gs=$("#cxGs"), au=$("#cxAuto"), cl=$("#cxClave");
    if(cl) cx.clave = cl.value.trim();
    await commit(()=>{
      if(csv) DB.meta.conexion.csvUrl=csv.value.trim();
      if(gs) DB.meta.conexion.gsUrl=gs.value.trim();
      const fd=$("#cxDesde"); if(fd) DB.meta.conexion.desdeFecha=fd.value||"";
      const sf=$("#cxSinFecha"); if(sf) DB.meta.conexion.sinFecha=sf.value;
      DB.meta.conexion.autoMin=Math.max(0,+au.value||0);
      DB.meta.conexion.ultimoError="";
    },"Conexión guardada");
    programarSync();
    sincronizar();
  };
  const s=$("#syncYa"); if(s) s.onclick=()=>sincronizar();
  const pc=$("#probarCx"); if(pc) pc.onclick=()=>probarConexion();
  const sl=$("#cxSoltar");
  if(sl) sl.onclick=async()=>{
    if(!await confirmar("Soltar columnas fijadas",
      "Se olvidan los ajustes manuales y la app vuelve a leer los encabezados de tu hoja.\n\n"
      +"Es lo correcto cuando la hoja cambió de estructura. Si alguna columna vuelve a quedar mal, "
      +"la puedes fijar otra vez.", "Soltar y rehacer")) return;
    await commitMaestro(()=>{
      DB.meta.conexion.fijos = {};
      DB.meta.conexion.mapaManual = false;
      DB.meta.conexion.mapa = null;          /* se detecta de cero en la próxima sincronización */
      DB.meta.conexion.mapaVersion = 0;
    }, "Mapeo liberado · sincroniza ahora");
    sincronizar();
  };
  const dp=$("#depurarCx"); if(dp) dp.onclick=()=>depurarOrdenes();
  const dpr=$("#irDepurar"); if(dpr) dpr.onclick=()=>depurarOrdenes();
  const dp2=$("#irDepurar"); if(dp2) dp2.onclick=()=>depurarOrdenes();
  const ro=$("#rastrearOT"); if(ro) ro.onclick=()=>modalBuscarOT();
  const au=$("#auditarCx"); if(au) au.onclick=()=>modalAuditar();
  const rt=$("#rehacerTodo");
  if(rt) rt.onclick=async()=>{
    if(!await confirmar("Rehacer todos los componentes",
      "Se borran los componentes SIN producción registrada y se vuelven a crear leyendo la hoja completa.\n\n"+
      "Los que tienen horas de algún técnico no se tocan.\n\nÚsalo si varias órdenes quedaron con componentes equivocados.","Rehacer todo")) return;
    try{
      toast("Leyendo la hoja…");
      const {filas}=await leerFuente();
      const cx=DB.meta.conexion, mapa=cx.mapa||detectarMapa(filas[0]);
      let borrados=0;
      await commit(()=>{
        const conProd=new Set(DB.componentes.filter(c=>DB.registros.some(r=>r.componenteId===c.id)).map(c=>c.id));
        const antes=DB.componentes.length;
        DB.componentes=DB.componentes.filter(c=>conProd.has(c.id) || c.origen==="manual");
        borrados=antes-DB.componentes.length;
        aplicarFilas(filas, mapa);
      }, `Listo · ${borrados} componentes rehechos`);
      render();
    }catch(e){ toast("No se pudo: "+(e.message||e)); }
  };
  const lt2=$("#linkTec"); if(lt2) lt2.onclick=()=>modalEnlaceTecnicos();
  const rm=$("#cxRemap"); if(rm) rm.onclick=()=>commit(()=>{ DB.meta.conexion.mapa=null;
    DB.meta.conexion.mapaManual=false; DB.meta.conexion.mapaVersion=0; DB.meta.conexion.fijos=null; },
    "Se detectará de nuevo al sincronizar");
  const ca=$("#cxCerrarAviso"); if(ca) ca.onclick=()=>commit(()=>{ delete DB.meta.conexion.avisoRemapeoEstructural; });
  document.querySelectorAll("[data-cxmap]").forEach(sel=>sel.onchange=()=>{
    const i=sel.dataset.cxmap, v=sel.value;
    commit(()=>{ DB.meta.conexion.mapa[i]=v; DB.meta.conexion.mapaManual=true;
      /* Se recuerda por el NOMBRE de la columna, no por su posición: así el
         ajuste sobrevive a cambios de versión y a que la hoja se mueva. */
      const cx=DB.meta.conexion;
      if(!cx.fijos) cx.fijos={};
      const enc=(cx.encabezados||[])[i];
      if(enc) cx.fijos[sinTildes(String(enc))]=v;
      DB.meta.conexion.mapaVersion=DETECTOR; },"Mapeo actualizado · quedará fijo");
  });
}

/* =========================================================================
   CORRECCIONES · nada se borra, todo queda con rastro de quién y cuándo
   ========================================================================= */
function puedeTocar(r){
  if(esCoordinador()) return true;
  return r.tecnicoId===YO && r.fecha===hoyISO();   // el técnico corrige solo lo de hoy
}
async function anularRegistro(id){
  const r = byId(DB.registros,id); if(!r) return;
  if(!puedeTocar(r)){ toast("Solo coordinación puede anular registros de días anteriores"); return; }
  const motivo = await pedirTexto("Anular registro","¿Por qué se anula? Queda registrado.","Error de digitación");
  if(motivo===null) return;
  commit(()=>{
    const t=byId(DB.registros,id); if(!t) return;
    t.anulado=true; t.anuladoPor=YO; t.anuladoEn=new Date().toISOString(); t.motivoAnulacion=motivo||"";
    t.actualizado=new Date().toISOString();
  },"Registro anulado");
}
function restaurarRegistro(id){
  commit(()=>{ const t=byId(DB.registros,id); if(t){ t.anulado=false; t.motivoAnulacion=""; t.anuladoPor=""; } },"Registro restaurado");
}
function modalEditarRegistro(id){
  const r = byId(DB.registros,id); if(!r) return;
  if(!puedeTocar(r)){ toast("Solo coordinación puede editar este registro"); return; }
  const o=byId(DB.ordenes,r.ordenId), c=fotoComponente(r);
  const acts=DB.actividades.slice().sort((a,b)=>a.orden-b.orden);
  const hist=r.historial||[];
  abrirModal("Corregir registro", `
