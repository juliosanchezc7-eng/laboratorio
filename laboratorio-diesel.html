      <div class="tw"><table><tbody>${hist.slice().reverse().map(x=>`<tr>
        <td class="mono" style="white-space:nowrap">${new Date(x.cuando).toLocaleString()}</td>
        <td>${esc(nom(DB.tecnicos,x.quien))}<br><span class="tag">${esc(x.motivo||"sin motivo")}</span></td>
        <td class="tag">${esc(x.cambios)}</td></tr>`).join("")}</tbody></table></div>`:""}
  `, d=>{
    const $ot=d.querySelector("#eOT"), $cp=d.querySelector("#eComp");
    /* Componente vigente: el que se acaba de elegir, o el que ya tenía. */
    const compActual=()=>{ const v=$cp.value; return v? byId(DB.componentes,v) : c; };
    /* Al escribir la OT se llena la lista de componentes de esa orden. */
    const llenarComps=()=>{
      const ot=$ot.value.trim();
      const pares=[];
      DB.ordenes.filter(x=>String(x.ot)===ot).forEach(x=>
        DB.componentes.filter(y=>y.ordenId===x.id).forEach(y=>pares.push(y)));
      const ords=DB.ordenes.filter(x=>String(x.ot)===ot);
      let vacio;
      if(!ot) vacio="escribe el número de OT arriba";
      else if(!ords.length) vacio="esa OT no está cargada en la app";
      else vacio="esa OT no tiene componentes cargados";
      $cp.innerHTML = (pares.length
        ? `<option value="">— elige —</option>`+pares.map(y=>
            `<option value="${y.id}" ${r.componenteId===y.id?"selected":""}>${esc(nom(DB.tiposComponente,y.tipoComponenteId))} \u00b7 ${esc(nom(DB.tipologias,y.tipologiaId,"—"))} \u00b7 ${y.cantidad} und \u00b7 ${esc(nom(DB.cuartos,y.cuartoId))}</option>`).join("")
        : `<option value="">${vacio}</option>`)
        + (ords.length?`<option value="__nuevo__">+ Agregar componente a esta OT\u2026</option>`:"");
    };
    /* Si el componente que trabajó el técnico no está en la orden, se crea aquí
       mismo sin perder lo que ya se escribió en el corrector. */
    $cp.onchange=()=>{
      if($cp.value!=="__nuevo__") return;
      $cp.value="";
      const ot=$ot.value.trim();
      const ord=DB.ordenes.find(x=>String(x.ot)===ot);
      if(!ord){ toast("Escribe primero una OT que exista"); return; }
      modalComponenteEn(ord.id, id);
    };
    $ot.oninput=llenarComps; llenarComps();
    if(PRESEL_COMP){                       /* volvemos de crear un componente */
      const nc=byId(DB.componentes,PRESEL_COMP), no=nc?byId(DB.ordenes,nc.ordenId):null;
      if(no){ $ot.value=no.ot; llenarComps(); $cp.value=PRESEL_COMP; }
      PRESEL_COMP=null;
    }
    d.querySelector("#eRecalc").onclick=()=>{
      const a=d.querySelector("#eAct").value, cant=+d.querySelector("#eCant").value||0;
      const cc=compActual();
      if(!cc){ toast("Primero asigna la OT y el componente"); return; }
      d.querySelector("#eStd").value = stdRegistro(cc, a, cant);
      toast("Estándar recalculado");
    };
    const an=d.querySelector("#eAnular"); if(an) an.onclick=()=>{ cerrarModal(); anularRegistro(id); };
    const rs=d.querySelector("#eRestaurar"); if(rs) rs.onclick=()=>{ cerrarModal(); restaurarRegistro(id); };
    d.querySelector("#eGuardar").onclick=()=>{
      const nuevo={
        fecha:d.querySelector("#eFecha").value, tecnicoId:d.querySelector("#eTec").value,
        actividadId:d.querySelector("#eAct").value, cantidad:+d.querySelector("#eCant").value||0,
        minutos:+d.querySelector("#eMin").value||0, minutosStd:+d.querySelector("#eStd").value||0,
        tipoNovedad:d.querySelector("#eTipoNov").value, novedad:d.querySelector("#eNov").value
      };
      const motivo=d.querySelector("#eMotivo").value.trim();
      const cambios=[];
      Object.keys(nuevo).forEach(k=>{ if(String(r[k]||"")!==String(nuevo[k]||"")){
        const et={fecha:"fecha",tecnicoId:"técnico",actividadId:"actividad",cantidad:"unidades",minutos:"minutos",minutosStd:"estándar",tipoNovedad:"novedad",novedad:"detalle"}[k];
        const val=v=>k==="tecnicoId"?nom(DB.tecnicos,v):k==="actividadId"?nom(DB.actividades,v):(v||"vacío");
        cambios.push(`${et}: ${val(r[k])} → ${val(nuevo[k])}`);
      }});
      /* Reasignación de orden y componente */
      const nuevoComp = $cp.value ? byId(DB.componentes,$cp.value) : null;
      const sinOrden = d.querySelector("#eSinOrden").checked;
      let reasigna=null;
      if(sinOrden && !r.sinOrden){
        reasigna={sinOrden:true, ordenId:null, componenteId:null};
        cambios.push("marcado como trabajo sin orden");
      } else if(nuevoComp && nuevoComp.id!==r.componenteId){
        const ord=byId(DB.ordenes,nuevoComp.ordenId);
        reasigna={sinOrden:false, ordenId:nuevoComp.ordenId, componenteId:nuevoComp.id,
          tipoComponenteId:nuevoComp.tipoComponenteId, tipologiaId:nuevoComp.tipologiaId||null,
          cuartoId:nuevoComp.cuartoId, otTexto:ord?ord.ot:(r.otTexto||""),
          compTexto:nom(DB.tiposComponente,nuevoComp.tipoComponenteId,"")};
        cambios.push(`orden: ${r.otTexto||"sin OT"} → ${reasigna.otTexto} · ${reasigna.compTexto}`);
        /* si el usuario no tocó el estándar a mano, se recalcula con el componente nuevo */
        if(nuevo.minutosStd===r.minutosStd)
          nuevo.minutosStd = stdRegistro(nuevoComp, nuevo.actividadId, nuevo.cantidad);
      }
      if(!cambios.length){ toast("No cambiaste nada"); return; }
      commit(()=>{
        const t=byId(DB.registros,id); if(!t) return;
        Object.assign(t,nuevo);
        if(reasigna) Object.assign(t,reasigna);
        t.historial=(t.historial||[]).concat([{cuando:new Date().toISOString(), quien:YO, motivo, cambios:cambios.join(" · ")}]);
        t.editadoPor=YO; t.editadoEn=new Date().toISOString();
      },"Corrección guardada");
      cerrarModal();
      empujarRegistros().catch(()=>{});
    };
  });
}

/* =========================================================================
   MODALES
   ========================================================================= */
function cerrarModal(){ const m=document.querySelector(".modal:not(.dlg)"); if(m) m.remove(); }
function abrirModal(titulo, html, onMount){
  cerrarModal();
  const d=document.createElement("div"); d.className="modal";
  d.innerHTML=`<div class="box"><header><h3>${esc(titulo)}</h3><div class="push" style="margin-left:auto"><button class="btn sm" data-cerrar>Cerrar</button></div></header><div class="bd">${html}</div></div>`;
  d.addEventListener("click",e=>{ if(e.target===d||e.target.closest("[data-cerrar]")) cerrarModal(); });
  document.body.appendChild(d);
  if(onMount) onMount(d);
}
function modalTecnico(){
  const lista = DB.tecnicos.filter(t=>t.activo!==false)
    .slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  abrirModal("¿Quién eres?", `
    <label class="f"><span>Selecciona tu nombre</span>
      <select id="selTec" style="font-size:16px;padding:11px 10px">
        <option value="">— Selecciona —</option>
        ${lista.map(t=>`<option value="${t.id}" ${YO===t.id?"selected":""}>${esc(t.nombre)}${t.rol==="coordinador"?" (coordinación)":""}</option>`).join("")}
      </select></label>
    <button class="btn primary" id="okTec" style="width:100%;justify-content:center;padding:11px">Continuar</button>
    <p class="hint" style="margin-top:11px">Queda guardado en este dispositivo. Si comparten computador, cámbialo antes de registrar.</p>`,
    d=>{
      const sel=d.querySelector("#selTec");
      const elegir=async()=>{
        const id=sel.value; if(!id){ toast("Selecciona tu nombre"); return; }
        const t=byId(DB.tecnicos,id);
        /* Coordinación: vale su clave personal si la tiene; si no, la general. */
        const clave = t.rol==="coordinador" ? (t.pin || DB.meta.pin || "") : (t.pin||"");
        if(clave){
          const p=await pedirTexto("Clave","Clave de "+t.nombre,"","password");
          if(p!==clave){ toast("Clave incorrecta"); return; }
        }
        YO=id; await Store.set(KEY_ME,YO,false); cerrarModal(); toast("Hola, "+t.nombre); render();
      };
      d.querySelector("#okTec").onclick=elegir;
      sel.onchange=()=>{ const t=sel.value&&byId(DB.tecnicos,sel.value); if(t && t.rol!=="coordinador" && !t.pin) elegir(); };
    });
}
function modalOrden(id, otPrecargada){
  const o = id? byId(DB.ordenes,id) : null;
  const comps = o? DB.componentes.filter(c=>c.ordenId===o.id):[];
  abrirModal(o?("Orden "+o.ot):"Nueva orden", `
    <div class="row">
      <label class="f"><span>Número de OT</span><input type="text" id="mOT" value="${esc(o?o.ot:(otPrecargada||""))}" placeholder="12345"></label>
      <label class="f"><span>Cliente</span><input type="text" id="mCli" list="dlCli" value="${esc(o?o.cliente:"")}">
        <datalist id="dlCli">${[...new Set([...(DB.clientes||[]), ...DB.ordenes.map(o=>o.cliente).filter(Boolean)])]
          .sort((a,b)=>a.localeCompare(b,"es")).slice(0,300).map(c=>`<option>${esc(c)}</option>`).join("")}</datalist></label>
    </div>
    <div class="row">
      <label class="f"><span>Fecha de ingreso</span><input type="date" id="mFec" value="${o?o.fechaIngreso:hoyISO()}"></label>
      <label class="f"><span>Estado</span><select id="mEst">${DB.estados.map(e=>`<option ${o&&o.estado===e?"selected":""}>${esc(e)}</option>`).join("")}</select></label>
    </div>
    <label class="f"><span>Observaciones</span><textarea id="mObs" style="min-height:56px">${esc(o?o.obs||"":"")}</textarea></label>
    ${o&&hermanasDe(o).length?`<hr class="sep"><div class="eyebrow" style="margin-bottom:8px">Misma OT en otros cuartos</div>
      <div class="tw" style="margin-bottom:6px"><table><tbody>
      ${hermanasDe(o).map(x=>{const cs=DB.componentes.filter(c=>c.ordenId===x.id);
        return `<tr><td class="mono">${esc(x.ot)}</td><td>${chipEstado(x.estado)}</td>
        <td class="tag">${cs.map(c=>c.cantidad+"× "+esc(nom(DB.tiposComponente,c.tipoComponenteId))+" "+esc(nom(DB.tipologias,c.tipologiaId,""))).join(" · ")||"sin componentes"}</td></tr>`;}).join("")}
      </tbody></table></div>
      <p class="hint">Cada cuarto lleva su propio estado y entrega por separado. No se fusionan a propósito.</p>`:""}
    ${o?`<hr class="sep"><div class="eyebrow" style="margin-bottom:8px">Componentes</div>
      ${comps.length?`<div class="tw"><table><tbody>${comps.map(c=>`<tr>
        <td>${c.cantidad}× <b>${esc(nom(DB.tiposComponente,c.tipoComponenteId))}</b> ${esc(nom(DB.tipologias,c.tipologiaId,""))}<br><span class="tag">${esc(nom(DB.cuartos,c.cuartoId))} · ${esc(c.estado)}</span></td>
        <td style="width:44px"><button class="btn sm danger" data-delc="${c.id}">×</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="hint">Sin componentes.</p>`}
      <button class="btn sm" id="mAddC" style="margin-top:9px">+ Componente</button>`:`<p class="hint">Guarda la orden y podrás agregarle componentes.</p>`}
    <hr class="sep"><button class="btn primary" id="mGuardar">Guardar orden</button>
    ${o?`<button class="btn danger" id="mBorrar" style="margin-left:8px">Eliminar</button>`:""}
  `, d=>{
    d.querySelector("#mGuardar").onclick=()=>{
      const ot=d.querySelector("#mOT").value.trim(); if(!ot){toast("Falta el número de OT");return;}
      const datos={ot, cliente:d.querySelector("#mCli").value.trim(), fechaIngreso:d.querySelector("#mFec").value, estado:d.querySelector("#mEst").value, obs:d.querySelector("#mObs").value};
      let creada=null;
      commit(()=>{ if(o){ Object.assign(byId(DB.ordenes,o.id),datos); }
        else { creada={id:idOrden(datos.ot,datos.cuartoDeclaradoId||"",datos.fechaIngreso||hoyISO()),...datos, origen:"manual"};
          if(byId(DB.ordenes,creada.id)) creada.id=uid("or");     /* choque improbable */
          DB.ordenes.push(creada); R.ordenId=creada.id; } }, "Orden guardada");
      empujarConfig().catch(()=>{});          /* que la vean los demás equipos */
      cerrarModal();
      if(creada && VISTA==="registro"){ R.paso=2; R.componenteId=null; R.sel={}; R.busca="";
        setTimeout(()=>modalComponente(creada.id), 120); }
    };
    const b=d.querySelector("#mBorrar");
    if(b) b.onclick=async()=>{ if(!await confirmar("Eliminar orden","Se elimina la orden "+o.ot+", sus componentes y TODOS sus registros de producción.\n\nEsto no se puede deshacer.","Eliminar la orden")) return;
      commit(()=>{ DB.ordenes=DB.ordenes.filter(x=>x.id!==o.id); DB.componentes=DB.componentes.filter(c=>c.ordenId!==o.id); DB.registros=DB.registros.filter(r=>r.ordenId!==o.id); },"Orden eliminada"); cerrarModal(); };
    const a=d.querySelector("#mAddC"); if(a) a.onclick=()=>modalComponente(o.id);
    d.querySelectorAll("[data-delc]").forEach(x=>x.onclick=async()=>{
      const c=byId(DB.componentes,x.dataset.delc); if(!c) return;
      const usos=DB.registros.filter(r=>r.componenteId===c.id).length;
      if(!await confirmar("Eliminar componente","Se quita "+nom(DB.tiposComponente,c.tipoComponenteId)+" de esta orden."+(usos?"\n\nTiene "+usos+" registro(s) de producción que quedarán sin componente.":""))) return;
      commit(()=>{ DB.componentes=DB.componentes.filter(y=>y.id!==c.id); },"Componente eliminado"); cerrarModal(); });
  });
}
/* Agregar un componente desde el corrector de registros.
   Al terminar se vuelve a abrir el corrector (con los handlers vivos) y el
   componente recién creado queda seleccionado. */
function modalComponenteEn(ordenId, registroId){
  modalComponente(ordenId, nuevoId=>{
    PRESEL_COMP = nuevoId;
    modalEditarRegistro(registroId);
  });
}
let PRESEL_COMP = null;
function modalComponente(ordenId, alCrear){
  abrirModal("Agregar componente", `
    <label class="f"><span>Cuarto</span><select id="cFiltro">
      <option value="">Todos los cuartos</option>
      ${DB.cuartos.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select></label>
    <label class="f"><span>Tipo de componente</span><select id="cTipo"></select></label>
    <label class="f"><span>Tipología</span><select id="cTip"></select></label>
    <div class="row">
      <label class="f"><span>Cantidad</span><input type="number" id="cCant" value="1" min="1"></label>
      <label class="f"><span>Cuarto asignado</span><select id="cCu">${DB.cuartos.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select></label>
    </div>
    <button class="btn primary" id="cGuardar">Agregar</button>`, d=>{
    const sFil=d.querySelector("#cFiltro"), sTipo=d.querySelector("#cTipo"), sTip=d.querySelector("#cTip"), sCu=d.querySelector("#cCu");
    const pintarTipos=()=>{
      const vis = sFil.value ? DB.tiposComponente.filter(t=>t.cuartoId===sFil.value) : DB.tiposComponente;
      sTipo.innerHTML = vis.length ? vis.map(t=>`<option value="${t.id}">${esc(t.nombre)}</option>`).join("")
        : `<option value="">— sin componentes en este cuarto —</option>`;
      pintarTip();
    };
    const pintarTip=()=>{
      const t=byId(DB.tiposComponente,sTipo.value);
      if(!t){ sTip.innerHTML=`<option value="">—</option>`; return; }
      const sug=tipologiasDe(t.id), otras=tipologiasOtras(t.id);
      sTip.innerHTML=`<option value="">— sin tipología —</option>`
        + (sug.length?`<optgroup label="Sugeridas para ${esc(t.nombre)}">`+sug.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join("")+`</optgroup>`:"")
        + (otras.length?`<optgroup label="Otras tipologías">`+otras.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join("")+`</optgroup>`:"");
      sCu.value=t.cuartoId;
    };
    sFil.onchange=pintarTipos; sTipo.onchange=pintarTip; pintarTipos();
    d.querySelector("#cGuardar").onclick=async()=>{
      if(!sTipo.value){ toast("Elige un tipo de componente"); return; }
      let idc=idComponente(ordenId,sTipo.value,sTip.value||null);
      if(byId(DB.componentes,idc)) idc=uid("cp");                 /* ya existe uno igual */
      const nuevo={id:idc,ordenId,tipoComponenteId:sTipo.value,tipologiaId:sTip.value||null,cantidad:+d.querySelector("#cCant").value||1,cuartoId:sCu.value,estado:"Ingresada",serie:"",origen:"manual"};
      cerrarModal();
      /* Hay que ESPERAR a que el componente quede guardado: commit vuelve a
         leer la base antes de aplicar, y si no se espera, quien recibe el id
         todavía no lo encuentra. */
      await commit(()=>{ DB.componentes.push(nuevo); const o=byId(DB.ordenes,ordenId); if(o) o.revisar=null; },"Componente agregado");
      empujarConfig().catch(()=>{});          /* que lo vean los demás equipos */
      if(alCrear) alCrear(nuevo.id);
      else { R.componenteId=nuevo.id; render(); }
    };
  });
}

/* Un dispositivo nuevo no sabe dónde está el puente. Si el enlace trae ?p=URL,
   se configura solo: así el técnico abre un enlace y ya queda conectado. */
async function configDesdeEnlace(){
  try{
    const q=new URLSearchParams(location.search);
    let u=q.get("p")||q.get("puente");
    if(!u && location.hash.indexOf("p=")>=0) u=new URLSearchParams(location.hash.slice(1)).get("p");
    if(!u) return false;
    u=decodeURIComponent(u).trim();
    if(!/^https:\/\/script\.google\.com\//.test(u)) return false;
    if(DB.meta.conexion.gsUrl===u && DB.meta.conexion.modo==="script") return false;
    DB.meta.conexion.modo="script";
    DB.meta.conexion.gsUrl=u;
    await guardar();
    return true;
  }catch(e){ return false; }
}
(async function(){
  await cargar();
  const nuevo = await configDesdeEnlace();
  render();
  if(!YO) modalTecnico();
  if(DB.meta.conexion && DB.meta.conexion.modo){
    if(nuevo){ toast("Conectando con el laboratorio…"); await sincronizar(true); render(); }
    else sincronizar(true);
    programarSync();
  }
})();
