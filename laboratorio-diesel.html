/* Comprueba que lo marcado cabe en la orden. Devuelve false y avisa si no. */
function revisarTope(){
  const c = byId(DB.componentes, R.componenteId);
  if(!c) return true;
  const excesos=[];
  Object.entries(R.sel).forEach(([actId,x])=>{
    const ya=yaRegistrado(c.id, actId);
    const tope=topeActividad(c, actId);
    const total=ya+(+x.cantidad||0);
    if(total > tope) excesos.push(esPorOrden(actId)
      ? `${nom(DB.actividades,actId)}: se hace una vez por orden y ya está registrada`
      : `${nom(DB.actividades,actId)}: ${total} de ${tope}${ya?` (ya había ${ya})`:""}`);
  });
  if(!excesos.length) return true;
  if(esCoordinador()) return true;          /* coordinación decide en el guardado */
  dialogo({titulo:`La orden trae ${c.cantidad} ${nom(DB.tiposComponente,c.tipoComponenteId)}`,
    mensaje:`No caben más:\n\n${excesos.join("\n")}\n\n`
      +`Corrige la cantidad antes de seguir. Si de verdad llegaron más piezas, avísale a coordinación para que ajuste la orden en PROGRAMACION.`,
    ok:"Entendido", cancelar:"Cerrar"});
  return false;
}

/* Refresca solo la barra inferior: el resumen y el botón Siguiente.
   Se usa mientras el técnico escribe, para no perder el foco del campo. */
function actualizarBarra(){
  const cont = document.querySelector(".fixbar");
  if(!cont || !cont.parentNode) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = barraRegistro();
  const nueva = tmp.firstElementChild;
  if(nueva){
    cont.parentNode.replaceChild(nueva, cont);
    const b = document.querySelector("#siguiente");
    if(b) b.onclick = async()=>{ if(R.paso===2 && !revisarTope()) return; R.paso++; render(); };
    const a = document.querySelector("#atras");
    if(a) a.onclick = ()=>{ R.paso--; render(); };
    const g = document.querySelector("#guardarReg");
    if(g) g.onclick = guardarRegistro;
  }
}

function barraRegistro(){
  const totalMin = Object.values(R.sel).reduce((a,s)=>a+(+s.minutos||0),0);
  /* En el paso 2 no basta con marcar la actividad: hay que decir cuánto tomó.
     Un registro sin tiempo no sirve para nada y ensucia todos los promedios,
     así que el botón no se habilita hasta que todas tengan su número. */
  const marcadas = Object.entries(R.sel);
  const faltaTiempo = marcadas.filter(([,x])=>!(+x.minutos||0)).length;
  const listo = R.paso===1 ? !!R.ordenId
              : R.paso===2 ? (marcadas.length>0 && faltaTiempo===0)
              : true;
  return `<div class="fixbar"><div class="in">
    <div class="sum">${marcadas.length} actividad(es)<br>${hrs(totalMin)} h · ${fmtFecha(R.fecha)}
      ${R.paso===2&&faltaTiempo?`<br><span style="color:var(--signal)">falta el tiempo en ${faltaTiempo}</span>`:""}</div>
    <div class="sp"></div>
    ${R.paso>1?`<button class="btn" id="atras">Atrás</button>`:""}
    ${R.paso<3?`<button class="btn primary" id="siguiente" ${listo?"":"disabled"}>Siguiente</button>`
              :`<button class="btn warn" id="guardarReg">Guardar registro</button>`}
  </div></div>`;
}

function hoyDelTecnico(){
  const regs = RA().filter(r=>r.tecnicoId===YO && r.fecha===R.fecha);
  const tot = regs.reduce((a,r)=>a+r.minutos,0);
  const jor = capacidadDia(R.fecha) || 465;
  const pct = Math.min(100, Math.round(tot/jor*100));
  const dia = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"][new Date(R.fecha+"T12:00:00").getDay()];
  return `
  <div class="card">
    <header><h2>Lo que llevas registrado</h2><span class="sub mono">${dia} ${fmtFecha(R.fecha)} · ${hrs(tot)} h de ${hrs(jor)} h</span></header>
    <div class="body">
      <div class="gauge"><i class="${pct>=90?"ok":pct>=50?"warn":"bad"}" style="width:${pct}%"></i></div>
      ${regs.length?`<div class="tw" style="margin-top:12px"><table><thead><tr><th>OT</th><th>Componente</th><th>Actividad</th><th class="num">Und</th><th class="num">Real</th><th></th></tr></thead><tbody>
      ${regs.map(r=>{
        const o=byId(DB.ordenes,r.ordenId), c=fotoComponente(r);
        return `<tr><td class="mono">${o?esc(etiquetaOT(o)):(r.sinOrden?`<span class="tag">sin orden</span>`:(r.otTexto?`${esc(r.otTexto)} <span class="tag">ya no está en la hoja</span>`:`<span class="chip c-naranja">sin OT</span>`))}</td>
        <td>${c?esc(nom(DB.tiposComponente,c.tipoComponenteId)):(r.compTexto?`${esc(r.compTexto)}`:`<span class="tag">—</span>`)}</td>
        <td>${esc(nom(DB.actividades,r.actividadId))}</td>
        <td class="num">${r.cantidad}</td><td class="num">${hrs(r.minutos)}</td>
        <td><button class="btn sm danger" data-delreg="${r.id}">Borrar</button></td></tr>`;
      }).join("")}</tbody></table></div>`:`<div class="empty" style="margin-top:10px">Aún no hay registros para esta fecha.</div>`}
    </div>
  </div>`;
}

function pRegistro(){
  const rcv=$("#recargarYa"); if(rcv) rcv.onclick=()=>{ sessionStorage.setItem("labdiesel_recarga",VER_NUEVA); location.reload(true); };
  const $f=$("#fechaReg"); if($f) $f.onchange=e=>{R.fecha=e.target.value; render();};
  const $rt=$("#regTecnico"); if($rt) $rt.onchange=e=>{ R.tecnicoId=e.target.value; render(); };
  const $b=$("#buscaOT"); if($b){ $b.oninput=e=>{ R.busca=e.target.value; const p=e.target.selectionStart; render(); const n=$("#buscaOT"); n.focus(); n.setSelectionRange(p,p); }; }
  document.querySelectorAll("[data-ot]").forEach(b=>b.onclick=()=>{
    R.ordenId=b.dataset.ot; R.componenteId=null; R.sel={}; R.paso=2; window.scrollTo(0,0); render();
  });
  const $n=$("#nuevaOT"); if($n) $n.onclick=()=>modalOrden(null, R.busca.trim());
  const $cb=$("#crearBuscada"); if($cb) $cb.onclick=()=>modalOrden(null, R.busca.trim());
  const $vt=$("#verTodas"); if($vt) $vt.onchange=e=>{ R.todas=e.target.checked; render(); };
  const $so=$("#sinOrden"); if($so) $so.onclick=()=>modalSinOrden();
  const $c=$("#compSel"); if($c) $c.onchange=e=>{
    R.recienGuardado=false;
    if(e.target.value==="__nuevo__"){ modalComponente(R.ordenId); return; }
    R.componenteId=e.target.value||null; R.sel={}; render();
  };
  document.querySelectorAll("[data-chk]").forEach(ch=>ch.onchange=()=>{
    const id=ch.dataset.chk, c=byId(DB.componentes,R.componenteId);
    if(ch.checked){
      /* Se propone lo que FALTA, no la cantidad completa. Si otro técnico ya
         registró las 6 piezas, aquí arranca en 0: su tiempo sí cuenta, pero
         las unidades ya están tomadas y no se pueden contar dos veces. */
      const falta = Math.max(0, topeActividad(c, id) - yaRegistrado(c.id, id));
      R.sel[id]={cantidad:falta, minutos:0, unidad:R.unidad||"min", estado:"", ajustado:false}; }
    else delete R.sel[id];
    render();
  });
  document.querySelectorAll("[data-cant]").forEach(i=>i.oninput=()=>{
    const id=i.dataset.cant; if(!R.sel[id]) return;
    R.sel[id].cantidad=+i.value||0;
    /* El tiempo ya no se recalcula: lo pone el técnico y no se le toca.
       Lo que sí se hace es marcar en rojo si la cantidad no cabe en la orden,
       mientras escribe, sin esperar a que intente avanzar de paso. */
    const cc=byId(DB.componentes,R.componenteId);
    const pasa = cc && (yaRegistrado(cc.id,id)+(+i.value||0)) > topeActividad(cc,id);
    i.style.borderColor = pasa ? "var(--red)" : "";
    i.style.background  = pasa ? "#fdeceb" : "";
    i.title = pasa ? (esPorOrden(id)
      ? "Esta actividad se hace una vez por orden y ya está registrada"
      : `La orden trae ${cc.cantidad} y ya hay ${yaRegistrado(cc.id,id)} registradas`) : "";
  });
  /* El tiempo se guarda SIEMPRE en minutos; la unidad es solo para escribirlo.
     Así un registro hecho en horas y otro en minutos suman igual. */
  document.querySelectorAll("[data-tiempo]").forEach(i=>i.oninput=()=>{
    const id=i.dataset.tiempo; if(!R.sel[id]) return;
    const uni=(R.sel[id].unidad)||R.unidad||"min";
    const v=parseFloat(String(i.value).replace(",","."))||0;
    R.sel[id].minutos = uni==="h" ? Math.round(v*60) : Math.round(v);
    /* El aviso se apaga en cuanto escribe, sin redibujar toda la pantalla:
       repintar mientras teclea le quitaría el cursor del campo. */
    const falta = !R.sel[id].minutos;
    i.style.borderColor = falta ? "var(--signal)" : "";
    i.style.background  = falta ? "#fdefe5" : "";
    actualizarBarra();
  });
  document.querySelectorAll("[data-unidad]").forEach(sel=>sel.onchange=()=>{
    const id=sel.dataset.unidad; if(!R.sel[id]) return;
    R.sel[id].unidad = sel.value;
    R.unidad = sel.value;                 /* la siguiente actividad hereda la elección */
    render();
  });
  const $eo=$("#estadoOrden"); if($eo) $eo.onchange=e=>R.estadoOrden=e.target.value;
  const $t=$("#tipoNov"); if($t) $t.onchange=e=>R.tipoNovedad=e.target.value;
  const $d=$("#detNov"); if($d) $d.oninput=e=>R.novedad=e.target.value;
  const $a=$("#atras"); if($a) $a.onclick=()=>{ R.paso--; render(); };
  const $s=$("#siguiente"); if($s) $s.onclick=async()=>{
    /* El tope se revisa AQUÍ, no al final. Descubrir en el paso 3 que la
       cantidad no cabía obliga a devolverse y volver a escribir todo. */
    if(R.paso===2 && !revisarTope()) return;
    R.paso++; render();
  };
  const $g=$("#guardarReg"); if($g) $g.onclick=guardarRegistro;
  document.querySelectorAll("[data-delreg]").forEach(b=>b.onclick=()=>anularRegistro(b.dataset.delreg));
}

async function guardarRegistro(){
  const c = byId(DB.componentes, R.componenteId);
  if(!c || !Object.keys(R.sel).length){ toast("Marca al menos una actividad"); return; }
  /* Tope: la orden trae N unidades, no se pueden registrar más. */
  const excesos=[];
  Object.entries(R.sel).forEach(([actId,s])=>{
    const ya=yaRegistrado(c.id, actId);
    const total=ya+(+s.cantidad||0);
    if(total > (c.cantidad||0)) excesos.push(`${nom(DB.actividades,actId)}: ${total} de ${c.cantidad} (ya había ${ya})`);
  });
  /* Un registro sin unidades y sin tiempo no dice nada y ensucia los conteos. */
  const vacias = Object.entries(R.sel)
    .filter(([,x])=>!(+x.cantidad||0) && !(+x.minutos||0))
    .map(([id])=>nom(DB.actividades,id));
  if(vacias.length){
    await dialogo({titulo:"Falta el tiempo",
      mensaje:`Estas actividades quedaron sin unidades y sin tiempo:\n\n${vacias.join("\n")}\n\n`
        +`Escribe cuánto te tomó, o desmárcalas.`,
      ok:"Entendido", cancelar:"Cerrar"});
    return;
  }

  if(excesos.length){
    const msg=`La orden trae ${c.cantidad} ${nom(DB.tiposComponente,c.tipoComponenteId)}. Con lo que vas a guardar se pasaría:\n\n${excesos.join("\n")}\n\n`;
    if(!esCoordinador()){
      await dialogo({titulo:"Más unidades de las que tiene la orden",
        mensaje:msg+"Corrige la cantidad. Si de verdad llegaron más piezas, avísale a coordinación para que ajuste la orden.",
        ok:"Entendido", cancelar:"Cerrar"});
      return;
    }
    if(!await confirmar("Más unidades de las que tiene la orden",
      msg+"Como coordinación puedes continuar, pero el indicador de entregas quedará por encima de lo que ingresó.","Guardar de todos modos")) return;
  }
  /* Nadie tiene 11 h en una jornada de 8. Si se pasa, se pregunta: puede ser
     hora extra de verdad, o un dedazo. Se avisa, no se bloquea. */
  const capHoy   = capacidadTecnicoDia(YO, R.fecha);
  const yaHoy    = minutosDia(YO, R.fecha);
  const porGuardar = Object.values(R.sel).reduce((a,x)=>a+(+x.minutos||0),0);
  let esExtra = false;
  if(capHoy && (yaHoy + porGuardar) > capHoy){
    const exceso = yaHoy + porGuardar - capHoy;
    esExtra = await confirmar("Se pasa de la jornada",
      `Ese día tienes ${hrs(capHoy)} h de jornada.\n`
      +`Ya llevabas ${hrs(yaHoy)} h y vas a agregar ${hrs(porGuardar)} h: quedarían ${hrs(yaHoy+porGuardar)} h.\n\n`
      +`Son ${hrs(exceso)} h por encima.\n\n`
      +`Si de verdad fueron horas extra, guárdalas y quedan marcadas como tal.\n`
      +`Si te equivocaste al escribir el tiempo, cancela y corrígelo.`,
      "Sí, fueron horas extra");
    if(!esExtra) return;
  }
  const nuevos = Object.entries(R.sel).map(([actId,s])=>({
    /* Coordinación puede registrar por otro técnico; queda registrado quién
       capturó, para que el historial no pierda la trazabilidad. */
    id:uid("rg"), fecha:R.fecha, tecnicoId:(esCoordinador() && R.tecnicoId) ? R.tecnicoId : YO,
    capturadoPor: (esCoordinador() && R.tecnicoId && R.tecnicoId!==YO) ? YO : "",
    ordenId:R.ordenId, componenteId:R.componenteId,
    cuartoId:c.cuartoId, actividadId:actId, cantidad:+s.cantidad||0, minutos:+s.minutos||0,
    tipoComponenteId:c.tipoComponenteId, tipologiaId:c.tipologiaId||null,   /* foto: sobrevive a la orden */
    minutosStd: 0,                       /* se conserva el campo por compatibilidad */
    extra: esExtra,                      /* declarado por el técnico al pasarse de jornada */
    tiempoMedido: true,                  /* ahora TODO tiempo es medido por el técnico */
    estadoNuevo:R.estadoOrden||"", tipoNovedad:R.tipoNovedad||"", novedad:R.novedad||"",
    creado:new Date().toISOString(), creadoPor:YO, historial:[],
    actualizado:new Date().toISOString(),
    otTexto:(byId(DB.ordenes,R.ordenId)||{}).ot||"",
    compTexto:nom(DB.tiposComponente,c.tipoComponenteId,"")
  }));
  /* Blindaje: aunque llegara un estado por otra vía, un técnico no cambia el
     estado de la orden. La hoja manda. */
  const ultEstado = esCoordinador() ? (R.estadoOrden||"") : "";
  const otrosComp = DB.componentes.filter(x=>x.ordenId===R.ordenId && x.id!==R.componenteId);
  await commit(()=>{
    DB.registros.push(...nuevos);
    if(ultEstado){
      const comp = byId(DB.componentes,R.componenteId); if(comp) comp.estado=ultEstado;
      const ord = byId(DB.ordenes,R.ordenId); if(ord) ord.estado=ultEstado;
    }
  }, "Registro guardado ✓");
  empujarRegistros().catch(e=>{
    DB.meta.subidaError=e.message||"no se pudo subir";
    /* Un fallo de red suele ser pasajero: se reintenta una vez, sin perder nada.
       Lo registrado ya está guardado en este equipo. */
    setTimeout(()=>empujarRegistros().catch(()=>{}), 45000);
  });
  if(otrosComp.length){
    /* La orden tiene más componentes: se queda en ella para seguir registrando. */
    R.componenteId=null; R.sel={}; R.novedad=""; R.tipoNovedad=""; R.estadoOrden=""; R.paso=2;
    R.recienGuardado=true;
    render();
  } else {
    R = { paso:1, fecha:R.fecha, ordenId:null, componenteId:null, sel:{}, novedad:"", tipoNovedad:"", busca:"", todas:R.todas, estadoOrden:"" };
    render();
  }
}

   VISTA · MI SEMANA (lo que cada técnico puede ver de sí mismo)
   ========================================================================= */
let MS = {lunes:""};
function vMiSemana(){
  if(!YO) return `<div class="card"><div class="body"><div class="empty">Elige quién eres arriba a la derecha.</div></div></div>`;
  const cabSync = avisoVersion() + barraSync();
  const lun = MS.lunes || semanaDe(hoyISO());
  const [d,h] = rangoSemana(lun);
  const rs = RA().filter(r=>r.tecnicoId===YO && r.fecha>=d && r.fecha<=h);
  const real = rs.reduce((a,r)=>a+r.minutos,0);
  const std = rs.reduce((a,r)=>a+r.minutosStd,0);
  /* La jornada del técnico que está mirando, descontando sus ausencias. */
  const cap = capacidadTecnicoRango(YO, d, h);
  const capCal = capacidadRango(d,h);
  const ocup = cap? Math.round(real/cap*100):0;
  const nombresDia=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const dias=[]; const a=new Date(d+"T12:00:00");
  for(let i=0;i<7;i++){ const iso=isoLocal(a);
    const cCal=capacidadDia(iso);
    const c=capacidadTecnicoDia(YO, iso);
    if(cCal>0) dias.push({iso, dow:new Date(iso+"T12:00:00").getDay(), cap:c, capCal:cCal,
      ausente:c<cCal, min:rs.filter(r=>r.fecha===iso).reduce((x,r)=>x+r.minutos,0)});
    a.setDate(a.getDate()+1); }
  const maxD = Math.max(1,...dias.map(x=>x.capCal));

  return cabSync + `
  <div class="card"><div class="body"><div class="row" style="align-items:end">
    <label class="f" style="max-width:200px"><span>Semana del</span><input type="date" id="msLunes" value="${lun}"></label>
    <div style="flex:0 0 auto;margin-bottom:11px"><button class="btn sm" id="msPrev">← Anterior</button>
    <button class="btn sm" id="msHoy">Esta semana</button>
    <button class="btn sm" id="msNext">Siguiente →</button></div>
  </div></div></div>

  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="l">Horas registradas</div><div class="v">${hrs(real)}</div><div class="h">de ${hrs(cap)} h de la semana${cap<capCal?` · ${hrs(capCal-cap)} h descontadas por ausencia`:""}</div></div>
    <div class="kpi"><div class="l">Ocupación</div><div class="v">${ocup}%</div>
      <div class="h">${(()=>{const ex=minutosExtra(YO,d,h); return ex?`${hrs(ex)} h por encima de la jornada`:"dentro de la jornada";})()}</div>
      <div class="gauge"><i class="${ocup>100?"warn":ocup>=90?"ok":ocup>=60?"warn":"bad"}" style="width:${Math.min(100,ocup)}%"></i></div></div>
    <div class="kpi"><div class="l">Piezas tocadas</div><div class="v">${(()=>{
      const ids=new Set(rs.filter(r=>r.componenteId).map(r=>r.componenteId));
      let t=0; ids.forEach(id=>{ const c=byId(DB.componentes,id); if(c) t+=+c.cantidad||0; });
      return t;
    })()}</div><div class="h">en ${new Set(rs.map(r=>r.ordenId)).size} órdenes</div></div>
    ${(()=>{const me=byId(DB.tecnicos,YO); const fuera=rs.filter(r=>me&&r.cuartoId!==me.cuartoId);
      const mf=fuera.reduce((a,r)=>a+r.minutos,0);
      return mf?`<div class="kpi"><div class="l">Apoyo a otros cuartos</div><div class="v">${hrs(mf)}</div>
        <div class="h">${[...new Set(fuera.map(r=>nom(DB.cuartos,r.cuartoId)))].join(", ")}</div></div>`
      :`<div class="kpi"><div class="l">Actividades</div><div class="v">${rs.length}</div><div class="h">${rs.reduce((x,r)=>x+r.cantidad,0)} unidades</div></div>`;})()}
  </div>

  <div class="card"><header><h2>Día por día</h2></header><div class="body"><div class="bars">
    ${dias.map(x=>`<div class="bar"><div class="t">${nombresDia[x.dow]}</div>
      <div class="track"><i class="${x.cap&&x.min>=x.cap*0.9?"":"b"}" style="width:${Math.min(100,x.min/maxD*100)}%"></i></div>
      <div class="n">${x.cap? `${hrs(x.min)} / ${hrs(x.cap)} h${x.min>x.cap?` <span class="chip c-naranja" title="Por encima de la jornada">+${hrs(x.min-x.cap)}</span>`:""}` : (x.min?`<span class="chip c-naranja">${hrs(x.min)} h en día ausente</span>`:`<span class="chip c-azul">ausente</span>`)}</div></div>`).join("")}
  </div></div></div>

  <div class="card"><header><h2>Mis registros</h2><span class="sub mono">${rs.length}</span></header><div class="body">
    ${rs.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>OT</th><th>Componente</th><th>Actividad</th><th class="num">Und</th><th class="num">Horas</th></tr></thead><tbody>
    ${rs.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(r=>{
      const o=byId(DB.ordenes,r.ordenId), c=fotoComponente(r);
      return `<tr><td class="mono">${fmtFecha(r.fecha)}</td><td class="mono">${o?esc(etiquetaOT(o)):(r.sinOrden?`<span class="tag">sin orden</span>`:(r.otTexto?`${esc(r.otTexto)} <span class="tag">ya no está en la hoja</span>`:`<span class="chip c-naranja">sin OT</span>`))}</td>
      <td>${c?esc(nom(DB.tiposComponente,c.tipoComponenteId)):"—"} ${c?esc(nom(DB.tipologias,c.tipologiaId,"")):""}</td>
      <td>${esc(nom(DB.actividades,r.actividadId))}</td><td class="num">${r.cantidad}</td><td class="num">${hrs(r.minutos)}</td></tr>`;
    }).join("")}</tbody></table></div>`:`<div class="empty">Sin registros esta semana.</div>`}
  </div></div>`;
}
function pMiSemana(){
  const rc=$("#recargarYa"); if(rc) rc.onclick=()=>{ sessionStorage.setItem("labdiesel_recarga",VER_NUEVA); location.reload(true); };
  if(!YO) return;                     /* sin técnico elegido no hay controles que enganchar */

/* =========================================================================
   VISTA 2 · ÓRDENES
   ========================================================================= */
let FO = {q:"", estado:"", cuarto:"", verCerradas:false, soloRevisar:false};
function vOrdenes(){
  const q=FO.q.toLowerCase();
  const cerr=cerrados();
  const lista = DB.ordenes.filter(o=>{
    if(FO.soloRevisar && !o.revisar) return false;
    if(!FO.verCerradas && !FO.estado && cerr.has(o.estado)) return false;
    if(FO.estado && o.estado!==FO.estado) return false;
    if(FO.cuarto && !DB.componentes.some(c=>c.ordenId===o.id && c.cuartoId===FO.cuarto)) return false;
    if(q && sinTildes(o.ot+" "+(o.cliente||"")+" "+(o.tipoTexto||"")).indexOf(sinTildes(q))<0) return false;
    return true;
  }).sort((a,b)=>(b.fechaIngreso||"").localeCompare(a.fechaIngreso||""));
  return `
  <div class="card">
    <header><h2>Órdenes de trabajo</h2><span class="sub mono">${lista.length}/${DB.ordenes.length}${(()=>{
       const fs=DB.ordenes.map(o=>o.fechaIngreso).filter(Boolean).sort();

function pOrdenes(){
  $("#fq").oninput=e=>{FO.q=e.target.value; const p=e.target.selectionStart; render(); const n=$("#fq"); n.focus(); n.setSelectionRange(p,p);};
  $("#fe").onchange=e=>{FO.estado=e.target.value;render();};
  $("#fc").onchange=e=>{FO.cuarto=e.target.value;render();};
  const fce=$("#fcerr"); if(fce) fce.onchange=e=>{FO.verCerradas=e.target.checked;render();};
  const frv=$("#frev"); if(frv) frv.onchange=e=>{FO.soloRevisar=e.target.checked;render();};
  document.querySelectorAll("[data-aplicar]").forEach(b=>b.onclick=async()=>{
    const tk=b.dataset.aplicar;
    const ords=DB.ordenes.filter(o=>(o.revisar||[]).includes(tk) && DB.componentes.some(c=>c.ordenId===o.id));
    const muestra=ords.slice(0,8).map(o=>{
      const cs=DB.componentes.filter(c=>c.ordenId===o.id && !c.tipologiaId);
      return `  OT ${o.ot}  (TIPO en la hoja: ${o.tipoTexto||"—"})\n     ${cs.map(c=>c.cantidad+"x "+nom(DB.tiposComponente,c.tipoComponenteId)).join(", ")||"nada por asignar"}`;
    }).join("\n");
    if(!await confirmar("Aplicar tipología",
      `"${tk}" se tomará de la celda TIPO de cada orden y se pondrá a sus componentes sin tipología.\n`+
      `No se pisa ninguna tipología ya asignada.\n\n`+
      `Órdenes afectadas: ${ords.length}\n\n${muestra}${ords.length>8?`\n  …y ${ords.length-8} más`:""}`,
      "Aplicar a las "+ords.length)) return;
    commitMaestro(()=>{
      /* Una sola tipología para el texto, sin atarla a un componente: así vale
         para todos los que la usen y el resolver la encuentra la próxima vez. */
      let tpGlobal = DB.tipologias.find(x=>!x.tipoComponenteId && coincideTipologia(x,tk))
                  || DB.tipologias.find(x=>coincideTipologia(x,tk));
      if(tpGlobal && tpGlobal.tipoComponenteId){
        /* estaba atada a un componente: se libera para que sirva en cualquiera */
        tpGlobal.tipoComponenteId="";
      }
      if(!tpGlobal) tpGlobal = buscarOCrear("tipologias", tk, {cuartoId:"", tipoComponenteId:""});
      ords.forEach(o=>{
        const cs=DB.componentes.filter(c=>c.ordenId===o.id);
        cs.forEach(c=>{ if(!c.tipologiaId) c.tipologiaId=tpGlobal.id; });
        const t=byId(DB.ordenes,o.id);
        if(t){ const q=(t.revisar||[]).filter(x=>x!==tk); t.revisar=q.length?q:null; }
      });
    }, `"${tk}" aplicada a ${ords.length} orden(es)`);
  });
  document.querySelectorAll("[data-ignorar]").forEach(b=>b.onclick=async()=>{
    const tk=b.dataset.ignorar;
    if(!await confirmar("No es una tipología",`La app dejará de intentar ubicar "${tk}", ahora y en las próximas sincronizaciones.`,"Ignorar siempre")) return;
    commitMaestro(()=>{
      DB.meta.tokensIgnorados=[...new Set([...(DB.meta.tokensIgnorados||[]), sinTildes(tk)])];
      DB.ordenes.forEach(o=>{ if(o.revisar){ const q=o.revisar.filter(x=>x!==tk); o.revisar=q.length?q:null; } });
    }, `"${tk}" ignorada de aquí en adelante`);
  });
  $("#addOT").onclick=()=>modalOrden();
  document.querySelectorAll("[data-edot]").forEach(b=>b.onclick=()=>modalOrden(b.dataset.edot));
  document.querySelectorAll("[data-rehacer]").forEach(b=>b.onclick=()=>rehacerOrden(b.dataset.rehacer));
}

let FD = {desde:"", hasta:"", cuarto:"", tecnico:"", verAnulados:false};
function rangoActivo(){
  const d = FD.desde || semanaDe(hoyISO());
  const h = FD.hasta || rangoSemana(semanaDe(hoyISO()))[1];

function regsFiltrados(){

    && (!FD.cuarto || r.cuartoId===FD.cuarto)
    && (!FD.tecnico || r.tecnicoId===FD.tecnico));

function vDashboard(){
  const [d,h]=rangoActivo();
  const rs=regsFiltrados();
  const real=rs.reduce((a,r)=>a+r.minutos,0);
  const std=rs.reduce((a,r)=>a+r.minutosStd,0);
  const efi = real? Math.round(std/real*100):0;
  const cuentan = tecnicosQueCuentan(d,h,FD.cuarto,FD.tecnico);
  const nTec = cuentan.length;
  const minNoProd = minutosNoProductivos(rs);
  const minAus = minutosAusencia(d,h);
  /* El denominador tiene que ser del MISMO grupo que el numerador: si se
     filtra por cuarto, la jornada disponible también. */
  const capTotal = Math.max(0, capacidadEquipoRango(d,h,FD.cuarto,FD.tecnico) - minNoProd);
  /* Ocupación: horas registradas contra la jornada que de verdad hubo.
     Reemplaza a la productividad, que dependía de los tiempos estándar. */
  const ocupDash = capTotal? Math.round(real/capTotal*100):0;
  /* Terminado = pasó por una actividad de fase Entrega. Antes se buscaban dos
     actividades que no existen en el catálogo, así que la cifra era siempre 0.
     Se topa contra la cantidad de la hoja: si la OT trae 6 inyectores, no se
     pueden terminar 8 aunque dos técnicos registren 6 cada uno. */
  const esEntrega = id => { const a=byId(DB.actividades,id); return a && a.fase==="Entrega"; };
  const undTerm = (()=>{
    const porComp={};
    rs.filter(r=>r.componenteId && esEntrega(r.actividadId))
      .forEach(r=>{ porComp[r.componenteId]=(porComp[r.componenteId]||0)+(+r.cantidad||0); });
    return Object.entries(porComp).reduce((a,[id,u])=>{
      const c=byId(DB.componentes,id);
      return a + Math.min(u, c? (+c.cantidad||0) : u);
    },0);
  })();
  const otsTocadas = new Set(rs.map(r=>r.ordenId)).size;

  /* PIEZAS TOCADAS · el número que no se puede inflar.
     Cada componente aporta la cantidad que dice PROGRAMACION, una sola vez,
     por más actividades que se le registren y por más técnicos que trabajen
     en él. Sumar r.cantidad daba 164 porque contaba los mismos 6 inyectores
     en lavado, calibración, armado y entrega. */
  const av = avancePeriodo(d, h, FD.cuarto, FD.tecnico);
  const piezasAvanzaron = av.avanzaron.reduce((a,x)=>a+x.piezas,0);
  const piezasQuietas   = av.quietas.reduce((a,x)=>a+(+x.c.cantidad||0),0);

  const piezasTocadas = (()=>{
    const ids=new Set(rs.filter(r=>r.componenteId).map(r=>r.componenteId));
    let t=0; ids.forEach(id=>{ const c=byId(DB.componentes,id); if(c) t+=+c.cantidad||0; });
    return t;
  })();
  const pasosActividad = rs.reduce((a,r)=>a+(+r.cantidad||0),0);
  const cerrDash = cerrados();
  const ordAbiertas = DB.ordenes.filter(o=>!cerrDash.has(o.estado));
  const abiertas = ordAbiertas.length;
  const bloqueadas = ordAbiertas.filter(o=>/repuesto/i.test(o.estado||"")).length;
  const porAutorizar = ordAbiertas.filter(o=>/autoriza/i.test(o.estado||"")).length;
  const pendRep = bloqueadas;

  // ocupación por técnico
  /* Cada técnico se mide contra SU jornada, no contra la del calendario.
     Quien estuvo incapacitado dos días no tenía 40.75 h disponibles. */
  const porTec = DB.tecnicos.filter(t=>t.activo!==false && t.rol!=="coordinador").map(t=>{
    const rr=rs.filter(r=>r.tecnicoId===t.id);
    const m=rr.reduce((a,x)=>a+x.minutos,0), s=rr.reduce((a,x)=>a+x.minutosStd,0);
    const capReal=capacidadTecnicoRango(t.id,d,h);
    /* Productividad: de lo que registró, cuánto fue trabajo real — con orden,
       o apoyo que sí tenía OT aunque la haya escrito en la novedad — contra
       cuánto fue aseo, reuniones o apoyo genuinamente sin ninguna orden detrás.
       Es distinto de la ocupación: la ocupación no distingue el tipo de tarea,
       esto sí. Un técnico puede tener 100% de ocupación y baja productividad
       si gran parte de esas horas fueron sin orden. */
    const noProd=minutosNoProductivos(rr);
    return {t, min:m, std:s, cap:capReal, aus:capacidadRango(d,h)-capReal,
            ex:minutosExtra(t.id,d,h), oc:capReal?Math.round(m/capReal*100):0,
            pr:capReal?Math.round((m-noProd)/capReal*100):0};
  }).sort((a,b)=>b.min-a.min);
  const maxT = Math.max(1,...porTec.map(x=>Math.max(x.cap,x.min)));

  const porCuarto = DB.cuartos.map(c=>{
    const rr=rs.filter(r=>r.cuartoId===c.id);
    return {c, min:rr.reduce((a,x)=>a+x.minutos,0), std:rr.reduce((a,x)=>a+x.minutosStd,0)};
  }).filter(x=>x.min>0).sort((a,b)=>b.min-a.min);
  const maxC = Math.max(1,...porCuarto.map(x=>x.min));

  const porAct = DB.actividades.map(a=>{
    const rr=rs.filter(r=>r.actividadId===a.id);
    return {a, min:rr.reduce((x,y)=>x+y.minutos,0), und:rr.reduce((x,y)=>x+y.cantidad,0)};
  }).filter(x=>x.min>0).sort((a,b)=>b.min-a.min).slice(0,10);
  const maxA = Math.max(1,...porAct.map(x=>x.min));

  const novs = {};
  rs.forEach(r=>{ if(r.tipoNovedad) novs[r.tipoNovedad]=(novs[r.tipoNovedad]||0)+1; });
  const novList=Object.entries(novs).sort((a,b)=>b[1]-a[1]);

  /* El último día laboral DENTRO del periodo que se está mirando. Antes usaba
     siempre la fecha de hoy: un domingo, o revisando una semana pasada, decía
     que nadie había registrado. */
  const diaControl = (()=>{
    const a=new Date(d+"T12:00:00"), b=new Date(h+"T12:00:00");
    const hoy=hoyISO();
    const habiles=[];
    while(a<=b){ const iso=isoLocal(a); if(capacidadDia(iso) && iso<=hoy) habiles.push(iso); a.setDate(a.getDate()+1); }
    if(!habiles.length) return "";
    /* Del último hacia atrás, el primero que ya tenga algún registro.
       A las ocho de la mañana nadie ha registrado todavía, y decir que los 16
       están en mora no informa nada: la jornada apenas empieza. */
    for(let i=habiles.length-1;i>=0;i--){
      if(RA().some(r=>r.fecha===habiles[i])) return habiles[i];
    }
    return habiles.length>1 ? habiles[habiles.length-2] : habiles[0];
  })();
  /* Quien está ausente ese día no debe aparecer como "sin registrar". */
  const sinRegistrar = !diaControl ? [] :
    tecnicosQueCuentan(d,h,FD.cuarto,FD.tecnico).filter(t=>
      capacidadTecnicoDia(t.id, diaControl) > 0 &&
      !RA().some(r=>r.tecnicoId===t.id && r.fecha===diaControl));

  return `
  ${filtrosDash()}
  ${(()=>{
    /* Días en los que lo registrado no cabe en la jornada. Los registros hechos
       antes de que existiera el aviso nunca se confirmaron como extra, así que
       hay que poder revisarlos sin perseguir a nadie uno por uno. */
    const casos=[];
    tecnicosQueCuentan(d,h,FD.cuarto,FD.tecnico).forEach(t=>{
      const a=new Date(d+"T12:00:00"), b=new Date(h+"T12:00:00");
      while(a<=b){
        const iso=isoLocal(a);
        const min=minutosDia(t.id,iso), cap=capacidadTecnicoDia(t.id,iso);
        if(min>cap) casos.push({t,iso,min,cap,
          motivo: cap? "por encima de la jornada" : (capacidadDia(iso)? "día marcado como ausente" : "día no laboral")});
        a.setDate(a.getDate()+1);
      }
    });
    if(!casos.length) return "";
    casos.sort((x,y)=>(y.min-y.cap)-(x.min-x.cap));
    return `<div class="card" style="border-color:#f3ccb0;background:#fdefe5;margin-bottom:14px">
      <header style="background:transparent;border-bottom-color:#f3ccb0">
        <h2 style="color:var(--signal)">${casos.length} día(s) con más horas que la jornada</h2>
        <span class="sub">horas extra, o un tiempo mal escrito</span></header>
      <div class="body" style="padding-top:10px">
        <div class="tw"><table><thead><tr><th>Técnico</th><th>Día</th><th class="num">Registró</th><th class="num">Jornada</th><th class="num">Exceso</th><th>Situación</th></tr></thead><tbody>
        ${casos.slice(0,20).map(c=>`<tr><td><b>${esc(c.t.nombre)}</b></td>
          <td class="mono">${fmtFecha(c.iso)}</td>
          <td class="num">${hrs(c.min)} h</td>
          <td class="num">${hrs(c.cap)} h</td>
          <td class="num"><span class="chip c-naranja">+${hrs(c.min-c.cap)} h</span></td>
          <td>${c.motivo}</td></tr>`).join("")}
        </tbody></table></div>
        ${casos.length>20?`<p class="hint">y ${casos.length-20} más</p>`:""}
        <p class="hint" style="margin-top:9px">Pregunta antes de asumir. Si fueron extras de verdad, el dato está bien y conviene
        dejarlo así. Si el técnico se equivocó al escribir el tiempo, coordinación puede corregir ese registro.</p>
      </div></div>`;
  })()}
  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="l">Horas registradas</div><div class="v">${hrs(real)}</div><div class="h">${rs.length} registros</div></div>
    <div class="kpi"><div class="l">Piezas tocadas</div><div class="v">${piezasTocadas}</div>
      <div class="h">en ${otsTocadas} órdenes · ${pasosActividad} pasos de actividad</div></div>
    <div class="kpi"><div class="l">Piezas que avanzaron</div><div class="v">${piezasAvanzaron}</div>
      <div class="h">${av.avanzaron.length} componente(s) subieron de fase</div></div>
    <div class="kpi ${piezasQuietas?"alert":""}"><div class="l">Piezas quietas</div><div class="v">${piezasQuietas}</div>
      <div class="h">${av.quietas.length?`empezadas y sin moverse · la más vieja ${av.quietas[0].dias} día(s)`:"nada detenido"}</div></div>
    <div class="kpi"><div class="l">Ocupación</div><div class="v">${ocupDash}%</div>
      <div class="h">${hrs(real)} de ${hrs(capTotal)} h disponibles</div>
      <div class="gauge"><i class="${ocupDash>=85?"ok":ocupDash>=60?"warn":"bad"}" style="width:${Math.min(100,ocupDash)}%"></i></div></div>
    <div class="kpi"><div class="l">Componentes terminados</div><div class="v">${undTerm}</div><div class="h">${otsTocadas} OT trabajadas</div></div>
  </div>
  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="l">OT abiertas</div><div class="v">${abiertas}</div>
      <div class="h">sin cerrar en el laboratorio, de ${DB.ordenes.length} importadas</div></div>
    <div class="kpi ${pendRep?"alert":""}"><div class="l">Pendiente repuestos</div><div class="v">${pendRep}</div>
      <div class="h">${porAutorizar} más por autorizar</div></div>
    <div class="kpi ${sinRegistrar.length?"alert":""}"><div class="l">Sin registrar${diaControl?" el "+fmtFecha(diaControl):""}</div><div class="v">${sinRegistrar.length}</div><div class="h">${sinRegistrar.slice(0,3).map(t=>esc(t.nombre)).join(", ")||"todos al día"}</div></div>
    <div class="kpi"><div class="l">Tiempo no productivo</div><div class="v">${hrs(minNoProd)}</div>
      <div class="h">aseo, reuniones, apoyo · descontado</div></div>
  </div>

  <div class="grid g2">
    <div class="card"><header><h2>Carga por técnico</h2><span class="sub mono">horas registradas contra su jornada</span></header>
      <div class="body">${porTec.length?`<div class="bars">${porTec.map(x=>`
        <div class="bar"><div class="t">${esc(x.t.nombre)}</div>

          <div class="n">${hrs(x.min)} / ${hrs(x.cap)} h
            <span class="chip ${x.oc>=90?"c-verde":x.oc>=60?"c-ambar":"c-naranja"}" title="Horas registradas ÷ jornada">${x.oc}% ocupación</span>
            <span class="chip ${x.pr>=85?"c-verde":x.pr>=60?"c-ambar":"c-naranja"}" title="De lo registrado, cuánto fue trabajo con orden detrás (el apoyo con OT cuenta; aseo y reuniones sin orden, no)">${x.pr}% productividad</span>
            ${x.aus>0?` <span class="chip c-azul" title="Jornada descontada por ausencia">−${hrs(x.aus)} h</span>`:""}${x.ex>0?` <span class="chip c-naranja" title="Registró más horas que su jornada">+${hrs(x.ex)} h</span>`:""}</div></div>`).join("")}</div>`:`<div class="empty">Sin datos en el rango.</div>`}</div></div>

    <div class="card"><header><h2>Horas por cuarto</h2></header>
      <div class="body">${porCuarto.length?`<div class="bars">${porCuarto.map(x=>`
        <div class="bar"><div class="t">${esc(x.c.nombre)}</div>
        <div class="track"><i style="width:${x.min/maxC*100}%"></i></div>
        <div class="n">${hrs(x.min)} h · ${x.min?Math.round(x.std/x.min*100):0}%</div></div>`).join("")}</div>`:`<div class="empty">Sin datos en el rango.</div>`}</div></div>

    <div class="card"><header><h2>Actividades que más tiempo consumen</h2></header>
      <div class="body">${porAct.length?`<div class="bars">${porAct.map(x=>`
        <div class="bar"><div class="t">${esc(x.a.nombre)}</div>
        <div class="track"><i style="width:${x.min/maxA*100}%"></i></div>
        <div class="n">${hrs(x.min)} h · ${x.und} und</div></div>`).join("")}</div>`:`<div class="empty">Sin datos.</div>`}</div></div>

    <div class="card"><header><h2>Novedades por causa</h2></header>
      <div class="body">${novList.length?`<div class="bars">${novList.map(([k,v])=>`
        <div class="bar"><div class="t">${esc(k)}</div>
        <div class="track"><i class="b" style="width:${v/novList[0][1]*100}%"></i></div>
        <div class="n">${v}</div></div>`).join("")}</div>`:`<div class="empty">Sin novedades reportadas. 👌</div>`}</div></div>
  </div>

  <div class="card"><header><h2>Detalle de registros</h2><span class="sub mono">${rs.length} filas</span>
    <div class="push"><label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="verAnulados" ${FD.verAnulados?"checked":""}> ver anulados</label>
    <button class="btn sm" id="csvReg">Exportar CSV</button></div></header>
    <div class="body">
    <p class="hint" style="margin-top:0">Cuando una fila dice <b>"sin orden · OT 36530"</b>, el técnico marcó "sin orden" pero mencionó ese
    número en la novedad, y coincide con una orden real: esas horas cuentan como producción, no se descuentan de su jornada.
    Solo pasa si el número coincide exacto con una orden que existe — no adivina con cualquier cifra suelta.</p>
    <div class="tw" style="max-height:420px;overflow:auto"><table>
      <thead><tr><th>Fecha</th><th>Técnico</th><th>OT</th><th>Componente</th><th>Actividad</th><th class="num">Und</th><th class="num">Horas</th><th class="num">h/unidad</th><th>Novedad</th><th></th></tr></thead>
      <tbody>${(FD.verAnulados? DB.registros.filter(r=>{const [dd,hh]=rangoActivo(); return r.fecha>=dd&&r.fecha<=hh&&(!FD.cuarto||r.cuartoId===FD.cuarto)&&(!FD.tecnico||r.tecnicoId===FD.tecnico);}) : rs)
        .slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)||String(b.creado).localeCompare(String(a.creado))).map(r=>{
        const o=byId(DB.ordenes,r.ordenId), c=fotoComponente(r);
        const editado=(r.historial||[]).length;
        return `<tr style="${r.anulado?"opacity:.5;text-decoration:line-through":""}">
        <td class="mono">${fmtFecha(r.fecha)}</td>
        <td>${esc(nom(DB.tecnicos,r.tecnicoId))}${r.capturadoPor?`<br><span class="tag" title="Lo capturó coordinación por él">lo registró ${esc(nom(DB.tecnicos,r.capturadoPor))}</span>`:""}</td>
        <td class="mono">${o?esc(etiquetaOT(o)):(r.sinOrden
            ?(()=>{ const otHallada=otNumeroMencionado(r.novedad);
                return otHallada
                  ? `<span class="tag" title="Encontrada en la novedad: cuenta como producción">sin orden · OT ${esc(otHallada)}</span>`
                  : `<span class="tag">sin orden</span>`; })()
            :(r.otTexto?`${esc(r.otTexto)} <span class="tag">ya no está en la hoja</span>`:`<span class="chip c-naranja">sin OT</span>`))}</td><td>${c?esc(nom(DB.tiposComponente,c.tipoComponenteId)):(r.compTexto?esc(r.compTexto):"—")}</td>
        <td>${esc(nom(DB.actividades,r.actividadId))}</td><td class="num">${r.cantidad}</td>
        <td class="num">${hrs(r.minutos)}</td><td class="num">${r.cantidad>0?hrs(r.minutos/r.cantidad):"—"}</td>
        <td>${r.tipoNovedad?`<span class="chip c-naranja">${esc(r.tipoNovedad)}</span> ${esc(r.novedad||"")}`:""}
            ${editado?`<span class="chip c-ambar" title="corregido ${editado} vez(ces)">corregido</span>`:""}
            ${r.anulado?`<span class="chip c-rojo">anulado</span>`:""}</td>
        <td><button class="btn sm" data-edreg="${r.id}">Corregir</button></td></tr>`;
      }).join("")}</tbody></table></div></div></div>

  ${(()=>{ const corr=rs.concat(DB.registros.filter(r=>r.anulado)).filter((r,i,a)=>a.indexOf(r)===i)
      .filter(r=>{const [dd,hh]=rangoActivo(); return r.fecha>=dd&&r.fecha<=hh&&((r.historial||[]).length||r.anulado);});
    if(!corr.length) return "";
    return `<div class="card"><header><h2>Correcciones del período</h2><span class="sub mono">${corr.length}</span></header>
    <div class="body"><div class="tw"><table><thead><tr><th>Registro</th><th>Quién corrigió</th><th>Qué cambió</th></tr></thead><tbody>
    ${corr.map(r=>{ const o=byId(DB.ordenes,r.ordenId); const ult=(r.historial||[]).slice(-1)[0];
      return `<tr><td class="mono">${fmtFecha(r.fecha)} · OT ${o?esc(etiquetaOT(o)):(r.sinOrden?`<span class="tag">sin orden</span>`:(r.otTexto?`${esc(r.otTexto)} <span class="tag">ya no está en la hoja</span>`:`<span class="chip c-naranja">sin OT</span>`))}<br><span class="tag">${esc(nom(DB.tecnicos,r.tecnicoId))}</span></td>
      <td>${esc(nom(DB.tecnicos,r.anulado?r.anuladoPor:(ult?ult.quien:"")))}<br><span class="tag">${r.anulado?esc(r.motivoAnulacion||"sin motivo"):esc(ult?ult.motivo||"sin motivo":"")}</span></td>
      <td class="tag">${r.anulado?"<b>Anulado</b>":esc(ult?ult.cambios:"")}</td></tr>`;
    }).join("")}</tbody></table></div></div></div>`; })()}`;
}

function diasHabiles(d,h){
  let n=0; const a=new Date(d+"T12:00:00"), b=new Date(h+"T12:00:00");
  while(a<=b){ const w=a.getDay(); if(w!==0) n++; a.setDate(a.getDate()+1); }
  return Math.max(1,n);
}
function pDashboard(){

    /* "Ya volvió": la ausencia se cierra el día anterior al de hoy. */
    const ayer=restarDias(hoyISO(),1);

    commit(()=>{ DB.ausencias=(DB.ausencias||[]).filter(x=>x.id!==id); },"Ausencia borrada");

  $("#dd").onchange=e=>{FD.desde=e.target.value;render();};

  $("#dc").onchange=e=>{FD.cuarto=e.target.value;render();};

  document.querySelectorAll("[data-rng]").forEach(b=>b.onclick=()=>{

    if(t==="semana"){ const l=semanaDe(hy); FD.desde=l; FD.hasta=rangoSemana(l)[1]; }
    if(t==="pasada"){ const l=new Date(semanaDe(hy)+"T12:00:00"); l.setDate(l.getDate()-7); const li=isoLocal(l); FD.desde=li; FD.hasta=rangoSemana(li)[1]; }
    if(t==="mes"){ FD.desde=hy.slice(0,8)+"01"; FD.hasta=hy; }

  const va=$("#verAnulados"); if(va) va.onchange=e=>{ FD.verAnulados=e.target.checked; render(); };
  document.querySelectorAll("[data-edreg]").forEach(b=>b.onclick=()=>modalEditarRegistro(b.dataset.edreg));
}

/* =========================================================================
   VISTA · INGRESOS  ·  qué entró al laboratorio, no cómo se trabajó
   ========================================================================= */
let FI={desde:"",hasta:"",cuarto:"",modoEntrega:"",baseEntrega:"entrega"};
function rangoIngresos(){
  const d=FI.desde || semanaDe(hoyISO());
  const h=FI.hasta || rangoSemana(semanaDe(hoyISO()))[1];
  return [d,h];
}
function vIngresos(){
  const [d,h]=rangoIngresos();
  /* Esta pantalla es un espejo de NUEVA PROGRAMACIÓN: solo las órdenes que
     la hoja sigue trayendo. Lo que cambió de cuarto o de fecha ya no cuenta. */
  let ords=DB.ordenes.filter(o=>o.vigente!==false && o.fechaIngreso>=d && o.fechaIngreso<=h);
  if(FI.cuarto) ords=ords.filter(o=>cuartosDeOrden(o).has(FI.cuarto));
  const ids=new Set(ords.map(o=>o.id));
  let comps=DB.componentes.filter(c=>ids.has(c.ordenId));
  if(FI.cuarto) comps=comps.filter(c=>cuartoDeComponente(c)===FI.cuarto);
  const und=comps.reduce((a,c)=>a+(+c.cantidad||0),0);
  const cerr=cerrados();

  const agrupa=(arr,fn)=>{ const g={}; arr.forEach(x=>{ const k=fn(x)||"Sin definir"; g[k]=(g[k]||0)+1; }); 
    return Object.entries(g).sort((a,b)=>b[1]-a[1]); };
  const porMotivo=agrupa(ords,o=>o.motivo);
  const porEstado=agrupa(ords,o=>o.estado);
  const porCliente=agrupa(ords,o=>o.cliente).slice(0,10);
  const porCuarto=DB.cuartos.map(cu=>({cu, n:ords.filter(o=>cuartosDeOrden(o).has(cu.id)).length,
    und:comps.filter(c=>cuartoDeComponente(c)===cu.id).reduce((a,c)=>a+(+c.cantidad||0),0)})).filter(x=>x.n||x.und);

  /* ENTREGAS: se cuentan por lo que el técnico registró como entregado,
     no por el estado de la orden. Así una entrega parcial (4 de 6 inyectores)
     sí queda contada, que era el hueco del método anterior. */
  const regsEnt = RA().filter(r=>{
    if(r.fecha<d || r.fecha>h) return false;
    const a=byId(DB.actividades,r.actividadId);
    if(!a || a.fase!=="Entrega") return false;
    if(FI.cuarto && r.cuartoId!==FI.cuarto) return false;
    return true;
  });
  /* Se agrupa por componente y se limita a lo que la orden trajo:
     nunca se puede entregar más de lo que entró. */
  const porComp={};
  regsEnt.forEach(r=>{ porComp[r.componenteId]=(porComp[r.componenteId]||0)+(+r.cantidad||0); });
  let entMatriz={}, undEnt=0, recortadas=0;

  /* MODO HISTÓRICO: meses sin registros de técnicos. La única fuente es la hoja:
     órdenes que quedaron en estado Entregado y los componentes que traían. */
  /* Ingresos NO usa los registros de los técnicos: esa lectura vive en el
     Dashboard. Aquí manda siempre la hoja, para que el número se pueda
     contrastar con NUEVA PROGRAMACIÓN sin sorpresas. */
  const modoEnt = "estado";
  if(modoEnt==="estado"){
    const porIngreso = FI.baseEntrega==="ingreso";
    const SALIDAS=/entregad|dado de baja|no autorizado/i;
    const entregadasOrd = DB.ordenes.filter(o=>{
      if(o.vigente===false) return false;
      if(!SALIDAS.test(o.estado||"")) return false;
      const ref = porIngreso ? o.fechaIngreso : (o.fechaEntrega || o.fechaIngreso);
      if(ref<d || ref>h) return false;
      if(FI.cuarto && !cuartosDeOrden(o).has(FI.cuarto)) return false;
      return true;
    });
    const idsEnt=new Set(entregadasOrd.map(o=>o.id));
    DB.componentes.filter(c=>idsEnt.has(c.ordenId) && (!FI.cuarto || c.cuartoId===FI.cuarto)).forEach(c=>{
      const k=nom(DB.tiposComponente,c.tipoComponenteId)+"|"+nom(DB.tipologias,c.tipologiaId,"Sin tipología")+"|"+nom(DB.cuartos,c.cuartoId);
      entMatriz[k]=(entMatriz[k]||0)+(+c.cantidad||0);
      undEnt+=(+c.cantidad||0);
    });
    var ordsEnt=entregadasOrd.length;
  } else {
    Object.entries(porComp).forEach(([cid,q])=>{
      const c=byId(DB.componentes,cid); if(!c) return;
      const tope=+c.cantidad||0;
      const real=Math.min(q, tope||q);
      if(q>real) recortadas+=q-real;
      undEnt+=real;
      const k=nom(DB.tiposComponente,c.tipoComponenteId)+"|"+nom(DB.tipologias,c.tipologiaId,"Sin tipología")+"|"+nom(DB.cuartos,c.cuartoId);
      entMatriz[k]=(entMatriz[k]||0)+real;
    });
    var ordsEnt=0;
  }
  const mapaCx=(DB.meta.conexion&&DB.meta.conexion.mapa)||{};
  const hayMotivo=Object.values(mapaCx).indexOf("motivo")>=0 || DB.ordenes.some(o=>o.motivo);
  const sinTip = comps.filter(c=>!c.tipologiaId).reduce((a,c)=>a+(+c.cantidad||0),0);
  const sinMotivo = ords.filter(o=>!o.motivo).length;

  const gar=ords.filter(o=>/garant/i.test(o.motivo||"")).length;
  const pendRep=ords.filter(o=>/repuesto/i.test(o.estado||"")).length;
  /* "No autorizado" también contiene la palabra "autoriza": contarlo como
     pendiente de autorización inflaba la cifra y mezclaba una orden cerrada
     con las que siguen esperando al cliente. */
  const pendAut=ords.filter(o=>/autoriza/i.test(o.estado||"") && !/^no\s+autoriz/i.test((o.estado||"").trim())).length;
  const entregadas=ords.filter(o=>cerr.has(o.estado)).length;

  const barras=(lista,total,clase)=>{ const max=Math.max(1,...lista.map(x=>x[1]));
    return lista.length?`<div class="bars">${lista.map(([k,v])=>`<div class="bar">
      <div class="t">${esc(k)}</div><div class="track"><i class="${clase||""}" style="width:${v/max*100}%"></i></div>
      <div class="n">${v}${total?" · "+Math.round(v/total*100)+"%":""}</div></div>`).join("")}</div>`
      :`<div class="empty">Sin datos en el rango.</div>`; };

  /* matriz componente × tipología */
  const matriz={};
  comps.forEach(c=>{
    const cu=nom(DB.cuartos,cuartoDeComponente(c)), tc=nom(DB.tiposComponente,c.tipoComponenteId), tp=nom(DB.tipologias,c.tipologiaId,"Sin tipología");
    matriz[cu]=matriz[cu]||{}; matriz[cu][tc]=matriz[cu][tc]||{};
    matriz[cu][tc][tp]=(matriz[cu][tc][tp]||0)+(+c.cantidad||0);
  });

  return `
  <div class="card noprint"><div class="body"><div class="row">
    <label class="f"><span>Ingresos desde</span><input type="date" id="id1" value="${d}"></label>
    <label class="f"><span>Hasta</span><input type="date" id="id2" value="${h}"></label>
    <label class="f"><span>Cuarto</span><select id="ic"><option value="">Todos</option>
      ${DB.cuartos.map(c=>`<option value="${c.id}" ${FI.cuarto===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select></label>
  </div>
  <div style="flex:0 0 auto"><button class="btn sm" data-irng="semana">Esta semana</button>
    <button class="btn sm" data-irng="pasada">Semana pasada</button>
    <button class="btn sm" data-irng="mes">Este mes</button>
    <button class="btn primary sm" id="imprimirIng">Imprimir / PDF</button></div>
  <p class="hint" style="margin-top:9px">Se cuenta por <b>fecha de ingreso</b> de la orden, no por cuándo se trabajó.</p></div></div>

  ${hayMotivo?"":`<div class="card"><div class="body" style="padding:11px 14px">
    <div class="hint"><b>Sin columna de motivo de ingreso.</b> Los indicadores de garantía y de motivo están apagados.
    Si quieres activarlos, agrega a PROGRAMACION_LABORATORIO una columna llamada <span class="mono">MOTIVO DE INGRESO</span>
    con valores como Reparación, Garantía, Diagnóstico o Mantenimiento, y sincroniza. El resto de indicadores funciona igual sin ella.</div></div></div>`}
  ${(()=>{
    const chuecos={};
    comps.forEach(c=>{ const o=byId(DB.ordenes,c.ordenId);
      if(o && o.cuartoDeclaradoId && c.cuartoId && o.cuartoDeclaradoId!==c.cuartoId){
        const k=nom(DB.tiposComponente,c.tipoComponenteId)+"|"+nom(DB.cuartos,c.cuartoId)+"|"+nom(DB.cuartos,o.cuartoDeclaradoId);
        chuecos[k]=(chuecos[k]||0)+(+c.cantidad||0);
      }});
    const lista=Object.entries(chuecos);
    if(!lista.length) return "";
    return `<div class="card" style="border-color:#f3ccb0"><div class="body" style="padding:11px 14px">
      <div style="color:var(--signal);font-size:13.5px"><b>Hay componentes configurados en otra sala.</b>
      La hoja dice que la orden entró a un cuarto, pero el tipo de componente está creado en otro.
      Corrígelo en <b>Maestros → Tipos de componente</b>:<br>
      ${lista.map(([k,v])=>{const [tc,cuComp,cuOrden]=k.split("|");
        return `· <b>${esc(tc)}</b> está en ${esc(cuComp)} pero sus ${v} unidades entraron a ${esc(cuOrden)}`;}).join("<br>")}
      </div></div></div>`;})()}
  ${sinTip?`<div class="card" style="border-color:#ecd6a4"><div class="body" style="padding:11px 14px">
    <div style="color:var(--amber);font-size:13.5px"><b>${sinTip} unidades quedaron sin tipología.</b>
    Su celda TIPO venía vacía o no se pudo resolver. Ábrelas en <b>Órdenes</b> y asígnala, o déjalas así si de verdad no aplica.</div></div></div>`:""}

  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="l">Órdenes ingresadas</div><div class="v">${ords.length}</div><div class="h">${fmtFecha(d)} → ${fmtFecha(h)}</div></div>
    <div class="kpi"><div class="l">Componentes recibidos</div><div class="v">${und}</div><div class="h">${comps.length} líneas</div></div>
    <div class="kpi"><div class="l">Clientes distintos</div><div class="v">${new Set(ords.map(o=>o.cliente).filter(Boolean)).size}</div>
      <div class="h">${porCliente.length?esc(porCliente[0][0])+" encabeza":"—"}</div></div>
    ${hayMotivo?`<div class="kpi ${gar?"alert":""}"><div class="l">Garantías</div><div class="v">${gar}</div>
      <div class="h">${ords.length?Math.round(gar/ords.length*100):0}% de lo ingresado</div></div>`
    :`<div class="kpi"><div class="l">Componentes por orden</div><div class="v">${ords.length?(und/ords.length).toFixed(1):0}</div>
      <div class="h">promedio del período</div></div>`}
  </div>
  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi ${pendRep?"alert":""}"><div class="l">Pendiente repuestos</div><div class="v">${pendRep}</div><div class="h">bloqueadas</div></div>
    <div class="kpi"><div class="l">Pendiente autorización</div><div class="v">${pendAut}</div><div class="h">esperando al cliente</div></div>
    <div class="kpi"><div class="l">Ya cerradas</div><div class="v">${entregadas}</div>
      <div class="h">${ords.length?Math.round(entregadas/ords.length*100):0}% del ingreso</div></div>
    <div class="kpi"><div class="l">Aún abiertas</div><div class="v">${ords.length-entregadas}</div><div class="h">en el laboratorio</div></div>
  </div>

  <div class="card" style="border-color:#bcd0e2"><header><h2>Lo que INGRESÓ · componentes recibidos</h2>
    <span class="sub mono">${und} unidades</span>
    <div class="push"><button class="btn sm" id="csvIng">Exportar CSV</button></div></header>
    <div class="body">
    ${(()=>{
      const porTipo={};
      comps.forEach(c=>{ const k=nom(DB.tiposComponente,c.tipoComponenteId); porTipo[k]=(porTipo[k]||0)+(+c.cantidad||0); });
      const lista=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
      if(!lista.length) return "";
      const mx=Math.max(1,...lista.map(x=>x[1]));
      return `<div class="eyebrow" style="margin:0 0 8px">Total INGRESADO por componente · ${und} unidades</div>
      <div class="bars" style="margin-bottom:16px">${lista.map(([k,v])=>`<div class="bar">
        <div class="t">${esc(k)}</div><div class="track"><i style="width:${v/mx*100}%"></i></div>
        <div class="n">${v} und · ${Math.round(v/und*100)}%</div></div>`).join("")}</div>
