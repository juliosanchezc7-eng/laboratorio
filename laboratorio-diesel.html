    ${Object.keys(matriz).length?Object.entries(matriz).map(([cu,tipos])=>`
      <div class="eyebrow" style="margin:14px 0 6px">${esc(cu)}</div>
      <div class="tw"><table><thead><tr><th>Componente</th><th>Tipología</th><th class="num">Unidades</th></tr></thead><tbody>
      ${Object.entries(tipos).map(([tc,tps])=>Object.entries(tps).sort((a,b)=>b[1]-a[1])
        .map(([tp,q],i)=>`<tr><td>${i===0?`<b>${esc(tc)}</b>`:""}</td><td>${esc(tp)}</td><td class="num mono">${q}</td></tr>`).join("")).join("")}
      </tbody></table></div>`).join(""):`<div class="empty">Sin componentes en el rango.</div>`}
    </div></div>

  ${(()=>{ const SAL=/entregad|dado de baja|no autorizado/i;
    const g={};
    DB.ordenes.forEach(o=>{
      if(o.vigente===false || !SAL.test(o.estado||"")) return;
      const ref = FI.baseEntrega==="ingreso" ? o.fechaIngreso : (o.fechaEntrega||o.fechaIngreso);
      if(ref<d || ref>h) return;
      if(FI.cuarto && !cuartosDeOrden(o).has(FI.cuarto)) return;
      const k=(o.estado||"").trim(); g[k]=(g[k]||0)+1;
    });
    const e=Object.entries(g); if(!e.length) return "";
    return `<div class="card"><header><h2>Cómo salieron</h2><span class="sub mono">${e.reduce((a,x)=>a+x[1],0)} órdenes</span></header>
    <div class="body"><p class="hint" style="margin-top:0">Las tres salen del laboratorio, pero significan cosas distintas para el cliente.</p>
    <div class="tw"><table><thead><tr><th>Estado</th><th class="num">Órdenes</th></tr></thead><tbody>
    ${e.sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num mono">${v}</td></tr>`).join("")}
    </tbody></table></div></div></div>`;})()}

  <div class="card" style="border-color:#b6ddc6"><header><h2>Lo que SALIÓ · entregas del período</h2>
    <span class="sub mono">${undEnt} unidades</span>
    <span class="sub tag">según NUEVA PROGRAMACIÓN</span></header>
    <div class="body">
      ${modoEnt==="estado"
        ? `<div class="seg" style="margin-bottom:10px">
             <button data-baseent="entrega" class="${FI.baseEntrega!=="ingreso"?"on":""}">Por fecha de ENTREGA</button>
             <button data-baseent="ingreso" class="${FI.baseEntrega==="ingreso"?"on":""}">Por fecha de INGRESO</button></div>
           <p class="hint" style="margin-top:0">${FI.baseEntrega==="ingreso"
             ? "<b>Órdenes que INGRESARON en el período y ya están entregadas</b>, sin importar cuándo salieron. Es el método que usabas antes."
             : "<b>Lo que SALIÓ en el período</b>, por su fecha de entrega. Una orden de julio entregada el 3 de agosto cuenta en agosto."}</p>
           <p class="hint" style="margin-top:0"><b>Modo histórico.</b> ${ordsEnt} órdenes en estado <b>Entregado</b>${DB.ordenes.some(o=>o.fechaEntrega)?", por su fecha de entrega":", usando la fecha de ingreso porque tu hoja no trae fecha de entrega"}.<br>
           Sirve para meses sin registro de técnicos. Su límite: una orden entregada a medias no aparece hasta que se cierre completa.<br>
           <b>No confundir con “componentes recibidos”:</b> aquí solo está lo que salió, y una orden que entró en julio y se entregó en agosto cuenta en agosto.
           ${DB.ordenes.some(o=>o.fechaEntrega)?"":`<br><b>Si tu hoja tiene columna de fecha de entrega</b>, asígnala en Conexión → Probar conexión y el conteo será exacto.`}</p>`
        : `<p class="hint" style="margin-top:0">Se cuenta lo que el técnico registró como entregado, no el estado de la orden.
           Si de 6 inyectores se entregaron 4, esos 4 cuentan aunque la orden siga abierta.<br>
           Nunca se cuenta más de lo que trajo la orden según PROGRAMACION_LABORATORIO.<br>
      <b>Este número es menor que “componentes recibidos” y está bien:</b> lo que sigue en el laboratorio, lo no autorizado y lo que se entregó el mes siguiente no cuentan aquí.
           ${recortadas?`<b style="color:var(--signal)">Se recortaron ${recortadas} unidades registradas de más.</b>`:""}</p>`}
      ${(()=>{ /* titular: total por componente, sin abrir por tipología */
        const porTipo={};
        Object.entries(entMatriz).forEach(([k,v])=>{ const [tc]=k.split("|"); porTipo[tc]=(porTipo[tc]||0)+v; });
        const lista=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
        if(!lista.length) return "";
        const mx=Math.max(1,...lista.map(x=>x[1]));
        return `<div class="eyebrow" style="margin:4px 0 8px">Total ENTREGADO por componente · ${undEnt} unidades</div>
        <div class="bars" style="margin-bottom:16px">${lista.map(([k,v])=>`<div class="bar">
          <div class="t">${esc(k)}</div><div class="track"><i style="width:${v/mx*100}%"></i></div>
          <div class="n">${v} und · ${Math.round(v/undEnt*100)}%</div></div>`).join("")}</div>
        <div class="eyebrow" style="margin:0 0 8px">Detalle por tipología</div>`;})()}
      ${Object.keys(entMatriz).length?(()=>{
        /* El componente se nombra una vez y debajo van sus tipologías. */
        const m={};
        Object.entries(entMatriz).forEach(([k,v])=>{ const [tc,tp,cu]=k.split("|");
          m[cu]=m[cu]||{}; m[cu][tc]=m[cu][tc]||{}; m[cu][tc][tp]=(m[cu][tc][tp]||0)+v; });
        const suma=o=>Object.values(o).reduce((x,y)=>x+y,0);
        return Object.entries(m).map(([cu,tipos])=>`
          <div class="eyebrow" style="margin:14px 0 6px">${esc(cu)}</div>
          <div class="tw"><table><thead><tr><th>Componente</th><th>Tipología</th><th class="num">Entregadas</th></tr></thead><tbody>
          ${Object.entries(tipos).sort((a,b)=>suma(b[1])-suma(a[1]))
            .map(([tc,tps])=>Object.entries(tps).sort((a,b)=>b[1]-a[1])
              .map(([tp,q],i)=>`<tr><td>${i===0?`<b>${esc(tc)}</b>`:""}</td><td>${esc(tp)}</td><td class="num mono">${q}</td></tr>`).join("")).join("")}
          </tbody></table></div>`).join("");})()
      :`<div class="empty">${modoEnt==="estado"
          ? "Ninguna orden del rango quedó en estado Entregado."
          : "Todavía no hay entregas registradas en este rango.<br><br>Se contarán cuando los técnicos marquen <b>Alistamiento y entrega</b> con las unidades que salieron.<br>Para meses anteriores, cambia a <b>Por estado de la hoja</b>."}</div>`}
    </div></div>

  <div class="grid g2">
    ${hayMotivo?`<div class="card"><header><h2>Motivo de ingreso</h2></header><div class="body">${barras(porMotivo,ords.length)}</div></div>`:""}
    <div class="card"><header><h2>Estado actual</h2></header><div class="body">${barras(porEstado,ords.length,"b")}</div></div>
    <div class="card"><header><h2>Clientes con más ingresos</h2></header><div class="body">${barras(porCliente,ords.length)}</div></div>
    <div class="card"><header><h2>Por cuarto</h2></header><div class="body">
      ${porCuarto.length?`<div class="bars">${(()=>{const mx=Math.max(1,...porCuarto.map(x=>x.und));
        return porCuarto.map(x=>`<div class="bar"><div class="t">${esc(x.cu.nombre)}</div>
        <div class="track"><i style="width:${x.und/mx*100}%"></i></div>
        <div class="n">${x.und} und · ${x.n} OT</div></div>`).join("");})()}</div>`:`<div class="empty">Sin datos.</div>`}
    </div></div>
  </div>

  ${(()=>{
    const gars=ords.filter(o=>/garant/i.test(o.motivo||""));
    if(!gars.length) return "";
    const aplica=o=>{ const g=sinTildes(o.garantia||""); if(!g) return "sin definir";
      if(/^no/.test(g)||/no aplica/.test(g)) return "No aplica";
      if(/aplica|^si/.test(g)) return "Sí aplica";
      return o.garantia; };
    const si=gars.filter(o=>aplica(o)==="Sí aplica"), no=gars.filter(o=>aplica(o)==="No aplica");
    const pend=gars.filter(o=>aplica(o)==="sin definir");
    const estSi={}; si.forEach(o=>{ const e=o.estado||"Sin estado"; estSi[e]=(estSi[e]||0)+1; });
    const listaEst=Object.entries(estSi).sort((a,b)=>b[1]-a[1]);
    const maxE=Math.max(1,...listaEst.map(x=>x[1]));
    const undG=DB.componentes.filter(c=>gars.some(o=>o.id===c.ordenId)).reduce((a,c)=>a+(+c.cantidad||0),0);
    return `<div class="card" style="border-color:#bcd0e2"><header><h2>Garantías</h2>
      <span class="sub mono">${gars.length} órdenes · ${undG} componentes</span></header>
      <div class="body">
      <p class="hint" style="margin-top:0">De lo que ingresó como <b>garantía</b>: cuántas procedieron y en qué va cada una.
      El motivo dice por qué entró; la columna GARANTÍA dice si aplicó; el estado dice en qué va el trámite.</p>
      <div class="kpis" style="margin-bottom:14px">
        <div class="kpi"><div class="l">Garantías ingresadas</div><div class="v">${gars.length}</div>
          <div class="h">${ords.length?Math.round(gars.length/ords.length*100):0}% del ingreso</div></div>
        <div class="kpi"><div class="l">Sí aplicaron</div><div class="v">${si.length}</div>
          <div class="h">${gars.length?Math.round(si.length/gars.length*100):0}% de las garantías</div>
          <div class="gauge"><i class="ok" style="width:${gars.length?si.length/gars.length*100:0}%"></i></div></div>
        <div class="kpi"><div class="l">No aplicaron</div><div class="v">${no.length}</div>
          <div class="h">pasan a autorización del cliente</div></div>
        <div class="kpi ${pend.length?"alert":""}"><div class="l">Sin definir</div><div class="v">${pend.length}</div>
          <div class="h">falta decidir si aplica</div></div>
      </div>
      ${(()=>{
        const bloque=(titulo,lista,color,nota)=>{
          if(!lista.length) return "";
          const g={}; lista.forEach(o=>{ const e=o.estado||"Sin estado"; g[e]=(g[e]||0)+1; });
          const ent=Object.entries(g).sort((a,b)=>b[1]-a[1]);
          const mx=Math.max(1,...ent.map(x=>x[1]));
          const cerradasG=lista.filter(o=>cerrados().has(o.estado)).length;
          return `<div class="card" style="margin-bottom:0"><header><h2>${titulo}</h2>
            <span class="sub mono">${lista.length} · ${cerradasG} ya cerradas</span></header>
            <div class="body">
              ${nota?`<p class="hint" style="margin-top:0">${nota}</p>`:""}
              <div class="bars">${ent.map(([e,v])=>`<div class="bar">
                <div class="t">${esc(e)}</div>
                <div class="track"><i class="${color}" style="width:${v/mx*100}%"></i></div>
                <div class="n">${v} · ${Math.round(v/lista.length*100)}%</div></div>`).join("")}</div>
            </div></div>`;
        };
        return `<div class="grid g2" style="margin-bottom:14px">
          ${bloque("En qué van las que SÍ aplicaron", si, "", "Se reparan de inmediato: aquí no debería haber nada esperando autorización.")}
          ${bloque("En qué van las que NO aplicaron", no, "b", "Dependen de que el cliente autorice. Lo que lleve semanas en “pendiente autorización” es plata detenida.")}
          ${bloque("Las que están sin definir", pend, "b", "Aún no se ha dictaminado si la garantía procede.")}
        </div>`;
      })()}
      <div class="tw" style="max-height:300px;overflow:auto"><table>
        <thead><tr><th>OT</th><th>Cliente</th><th>Ingreso</th><th>¿Aplica?</th><th>Estado actual</th></tr></thead><tbody>
        ${gars.slice().sort((a,b)=>(a.fechaIngreso||"").localeCompare(b.fechaIngreso||"")).map(o=>{
          const ap=aplica(o);
          return `<tr><td class="mono">${esc(o.ot)}</td><td>${esc(o.cliente||"—")}</td>
          <td class="mono">${fmtFecha(o.fechaIngreso)}</td>
          <td>${ap==="Sí aplica"?'<span class="chip c-verde">Sí aplica</span>'
              :ap==="No aplica"?'<span class="chip c-ambar">No aplica</span>'
              :'<span class="chip c-gris">sin definir</span>'}</td>
          <td>${chipEstado(o.estado)}</td></tr>`;}).join("")}
      </tbody></table></div>
      </div></div>`;})()}
`;
}
function pIngresos(){
  $("#id1").onchange=e=>{FI.desde=e.target.value;render();};
  $("#id2").onchange=e=>{FI.hasta=e.target.value;render();};
  $("#ic").onchange=e=>{FI.cuarto=e.target.value;render();};
  document.querySelectorAll("[data-irng]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.irng, hy=hoyISO();
    if(t==="semana"){ const l=semanaDe(hy); FI.desde=l; FI.hasta=rangoSemana(l)[1]; }
    if(t==="pasada"){ const l=new Date(semanaDe(hy)+"T12:00:00"); l.setDate(l.getDate()-7);
      const li=isoLocal(l); FI.desde=li; FI.hasta=rangoSemana(li)[1]; }
    if(t==="mes"){ FI.desde=hy.slice(0,8)+"01"; FI.hasta=hy; }
    render();
  });
  document.querySelectorAll("[data-modoent]").forEach(b=>b.onclick=()=>{ FI.modoEntrega=b.dataset.modoent; render(); });
  document.querySelectorAll("[data-baseent]").forEach(b=>b.onclick=()=>{ FI.baseEntrega=b.dataset.baseent; render(); });
  $("#imprimirIng").onclick=()=>window.print();
  $("#csvIng").onclick=()=>{
    const [d,h]=rangoIngresos();
    const ords=DB.ordenes.filter(o=>o.fechaIngreso>=d && o.fechaIngreso<=h);
    const ids=new Set(ords.map(o=>o.id));
    const hh=["OT","Cliente","Fecha_ingreso","Motivo","Estado","Cuarto","Componente","Tipologia","Unidades"];
    const rows=[];
    DB.componentes.filter(c=>ids.has(c.ordenId)).forEach(c=>{
      const o=byId(DB.ordenes,c.ordenId);
      rows.push([o.ot,o.cliente,o.fechaIngreso,o.motivo||"",o.estado,nom(DB.cuartos,c.cuartoId),
        nom(DB.tiposComponente,c.tipoComponenteId),nom(DB.tipologias,c.tipologiaId,""),c.cantidad]);
    });
    bajar("ingresos_"+hoyISO()+".csv",[hh,...rows].map(r=>r.map(csvCell).join(",")).join("\n"));
  };
}

/* =========================================================================
   VISTA 4 · INFORME SEMANAL (para presentar / imprimir a PDF)
   ========================================================================= */
function vSemanal(){
  const [d,h]=rangoActivo();
  const rs=regsFiltrados();
  const real=rs.reduce((a,r)=>a+r.minutos,0), std=rs.reduce((a,r)=>a+r.minutosStd,0);
  const efi=real?Math.round(std/real*100):0;
  const capDia=capacidadRango(d,h);
  const activos=tecnicosQueCuentan(d,h,FD.cuarto,FD.tecnico);
  const minNoProd=minutosNoProductivos(rs);
  const cap=Math.max(0, capacidadEquipoRango(d,h,FD.cuarto,FD.tecnico) - minNoProd);
  const ocup=cap?Math.round(real/cap*100):0;

  /* Piezas distintas tocadas en el periodo: cada componente aporta la cantidad
     que dice la hoja, una sola vez, sin importar cuántas actividades ni cuántos
     técnicos pasaron por él. */
  const piezasSemana = (()=>{
    const ids=new Set(rs.filter(r=>r.componenteId).map(r=>r.componenteId));
    let t=0; ids.forEach(id=>{ const c=byId(DB.componentes,id); if(c) t+=+c.cantidad||0; });
    return t;
  })();

  const tec=activos.map(t=>{
    const rr=rs.filter(r=>r.tecnicoId===t.id);
    const m=rr.reduce((a,x)=>a+x.minutos,0), s=rr.reduce((a,x)=>a+x.minutosStd,0);
    /* Piezas distintas que tocó, según PROGRAMACION. Antes buscaba dos
       actividades que no existen en el catálogo y la columna salía vacía. */
    const suyos = new Set(rr.filter(r=>r.componenteId).map(r=>r.componenteId));
    let u=0; suyos.forEach(id=>{ const c=byId(DB.componentes,id); if(c) u+=+c.cantidad||0; });
    const np=minutosNoProductivos(rr);
    const capReal=capacidadTecnicoRango(t.id,d,h);        /* su jornada, no la del grupo */
    const capT=Math.max(1, capReal-np);
    const aus=capDia-capReal;                              /* lo que perdió por ausencia */
    return {t,m,s,u,np,aus,capReal, ex:minutosExtra(t.id,d,h),
      oc:capReal?Math.round(m/capReal*100):0};
  }).sort((a,b)=>b.m-a.m);

  const ritmos = ritmoPorTecnico(rs);
  const av = avancePeriodo(d, h, FD.cuarto, FD.tecnico);
  const piezasAvanzaron = av.avanzaron.reduce((a,x)=>a+x.piezas,0);
  const piezasQuietas   = av.quietas.reduce((a,x)=>a+(+x.c.cantidad||0),0);
  /* Solo lo que salió DENTRO del periodo. Antes mostraba el histórico completo
     (622 de 771), que no dice nada sobre la semana que se está presentando. */
  const entregadas = DB.ordenes.filter(o=>{
    if(o.vigente===false) return false;
    if(!/entregad/i.test(o.estado||"")) return false;
    const ref = o.fechaEntrega || o.fechaIngreso;
    if(!ref || ref<d || ref>h) return false;
    if(FD.cuarto && !cuartosDeOrden(o).has(FD.cuarto)) return false;
    return true;
  }).length;
  /* Salieron sin repararse: no autorizadas o dadas de baja. */
  const salieronSinReparar = DB.ordenes.filter(o=>{
    if(o.vigente===false) return false;
    if(!/dado de baja|no autorizado/i.test(o.estado||"")) return false;
    const ref = o.fechaEntrega || o.fechaIngreso;
    if(!ref || ref<d || ref>h) return false;
    if(FD.cuarto && !cuartosDeOrden(o).has(FD.cuarto)) return false;
    return true;
  }).length;
  const novs={}; rs.forEach(r=>{ if(r.tipoNovedad){ (novs[r.tipoNovedad]=novs[r.tipoNovedad]||[]).push(r); } });

  return `
  <div class="card noprint"><div class="body"><div class="row">
    <label class="f"><span>Desde</span><input type="date" id="dd" value="${d}"></label>
    <label class="f"><span>Hasta</span><input type="date" id="dh" value="${h}"></label>
    <div style="flex:0 0 auto;align-self:end;margin-bottom:11px">
      <button class="btn sm" data-rng="semana">Esta semana</button>
      <button class="btn sm" data-rng="pasada">Semana pasada</button>
      <button class="btn primary sm" id="imprimir">Imprimir / PDF</button></div>
  </div><p class="hint">Imprime a PDF y tienes la presentación semanal lista. Cada bloque es una diapositiva.</p></div></div>

  <div class="card"><header>
      <h2>1 · El flujo del laboratorio</h2>
      <span class="sub mono">${fmtFecha(d)} → ${fmtFecha(h)}</span></header>
    <div class="body">
      <p class="hint" style="margin-top:0">Cómo se movió el trabajo. Estas cifras son del laboratorio, no de una persona:
      una orden sale cuando llega el repuesto y el cliente autoriza, no solo cuando el técnico termina.</p>
      <div class="kpis">
        <div class="kpi"><div class="l">Piezas que avanzaron</div><div class="v">${av.avanzaron.reduce((a,x)=>a+x.piezas,0)}</div>
          <div class="h">${av.avanzaron.length} componente(s) subieron de fase</div></div>
        <div class="kpi"><div class="l">Piezas tocadas</div><div class="v">${piezasSemana}</div>
          <div class="h">en ${new Set(rs.map(r=>r.ordenId)).size} órdenes</div></div>
        <div class="kpi"><div class="l">OT entregadas</div><div class="v">${entregadas}</div>
          <div class="h">${(()=>{
            const viejas = DB.ordenes.filter(o=>o.vigente!==false && /entregad/i.test(o.estado||"")
              && (o.fechaEntrega||o.fechaIngreso) >= d && (o.fechaEntrega||o.fechaIngreso) <= h
              && o.fechaIngreso && o.fechaIngreso < d).length;
            return viejas ? `${viejas} venían de antes del periodo` : "en el periodo";
          })()}</div></div>
        <div class="kpi ${av.quietas.length?"alert":""}"><div class="l">Piezas quietas</div>
          <div class="v">${av.quietas.reduce((a,x)=>a+(+x.piezas||0),0)}</div>
          <div class="h">${(()=>{
            if(!av.quietas.length) return "nada atascado";
            const conDias = av.quietas.filter(x=>x.dias!=null);
            return conDias.length ? `la más vieja lleva ${conDias[0].dias} día(s)`
                                  : `${av.quietas.length} componente(s) sin movimiento`;
          })()}</div></div>
      </div>
      ${salieronSinReparar?`<p class="hint" style="margin:9px 0 0">Además, <b>${salieronSinReparar}</b> orden(es) salieron sin repararse: dadas de baja o no autorizadas.</p>`:""}
    </div></div>

  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><header><h2>2 · Qué se movió</h2>
      <span class="sub">piezas que subieron de fase en el periodo</span></header><div class="body">
      <p class="hint" style="margin-top:0">El tiempo dice cuánto se gastó; esto dice qué se logró.
      Para que una pieza pase de Diagnóstico a Reparación hay que haber hecho el trabajo, y la cantidad
      la topa PROGRAMACION: es el número que nadie puede inflar.</p>
      ${av.avanzaron.length?`<div class="tw" style="max-height:300px;overflow:auto"><table>
        <thead><tr><th>OT</th><th>Componente</th><th class="num">Piezas</th><th>Pasó de</th><th>a</th></tr></thead>
        <tbody>${av.avanzaron.slice(0,40).map(x=>`<tr>
          <td class="mono">${esc(x.o?x.o.ot:"—")}</td>
          <td>${esc(nom(DB.tiposComponente,x.c.tipoComponenteId))}</td>
          <td class="num">${x.piezas}</td>
          <td class="tag">${NOMBRE_FASE[x.de]}</td>
          <td><span class="chip ${x.a===4?"c-verde":"c-azul"}">${NOMBRE_FASE[x.a]}</span></td></tr>`).join("")}
        </tbody></table></div>`:`<div class="empty">Ninguna pieza cambió de fase en el periodo.</div>`}
      ${Object.keys(av.porTecnico).length?`
        <div class="eyebrow" style="margin:12px 0 6px">Quién las hizo avanzar</div>
        <div class="bars">${Object.entries(av.porTecnico).sort((a,b)=>b[1].piezas-a[1].piezas).map(([id,x])=>`
          <div class="bar"><div class="t">${esc(nom(DB.tecnicos,id))}</div>
            <div class="track"><i style="width:${Math.min(100,x.piezas/Math.max(1,piezasAvanzaron)*100)}%"></i></div>
            <div class="n">${x.piezas} pza · ${x.comps.size} comp.</div></div>`).join("")}</div>`:""}
    </div></div>

    <div class="card"><header><h2>3 · Qué está detenido</h2>
      <span class="sub">empezado y sin moverse en el periodo</span></header><div class="body">
      ${av.quietas.length?`<div class="tw" style="max-height:340px;overflow:auto"><table>
        <thead><tr><th>OT</th><th>Componente</th><th class="num">Piezas</th><th>Se quedó en</th><th>Estado en la hoja</th><th class="num">Días</th></tr></thead>
        <tbody>${av.quietas.slice(0,40).map(x=>`<tr>
          <td class="mono">${esc(x.o?x.o.ot:"—")}</td>
          <td>${esc(nom(DB.tiposComponente,x.c.tipoComponenteId))}</td>
          <td class="num">${x.c.cantidad}</td>
          <td class="tag">${NOMBRE_FASE[x.fase]}</td>
          <td>${x.o&&x.o.estado?`<span class="tag">${esc(x.o.estado)}</span>`:"—"}</td>
          <td class="num">${x.dias==null
            ? (x.fechaRara?`<span class="chip c-naranja" title="El registro tiene una fecha imposible: ${esc(x.desde)}">fecha mal escrita</span>`:"—")
            : `<span class="chip ${x.dias>15?"c-naranja":x.dias>7?"c-ambar":""}">${x.dias}</span>`}</td></tr>`).join("")}
        </tbody></table></div>
        <p class="hint" style="margin-top:9px">Solo aparecen órdenes que <b>siguen abiertas según PROGRAMACION</b>.
        Si la hoja dice Entregado, Dado de baja o No autorizado, la pieza ya salió del laboratorio y no está detenida,
        aunque nadie le haya registrado la actividad de entrega.<br>
        La columna <b>Estado en la hoja</b> suele explicar la demora: casi todo lo que lleva más de quince días
        está en Pendiente autorización o Pendiente repuestos. Eso no lo resuelve el técnico.</p>`
        :`<div style="border:1px solid #b6ddc6;background:#eaf6ef;color:var(--green);padding:10px 12px;border-radius:var(--r);font-size:13.5px"><b>Nada detenido.</b> Todo lo empezado se movió en el periodo.</div>`}
    </div></div>
  </div>

  <div class="card"><header><h2>4 · Qué hizo cada técnico</h2>
    <span class="sub">lo que movió, no lo que declaró</span></header><div class="body">
    <p class="hint" style="margin-top:0">
      <b>Piezas que movió</b> es la primera columna a propósito: son las que subieron de fase gracias a él.
      Es lo único que no se puede escribir sin haberlo hecho — la cantidad la topa PROGRAMACION y una fase
      se alcanza o no se alcanza. Alguien puede declarar sus ocho horas; no puede declarar que una bomba
      pasó a reparación si no la reparó.<br>
      <b>Ritmo</b> compara sus minutos por unidad contra la mediana de sus compañeros en la misma actividad
      y el mismo componente. <b>1.00</b> es ir al paso del cuarto; <b>1.40</b> es tardar 40% más.
      No hay tiempo estándar: la referencia sale del propio grupo, así que si todos se demoran más este mes,
      la referencia se mueve con ellos. Se calcula solo donde al menos dos personas hicieron el mismo trabajo.<br>
      <b>Oportunidad</b> es qué parte registró el mismo día. Quien llena la semana el viernes está recordando,
      no midiendo: mira ese número antes de leer los demás.
    </p>
    <div class="tw"><table>
    <thead><tr><th>Técnico</th><th class="num">Piezas que movió</th><th class="num">Piezas tocadas</th><th class="num">Ritmo</th><th class="num">Mismo día</th><th class="num">Horas</th><th>En qué se fue el tiempo</th></tr></thead>
    <tbody>${activos.map(t=>{
      const rr=rs.filter(r=>r.tecnicoId===t.id);
      const rep=repartoTiempo(rr,t);
      const ri=ritmos[t.id];
      const op=oportunidad(rr);
      /* Piezas distintas que tocó, según la hoja. */
      const suyos=new Set(rr.filter(r=>r.componenteId).map(r=>r.componenteId));
      let und=0; suyos.forEach(id=>{ const cc=byId(DB.componentes,id); if(cc) und+=+cc.cantidad||0; });
      /* Piezas que hizo avanzar de fase: el crédito del avance. */
      const movio=(av.porTecnico[t.id]||{}).piezas||0;
      const tot=rep.directo+rep.apoyo+rep.sinOrden+rep.noProd;
      const barra=(v,color)=>tot?`<div style="height:5px;background:${color};width:${v/tot*100}%"></div>`:"";
      return `<tr><td><b>${esc(t.nombre)}</b><br>
          <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;background:#eef1f3;margin-top:4px;max-width:170px">
            ${barra(rep.directo,"var(--prussian-2)")}${barra(rep.apoyo,"var(--green)")}${barra(rep.sinOrden,"var(--amber)")}${barra(rep.noProd,"#b8c4cd")}</div></td>
        <td class="num" style="font-size:16px;font-weight:600">${movio||"—"}</td>
        <td class="num">${und||"—"}</td>
        <td class="num">${ri&&ri.n>=3
          ? `<span class="chip ${ri.ritmo<=1.15?"c-verde":ri.ritmo<=1.5?"c-ambar":"c-naranja"}" title="${ri.n} trabajos comparables">${ri.ritmo.toFixed(2)}</span>`
          : `<span class="tag" title="${ri?ri.n:0} trabajos comparables · hacen falta 3">sin base</span>`}</td>
        <td class="num">${op.n?`<span class="chip ${op.pct>=80?"c-verde":op.pct>=50?"c-ambar":"c-naranja"}" title="demora mediana: ${op.demora} día(s)">${op.pct}%</span>`:"—"}</td>
        <td class="num">${tot?hrs(tot):"—"}</td>
        <td class="sub" style="font-size:11.5px">${[
            rep.directo?`${hrs(rep.directo)} directo`:"",
            rep.apoyo?`${hrs(rep.apoyo)} apoyo`:"",
            rep.sinOrden?`${hrs(rep.sinOrden)} sin orden`:"",
            rep.noProd?`${hrs(rep.noProd)} no prod.`:""
          ].filter(Boolean).join(" · ")||"—"}</td></tr>`;
    }).join("")}</tbody></table></div>
    <div class="cohorte-pie" style="display:flex;gap:15px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--ink-2)">
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--prussian-2);margin-right:5px"></i>Directo sobre piezas</span>
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--green);margin-right:5px"></i>Apoyo a otro cuarto</span>
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--amber);margin-right:5px"></i>Sin orden</span>
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#b8c4cd;margin-right:5px"></i>No productivo</span>
    </div>
  </div></div>

  <div class="card noprint"><header><h2>Jornada por técnico</h2>
    <span class="sub">control interno · no es material de reunión</span></header>
    <div class="body">
    <p class="hint" style="margin-top:0">Las horas sirven para saber cuánto toma un trabajo y para dimensionar el
    laboratorio, no para calificar a nadie: el tiempo lo declara cada quien y siempre cabe en la jornada.
    Esta tarjeta no se imprime.</p>
    <div class="tw"><table>
    <thead><tr><th>Técnico</th><th>Cuarto</th><th class="num">Horas</th><th class="num">Jornada</th><th class="num">Ausencia</th><th class="num">Extra</th><th class="num">No prod.</th><th class="num">Unidades</th><th class="num">Ocupación</th></tr></thead>
    <tbody>${tec.map(x=>`<tr><td><b>${esc(x.t.nombre)}</b></td><td>${esc(nom(DB.cuartos,x.t.cuartoId))}</td>
      <td class="num">${hrs(x.m)}</td>
      <td class="num">${hrs(x.capReal)}</td>
      <td class="num">${x.aus>0?`<span class="chip c-azul">−${hrs(x.aus)}</span>`:"—"}</td>
      <td class="num">${x.ex>0?`<span class="chip c-naranja">+${hrs(x.ex)}</span>`:"—"}</td>
      <td class="num">${x.np?hrs(x.np):"—"}</td>
      <td class="num">${x.u||"—"}</td>
      <td class="num">${x.oc?`<span class="chip ${x.oc>=90?"c-verde":x.oc>=65?"c-ambar":"c-naranja"}">${x.oc}%</span>`:"—"}</td></tr>`).join("")}
    <tr style="background:#f7f9fa"><td><b>TOTAL</b></td><td></td><td class="num"><b>${hrs(real)}</b></td><td class="num"><b>${hrs(cap)}</b></td><td class="num"><b>${hrs(minutosAusencia(d,h))}</b></td><td class="num"><b>${hrs(tec.reduce((a,x)=>a+x.ex,0))}</b></td><td class="num"><b>${hrs(minNoProd)}</b></td><td class="num"><b>${tec.reduce((a,x)=>a+x.u,0)}</b></td><td class="num"><b>${ocup}%</b></td></tr>
    </tbody></table></div></div>

  </div>

  <div class="card"><header><h2>5 · Por qué no avanzó lo que no avanzó</h2>
    <span class="sub">novedades que escribieron los técnicos</span></header><div class="body">
    ${Object.keys(novs).length?Object.entries(novs).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>`
      <div style="margin-bottom:11px"><span class="chip c-naranja">${esc(k)}</span> <b class="mono">${v.length}</b>
      <ul style="margin:5px 0 0 18px;padding:0;font-size:13px;color:var(--ink-2)">
        ${v.slice(0,6).map(r=>{const o=byId(DB.ordenes,r.ordenId);return `<li>OT ${o?esc(etiquetaOT(o)):(r.sinOrden?`<span class="tag">sin orden</span>`:(r.otTexto?`${esc(r.otTexto)} <span class="tag">ya no está en la hoja</span>`:`<span class="chip c-naranja">sin OT</span>`))} · ${esc(nom(DB.tecnicos,r.tecnicoId))}: ${esc(r.novedad||"sin detalle")}</li>`;}).join("")}
      </ul></div>`).join(""):`<div class="empty">Semana sin novedades reportadas.</div>`}
  </div></div>`;
}
function pSemanal(){
  $("#dd").onchange=e=>{FD.desde=e.target.value;render();};
  $("#dh").onchange=e=>{FD.hasta=e.target.value;render();};
  document.querySelectorAll("[data-rng]").forEach(b=>b.onclick=()=>{
    const hy=hoyISO();
    if(b.dataset.rng==="semana"){ const l=semanaDe(hy); FD.desde=l; FD.hasta=rangoSemana(l)[1]; }
    else { const l=new Date(semanaDe(hy)+"T12:00:00"); l.setDate(l.getDate()-7); const li=isoLocal(l); FD.desde=li; FD.hasta=rangoSemana(li)[1]; }
    render();
  });
  $("#imprimir").onclick=()=>window.print();
}

/* =========================================================================
   VISTA 5 · MAESTROS (todo editable)
   ========================================================================= */
let MSEC="tecnicos";
let RAPIDO=false;
let MFILTRO={cuarto:"", tipo:""};
function vMaestros(){
  /* Se retiran "Tiempos", "Tabla completa" y "Reparto": existían para mantener
     los tiempos estándar, que ya no se usan. El tiempo lo pone el técnico. */
  const secciones=[["tecnicos","Técnicos"],["cuartos","Cuartos"],["tiposComponente","Tipos de componente"],["tipologias","Tipologías"],["actividades","Actividades"],["listas","Listas"]];

  <div class="card"><header><h2>Maestros</h2><span class="sub">Todo lo que aparece en el registro sale de aquí</span></header>

  </div></div>
  ${({tecnicos:mTecnicos,cuartos:mCuartos,tiposComponente:mTipos,tipologias:mTipologias,actividades:mActividades,listas:mListas}[MSEC]||mTecnicos)()}`;
}
function mTecnicos(){
  return `<div class="card"><header><h2>Técnicos</h2><div class="push"><button class="btn sm primary" data-add="tecnico">+ Técnico</button></div></header>
  <div class="body"><p class="scroll-hint">Desliza la tabla a los lados para ver todas las columnas.</p><div class="tw"><table class="acc"><thead><tr><th>Nombre</th><th>Cuarto base</th><th>Rol</th><th>Clave</th><th>Activo</th><th>Acciones</th></tr></thead><tbody>
  ${DB.tecnicos.map(t=>`<tr>
    <td><input type="text" data-fld="tecnicos.${t.id}.nombre" value="${esc(t.nombre)}"></td>
    <td><select data-fld="tecnicos.${t.id}.cuartoId">${DB.cuartos.map(c=>`<option value="${c.id}" ${t.cuartoId===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select></td>
    <td><select data-fld="tecnicos.${t.id}.rol">
      <option value="tecnico" ${t.rol!=="coordinador"?"selected":""}>Técnico</option>
      <option value="coordinador" ${t.rol==="coordinador"?"selected":""}>Coordinación</option></select></td>
    <td style="width:110px"><input type="text" data-fld="tecnicos.${t.id}.pin" value="${esc(t.pin||"")}" placeholder="sin clave"></td>
    <td><input type="checkbox" data-chkfld="tecnicos.${t.id}.activo" ${t.activo!==false?"checked":""}></td>

async function modalAuditar(){
  const cx=DB.meta.conexion;
  if(!cx.modo){ toast("Configura primero la conexión"); return; }
  const d1 = await pedirTexto("Auditar cantidades","Desde (aaaa-mm-dd)", (FI.desde||rangoIngresos()[0]));
  if(d1===null) return;
  const d2 = await pedirTexto("Auditar cantidades","Hasta (aaaa-mm-dd)", (FI.hasta||rangoIngresos()[1]));
  if(d2===null) return;
  abrirModal("Auditoría contra la hoja", `<div class="empty">Comparando…</div>`);
  const pinta=h=>{ const b=document.querySelector(".modal:not(.dlg) .bd"); if(b) b.innerHTML=h; };
  try{
    const {filas}=await leerFuente();
    const mapa=cx.mapa||detectarMapa(filas[0]);
    const idx={}; Object.entries(mapa).forEach(([i,c])=>{ if(c!=="ignorar") idx[c]=+i; });
    const compCols=Object.entries(mapa).filter(([,v])=>String(v).indexOf("comp:")===0)
      .map(([i,v])=>({i:+i, tipoId:String(v).slice(5)}));
    /* lo que dice la hoja, sumando sin interpretar nada */
    const hoja={}; let filasUsadas=0;
    filas.slice(1).forEach(f=>{
      const ot=String(f[idx.ot]||"").trim(); if(!ot) return;
      const fIso = idx.fechaIngreso!==undefined ? normFechaEstricta(f[idx.fechaIngreso]) : "";
      if(!fIso || fIso<d1 || fIso>d2) return;
      const cuId = idx.cuarto!==undefined ? cuartoPorNombre(f[idx.cuarto]) : cuartoDeclarado(ot);
      if(FI.cuarto && cuId!==FI.cuarto) return;
      filasUsadas++;
      compCols.forEach(cc=>{
        const q=parseInt(String(f[cc.i]==null?"":f[cc.i]).replace(/[^\d]/g,""),10)||0;
        if(!q) return;
        /* se compara por FAMILIA: la columna INYECT. puede ser inyector
           Common Rail o unitario según el cuarto, y ambas cuentan igual. */
        const fam=familiaDe(nom(DB.tiposComponente,cc.tipoId));
        const k=ot+"|"+cuId+"|"+fam;
        hoja[k]=(hoja[k]||0)+q;
      });
    });
    /* lo que tiene la app */
    const app={}, detalle={};
    DB.ordenes.filter(o=>o.fechaIngreso>=d1 && o.fechaIngreso<=d2 && (!FI.cuarto || cuartosDeOrden(o).has(FI.cuarto)))
      .forEach(o=>{
        DB.componentes.filter(c=>c.ordenId===o.id).forEach(c=>{
          const fam=familiaDe(nom(DB.tiposComponente,c.tipoComponenteId));
          const k=o.ot+"|"+(o.cuartoDeclaradoId||c.cuartoId)+"|"+fam;
          app[k]=(app[k]||0)+(+c.cantidad||0);
          (detalle[k]=detalle[k]||{})[nom(DB.tiposComponente,c.tipoComponenteId)]=
            (detalle[k][nom(DB.tiposComponente,c.tipoComponenteId)]||0)+(+c.cantidad||0);
        });
      });
    const claves=[...new Set([...Object.keys(hoja),...Object.keys(app)])];
    const difs=claves.map(k=>({k, h:hoja[k]||0, a:app[k]||0})).filter(x=>x.h!==x.a);
    const totH={}, totA={};
    claves.forEach(k=>{ const tc=k.split("|")[2];
      totH[tc]=(totH[tc]||0)+(hoja[k]||0); totA[tc]=(totA[tc]||0)+(app[k]||0); });
    const tipos=[...new Set(claves.map(k=>k.split("|")[2]))].sort();
    pinta(`
      <p class="hint" style="margin-top:0">${filasUsadas} filas de la hoja entre ${fmtFecha(d1)} y ${fmtFecha(d2)}${FI.cuarto?" · solo "+esc(nom(DB.cuartos,FI.cuarto)):""}.
      El conteo de la hoja se hace sumando las celdas tal cual, sin interpretar nada.</p>
      <div class="eyebrow" style="margin-bottom:7px">Totales</div>
      <div class="tw" style="margin-bottom:14px"><table><thead><tr><th>Familia</th><th>Componentes que la app le asignó</th><th class="num">Hoja</th><th class="num">App</th><th class="num">Dif.</th></tr></thead><tbody>
      ${tipos.map(fam=>{const h=totH[fam]||0,a=totA[fam]||0;
        const nombres={};
        Object.keys(detalle).filter(k=>k.split("|")[2]===fam).forEach(k=>{
          Object.entries(detalle[k]).forEach(([n,q])=>{ nombres[n]=(nombres[n]||0)+q; }); });
        return `<tr><td>${esc(fam)}</td>
        <td class="tag">${Object.entries(nombres).sort((x,y)=>y[1]-x[1]).map(([n,q])=>esc(n)+" ("+q+")").join(" · ")||"—"}</td>
        <td class="num mono">${h}</td><td class="num mono">${a}</td>
        <td class="num mono" style="color:${h===a?"var(--green)":"var(--red)"}">${a-h>0?"+":""}${a-h}</td></tr>`;}).join("")}
      </tbody></table></div>
      ${difs.length?`<div class="eyebrow" style="margin-bottom:7px">Dónde está la diferencia · ${difs.length} caso(s)</div>
      <div class="tw" style="max-height:320px;overflow:auto"><table><thead><tr><th>OT</th><th>Cuarto</th><th>Componente</th><th class="num">Hoja</th><th class="num">App</th><th>Qué pasó</th></tr></thead><tbody>
      ${difs.slice(0,80).map(x=>{const [ot,cu,tc]=x.k.split("|");
        const enApp=DB.ordenes.find(o=>o.ot===ot && (o.cuartoDeclaradoId||"")===cu);
        const causa = x.a===0 ? (enApp?"la orden existe pero sin ese componente":"la orden no está en la app")
                    : x.h===0 ? "la app tiene un componente que la hoja no trae"
                    : "cantidad distinta";
        return `<tr><td class="mono">${esc(ot)}</td><td class="tag">${esc(nom(DB.cuartos,cu))}</td>
        <td>${esc(tc)}</td><td class="num mono">${x.h}</td><td class="num mono">${x.a}</td>
        <td class="tag">${causa}</td></tr>`;}).join("")}
      ${difs.length>80?`<tr><td colspan="6" class="tag">…y ${difs.length-80} más</td></tr>`:""}
      </tbody></table></div>`
      :`<div style="border:1px solid #b6ddc6;background:#eaf6ef;color:var(--green);padding:10px 12px;border-radius:var(--r)">
        <b>Todo cuadra.</b> La app coincide con la hoja en cada OT.</div>`}
      <button class="btn" id="okA" style="margin-top:12px">Cerrar</button>`);
    document.querySelector("#okA").onclick=cerrarModal;
  }catch(e){
    pinta(`<div style="border:1px solid #eec4c1;background:#fbecea;color:var(--red);padding:10px 12px;border-radius:var(--r)">${esc(String(e.message||e))}</div>
      <button class="btn" id="okA" style="margin-top:11px">Cerrar</button>`);
    document.querySelector("#okA").onclick=cerrarModal;
  }
}
/* Vuelve a leer una OT de la hoja y rehace SUS componentes desde cero.
   Sirve cuando quedaron mal de sincronizaciones anteriores. */
async function rehacerOrden(ot){
  const cx=DB.meta.conexion;
  if(!cx.modo){ toast("Configura primero la conexión"); return; }
  try{
    toast("Leyendo la hoja…");
    const {filas}=await leerFuente();
    const mapa=cx.mapa||detectarMapa(filas[0]);
    const idx={}; Object.entries(mapa).forEach(([i,c])=>{ if(c!=="ignorar") idx[c]=+i; });
    const hits=filas.slice(1).filter(f=>String(f[idx.ot]||"").trim()===String(ot).trim());
    if(!hits.length){ toast("Esa OT no está en la hoja"); return; }
    const conRegistro=DB.componentes.filter(c=>{
      const o=byId(DB.ordenes,c.ordenId); return o && o.ot===ot && DB.registros.some(r=>r.componenteId===c.id);
    });
    if(!await confirmar("Rehacer la orden "+ot,
      `Se borran sus componentes y se vuelven a crear leyendo la hoja.\n\n`+
      (conRegistro.length? `${conRegistro.length} componente(s) tienen producción registrada y NO se tocan.\n\n`:"")+
      `Úsalo cuando la orden quedó mal de una sincronización anterior.`,"Rehacer")) return;
    await commit(()=>{
      const proteger=new Set(conRegistro.map(c=>c.id));
      const ordIds=DB.ordenes.filter(o=>o.ot===ot).map(o=>o.id);
      DB.componentes=DB.componentes.filter(c=>!ordIds.includes(c.ordenId) || proteger.has(c.id));
      aplicarFilas([filas[0], ...hits], mapa);
    }, "Orden "+ot+" rehecha");
    render();
  }catch(e){ toast("No se pudo: "+(e.message||e)); }
}

      else if(desde && fIso && fIso<desde){ veredicto=`Omitida: su fecha (${fmtFecha(fIso)}) es anterior al corte del ${fmtFecha(desde)}.`; color="c-ambar"; }
      else if(desde && !fIso && omitirSF){ veredicto="Omitida: no tiene fecha legible y configuraste omitir esas filas."; color="c-ambar"; }
      else {
        const enApp=DB.ordenes.find(o=>o.ot===ot);
        if(!enApp){ veredicto="Debería estar importada pero no la encuentro en la app. Sincroniza de nuevo."; color="c-rojo"; }
        else if(cerr.has(enApp.estado)){ veredicto=`Importada, pero su estado “${enApp.estado}” está marcado como cerrado: no la ve el técnico y no cuenta como abierta.`; color="c-azul"; }
        else { veredicto="Importada y activa."; color="c-verde"; }
      }
      return `<tr><td class="mono">${x.fila}</td><td class="mono"><b>${esc(ot)}</b></td>
        <td class="mono">${fIso?fmtFecha(fIso):`<span style="color:var(--red)">sin fecha</span>`}<br><span class="tag">${esc(String(idx.fechaIngreso!==undefined?f[idx.fechaIngreso]||"":""))}</span></td>
        <td>${esc(est)||"—"}</td><td>${esc(mot)||`<span class="tag">sin motivo</span>`}</td>
        <td class="tag">${esc(tipo)||"—"}<br>${cants.map(c=>c.q+"× "+esc(c.n)).join("<br>")||"sin cantidades"}</td>
        <td><span class="chip ${color}">${esc(veredicto)}</span></td></tr>`;
    }).join("");
    pinta(`<p class="hint" style="margin-top:0">${hits.length} fila(s) en la hoja. Corte configurado: ${desde?fmtFecha(desde):"sin corte"} · filas sin fecha: ${omitirSF?"se omiten":"se importan"}.</p>
      <div class="tw"><table><thead><tr><th>Fila</th><th>OT</th><th>Ingreso</th><th>Estado</th><th>Motivo</th><th>TIPO y cantidades</th><th>Qué pasó</th></tr></thead>
      <tbody>${filasHtml}</tbody></table></div>
      <button class="btn" id="okB" style="margin-top:12px">Cerrar</button>`);
    document.querySelector("#okB").onclick=cerrarModal;
  }catch(e){
    pinta(`<div style="border:1px solid #eec4c1;background:#fbecea;color:var(--red);padding:10px 12px;border-radius:var(--r)">${esc(String(e.message||e))}</div>
      <button class="btn" id="okB" style="margin-top:11px">Cerrar</button>`);
    document.querySelector("#okB").onclick=cerrarModal;
  }
}

/* =========================================================================
   EDITOR DE TIEMPOS POR COMPONENTE
   Una sola pantalla: eliges cuarto y componente, y ves cada actividad con
   sus minutos al frente. Marcar/desmarcar decide si el técnico la ve.
   Los porcentajes ya no se escriben: se deducen de los minutos.
   ========================================================================= */
let TE = {cuarto:"", tipo:"", avanzado:false};

function faseDe(a){
  const f=(a.fase||"").toLowerCase();
  if(f.indexOf("diagn")===0) return "Diagnóstico";
  if(f.indexOf("entrega")===0) return "Entrega";
  if(f.indexOf("apoyo")===0) return "Apoyo";
  return "Reparación";
}
function estandarDe(tc, actId){
  return DB.estandares.find(e=>e.tipoComponenteId===tc && e.tipologiaId==="*" && e.actividadId===actId);
}
function mTiempos(){
  const cuartos=DB.cuartos.filter(c=>c.tipo==="principal"||DB.tiposComponente.some(t=>t.cuartoId===c.id));
  if(!TE.cuarto) TE.cuarto=(cuartos[0]||{}).id||"";
  const tipos=DB.tiposComponente.filter(t=>t.cuartoId===TE.cuarto);
  if(!tipos.some(t=>t.id===TE.tipo)) TE.tipo=(tipos[0]||{}).id||"";
  const tipo=byId(DB.tiposComponente,TE.tipo);

  const cab=`<div class="card"><header><h2>Tiempos por componente</h2>
    <span class="sub">Escribe los minutos de cada paso. Los porcentajes se calculan solos.</span></header>
  <div class="body"><div class="row">
    <label class="f"><span>Cuarto</span><select id="teCuarto">
      ${cuartos.map(c=>`<option value="${c.id}" ${TE.cuarto===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select></label>
    <label class="f"><span>Componente</span><select id="teTipo">
      ${tipos.map(t=>`<option value="${t.id}" ${TE.tipo===t.id?"selected":""}>${esc(t.nombre)}</option>`).join("")}</select></label>
  </div></div></div>`;

  if(!tipo) return cab+`<div class="card"><div class="body"><div class="empty">Este cuarto no tiene componentes. Créalos en Tipos de componente.</div></div></div>`;

  const r=resumenTiempos(tipo.id);
  const meta=+tipo.estandarReparacion||0;         /* lo que la empresa dice que vale la reparación */
  const cuadra = !meta || r.reparacion===meta;
  let acts=actividadesDe(tipo.cuartoId).filter(a=>!a.noProductiva);
  const usados=DB.componentes.filter(c=>c.tipoComponenteId===tipo.id).length;
  const regs=DB.registros.filter(x=>!x.anulado && fotoComponente(x) && fotoComponente(x).tipoComponenteId===tipo.id).length;

  const FASES=["Diagnóstico","Reparación","Entrega"];
  const fila=a=>{
    const e=estandarDe(tipo.id,a.id);
    const min=e?(+e.minutos||0):0;
    const activa=!!e;
    const pct=pesoActividad(tipo.id,a.id);
    return `<tr class="${activa?"":"apagada"}">
      <td style="width:36px"><input type="checkbox" data-teon="${a.id}" ${activa?"checked":""} style="width:18px;height:18px;accent-color:var(--signal)"></td>
      <td><b>${esc(a.nombre)}</b>${esPorOrden(a.id)?' <span class="tag">por orden, no por unidad</span>':""}
        <br><select data-tefase="${a.id}" style="font-size:12px;padding:2px 4px;margin-top:3px">
          ${FASES.map(f=>`<option value="${f}" ${faseDe(a)===f?"selected":""}>${f}</option>`).join("")}</select>
        ${activa?`<label style="font-size:12px;margin-left:8px;white-space:nowrap;cursor:pointer">
          <input type="checkbox" data-teaparte="${a.id}" ${e.aparte?"checked":""} style="vertical-align:-2px"> aparte</label>`:""}</td>
      <td class="num" style="width:110px"><input type="number" min="0" step="1" data-temin="${a.id}" value="${min}" ${activa?"":"disabled"} style="text-align:right"></td>
      <td class="num mono" style="width:70px">${!activa?"—":(e.aparte?'<span class="tag">aparte</span>':(pct?pct.toFixed(1)+"%":"—"))}</td></tr>`;
  };

  const bloque=(titulo,lista,suma,extra)=>lista.length?`
    <tr class="cab"><td></td><td><b>${titulo}</b>${extra||""}</td>
      <td class="num mono"><b>${suma}</b></td><td class="num mono">${r.total?(suma/r.total*100).toFixed(1)+"%":""}</td></tr>
    ${lista.map(fila).join("")}`:"";

  /* Cualquier actividad con minutos guardados TIENE que verse, aunque no
     pertenezca al cuarto o sea una duplicada: si suma al subtotal y no se
     muestra, los números no cuadran y no hay forma de saber por qué. */
  {
    const yaEstan=new Set(acts.map(a=>a.id));
    minutosPropios(tipo.id).forEach(e=>{
      if(yaEstan.has(e.actividadId)) return;
      const a=byId(DB.actividades,e.actividadId);
      if(a && !a.noProductiva){ acts=acts.concat([a]); yaEstan.add(a.id); }
    });
  }
  const esAparte=a=>{ const e=estandarDe(tipo.id,a.id); return !!(e && e.aparte); };

function pTiempos(){
  const cu=$("#teCuarto"); if(cu) cu.onchange=e=>{ TE.cuarto=e.target.value; TE.tipo=""; render(); };
  const tp=$("#teTipo");   if(tp) tp.onchange=e=>{ TE.tipo=e.target.value; render(); };

  /* Encender / apagar una actividad para este componente */
  document.querySelectorAll("[data-teon]").forEach(ch=>ch.onchange=()=>{
    const actId=ch.dataset.teon, tc=TE.tipo;
    commitMaestro(()=>{
      if(ch.checked){
        if(!estandarDe(tc,actId)) DB.estandares.push({id:uid("es"),tipoComponenteId:tc,tipologiaId:"*",actividadId:actId,minutos:0});
      } else {
        DB.estandares=DB.estandares.filter(e=>!(e.tipoComponenteId===tc && e.tipologiaId==="*" && e.actividadId===actId));

      ch.checked?"Queda aparte del proceso":"Vuelve a contar en el proceso");
  });
  const mt=$("#teMeta"); if(mt) mt.onchange=()=>{
    const v=Math.max(0,+mt.value||0);
    commitMaestro(()=>{ const t=byId(DB.tiposComponente,TE.tipo); if(t) t.estandarReparacion=v; },"Estándar guardado");
  };

  document.querySelectorAll("[data-tetip]").forEach(i=>i.onchange=()=>{
    const id=i.dataset.tetip, v=Math.max(0,+i.value||0);
    commitMaestro(()=>{ const e=byId(DB.estandares,id); if(e) e.minutos=v; },"Variante guardada");
  });
  document.querySelectorAll("[data-tedel]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.tedel;
    commitMaestro(()=>{ DB.estandares=DB.estandares.filter(e=>e.id!==id); },"Variante eliminada");
  });
  const at=$("#teAddTip"); if(at) at.onclick=()=>modalVariante(TE.tipo);

  const lr=$("#teLimpiarRep"); if(lr) lr.onclick=()=>commitMaestro(()=>{
    DB.repartos=(DB.repartos||[]).filter(x=>x.tipoComponenteId!==TE.tipo);
  },"Porcentajes quitados · ahora se deducen de los minutos");

  const gd=$("#teGuardar"); if(gd) gd.onclick=()=>recalcularDeTipo(TE.tipo);
  const cp=$("#teCopiar");  if(cp) cp.onclick=()=>modalCopiarTiempos(TE.tipo);
}
/* Recalcula las horas ganadas de todos los registros de un tipo de componente. */
async function recalcularDeTipo(tc){
  const afectados=DB.registros.filter(r=>{ const c=fotoComponente(r); return c && c.tipoComponenteId===tc; });
  let cambian=0;
  afectados.forEach(r=>{ if(stdRegistro(fotoComponente(r), r.actividadId, r.cantidad)!==r.minutosStd) cambian++; });
  if(!afectados.length){ toast("Guardado. Este componente todavía no tiene registros"); return; }
  if(!await confirmar("Aplicar a los registros",
    `${afectados.length} registro(s) de ${nom(DB.tiposComponente,tc)}.\n\nCambiarían las horas ganadas de ${cambian}.\n\nNo se toca el tiempo real que puso el técnico: solo la parte estándar.`,
    "Aplicar")) return;
  await commit(()=>{
    DB.registros.forEach(r=>{
      const c=fotoComponente(r); if(!c || c.tipoComponenteId!==tc) return;
      r.minutosStd=stdRegistro(c, r.actividadId, r.cantidad);
      r.actualizado=new Date().toISOString();
    });
  }, cambian+" registros actualizados");
  empujarRegistros().catch(()=>{});
}

/* Reparto sugerido: distribuye SOLO la bolsa de reparación. Lo que ya tiene
   tiempo propio queda fuera y el resto se ajusta a 100%. */
function repartoSugerido(){
  const plan=[];
  DB.tiposComponente.forEach(t=>{
    const acts=actividadesDe(t.cuartoId).filter(a=>!a.noProductiva);
    const hallar=(...frags)=>{
      for(const f of frags){ const a=acts.find(x=>sinTildes(x.nombre).indexOf(sinTildes(f))>=0); if(a) return a.id; }
      return null;
    };
    const conPropio=new Set(acts.filter(a=>estandarExacto(t.id,"*",a.id)!=null).map(a=>a.id));
    const fam=familiaDe(t.nombre), cu=nom(DB.cuartos,t.cuartoId);
    let pares;
    if(fam==="turbo") pares=[[hallar("sandblast"),18],[hallar("balanceo"),27],
                             [hallar("armado"),42],[hallar("prueba final"),13]];
    else if(/torno/i.test(cu)) pares=[[hallar("torneado","rectific"),100]];
    else if(/soldadura/i.test(cu)) pares=[[hallar("soldadura"),100]];
    else pares=[[hallar("mantenimiento del componente"),60],[hallar("calibraci"),40]];
    const validos=pares.filter(([a,p])=>a && p>0 && !conPropio.has(a));
    const suma=validos.reduce((x,[,p])=>x+p,0);
    if(!suma) return;
    let acum=0;
    validos.forEach(([a,p],k)=>{
      const v = k===validos.length-1 ? 100-acum : Math.round(p*100/suma);
      acum+=v; plan.push({tipoComponenteId:t.id, actividadId:a, porcentaje:v});
    });
  });
  return plan;
}
async function recalcularEstandares(){
  const regs=DB.registros;
  let cambiados=0, ceros=0;
  const nuevos=regs.map(r=>{
    const c=fotoComponente(r);
    const std = stdRegistro(c, r.actividadId, r.cantidad);
    if(std!==r.minutosStd) cambiados++;
    if(!std) ceros++;
    return {id:r.id, std};
  });
  if(!await confirmar("Recalcular horas estándar",
    `Se revisan ${regs.length} registros con los tiempos y repartos que tienes hoy.\n\n`+
    `Cambiarían ${cambiados}.\n`+
    (ceros?`Quedarían en cero ${ceros} (les falta estándar o reparto).\n`:"")+
    `\nNo se toca lo que registró el técnico: solo se recalcula la parte estándar.`,
    "Recalcular")) return;
  await commit(()=>{
    const m={}; nuevos.forEach(x=>m[x.id]=x.std);
    DB.registros.forEach(r=>{ if(m[r.id]!==undefined) r.minutosStd=m[r.id]; });
  }, `${cambiados} registros actualizados`);
  empujarRegistros().catch(()=>{});
}

  return `<div class="card"><header><h2>Reparto del proceso</h2>

  <div class="body">
    <div style="border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.55">
      <b>Qué se hace aquí.</b> Tu tabla dice cuánto vale <b>reparar</b> un componente — por ejemplo,
      un inyector CR vale 1 hora. Si esa reparación la hacen entre dos personas, esa hora hay que
      dividirla entre ellas. Aquí decides cómo.<br>
      <span class="tag">El diagnóstico, el lavado y el alistamiento no entran: ya tienen su propio tiempo en tu tabla.</span>
    </div>

    <div class="row">
      <label class="f" style="max-width:340px"><span>¿De qué componente?</span><select id="fTipo">
        <option value="">Todos los que no tengan uno propio</option>
        ${DB.tiposComponente.map(t=>`<option value="${t.id}" ${tcSel===t.id?"selected":""}>${esc(t.nombre)}${todosRp.some(r=>r.tipoComponenteId===t.id)?" ✓":""}</option>`).join("")}
      </select></label>
      ${tipo?`<div style="flex:0 0 auto;align-self:end;margin-bottom:11px">
        <span class="tag">Reparación de este componente: <b class="mono">${total?hrs(total)+" h":"sin definir"}</b></span></div>`:""}
    </div>

    ${hereda?`<div style="border:1px solid #bcd0e2;background:#eaf1f8;color:var(--prussian);padding:9px 11px;border-radius:var(--r);margin-bottom:12px;font-size:13px">
      Este componente usa el reparto general. Si le pones porcentajes propios, dejará de heredarlo.</div>`:""}

    <div class="eyebrow" style="margin-bottom:7px">1 · Se reparten la reparación</div>
    <div style="height:9px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-bottom:8px">
      <i style="display:block;height:100%;width:${Math.min(100,suma)}%;background:${suma===100?"var(--green)":suma>100?"var(--red)":"var(--amber)"}"></i></div>
    ${enReparto.length?`<div class="tw"><table class="acc"><thead><tr><th>Actividad</th><th class="num">% de la reparación</th><th class="num">Le toca</th><th></th></tr></thead>
      <tbody>${enReparto.map(filaRep).join("")}</tbody></table></div>`
      :`<div class="empty">Todavía nadie se reparte la reparación. Agrega alguna abajo.</div>`}
    <p class="hint" style="margin-top:8px">${suma===100?"<b>Está completo.</b> No hay que hacer nada más aquí."
      :suma>100?`<b>Se pasa ${suma-100}%:</b> se pagarían más horas de las que vale el proceso. Baja algún porcentaje.`
      :`<b>Falta ${100-suma}%:</b> parte del tiempo no se le acredita a nadie. Súbelos o usa “Repartir lo que falta”.`}</p>

    ${conPropio.length?`
    <div class="eyebrow" style="margin:18px 0 7px">2 · Ya tienen su propio tiempo · no van aquí</div>
    <div class="tw"><table><tbody>${conPropio.map(x=>`<tr>
      <td>${esc(x.a.nombre)}</td><td class="num mono">${x.min} min/und</td>
      <td class="tag">sale de tu tabla de tiempos</td></tr>`).join("")}</tbody></table></div>`:""}

    ${sinNada.length?`
    <div class="eyebrow" style="margin:18px 0 7px">3 · No valen nada todavía</div>
    <p class="hint" style="margin-top:0">Quien las registre gana <b>cero horas</b>. Dales un % arriba, ponles tiempo en
    <b>Tiempos estándar</b>, o bórralas en <b>Actividades</b> si no se usan.</p>
    <div class="tw"><table><tbody>${sinNada.map(x=>`<tr>
      <td>${esc(x.a.nombre)}</td><td class="tag">${esc(x.a.fase)}</td>
      <td><button class="btn sm" data-rpadd="${x.a.id}">Meterla al reparto</button></td></tr>`).join("")}</tbody></table></div>`:""}

    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="rpGuardar">Guardar</button>
      <button class="btn" id="rpAjustar">Repartir lo que falta</button>
      ${!hereda&&tcSel!=="*"?`<button class="btn" id="rpHeredar">Usar el reparto general</button>`:""}
      <button class="btn warn" id="rpSugerido">Rehacer el reparto de todos los componentes</button>
    </div>
    ${DB.registros.length?`<div style="border:1px solid #bcd0e2;background:#eaf1f8;padding:10px 12px;border-radius:var(--r);margin-top:14px;font-size:13.5px">
      <b>Hay ${DB.registros.length} registros guardados.</b> Si cambiaste algo aquí o en los tiempos, pulsa esto para que tomen los valores nuevos.
      <br><button class="btn sm primary" id="recalcEstd" style="margin-top:8px">Recalcular las horas de todos los registros</button></div>`:""}
  </div></div>`;
}
function mListas(){

    Si hay más de un coordinador y quieres que cada uno tenga la suya, escríbela en la columna <b>Clave</b> de Maestros → Técnicos: esa manda sobre esta.
    ${DB.meta.pin?"":'<br><b style="color:var(--signal)">Ahora mismo cualquiera puede entrar a tu perfil y borrar datos.</b>'}</p>
    </div></div>

  <div class="card"><header><h2>Listas</h2><span class="sub">un elemento por línea</span></header><div class="body">
  <div class="eyebrow" style="margin-bottom:4px">Estados de orden</div>
  <p class="hint" style="margin:0 0 9px">
    Los estados los trae tu hoja PROGRAMACION; aquí solo se decide <b>cuáles hacen desaparecer la orden
    de la lista del técnico</b>. Marca "cierra" en los estados que significan que ya no hay nada que hacerle:
    Entregado, Dado de baja, No autorizado. Los demás siguen visibles para que puedan seguir registrando.

  <div class="tw" style="margin-bottom:8px"><table><thead><tr><th>Estado (tal como viene de tu hoja)</th><th style="width:150px">¿Sale de la lista del técnico?</th><th class="num">Órdenes</th></tr></thead><tbody>
  ${DB.estados.map(e=>`<tr>
    <td>${chipEstado(e)}</td>
    <td><label style="display:flex;align-items:center;gap:7px;cursor:pointer">
      <input type="checkbox" data-cierra="${esc(e)}" ${(DB.estadosCerrados||[]).includes(e)?"checked":""} style="width:17px;height:17px;accent-color:var(--signal)">
      <span class="tag">${(DB.estadosCerrados||[]).includes(e)?"oculta al técnico":"visible"}</span></label></td>
    <td class="num mono">${DB.ordenes.filter(o=>o.estado===e).length}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="hint">Los estados se agregan solos cuando aparecen en la hoja. Un estado cerrado saca la orden de la lista del técnico, pero conserva su historial.</p>
  ${DB.estados.filter(e=>!DB.ordenes.some(o=>o.estado===e)).length?`<button class="btn" id="limpiarEstados" style="margin-bottom:12px">Quitar los ${DB.estados.filter(e=>!DB.ordenes.some(o=>o.estado===e)).length} estados sin ninguna orden</button>`:""}
  <div class="grid g3">${L("estados","Editar la lista completa (uno por línea)")}${L("motivos","Motivos de ingreso")}${L("tiposNovedad","Tipos de novedad")}</div>
  <hr class="sep">
  <div class="eyebrow" style="margin-bottom:8px">Días festivos · no cuentan como jornada disponible</div>
  ${(()=>{const f=(DB.festivos||[]).slice().sort();
    const prox=f.filter(x=>x>=hoyISO()).slice(0,6);
    return `<p class="hint" style="margin-top:0">${f.length} cargados. Próximos: ${prox.length?prox.map(x=>fmtFecha(x)+" ("+DIAS_SEM[new Date(x+"T12:00:00").getDay()]+")").join(" · "):"ninguno"}.<br>
    Un festivo no suma horas disponibles ni aparece en “Mi semana”, así que no castiga la productividad.</p>`;})()}
  <div class="grid g2">${L("festivos","Festivos (una fecha por línea, formato 2026-12-25)")}${L("clientes","Clientes frecuentes (opcional, para escribir órdenes a mano)")}</div>
  <hr class="sep">
  <div class="eyebrow" style="margin-bottom:9px">Horario del laboratorio · minutos pagados por día</div>
  <div class="row">${[1,2,3,4,5,6,0].map(d=>`<label class="f" style="flex:1 1 90px"><span>${nd[d].slice(0,3)}</span>
    <input type="number" min="0" step="15" data-dia="${d}" value="${+h.dias[d]||0}"></label>`).join("")}</div>
  <div class="row">
    <label class="f" style="max-width:200px"><span>Break (min)</span><input type="number" id="brk" min="0" step="5" value="${h.breakMin}"></label>
    <label class="f" style="max-width:250px"><span>La semana del informe empieza el</span>
      <select id="iniSem">${DIAS_SEM.map((d,i)=>`<option value="${i}" ${inicioSemana()===i?"selected":""}>${d.charAt(0).toUpperCase()+d.slice(1)}</option>`).join("")}</select></label>
    <label class="f" style="max-width:230px"><span>Días atrás que puede registrar el técnico</span>
      <input type="number" id="diasRetro" min="0" max="30" value="${DB.meta.diasRetro==null?2:DB.meta.diasRetro}"></label>
    <label class="f" style="max-width:280px"><span>¿Descontar el break?</span>
      <select id="brkOn"><option value="1" ${h.descontarBreak?"selected":""}>Sí — no cuenta como producción</option>
      <option value="0" ${!h.descontarBreak?"selected":""}>No — cuenta dentro de la jornada</option></select></label>
    <label class="f" style="max-width:330px"><span>Captura del tiempo</span>
      <select id="captura">
        <option value="simple" ${(DB.meta.capturaTiempo||"simple")==="simple"?"selected":""}>El técnico escribe su tiempo en cada actividad</option>
        <option value="detallado" ${DB.meta.capturaTiempo==="detallado"?"selected":""}>Detallado — el técnico escribe los minutos de cada actividad</option>
      </select></label>
  </div>
  <p class="hint" style="margin-top:-4px">Semana: <b class="mono">${hrs(totalBruto)} h</b> pagadas · <b class="mono">${hrs(totalNeto)} h</b> disponibles para producción.
  La clave solo evita entradas por descuido al perfil de coordinación; no es seguridad real.</p>
  <button class="btn primary" id="guardarListas">Guardar cambios</button></div></div>`;
}
function pMaestros(){
  document.querySelectorAll("[data-ms]").forEach(b=>b.onclick=()=>{MSEC=b.dataset.ms;MFILTRO.tipo="";render();});
  const fc=$("#fCuarto"); if(fc) fc.onchange=e=>{ MFILTRO.cuarto=e.target.value; MFILTRO.tipo=""; render(); };
  const ft=$("#fTipo"); if(ft) ft.onchange=e=>{ MFILTRO.tipo=e.target.value; render(); };
  document.querySelectorAll("[data-cuartos]").forEach(b=>b.onclick=()=>modalCuartosActividad(b.dataset.cuartos));
  document.querySelectorAll("[data-fusact]").forEach(b=>b.onclick=()=>modalFusionActividad(b.dataset.fusact));
  document.querySelectorAll("[data-fusion]").forEach(b=>b.onclick=()=>modalFusionTipologia(b.dataset.fusion));
  document.querySelectorAll("[data-fustipo]").forEach(b=>b.onclick=()=>modalFusionTipo(b.dataset.fustipo));
  const lt=$("#liberarTip"); if(lt) lt.onclick=async()=>{
    const visibles=DB.tipologias.filter(t=>{
      const cu=cuartoDeTipologia(t);
      if(MFILTRO.cuarto && cu && cu!==MFILTRO.cuarto) return false;
      if(MFILTRO.tipo && t.tipoComponenteId && t.tipoComponenteId!==MFILTRO.tipo) return false;
      return true;
    }).filter(t=>t.tipoComponenteId);
    if(!visibles.length){ toast("No hay tipologías atadas a un componente en esta vista"); return; }
    const ok=await confirmar("Convertir en familia de motor",
      `${visibles.length} tipología(s) quedarán ligadas a su cuarto y sueltas del componente.\n\n`+
      `Ejemplo: si ISB estaba solo bajo Inyector, pasará a servir también para Riel y Bomba de alta.\n\n`+
      `Los registros ya hechos no cambian.`, "Convertir");
    if(!ok) return;
    commitMaestro(()=>{
      visibles.forEach(v=>{ const t=byId(DB.tipologias,v.id); if(!t) return;
        const tc=byId(DB.tiposComponente,t.tipoComponenteId);
        t.cuartoId = tc? tc.cuartoId : (MFILTRO.cuarto||"");
        t.tipoComponenteId="";
      });
    }, visibles.length+" tipología(s) convertidas");
  };
  const le=$("#limpiarEstados");
  if(le) le.onclick=async()=>{
    const sobran=DB.estados.filter(e=>!DB.ordenes.some(o=>o.estado===e));
    if(!await confirmar("Limpiar estados",`Se quitan ${sobran.length} estados que ninguna orden usa:\n\n${sobran.join("\n")}`,"Quitar")) return;
    commitMaestro(()=>{ DB.estados=DB.estados.filter(e=>DB.ordenes.some(o=>o.estado===e));
      DB.estadosCerrados=(DB.estadosCerrados||[]).filter(e=>DB.estados.includes(e)); },"Estados limpios");
  };
  const st=$("#soloTotales");
  if(st) st.onclick=async()=>{
    const sobran=DB.estandares.filter(e=>e.actividadId!==ACT_TOTAL);
    const lista=sobran.slice(0,10).map(e=>`  ${nom(DB.tiposComponente,e.tipoComponenteId)} · ${nom(DB.actividades,e.actividadId)} = ${e.minutos} min`).join("\n");
    if(!await confirmar("Dejar solo los tiempos totales",
      `Se quitan ${sobran.length} tiempos por actividad. Quedan los ${DB.estandares.length-sobran.length} totales, que se reparten por porcentaje.\n\n${lista}${sobran.length>10?"\n  …":""}\n\nDespués vuelve a cargar tu tabla para reponer los que sí son tuyos (diagnóstico, lavado, cartridge).`,
      "Quitar")) return;
    commitMaestro(()=>{ DB.estandares=DB.estandares.filter(e=>e.actividadId===ACT_TOTAL); },"Listo, solo quedan los totales");
  };
  const rec=$("#recalcEstd"); if(rec) rec.onclick=()=>recalcularEstandares();
  if(MSEC==="tiempos") pTiempos();
  const rpg=$("#rpGuardar");
  if(rpg) rpg.onclick=()=>{
    const tcSel = MFILTRO.tipo || "*";
    const nuevos=[];
    document.querySelectorAll("[data-rp]").forEach(i=>{ const v=Math.max(0,+i.value||0);
      if(v) nuevos.push({id:uid("rp"),tipoComponenteId:tcSel,actividadId:i.dataset.rp,porcentaje:v}); });
    commitMaestro(()=>{ DB.repartos=DB.repartos.filter(r=>r.tipoComponenteId!==tcSel).concat(nuevos); },
      `Reparto guardado · suma ${nuevos.reduce((a,r)=>a+r.porcentaje,0)}%`);
  };
  const rps=$("#rpSugerido");
  if(rps) rps.onclick=async()=>{
    const plan=repartoSugerido();
    const porTipo={};
    plan.forEach(x=>{ porTipo[x.tipoComponenteId]=(porTipo[x.tipoComponenteId]||[]).concat([x]); });
    const muestra=Object.entries(porTipo).slice(0,6).map(([tc,ps])=>
      `  ${nom(DB.tiposComponente,tc)}\n     ${ps.map(x=>nom(DB.actividades,x.actividadId)+" "+x.porcentaje+"%").join(" · ")}`).join("\n");
    const ok=await confirmar("Reparto sugerido",
      `Se define el reparto de ${Object.keys(porTipo).length} componentes. Cada uno suma 100%, así que el tiempo total de la empresa no cambia: solo se reparte.\n\n`+
      `El alistamiento sale de dentro de la reparación, no se suma aparte.\n\n${muestra}\n  …\n\n`+
      `Reemplaza los repartos que tengas. Después puedes ajustar cualquier porcentaje.`,
      "Cargar reparto");
    if(!ok) return;
    commitMaestro(()=>{
      const ids=new Set(plan.map(x=>x.tipoComponenteId));
      DB.repartos=DB.repartos.filter(r=>!ids.has(r.tipoComponenteId) && r.tipoComponenteId!=="*");
      plan.forEach(x=>DB.repartos.push({id:uid("rp"),...x}));
    }, "Reparto cargado para "+Object.keys(porTipo).length+" componentes");
  };
  document.querySelectorAll("[data-rpadd]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.rpadd, tc=MFILTRO.tipo||"*";
    const otros=DB.repartos.filter(r=>r.tipoComponenteId===tc);
    const suma=otros.reduce((a,r)=>a+(+r.porcentaje||0),0);
    commitMaestro(()=>{ DB.repartos.push({id:uid("rp"),tipoComponenteId:tc,actividadId:id,porcentaje:Math.max(0,100-suma)}); },
      "Agregada al reparto");
  });
  const rpa=$("#rpAjustar");
  if(rpa) rpa.onclick=()=>{
    const inputs=[...document.querySelectorAll("[data-rp]")].filter(i=>+i.value>0);
    const suma=inputs.reduce((a,i)=>a+(+i.value||0),0);
    if(!suma){ toast("Pon al menos un porcentaje"); return; }
    let acum=0;
    inputs.forEach((i,k)=>{ let v = k===inputs.length-1 ? 100-acum : Math.round((+i.value)*100/suma); acum+=v; i.value=v; });
    toast("Ajustado a 100%. Pulsa Guardar reparto.");
  };
  const rph=$("#rpHeredar");
  if(rph) rph.onclick=async()=>{
    const tcSel=MFILTRO.tipo||"*";
    if(!await confirmar("Volver al proceso general","Se borran los porcentajes propios de este componente y volverá a usar el reparto general.","Volver al general")) return;
    commitMaestro(()=>{ DB.repartos=DB.repartos.filter(r=>r.tipoComponenteId!==tcSel); },"Ahora hereda el proceso general");
  };
  document.querySelectorAll("[data-rpdel]").forEach(b=>b.onclick=()=>{
    const tcSel=MFILTRO.tipo||"*";
    commitMaestro(()=>{ DB.repartos=DB.repartos.filter(r=>!(r.tipoComponenteId===tcSel && r.actividadId===b.dataset.rpdel)); },"Quitado");
  });
  const mr=$("#modoRapido"); if(mr) mr.onchange=e=>{ RAPIDO=e.target.checked; toast(RAPIDO?"Borrado rápido activado":"Borrado rápido desactivado"); };

  /* editar un campo NO redibuja: así el botón Eliminar sigue en su sitio */
  document.querySelectorAll("[data-fld]").forEach(i=>i.onchange=()=>{
    const [col,id,campo]=i.dataset.fld.split(".");
    let valor = i.type==="number" ? (+i.value||0) : i.value;
    if(campo==="noProductiva"||campo==="porOrden") valor = !!valor;
    const necesitaRedibujar = (col==="estandares" && campo==="tipoComponenteId");
    commitMaestro(()=>{ const t=byId(DB[col],id); if(t) t[campo]=valor; }, "", !necesitaRedibujar);
    i.style.outline="2px solid var(--green)";
    setTimeout(()=>{ i.style.outline=""; },600);
  });
  document.querySelectorAll("[data-chkfld]").forEach(i=>i.onchange=()=>{
    const [col,id,campo]=i.dataset.chkfld.split(".");
    const v=i.checked;
    commitMaestro(()=>{ const t=byId(DB[col],id); if(t) t[campo]=v; }, v?"Activo":"Desactivado", true);
  });

  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const [col,id]=b.dataset.del.split(".");
    const o=byId(DB[col],id); if(!o){ toast("No encuentro ese elemento"); return; }
    let usos=0, detalle="";
    if(col==="tecnicos"){ usos=DB.registros.filter(r=>r.tecnicoId===id).length; detalle=usos+" registro(s) de producción"; }
    if(col==="cuartos"){ const cs=DB.componentes.filter(c=>c.cuartoId===id).length, ts=DB.tecnicos.filter(t=>t.cuartoId===id).length;
      usos=cs+ts; detalle=`${ts} técnico(s) y ${cs} componente(s)`; }
    if(col==="tiposComponente"){ usos=DB.componentes.filter(c=>c.tipoComponenteId===id).length; detalle=usos+" componente(s) en órdenes"; }
    if(col==="tipologias"){ usos=DB.componentes.filter(c=>c.tipologiaId===id).length; detalle=usos+" componente(s) en órdenes"; }
    if(col==="actividades"){ usos=DB.registros.filter(r=>r.actividadId===id).length; detalle=usos+" registro(s) de producción"; }
    const nombre=o.nombre||"este elemento";

    /* Sin datos que dependan + modo rápido activo = borra directo. */
    if(!(RAPIDO && usos===0)){
      const msg = usos
        ? `"${nombre}" está en uso por ${detalle}.\n\nSi lo eliminas, esos datos históricos quedarán mostrando "—".\n\nSi la persona o el cuarto ya no trabaja, es mejor DESACTIVARLO que borrarlo.`
        : `Se eliminará "${nombre}".\nNo hay datos que dependan de él.`;
      const ok = await confirmar("Eliminar", msg, usos?"Eliminar de todos modos":"Eliminar");
      if(!ok) return;
    }
    commitMaestro(()=>{
      /* Si es un cuarto, se apunta el nombre para que la hoja no vuelva a
         crearlo en la siguiente sincronización. Se puede volver a agregar a
         mano y entonces sale de la lista de ignorados. */
      if(col==="cuartos"){
        DB.meta.cuartosIgnorados = [...new Set((DB.meta.cuartosIgnorados||[]).concat([nombre]))];
      }
      DB[col]=DB[col].filter(x=>x.id!==id);
      /* Los avisos guardados de la última sincronización dejan de ser válidos
         en cuanto se toca un maestro. */
      if(DB.meta.conexion && DB.meta.conexion.ultimoResumen) DB.meta.conexion.ultimoResumen.avisos=[];
    }, "Eliminado: "+nombre);
  });

  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.add;
    commitMaestro(()=>{
      if(t==="tecnico") DB.tecnicos.push({id:uid("te"),nombre:"Nuevo técnico",cuartoId:DB.cuartos[0]&&DB.cuartos[0].id,rol:"tecnico",pin:"",activo:true});
      if(t==="cuarto") DB.cuartos.push({id:uid("cu"),nombre:"Nuevo cuarto",tipo:"principal",grupo:""});
      if(t==="tipo") DB.tiposComponente.push({id:uid("tc"),nombre:"Nuevo componente",cuartoId:DB.cuartos[0]&&DB.cuartos[0].id});
      if(t==="tipologia") DB.tipologias.push({id:uid("tp"),nombre:"Nueva tipología",cuartoId:MFILTRO.cuarto||"",tipoComponenteId:MFILTRO.tipo||""});

let IMP={texto:"",filas:[],map:{},sep:"\t"};
/* ---- Importar la tabla de tiempos de la empresa ---- */
let IMPE={texto:"",filas:[],map:{},unidad:"min"};
const CAMPOS_E=[["ignorar","(ignorar)"],["cuarto","Cuarto"],["componente","Tipo de componente"],["tipologia","Tipología"],["actividad","Actividad"],["tiempo","Tiempo"],["aparte","¿Aparte del proceso?"]];
function aMinutos(v, unidad){
  const t=String(v||"").trim().replace(",",".");
  if(!t) return 0;
  if(t.includes(":")){ const [h,m]=t.split(":"); return (parseInt(h,10)||0)*60+(parseInt(m,10)||0); }
  const num=parseFloat(t.replace(/[^\d.]/g,""))||0;
  if(/h/i.test(t) || unidad==="h") return Math.round(num*60);
  return Math.round(num);
}

function pImportEstandares(){
  const t=$("#pegadoE"); if(!t) return;
  t.oninput=e=>IMPE.texto=e.target.value;
  $("#unidadE").onchange=e=>IMPE.unidad=e.target.value;

    IMPE.map={};
    IMPE.filas[0].forEach((h,i)=>{
      const k=String(h||"").toLowerCase();
      if(/cuarto|secci|area|área/.test(k)) IMPE.map[i]="cuarto";
      else if(/component|element|pieza|item|descrip/.test(k)) IMPE.map[i]="componente";
      else if(/tipolog|aplicaci|motor|modelo|referencia|sistema/.test(k)) IMPE.map[i]="tipologia";
      else if(/activ|proceso|operaci|trabajo/.test(k)) IMPE.map[i]="actividad";
      else if(/tiempo|min|hora|dura|estand|estánd/.test(k)) IMPE.map[i]="tiempo";
      else IMPE.map[i]="ignorar";
    });

function importarEstandares(){
  const idx={}; Object.entries(IMPE.map).forEach(([i,c])=>{ if(c!=="ignorar") idx[c]=+i; });
  if(idx.componente===undefined || idx.tiempo===undefined){ toast("Faltan las columnas de Componente y Tiempo"); return; }
  /* se copian antes: commitMaestro es asíncrono y IMPE se limpia después */
  const filas = IMPE.filas.slice(1);
  const unidad = IMPE.unidad;
  const cont = {nuevos:0, actualizados:0, actividades:0, componentes:0};
  commitMaestro(()=>{
    filas.forEach(f=>{
      const cn=String(f[idx.componente]||"").trim(); if(!cn) return;
      const min=aMinutos(f[idx.tiempo], unidad); if(!min) return;
      /* cuarto */
      let cuartoId = DB.cuartos[0] && DB.cuartos[0].id;
      if(idx.cuarto!==undefined && f[idx.cuarto]){
        const cu=buscarOCrear("cuartos", String(f[idx.cuarto]).trim(), {tipo:"principal",grupo:""});
        cuartoId=cu.id;
      }
      /* componente */
      let tipo = DB.tiposComponente.find(x=>x.nombre.trim().toLowerCase()===cn.toLowerCase());
      if(!tipo){ tipo={id:uid("tc"), nombre:cn, cuartoId}; DB.tiposComponente.push(tipo); cont.componentes++; }
      else if(idx.cuarto!==undefined && f[idx.cuarto]) tipo.cuartoId=cuartoId;
      /* tipología */
      const tn = idx.tipologia!==undefined ? String(f[idx.tipologia]||"").trim() : "";
      const tip = (tn && !/^(todas|todos|general|n\/a|-)$/i.test(tn))
        ? buscarOCrear("tipologias", tn, {cuartoId:tipo.cuartoId, tipoComponenteId:""}) : null;
      /* actividad */
      const an = idx.actividad!==undefined ? String(f[idx.actividad]||"").trim() : "";
      let act;
      if(an){
        act = DB.actividades.find(x=>x.nombre.trim().toLowerCase()===an.toLowerCase());
        if(!act){ act={id:uid("ac"), nombre:an, orden:(Math.max(0,...DB.actividades.map(a=>a.orden))+1), fase:"Reparación", cuartos:[tipo.cuartoId]};
          DB.actividades.push(act); cont.actividades++; }
        else if(Array.isArray(act.cuartos) && act.cuartos.length && !act.cuartos.includes(tipo.cuartoId)) act.cuartos.push(tipo.cuartoId);
      } else {
        act = {id:ACT_TOTAL};   /* sin actividad = tiempo total del proceso */
      }
      /* estándar (uno por combinación) */
      const tipId = tip? tip.id : "*";
      /* Columna opcional: marca las alternativas que no suman al proceso
         (montaje de cartridge en vez de armar, mantenimiento suelto). */
      const ap = idx.aparte!==undefined && /^(s[ií]|1|x|true|aparte)$/i.test(String(f[idx.aparte]||"").trim());
      const ya = DB.estandares.find(e=>e.tipoComponenteId===tipo.id && e.tipologiaId===tipId && e.actividadId===act.id);
      if(ya){ ya.minutos=min; ya.aparte=ap; cont.actualizados++; }
      else { DB.estandares.push({id:uid("es"), tipoComponenteId:tipo.id, tipologiaId:tipId, actividadId:act.id, minutos:min, aparte:ap}); cont.nuevos++; }
    });
  }).then(()=>{
    toast(`${cont.nuevos} tiempos nuevos · ${cont.actualizados} actualizados · ${cont.componentes} componentes y ${cont.actividades} actividades creadas`);
    IMPE={texto:"",filas:[],map:{},unidad};
    render();
  });
}
