const TABS = [
  ["registro","Mi registro","todos"],
  ["misemana","Mi semana","todos"],
  ["ordenes","Órdenes","coord"],
  ["dashboard","Dashboard","coord"],
  ["ingresos","Ingresos","coord"],
  ["semanal","Informe semanal","coord"],
  ["maestros","Maestros","coord"],
  ["conexion","Conexión","coord"],
  ["datos","Datos","coord"]
];
function tabsVisibles(){ return esCoordinador()? TABS : TABS.filter(t=>t[2]==="todos"); }
function pintarTabs(){
  const vis=tabsVisibles();
  $("#tabs").innerHTML = vis.map(([k,l])=>`<button data-t="${k}" class="${VISTA===k?"on":""}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ VISTA=b.dataset.t; window.scrollTo(0,0); render(); });
}
function render(){
  try{ renderInterno(); }
  catch(err){
    console.error(err);
    $("#app").innerHTML = `<div class="card"><header><h2>Algo falló al dibujar esta pantalla</h2></header>
      <div class="body">
        <div style="border:1px solid #eec4c1;background:#fbecea;color:var(--red);padding:10px 12px;border-radius:var(--r);font-size:13.5px">
          <b>${esc(String(err && err.message || err))}</b></div>
        <p class="hint" style="margin-top:12px">Tus datos están a salvo. Vuelve a otra pestaña y sigue trabajando; si se repite, cuéntame este mensaje.</p>
        <button class="btn primary" id="volverInicio" style="margin-top:6px">Volver a Mi registro</button>
        <details style="margin-top:12px"><summary class="hint" style="cursor:pointer">Detalle técnico</summary>
          <pre style="font-size:11px;overflow:auto;white-space:pre-wrap">${esc(String(err && err.stack || ""))}</pre></details>
      </div></div>`;
    const b=$("#volverInicio"); if(b) b.onclick=()=>{ VISTA="registro"; render(); };
  }
}
function renderInterno(){
  if(!tabsVisibles().some(t=>t[0]===VISTA)) VISTA="registro";
  pintarTabs();

  $("#hoy").textContent = "· " + fmtFecha(hoyISO()) + " · " + VERSION_APP;
  const me = YO ? byId(DB.tecnicos, YO) : null;
  $("#whoami").innerHTML = `<span class="dot ${me?"":"off"}"></span>${me?esc(me.nombre):"Elegir técnico"}`;
  $("#salir").style.display = me ? "" : "none";
  const v = {registro:vRegistro, misemana:vMiSemana, ordenes:vOrdenes, dashboard:vDashboard, ingresos:vIngresos, semanal:vSemanal, maestros:vMaestros, conexion:vConexion, datos:vDatos}[VISTA];
  $("#app").innerHTML = v();
  const post = {registro:pRegistro, misemana:pMiSemana, ordenes:pOrdenes, dashboard:pDashboard, ingresos:pIngresos, semanal:pSemanal, maestros:pMaestros, conexion:pConexion, datos:pDatos}[VISTA];
  if(post) post();
}
document.addEventListener("click", async e=>{
  if(e.target.closest("#salir")){ YO=null; await Store.set(KEY_ME,null,false); VISTA="registro"; render(); modalTecnico(); return; }
  if(e.target.closest("#whoami")) modalTecnico();
});

/* =========================================================================
   VISTA 1 · MI REGISTRO  (3 pasos)
   ========================================================================= */
let R = { paso:1, fecha:hoyISO(), ordenId:null, componenteId:null, sel:{}, novedad:"", tipoNovedad:"", busca:"", todas:false, estadoOrden:"" };

function vRegistro(){
  const me = YO ? byId(DB.tecnicos,YO) : null;
  if(!me) return `<div class="card"><div class="body"><div class="empty">Primero elige quién eres. Toca el botón <b>Elegir técnico</b> arriba a la derecha.</div></div></div>`;
  const paso = R.paso;
  const head = avisoVersion() + barraSync() + `
  <div class="steps">
    <div class="${paso===1?"on":(paso>1?"done":"")}"><b>1</b>Orden</div>
    <div class="${paso===2?"on":(paso>2?"done":"")}"><b>2</b>Actividades</div>
    <div class="${paso===3?"on":""}"><b>3</b>Novedades</div>
  </div>`;
  return head + (paso===1?pasoOrden():paso===2?pasoActividades():pasoNovedades()) + barraRegistro() + hoyDelTecnico();
}

function pasoOrden(){
  const q = R.busca.trim(); const ql=q.toLowerCase();
  const me = YO? byId(DB.tecnicos,YO):null;
  const miCuarto = me? me.cuartoId : "";
  const cerr = cerrados();

  const abiertas = DB.ordenes.filter(o=>!cerr.has(o.estado));
  const filtradoPorCuarto = !R.todas && !!miCuarto;
  const base = filtradoPorCuarto ? abiertas.filter(o=>cuartosDeOrden(o).has(miCuarto)) : abiertas;
  const lista = base
    .filter(o=> !q || sinTildes(o.ot+" "+(o.cliente||"")+" "+(o.tipoTexto||"")).indexOf(sinTildes(ql))>=0)
    .sort((a,b)=> (b.fechaIngreso||"").localeCompare(a.fechaIngreso||"") );

  const cerradas = DB.ordenes.length - abiertas.length;
  const minFecha = (esCoordinador()||!DB.meta.diasRetro) ? "" :
    restarDias(hoyISO(), DB.meta.diasRetro);

  return `
  <div class="card">
    <header><h2>Paso 1 · Elige la orden</h2>
      <span class="sub mono">${lista.length} abiertas${filtradoPorCuarto?" · "+esc(nom(DB.cuartos,miCuarto)):""}</span>
      <div class="push"><button class="btn sm" id="nuevaOT">+ Orden nueva</button></div>
    </header>
    <div class="body">
      <label class="f"><span>Fecha del registro</span>
        <input type="date" id="fechaReg" value="${R.fecha}" max="${hoyISO()}" ${minFecha?`min="${minFecha}"`:""}></label>
      ${minFecha&&R.fecha<minFecha?`<p class="hint" style="color:var(--signal);margin-top:-6px">Solo puedes registrar hasta ${DB.meta.diasRetro} día(s) atrás. Para fechas anteriores, pídeselo a coordinación.</p>`:""}
      <label class="f"><span>Buscar OT, cliente o tipología</span><input type="search" id="buscaOT" placeholder="Ej: 36093, Umbarela o ISB" value="${esc(R.busca)}"></label>
      ${miCuarto?`<p class="hint" style="margin-top:-6px">Estás registrando como <b>${esc(nom(DB.tecnicos,YO))}</b>, del cuarto <b>${esc(nom(DB.cuartos,miCuarto))}</b>. Si no es tu cuarto, avísale a coordinación.</p>`:""}
      <button class="btn" id="sinOrden" style="margin-bottom:12px;width:100%">Registrar algo que no es de una orden</button>
      <p class="hint" style="margin-top:-6px">Aseo, capacitación, mantenimiento de equipos, apoyo a otra sede.</p>
      ${miCuarto?`<label class="hint" style="display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;padding:9px 11px;border:1px solid ${R.todas?"var(--prussian)":"var(--line)"};border-radius:var(--r);background:${R.todas?"#f2f7fb":"#fff"}">
        <input type="checkbox" id="verTodas" ${R.todas?"checked":""} style="width:18px;height:18px;accent-color:var(--prussian)">
        <span><b>Hoy estoy apoyando otro cuarto</b><br>
        Muestra las órdenes de todo el laboratorio. Registra la actividad real que hiciste allá: esas horas son tuyas y la producción se le acredita a ese cuarto.</span></label>`:""}
      ${!DB.ordenes.length?`<div class="empty">
        Todavía no hay órdenes en la app.<br><br>
        ${esCoordinador()?`Cárgalas desde <b>Conexión</b> o <b>Datos</b>.`:`Avísale a coordinación para que sincronice las órdenes del día.`}
      </div>`
      :lista.length?`<div class="pick">${lista.slice(0,60).map(o=>{
        const comps = DB.componentes.filter(c=>c.ordenId===o.id);
        const cus = [...cuartosDeOrden(o)];
        return `<button data-ot="${o.id}" class="${R.ordenId===o.id?"sel":""}">
          <div><div class="ot">OT ${esc(etiquetaOT(o))}</div>
          <div class="meta">${esc(o.cliente||"Sin cliente")} · ingresó ${fmtFecha(o.fechaIngreso)}${cus.length?" · "+cus.map(x=>esc(nom(DB.cuartos,x))).join(" + "):""}</div>
          ${(()=>{const h=hermanasDe(o); if(!h.length) return "";
            return `<div class="meta" style="color:var(--muted)">La OT ${esc(otBase(o.ot))} también tiene: ${h.map(x=>esc(x.ot.replace(otBase(x.ot)+"-",""))+" ("+esc(x.estado)+")").join(" · ")}</div>`;})()}
          ${o.revisar?`<div class="meta" style="color:var(--signal)">Falta ubicar: ${esc(o.revisar.join(" / "))}</div>`:""}
          ${(()=>{const h=hermanasDe(o); return h.length?`<div class="meta">También hay ${h.map(x=>esc(x.ot)).join(", ")} de la misma orden</div>`:"";})()}
          <div class="meta">${comps.length
            ? comps.map(c=>`${c.cantidad}× ${esc(nom(DB.tiposComponente,c.tipoComponenteId))}${c.tipologiaId?" "+esc(nom(DB.tipologias,c.tipologiaId,"")):""}`).join(" · ")
            : (o.tipoTexto?`<span class="tag">TIPO: ${esc(o.tipoTexto)}</span>`:`<span class="tag">sin componentes cargados</span>`)}</div></div>
          <div class="r">${chipEstado(o.estado)}</div>
        </button>`;}).join("")}</div>`
      :`<div class="empty">${q
          ? `Ninguna orden abierta de ${esc(nom(DB.cuartos,miCuarto))} coincide con “${esc(q)}”.<br><br>
             <button class="btn primary" id="crearBuscada">Crear la orden ${esc(q)}</button>`
          : `No hay órdenes abiertas asignadas a <b>${esc(nom(DB.cuartos,miCuarto))}</b>.<br><br>
             ${(()=>{const porCu=DB.cuartos.map(c=>({c, n:abiertas.filter(o=>cuartosDeOrden(o).has(c.id)).length})).filter(x=>x.n);
               const sinCu=abiertas.filter(o=>!cuartosDeOrden(o).size).length;
               if(!abiertas.length) return "No hay ninguna orden abierta en el laboratorio. Avísale a coordinación para que sincronice.";
               return `Hay ${abiertas.length} órdenes abiertas repartidas así:<br>
                 <span class="tag">${porCu.map(x=>esc(x.c.nombre)+": "+x.n).join(" · ")}${sinCu?` · sin cuarto: ${sinCu}`:""}</span><br><br>
                 Marca <b>“Hoy estoy apoyando otro cuarto”</b> arriba para verlas todas, y avísale a coordinación.`;})()}`}</div>`}
    </div>
  </div>`;
}
function pasoActividades(){
  const o = byId(DB.ordenes, R.ordenId);
  const me2 = YO? byId(DB.tecnicos,YO):null;
  const todosComps = DB.componentes.filter(c=>c.ordenId===R.ordenId);
  /* El técnico ve los componentes de su cuarto; si la orden es de otro cuarto
     los ve todos, para que un componente mal clasificado no lo deje sin registrar. */
  const comps = (!R.todas && me2 && todosComps.some(c=>cuartoDeComponente(c)===me2.cuartoId))
    ? todosComps.filter(c=>cuartoDeComponente(c)===me2.cuartoId) : todosComps;
  const c = R.componenteId ? byId(DB.componentes,R.componenteId) : null;
  const acts = c ? actividadesDeComponente(c.tipoComponenteId, c.cuartoId) : [];
  return `
  <div class="card">
    <header><h2>Paso 2 · ¿Qué hiciste?</h2><span class="sub mono">OT ${esc(o?etiquetaOT(o):"")}</span></header>
    <div class="body">
      ${R.recienGuardado?`<div style="border:1px solid #b6ddc6;background:#eaf6ef;color:var(--green);padding:10px 12px;border-radius:var(--r);margin-bottom:12px;font-size:13.5px">
        <b>Guardado.</b> Esta orden tiene más componentes: elige otro abajo para seguir registrando, o pulsa <b>Atrás</b> si ya terminaste con ella.</div>`:""}
      <label class="f"><span>Componente trabajado</span>
        <select id="compSel">
          <option value="">— Selecciona —</option>
          ${comps.map(x=>`<option value="${x.id}" ${R.componenteId===x.id?"selected":""}>${esc(nom(DB.tiposComponente,x.tipoComponenteId))} · ${esc(nom(DB.tipologias,x.tipologiaId,"—"))}${x.tipSupuesta?" (?)":""} · ${x.cantidad} und · ${esc(nom(DB.cuartos,x.cuartoId))}</option>`).join("")}
          <option value="__nuevo__">+ Agregar componente a esta OT…</option>
        </select>
      </label>
      ${c?`
      ${(me2 && c.cuartoId!==me2.cuartoId)?`<div style="border:1px solid #bcd0e2;background:#eaf1f8;color:var(--prussian);padding:9px 11px;border-radius:var(--r);margin:12px 0;font-size:13px">
        Estás registrando en <b>${esc(nom(DB.cuartos,c.cuartoId))}</b>, que no es tu cuarto base.
        Las horas se te acreditan a ti; la producción, a ${esc(nom(DB.cuartos,c.cuartoId))}.</div>`:""}
      <div class="eyebrow" style="margin:14px 0 7px">Actividades de ${esc(nom(DB.cuartos,c.cuartoId))} · marca las que realizaste</div>
      ${["Diagnóstico","Lavado","Reparación","Entrega","Apoyo"].map(fase=>{
        const grupo = acts.filter(a=>a.fase===fase);
        if(!grupo.length) return "";
        const simple = (DB.meta.capturaTiempo||"simple")==="simple";
        return `<div class="tag" style="margin:11px 0 5px">${fase.toUpperCase()}</div>` + grupo.map(a=>{
          const s = R.sel[a.id];
          const std = estandarMin(c.tipoComponenteId, c.tipologiaId, a.id);
          const cant = s? s.cantidad : c.cantidad;
          return `<div class="act ${s?"on":""}" data-act="${a.id}">
            <div class="hd"><input type="checkbox" ${s?"checked":""} data-chk="${a.id}">
              <span class="nm">${esc(a.nombre)}</span>
              <span class="std">${std?`${std} min${esPorOrden(a.id)?" por orden":"/und"}${origenEstandar(c.tipoComponenteId,c.tipologiaId,a.id)==="reparto"?` · ${repartoDe(c.tipoComponenteId,a.id)}% de la reparación`:""}`:"sin estándar"}</span></div>
            <div class="det">
              <label><span>Unidades${(()=>{
                const ya=yaRegistrado(c.id,a.id); if(!ya) return "";
                const queda=(c.cantidad||0)-ya;
                const quienes=[...new Set(RA().filter(r=>r.componenteId===c.id && r.actividadId===a.id)
                  .map(r=>nom(DB.tecnicos,r.tecnicoId)))];
                return ` <span style="text-transform:none;letter-spacing:0;color:${queda<=0?"var(--red)":"var(--amber)"}">· ya van ${ya} de ${c.cantidad}${quienes.length?" · las registró "+esc(quienes.join(", ")):""}${queda>0?" · quedan "+queda:""}</span>`;})()}</span>
                <input type="number" min="0" step="1" max="${Math.max(0,(c.cantidad||0)-yaRegistrado(c.id,a.id))}" data-cant="${a.id}" value="${cant}"></label>
              ${simple?`
              <label style="flex:1 1 100%;margin-top:2px">
                <span style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--ink)">
                  <input type="checkbox" data-adj="${a.id}" ${s&&s.ajustado?"checked":""} style="width:17px;height:17px;accent-color:var(--signal)">
                  Se salió del estándar ${std?`(${hrs(esPorOrden(a.id)?std:std*(cant||1))} h esperadas)`:""}
                </span></label>
              ${s&&s.ajustado?`<label><span>Tiempo real (min)</span><input type="number" min="0" step="5" data-min="${a.id}" value="${s.minutos}"></label>`:""}
              `:`
              <label><span>Tiempo real (min)</span><input type="number" min="0" step="5" data-min="${a.id}" value="${s?s.minutos:(std*(c.cantidad||1)||60)}"></label>
              `}
            </div></div>`;
        }).join("");
      }).join("")}
      `:`<div class="empty">Elige el componente para ver sus actividades.</div>`}
    </div>
  </div>`;
}

  <div class="card">
    <header><h2>Paso 3 · Cierre del registro</h2><span class="sub">Estado y novedades</span></header>
    <div class="body">
      <label class="f"><span>¿En qué estado queda la orden?</span>
        <select id="estadoOrden"><option value="">Sin cambio</option>
        ${DB.estados.map(e=>`<option ${R.estadoOrden===e?"selected":""}>${esc(e)}</option>`).join("")}</select></label>
      <p class="hint" style="margin-top:-6px">Solo si tú lo cambiaste. Si la orden sigue igual, déjalo en “Sin cambio”.</p>
      <hr class="sep">
      <label class="f"><span>Tipo de novedad</span>
        <select id="tipoNov"><option value="">Sin novedad</option>
        ${DB.tiposNovedad.map(t=>`<option ${R.tipoNovedad===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
      <label class="f"><span>Detalle</span>
        <textarea id="detNov" placeholder="Ej: faltó el kit de reparación, el banco EPS-205 quedó fuera de servicio a las 2pm…">${esc(R.novedad)}</textarea></label>

function barraRegistro(){
  const totalMin = Object.values(R.sel).reduce((a,s)=>a+(+s.minutos||0),0);
  const listo = R.paso===1 ? !!R.ordenId : R.paso===2 ? Object.keys(R.sel).length>0 : true;
  return `<div class="fixbar"><div class="in">
    <div class="sum">${Object.keys(R.sel).length} actividad(es)<br>${hrs(totalMin)} h · ${fmtFecha(R.fecha)}</div>
    <div class="sp"></div>
    ${R.paso>1?`<button class="btn" id="atras">Atrás</button>`:""}
    ${R.paso<3?`<button class="btn primary" id="siguiente" ${listo?"":"disabled"}>Siguiente</button>`
              :`<button class="btn warn" id="guardarReg">Guardar registro</button>`}
  </div></div>`;
}

function hoyDelTecnico(){
  const regs = RA().filter(r=>r.tecnicoId===YO && r.fecha===R.fecha);
  const tot = regs.reduce((a,r)=>a+r.minutos,0);
  const jor = capacidadDia(R.fecha) || 465;
  const pct = Math.min(100, Math.round(tot/jor*100));
  const dia = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"][new Date(R.fecha+"T12:00:00").getDay()];
  return `
  <div class="card">
    <header><h2>Lo que llevas registrado</h2><span class="sub mono">${dia} ${fmtFecha(R.fecha)} · ${hrs(tot)} h de ${hrs(jor)} h</span></header>
    <div class="body">
      <div class="gauge"><i class="${pct>=90?"ok":pct>=50?"warn":"bad"}" style="width:${pct}%"></i></div>
      ${regs.length?`<div class="tw" style="margin-top:12px"><table><thead><tr><th>OT</th><th>Componente</th><th>Actividad</th><th class="num">Und</th><th class="num">Real</th><th class="num">Std</th><th></th></tr></thead><tbody>
      ${regs.map(r=>{
        const o=byId(DB.ordenes,r.ordenId), c=fotoComponente(r);
        return `<tr><td class="mono">${o?esc(etiquetaOT(o)):(r.sinOrden?`<span class="tag">sin orden</span>`:(r.otTexto?`${esc(r.otTexto)} <span class="tag">ya no está en la hoja</span>`:`<span class="chip c-naranja">sin OT</span>`))}</td>
        <td>${c?esc(nom(DB.tiposComponente,c.tipoComponenteId)):(r.compTexto?`${esc(r.compTexto)}`:`<span class="tag">—</span>`)}</td>
        <td>${esc(nom(DB.actividades,r.actividadId))}</td>
        <td class="num">${r.cantidad}</td><td class="num">${hrs(r.minutos)}</td><td class="num">${hrs(r.minutosStd)}</td>
        <td><button class="btn sm danger" data-delreg="${r.id}">Borrar</button></td></tr>`;
      }).join("")}</tbody></table></div>`:`<div class="empty" style="margin-top:10px">Aún no hay registros para esta fecha.</div>`}
    </div>
  </div>`;
}

function pRegistro(){
  const rcv=$("#recargarYa"); if(rcv) rcv.onclick=()=>{ sessionStorage.setItem("labdiesel_recarga",VER_NUEVA); location.reload(true); };
  const $f=$("#fechaReg"); if($f) $f.onchange=e=>{R.fecha=e.target.value; render();};
  const $b=$("#buscaOT"); if($b){ $b.oninput=e=>{ R.busca=e.target.value; const p=e.target.selectionStart; render(); const n=$("#buscaOT"); n.focus(); n.setSelectionRange(p,p); }; }
  document.querySelectorAll("[data-ot]").forEach(b=>b.onclick=()=>{
    R.ordenId=b.dataset.ot; R.componenteId=null; R.sel={}; R.paso=2; window.scrollTo(0,0); render();
  });
  const $n=$("#nuevaOT"); if($n) $n.onclick=()=>modalOrden(null, R.busca.trim());
  const $cb=$("#crearBuscada"); if($cb) $cb.onclick=()=>modalOrden(null, R.busca.trim());
  const $vt=$("#verTodas"); if($vt) $vt.onchange=e=>{ R.todas=e.target.checked; render(); };
  const $so=$("#sinOrden"); if($so) $so.onclick=()=>modalSinOrden();
  const $c=$("#compSel"); if($c) $c.onchange=e=>{
    R.recienGuardado=false;
    if(e.target.value==="__nuevo__"){ modalComponente(R.ordenId); return; }
    R.componenteId=e.target.value||null; R.sel={}; render();
  };
  document.querySelectorAll("[data-chk]").forEach(ch=>ch.onchange=()=>{
    const id=ch.dataset.chk, c=byId(DB.componentes,R.componenteId);
    if(ch.checked){ const std=estandarMin(c.tipoComponenteId,c.tipologiaId,id);
      R.sel[id]={cantidad:c.cantidad||1, minutos:(std*(c.cantidad||1))||60, estado:"", ajustado:false}; }
    else delete R.sel[id];
    render();
  });
  document.querySelectorAll("[data-cant]").forEach(i=>i.onchange=()=>{
    const id=i.dataset.cant; if(!R.sel[id]) return;
    R.sel[id].cantidad=+i.value||0;
    if(!R.sel[id].ajustado){
      const cc=byId(DB.componentes,R.componenteId);
      const std=cc?estandarMin(cc.tipoComponenteId,cc.tipologiaId,id):0;
      R.sel[id].minutos = std*R.sel[id].cantidad || R.sel[id].minutos;
    }
    render();
  });
  document.querySelectorAll("[data-adj]").forEach(i=>i.onchange=()=>{
    const id=i.dataset.adj; if(!R.sel[id]) return;
    R.sel[id].ajustado=i.checked;
    if(!i.checked){
      const cc=byId(DB.componentes,R.componenteId);
      const std=cc?estandarMin(cc.tipoComponenteId,cc.tipologiaId,id):0;
      R.sel[id].minutos = std*(R.sel[id].cantidad||1);
    }
    render();
  });
  document.querySelectorAll("[data-min]").forEach(i=>i.onchange=()=>{ const id=i.dataset.min; if(R.sel[id]) R.sel[id].minutos=+i.value||0; });
  const $eo=$("#estadoOrden"); if($eo) $eo.onchange=e=>R.estadoOrden=e.target.value;
  const $t=$("#tipoNov"); if($t) $t.onchange=e=>R.tipoNovedad=e.target.value;
  const $d=$("#detNov"); if($d) $d.oninput=e=>R.novedad=e.target.value;
  const $a=$("#atras"); if($a) $a.onclick=()=>{ R.paso--; render(); };
  const $s=$("#siguiente"); if($s) $s.onclick=()=>{ R.paso++; render(); };
  const $g=$("#guardarReg"); if($g) $g.onclick=guardarRegistro;
  document.querySelectorAll("[data-delreg]").forEach(b=>b.onclick=()=>anularRegistro(b.dataset.delreg));
}

async function guardarRegistro(){
  const c = byId(DB.componentes, R.componenteId);
  if(!c || !Object.keys(R.sel).length){ toast("Marca al menos una actividad"); return; }
  /* Tope: la orden trae N unidades, no se pueden registrar más. */
  const excesos=[];
  Object.entries(R.sel).forEach(([actId,s])=>{
    const ya=yaRegistrado(c.id, actId);
    const total=ya+(+s.cantidad||0);
    if(total > (c.cantidad||0)) excesos.push(`${nom(DB.actividades,actId)}: ${total} de ${c.cantidad} (ya había ${ya})`);
  });
  if(excesos.length){
    const msg=`La orden trae ${c.cantidad} ${nom(DB.tiposComponente,c.tipoComponenteId)}. Con lo que vas a guardar se pasaría:\n\n${excesos.join("\n")}\n\n`;
    if(!esCoordinador()){
      await dialogo({titulo:"Más unidades de las que tiene la orden",
        mensaje:msg+"Corrige la cantidad. Si de verdad llegaron más piezas, avísale a coordinación para que ajuste la orden.",
        ok:"Entendido", cancelar:"Cerrar"});
      return;
    }
    if(!await confirmar("Más unidades de las que tiene la orden",
      msg+"Como coordinación puedes continuar, pero el indicador de entregas quedará por encima de lo que ingresó.","Guardar de todos modos")) return;
  }
  const nuevos = Object.entries(R.sel).map(([actId,s])=>({
    id:uid("rg"), fecha:R.fecha, tecnicoId:YO, ordenId:R.ordenId, componenteId:R.componenteId,
    cuartoId:c.cuartoId, actividadId:actId, cantidad:+s.cantidad||0, minutos:+s.minutos||0,
    tipoComponenteId:c.tipoComponenteId, tipologiaId:c.tipologiaId||null,   /* foto: sobrevive a la orden */
    minutosStd: stdRegistro(c, actId, s.cantidad),
    tiempoMedido: !!s.ajustado,
    estadoNuevo:R.estadoOrden||"", tipoNovedad:R.tipoNovedad||"", novedad:R.novedad||"",
    creado:new Date().toISOString(), creadoPor:YO, historial:[],
    actualizado:new Date().toISOString(),
    otTexto:(byId(DB.ordenes,R.ordenId)||{}).ot||"",
    compTexto:nom(DB.tiposComponente,c.tipoComponenteId,"")
  }));
  const ultEstado = R.estadoOrden||"";
  const otrosComp = DB.componentes.filter(x=>x.ordenId===R.ordenId && x.id!==R.componenteId);
  await commit(()=>{
    DB.registros.push(...nuevos);
    if(ultEstado){
      const comp = byId(DB.componentes,R.componenteId); if(comp) comp.estado=ultEstado;
      const ord = byId(DB.ordenes,R.ordenId); if(ord) ord.estado=ultEstado;
    }
  }, "Registro guardado ✓");
  empujarRegistros().catch(e=>{
    DB.meta.subidaError=e.message||"no se pudo subir";
    /* Un fallo de red suele ser pasajero: se reintenta una vez, sin perder nada.
       Lo registrado ya está guardado en este equipo. */
    setTimeout(()=>empujarRegistros().catch(()=>{}), 45000);
  });
  if(otrosComp.length){
    /* La orden tiene más componentes: se queda en ella para seguir registrando. */
    R.componenteId=null; R.sel={}; R.novedad=""; R.tipoNovedad=""; R.estadoOrden=""; R.paso=2;
    R.recienGuardado=true;
    render();
  } else {
    R = { paso:1, fecha:R.fecha, ordenId:null, componenteId:null, sel:{}, novedad:"", tipoNovedad:"", busca:"", todas:R.todas, estadoOrden:"" };
    render();
  }
}

/* =========================================================================
   VISTA · MI SEMANA (lo que cada técnico puede ver de sí mismo)
   ========================================================================= */
let MS = {lunes:""};
function vMiSemana(){
  if(!YO) return `<div class="card"><div class="body"><div class="empty">Elige quién eres arriba a la derecha.</div></div></div>`;
  const cabSync = avisoVersion() + barraSync();
  const lun = MS.lunes || semanaDe(hoyISO());
  const [d,h] = rangoSemana(lun);
  const rs = RA().filter(r=>r.tecnicoId===YO && r.fecha>=d && r.fecha<=h);
  const real = rs.reduce((a,r)=>a+r.minutos,0);
  const std = rs.reduce((a,r)=>a+r.minutosStd,0);
  const cap = capacidadRango(d,h);
  const ocup = cap? Math.round(real/cap*100):0;
  const nombresDia=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const dias=[]; const a=new Date(d+"T12:00:00");
  for(let i=0;i<7;i++){ const iso=isoLocal(a);
    const c=capacidadDia(iso);
    if(c>0) dias.push({iso, dow:new Date(iso+"T12:00:00").getDay(), cap:c, min:rs.filter(r=>r.fecha===iso).reduce((x,r)=>x+r.minutos,0)});
    a.setDate(a.getDate()+1); }
  const maxD = Math.max(1,...dias.map(x=>x.cap));

  return cabSync + `
  <div class="card"><div class="body"><div class="row" style="align-items:end">
    <label class="f" style="max-width:200px"><span>Semana del</span><input type="date" id="msLunes" value="${lun}"></label>
    <div style="flex:0 0 auto;margin-bottom:11px"><button class="btn sm" id="msPrev">← Anterior</button>
    <button class="btn sm" id="msHoy">Esta semana</button>
    <button class="btn sm" id="msNext">Siguiente →</button></div>
  </div></div></div>

  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="l">Horas registradas</div><div class="v">${hrs(real)}</div><div class="h">de ${hrs(cap)} h de la semana</div></div>
    <div class="kpi"><div class="l">Cumplimiento</div><div class="v">${ocup}%</div>
      <div class="gauge"><i class="${ocup>=90?"ok":ocup>=60?"warn":"bad"}" style="width:${Math.min(100,ocup)}%"></i></div></div>
    <div class="kpi"><div class="l">Producción estándar</div><div class="v">${hrs(std)}</div><div class="h">${real?Math.round(std/real*100):0}% vs tiempo real</div></div>
    ${(()=>{const me=byId(DB.tecnicos,YO); const fuera=rs.filter(r=>me&&r.cuartoId!==me.cuartoId);
      const mf=fuera.reduce((a,r)=>a+r.minutos,0);
      return mf?`<div class="kpi"><div class="l">Apoyo a otros cuartos</div><div class="v">${hrs(mf)}</div>
        <div class="h">${[...new Set(fuera.map(r=>nom(DB.cuartos,r.cuartoId)))].join(", ")}</div></div>`
      :`<div class="kpi"><div class="l">Actividades</div><div class="v">${rs.length}</div><div class="h">${rs.reduce((x,r)=>x+r.cantidad,0)} unidades</div></div>`;})()}
  </div>

  <div class="card"><header><h2>Día por día</h2></header><div class="body"><div class="bars">
    ${dias.map(x=>`<div class="bar"><div class="t">${nombresDia[x.dow]}</div>
      <div class="track"><i class="${x.min>=x.cap*0.9?"":"b"}" style="width:${Math.min(100,x.min/maxD*100)}%"></i></div>
      <div class="n">${hrs(x.min)} / ${hrs(x.cap)} h</div></div>`).join("")}
  </div></div></div>

  <div class="card"><header><h2>Mis registros</h2><span class="sub mono">${rs.length}</span></header><div class="body">
    ${rs.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>OT</th><th>Componente</th><th>Actividad</th><th class="num">Und</th><th class="num">Horas</th></tr></thead><tbody>
    ${rs.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(r=>{
      const o=byId(DB.ordenes,r.ordenId), c=fotoComponente(r);
      return `<tr><td class="mono">${fmtFecha(r.fecha)}</td><td class="mono">${o?esc(etiquetaOT(o)):(r.sinOrden?`<span class="tag">sin orden</span>`:(r.otTexto?`${esc(r.otTexto)} <span class="tag">ya no está en la hoja</span>`:`<span class="chip c-naranja">sin OT</span>`))}</td>
      <td>${c?esc(nom(DB.tiposComponente,c.tipoComponenteId)):"—"} ${c?esc(nom(DB.tipologias,c.tipologiaId,"")):""}</td>
      <td>${esc(nom(DB.actividades,r.actividadId))}</td><td class="num">${r.cantidad}</td><td class="num">${hrs(r.minutos)}</td></tr>`;
    }).join("")}</tbody></table></div>`:`<div class="empty">Sin registros esta semana.</div>`}
  </div></div>`;
}
function pMiSemana(){
  const rc=$("#recargarYa"); if(rc) rc.onclick=()=>{ sessionStorage.setItem("labdiesel_recarga",VER_NUEVA); location.reload(true); };
  if(!YO) return;                     /* sin técnico elegido no hay controles que enganchar */

let FO = {q:"", estado:"", cuarto:"", verCerradas:false, soloRevisar:false};

    if(FO.cuarto && !DB.componentes.some(c=>c.ordenId===o.id && c.cuartoId===FO.cuarto)) return false;

  <div class="card">
    <header><h2>Órdenes de trabajo</h2><span class="sub mono">${lista.length}/${DB.ordenes.length}${(()=>{
       const fs=DB.ordenes.map(o=>o.fechaIngreso).filter(Boolean).sort();
       return fs.length?` · de ${fmtFecha(fs[0])} a ${fmtFecha(fs[fs.length-1])}`:"";

        <select id="fc"><option value="">Todos los cuartos</option>${DB.cuartos.map(c=>`<option value="${c.id}" ${FO.cuarto===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin:-4px 0 12px">
        <label class="hint" style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="fcerr" ${FO.verCerradas?"checked":""} style="width:17px;height:17px">
          <span>Incluir órdenes cerradas (${DB.ordenes.filter(o=>cerr.has(o.estado)).length})</span></label>
        <label class="hint" style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="frev" ${FO.soloRevisar?"checked":""} style="width:17px;height:17px;accent-color:var(--signal)">
          <span>Solo las que necesitan revisión (${DB.ordenes.filter(o=>o.revisar).length})</span></label>
      </div>
      ${FO.soloRevisar?panelRevision():""}
      ${lista.length?`<div class="tw"><table><thead><tr><th>OT</th><th>Cliente</th><th>Ingreso</th><th>Componentes</th><th>Estado</th><th style="width:150px">Avance</th><th class="num">h reales</th><th></th></tr></thead><tbody>
      ${lista.map(o=>{
        const cs=DB.componentes.filter(c=>c.ordenId===o.id);
        const min=RA().filter(r=>r.ordenId===o.id).reduce((a,r)=>a+r.minutos,0);
        return `<tr>
          <td class="mono"><b>${esc(etiquetaOT(o))}</b>
            ${o.revisar?`<br><span class="chip c-naranja" title="La celda TIPO trae: ${esc(o.revisar.join(" / "))}">revisar</span>`:""}
            ${(()=>{const h=hermanasDe(o); return h.length?`<br><span class="tag">parte de ${esc(otBase(o.ot))} · ${h.map(x=>esc(x.ot)+" ("+esc(x.estado)+")").join(", ")}</span>`:"";})()}</td>
          <td>${esc(o.cliente||"—")}</td>
          <td class="mono">${fmtFecha(o.fechaIngreso)}</td>
          <td>${o.revisar?`<div class="tag" style="color:var(--signal)">TIPO sin ubicar: <b>${esc(o.revisar.join(" / "))}</b> — falta agregar ese componente</div>`:""}
            ${cs.length?cs.map(c=>{const av=avanceComponente(c); const pend=pendientesComponente(c);
            const hayReparto = sumaReparto(c.tipoComponenteId)>0;
            return `<div class="tag">${c.cantidad}× ${esc(nom(DB.tiposComponente,c.tipoComponenteId))} <b>${esc(nom(DB.tipologias,c.tipologiaId,""))}</b>${c.tipSupuesta?' <span style="color:var(--amber)">(por confirmar)</span>':""}${
              !hayReparto ? ' · <span style="color:var(--amber)">sin reparto definido</span>'
              : ` · ${av}%${pend.length?` · falta: ${esc(pend.slice(0,2).map(a=>a.nombre).join(", "))}${pend.length>2?"…":""}`:" · completo"}`}</div>`;

          <td>${chipEstado(o.estado)}</td>

            return `<div class="gauge" style="margin:0"><i class="${av>=100?"ok":av>=50?"warn":""}" style="width:${av}%"></i></div>

function panelRevision(){
  const rev=DB.ordenes.filter(o=>o.revisar);
  if(!rev.length) return `<div style="border:1px solid #b6ddc6;background:#eaf6ef;color:var(--green);padding:10px 12px;border-radius:var(--r);margin-bottom:14px;font-size:13.5px"><b>No queda ninguna orden por revisar.</b></div>`;
  const g={};
  rev.forEach(o=>(o.revisar||[]).forEach(t=>{ (g[t]=g[t]||[]).push(o); }));
  const filas=Object.entries(g).sort((a,b)=>b[1].length-a[1].length);
  return `<div class="card" style="border-color:#f3ccb0"><header><h2>Qué hay que revisar</h2>
    <span class="sub mono">${rev.length} órdenes · ${filas.length} textos distintos</span></header>
  <div class="body">
    <p class="hint" style="margin-top:0">La celda TIPO trae un texto que no se pudo asignar a ningún componente. Agrupado por texto, casi siempre son pocas causas repetidas.</p>
    ${(()=>{const sinNada=rev.filter(o=>!DB.componentes.some(c=>c.ordenId===o.id));
      return sinNada.length
        ? `<div style="border:1px solid #f3ccb0;background:#fdefe5;color:var(--signal);padding:9px 11px;border-radius:var(--r);margin-bottom:12px;font-size:13px">
           <b>${sinNada.length} de estas órdenes llegaron sin ninguna cantidad</b> en las columnas INYECT., BOMBAS, RIELES, TURBOS…
           A esas hay que agregarles el componente a mano con <b>+ Componente</b>: ${sinNada.slice(0,6).map(o=>esc(o.ot)).join(", ")}${sinNada.length>6?` y ${sinNada.length-6} más`:""}.</div>`
        : `<div style="border:1px solid #b6ddc6;background:#eaf6ef;color:var(--green);padding:9px 11px;border-radius:var(--r);margin-bottom:12px;font-size:13px">
           Todas estas órdenes <b>sí tienen componentes cargados</b>. Solo falta decidir si el texto es una tipología o no.</div>`;})()}
    <p class="scroll-hint">Desliza la tabla a los lados para ver todas las columnas.</p>
    <div class="tw"><table class="acc"><thead><tr><th>Texto sin ubicar</th><th class="num">Órdenes</th><th>Situación</th><th>Acciones</th></tr></thead><tbody>
    ${filas.map(([tk,ords])=>{
      const conComp=ords.filter(o=>DB.componentes.some(c=>c.ordenId===o.id)).length;
      const sinComp=ords.length-conComp;
      return `<tr>
        <td><b class="mono">${esc(tk)}</b></td>
        <td class="num mono">${ords.length}</td>
        <td class="tag">
          <div>${conComp} con componentes cargados ${conComp?'<span style="color:var(--green)">✓ se puede aplicar</span>':""}</div>
          <div style="${sinComp?"color:var(--signal)":"opacity:.45"}">${sinComp} sin ninguna cantidad en la hoja ${sinComp?"— hay que agregar el componente a mano":""}</div>
        </td>
        <td style="white-space:nowrap">
          ${conComp?`<button class="btn sm primary" data-aplicar="${esc(tk)}">Es una tipología</button> `:""}
          <button class="btn sm" data-ignorar="${esc(tk)}">No es tipología</button></td>
      </tr>`;}).join("")}
    </tbody></table></div>
    <p class="hint" style="margin-top:10px">
      <b>“Es una tipología”</b>: la aplica a todos los componentes de esas órdenes y quita la marca.<br>
      <b>“No es tipología”</b>: la app deja de intentar ubicarla, ahora y en futuras sincronizaciones. Úsalo con textos que no describen componentes.<br>
      Las que llegaron <b>sin cantidades</b> son un vacío de la hoja: ahí toca abrir la orden y usar <b>+ Componente</b>.</p>
  </div></div>`;
}
function pOrdenes(){
  $("#fq").oninput=e=>{FO.q=e.target.value; const p=e.target.selectionStart; render(); const n=$("#fq"); n.focus(); n.setSelectionRange(p,p);};
  $("#fe").onchange=e=>{FO.estado=e.target.value;render();};
  $("#fc").onchange=e=>{FO.cuarto=e.target.value;render();};
  const fce=$("#fcerr"); if(fce) fce.onchange=e=>{FO.verCerradas=e.target.checked;render();};
  const frv=$("#frev"); if(frv) frv.onchange=e=>{FO.soloRevisar=e.target.checked;render();};
  document.querySelectorAll("[data-aplicar]").forEach(b=>b.onclick=async()=>{
    const tk=b.dataset.aplicar;
    const ords=DB.ordenes.filter(o=>(o.revisar||[]).includes(tk) && DB.componentes.some(c=>c.ordenId===o.id));
    const muestra=ords.slice(0,8).map(o=>{
      const cs=DB.componentes.filter(c=>c.ordenId===o.id && !c.tipologiaId);
      return `  OT ${o.ot}  (TIPO en la hoja: ${o.tipoTexto||"—"})\n     ${cs.map(c=>c.cantidad+"x "+nom(DB.tiposComponente,c.tipoComponenteId)).join(", ")||"nada por asignar"}`;
    }).join("\n");
    if(!await confirmar("Aplicar tipología",
      `"${tk}" se tomará de la celda TIPO de cada orden y se pondrá a sus componentes sin tipología.\n`+
      `No se pisa ninguna tipología ya asignada.\n\n`+
      `Órdenes afectadas: ${ords.length}\n\n${muestra}${ords.length>8?`\n  …y ${ords.length-8} más`:""}`,
      "Aplicar a las "+ords.length)) return;
    commitMaestro(()=>{
      /* Una sola tipología para el texto, sin atarla a un componente: así vale
         para todos los que la usen y el resolver la encuentra la próxima vez. */
      let tpGlobal = DB.tipologias.find(x=>!x.tipoComponenteId && coincideTipologia(x,tk))
                  || DB.tipologias.find(x=>coincideTipologia(x,tk));
      if(tpGlobal && tpGlobal.tipoComponenteId){
        /* estaba atada a un componente: se libera para que sirva en cualquiera */
        tpGlobal.tipoComponenteId="";
      }
      if(!tpGlobal) tpGlobal = buscarOCrear("tipologias", tk, {cuartoId:"", tipoComponenteId:""});
      ords.forEach(o=>{
        const cs=DB.componentes.filter(c=>c.ordenId===o.id);
        cs.forEach(c=>{ if(!c.tipologiaId) c.tipologiaId=tpGlobal.id; });
        const t=byId(DB.ordenes,o.id);
        if(t){ const q=(t.revisar||[]).filter(x=>x!==tk); t.revisar=q.length?q:null; }
      });
    }, `"${tk}" aplicada a ${ords.length} orden(es)`);
  });
  document.querySelectorAll("[data-ignorar]").forEach(b=>b.onclick=async()=>{
    const tk=b.dataset.ignorar;
    if(!await confirmar("No es una tipología",`La app dejará de intentar ubicar "${tk}", ahora y en las próximas sincronizaciones.`,"Ignorar siempre")) return;
    commitMaestro(()=>{
      DB.meta.tokensIgnorados=[...new Set([...(DB.meta.tokensIgnorados||[]), sinTildes(tk)])];
      DB.ordenes.forEach(o=>{ if(o.revisar){ const q=o.revisar.filter(x=>x!==tk); o.revisar=q.length?q:null; } });
    }, `"${tk}" ignorada de aquí en adelante`);
  });
  $("#addOT").onclick=()=>modalOrden();
  document.querySelectorAll("[data-edot]").forEach(b=>b.onclick=()=>modalOrden(b.dataset.edot));
  document.querySelectorAll("[data-rehacer]").forEach(b=>b.onclick=()=>rehacerOrden(b.dataset.rehacer));
}

/* =========================================================================
   VISTA 3 · DASHBOARD
   ========================================================================= */
let FD = {desde:"", hasta:"", cuarto:"", tecnico:"", verAnulados:false};
function rangoActivo(){
  const d = FD.desde || semanaDe(hoyISO());
  const h = FD.hasta || rangoSemana(semanaDe(hoyISO()))[1];
  return [d,h];
}
function regsFiltrados(){
  const [d,h]=rangoActivo();
  return RA().filter(r=>r.fecha>=d && r.fecha<=h
    && (!FD.cuarto || r.cuartoId===FD.cuarto)
    && (!FD.tecnico || r.tecnicoId===FD.tecnico));
}
/* Panel para marcar quién no vino y por cuánto tiempo. */
function panelAusencias(d,h){
  const activos=DB.tecnicos.filter(t=>t.activo!==false && t.rol!=="coordinador");
  const enRango=(DB.ausencias||[]).filter(a=>a.desde<=h && (!a.hasta || a.hasta>=d))
    .sort((a,b)=>(a.hasta?1:0)-(b.hasta?1:0) || b.desde.localeCompare(a.desde));
  const perdidas=minutosAusencia(d,h);
  const capIdeal=capacidadRango(d,h)*activos.length;
  return `<div class="card noprint"><header><h2>Ausencias y jornada</h2>
    <span class="sub mono">${hrs(perdidas)} h de ${hrs(capIdeal)} h</span>
    <div class="push"><button class="btn sm primary" id="ausAdd">+ Registrar ausencia</button></div></header>

function diasHabiles(d,h){
  let n=0; const a=new Date(d+"T12:00:00"), b=new Date(h+"T12:00:00");
  while(a<=b){ const w=a.getDay(); if(w!==0) n++; a.setDate(a.getDate()+1); }
  return Math.max(1,n);
}

/* =========================================================================
   VISTA · INGRESOS  ·  qué entró al laboratorio, no cómo se trabajó
   ========================================================================= */
let FI={desde:"",hasta:"",cuarto:"",modoEntrega:"",baseEntrega:"entrega"};
function rangoIngresos(){
  const d=FI.desde || semanaDe(hoyISO());
  const h=FI.hasta || rangoSemana(semanaDe(hoyISO()))[1];
  return [d,h];
}
function vIngresos(){
  const [d,h]=rangoIngresos();
  let ords=DB.ordenes.filter(o=>o.fechaIngreso>=d && o.fechaIngreso<=h);
  if(FI.cuarto) ords=ords.filter(o=>cuartosDeOrden(o).has(FI.cuarto));
  const ids=new Set(ords.map(o=>o.id));
  let comps=DB.componentes.filter(c=>ids.has(c.ordenId));
  if(FI.cuarto) comps=comps.filter(c=>cuartoDeComponente(c)===FI.cuarto);
  const und=comps.reduce((a,c)=>a+(+c.cantidad||0),0);
  const cerr=cerrados();

  const agrupa=(arr,fn)=>{ const g={}; arr.forEach(x=>{ const k=fn(x)||"Sin definir"; g[k]=(g[k]||0)+1; }); 
    return Object.entries(g).sort((a,b)=>b[1]-a[1]); };
  const porMotivo=agrupa(ords,o=>o.motivo);
  const porEstado=agrupa(ords,o=>o.estado);
  const porCliente=agrupa(ords,o=>o.cliente).slice(0,10);
  const porCuarto=DB.cuartos.map(cu=>({cu, n:ords.filter(o=>cuartosDeOrden(o).has(cu.id)).length,
    und:comps.filter(c=>cuartoDeComponente(c)===cu.id).reduce((a,c)=>a+(+c.cantidad||0),0)})).filter(x=>x.n||x.und);

  /* ENTREGAS: se cuentan por lo que el técnico registró como entregado,
     no por el estado de la orden. Así una entrega parcial (4 de 6 inyectores)
     sí queda contada, que era el hueco del método anterior. */
  const regsEnt = RA().filter(r=>{
    if(r.fecha<d || r.fecha>h) return false;
    const a=byId(DB.actividades,r.actividadId);
    if(!a || a.fase!=="Entrega") return false;
    if(FI.cuarto && r.cuartoId!==FI.cuarto) return false;
    return true;
  });
  /* Se agrupa por componente y se limita a lo que la orden trajo:
     nunca se puede entregar más de lo que entró. */
  const porComp={};
  regsEnt.forEach(r=>{ porComp[r.componenteId]=(porComp[r.componenteId]||0)+(+r.cantidad||0); });
  let entMatriz={}, undEnt=0, recortadas=0;

  /* MODO HISTÓRICO: meses sin registros de técnicos. La única fuente es la hoja:
     órdenes que quedaron en estado Entregado y los componentes que traían. */
  const modoEnt = FI.modoEntrega || (Object.keys(porComp).length? "registro" : "estado");
  if(modoEnt==="estado"){
    const porIngreso = FI.baseEntrega==="ingreso";
    const entregadasOrd = DB.ordenes.filter(o=>{
      if(!/entregad/i.test(o.estado||"")) return false;
      const ref = porIngreso ? o.fechaIngreso : (o.fechaEntrega || o.fechaIngreso);
      if(ref<d || ref>h) return false;
      if(FI.cuarto && !cuartosDeOrden(o).has(FI.cuarto)) return false;
      return true;
    });
    const idsEnt=new Set(entregadasOrd.map(o=>o.id));
    DB.componentes.filter(c=>idsEnt.has(c.ordenId) && (!FI.cuarto || c.cuartoId===FI.cuarto)).forEach(c=>{
      const k=nom(DB.tiposComponente,c.tipoComponenteId)+"|"+nom(DB.tipologias,c.tipologiaId,"Sin tipología")+"|"+nom(DB.cuartos,c.cuartoId);
      entMatriz[k]=(entMatriz[k]||0)+(+c.cantidad||0);
      undEnt+=(+c.cantidad||0);
    });
    var ordsEnt=entregadasOrd.length;
  } else {
    Object.entries(porComp).forEach(([cid,q])=>{

  ${(()=>{

      ${(()=>{ /* titular: total por componente, sin abrir por tipología */

  <div class="grid g2">
    ${hayMotivo?`<div class="card"><header><h2>Motivo de ingreso</h2></header><div class="body">${barras(porMotivo,ords.length)}</div></div>`:""}

    <div class="card"><header><h2>Clientes con más ingresos</h2></header><div class="body">${barras(porCliente,ords.length)}</div></div>
    <div class="card"><header><h2>Por cuarto</h2></header><div class="body">
      ${porCuarto.length?`<div class="bars">${(()=>{const mx=Math.max(1,...porCuarto.map(x=>x.und));
        return porCuarto.map(x=>`<div class="bar"><div class="t">${esc(x.cu.nombre)}</div>
        <div class="track"><i style="width:${x.und/mx*100}%"></i></div>
        <div class="n">${x.und} und · ${x.n} OT</div></div>`).join("");})()}</div>`:`<div class="empty">Sin datos.</div>`}
    </div></div>
  </div>

  ${(()=>{
    const gars=ords.filter(o=>/garant/i.test(o.motivo||""));
    if(!gars.length) return "";
    const aplica=o=>{ const g=sinTildes(o.garantia||""); if(!g) return "sin definir";
      if(/^no/.test(g)||/no aplica/.test(g)) return "No aplica";
      if(/aplica|^si/.test(g)) return "Sí aplica";
      return o.garantia; };
    const si=gars.filter(o=>aplica(o)==="Sí aplica"), no=gars.filter(o=>aplica(o)==="No aplica");
    const pend=gars.filter(o=>aplica(o)==="sin definir");
    const estSi={}; si.forEach(o=>{ const e=o.estado||"Sin estado"; estSi[e]=(estSi[e]||0)+1; });
    const listaEst=Object.entries(estSi).sort((a,b)=>b[1]-a[1]);
    const maxE=Math.max(1,...listaEst.map(x=>x[1]));
    const undG=DB.componentes.filter(c=>gars.some(o=>o.id===c.ordenId)).reduce((a,c)=>a+(+c.cantidad||0),0);
    return `<div class="card" style="border-color:#bcd0e2"><header><h2>Garantías</h2>
      <span class="sub mono">${gars.length} órdenes · ${undG} componentes</span></header>

      <div class="kpis" style="margin-bottom:14px">
        <div class="kpi"><div class="l">Garantías ingresadas</div><div class="v">${gars.length}</div>
          <div class="h">${ords.length?Math.round(gars.length/ords.length*100):0}% del ingreso</div></div>
        <div class="kpi"><div class="l">Sí aplicaron</div><div class="v">${si.length}</div>
          <div class="h">${gars.length?Math.round(si.length/gars.length*100):0}% de las garantías</div>
          <div class="gauge"><i class="ok" style="width:${gars.length?si.length/gars.length*100:0}%"></i></div></div>
        <div class="kpi"><div class="l">No aplicaron</div><div class="v">${no.length}</div>
          <div class="h">pasan a autorización del cliente</div></div>
        <div class="kpi ${pend.length?"alert":""}"><div class="l">Sin definir</div><div class="v">${pend.length}</div>
          <div class="h">falta decidir si aplica</div></div>
      </div>
      ${(()=>{
        const bloque=(titulo,lista,color,nota)=>{
          if(!lista.length) return "";
          const g={}; lista.forEach(o=>{ const e=o.estado||"Sin estado"; g[e]=(g[e]||0)+1; });
          const ent=Object.entries(g).sort((a,b)=>b[1]-a[1]);
          const mx=Math.max(1,...ent.map(x=>x[1]));
          const cerradasG=lista.filter(o=>cerrados().has(o.estado)).length;
          return `<div class="card" style="margin-bottom:0"><header><h2>${titulo}</h2>
            <span class="sub mono">${lista.length} · ${cerradasG} ya cerradas</span></header>

              <div class="bars">${ent.map(([e,v])=>`<div class="bar">

                <div class="track"><i class="${color}" style="width:${v/mx*100}%"></i></div>
                <div class="n">${v} · ${Math.round(v/lista.length*100)}%</div></div>`).join("")}</div>
            </div></div>`;
        };
        return `<div class="grid g2" style="margin-bottom:14px">
          ${bloque("En qué van las que SÍ aplicaron", si, "", "Se reparan de inmediato: aquí no debería haber nada esperando autorización.")}
          ${bloque("En qué van las que NO aplicaron", no, "b", "Dependen de que el cliente autorice. Lo que lleve semanas en “pendiente autorización” es plata detenida.")}
          ${bloque("Las que están sin definir", pend, "b", "Aún no se ha dictaminado si la garantía procede.")}
        </div>`;
      })()}
      <div class="tw" style="max-height:300px;overflow:auto"><table>
        <thead><tr><th>OT</th><th>Cliente</th><th>Ingreso</th><th>¿Aplica?</th><th>Estado actual</th></tr></thead><tbody>

function pIngresos(){
  $("#id1").onchange=e=>{FI.desde=e.target.value;render();};
  $("#id2").onchange=e=>{FI.hasta=e.target.value;render();};
  $("#ic").onchange=e=>{FI.cuarto=e.target.value;render();};
  document.querySelectorAll("[data-irng]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.irng, hy=hoyISO();
    if(t==="semana"){ const l=semanaDe(hy); FI.desde=l; FI.hasta=rangoSemana(l)[1]; }
    if(t==="pasada"){ const l=new Date(semanaDe(hy)+"T12:00:00"); l.setDate(l.getDate()-7);
      const li=isoLocal(l); FI.desde=li; FI.hasta=rangoSemana(li)[1]; }
    if(t==="mes"){ FI.desde=hy.slice(0,8)+"01"; FI.hasta=hy; }
    render();
  });
  document.querySelectorAll("[data-modoent]").forEach(b=>b.onclick=()=>{ FI.modoEntrega=b.dataset.modoent; render(); });
  document.querySelectorAll("[data-baseent]").forEach(b=>b.onclick=()=>{ FI.baseEntrega=b.dataset.baseent; render(); });
  $("#imprimirIng").onclick=()=>window.print();
  $("#csvIng").onclick=()=>{
    const [d,h]=rangoIngresos();
    const ords=DB.ordenes.filter(o=>o.fechaIngreso>=d && o.fechaIngreso<=h);
    const ids=new Set(ords.map(o=>o.id));
    const hh=["OT","Cliente","Fecha_ingreso","Motivo","Estado","Cuarto","Componente","Tipologia","Unidades"];
    const rows=[];
    DB.componentes.filter(c=>ids.has(c.ordenId)).forEach(c=>{
      const o=byId(DB.ordenes,c.ordenId);
      rows.push([o.ot,o.cliente,o.fechaIngreso,o.motivo||"",o.estado,nom(DB.cuartos,c.cuartoId),
        nom(DB.tiposComponente,c.tipoComponenteId),nom(DB.tipologias,c.tipologiaId,""),c.cantidad]);
    });
    bajar("ingresos_"+hoyISO()+".csv",[hh,...rows].map(r=>r.map(csvCell).join(",")).join("\n"));
  };
}

/* =========================================================================
   VISTA 4 · INFORME SEMANAL (para presentar / imprimir a PDF)
   ========================================================================= */
function vSemanal(){
  const [d,h]=rangoActivo();
  const rs=regsFiltrados();
  const real=rs.reduce((a,r)=>a+r.minutos,0), std=rs.reduce((a,r)=>a+r.minutosStd,0);
  const efi=real?Math.round(std/real*100):0;
  const capDia=capacidadRango(d,h);
  const activos=tecnicosQueCuentan(d,h,FD.cuarto,FD.tecnico);
  const minNoProd=minutosNoProductivos(rs);
  const cap=Math.max(0, capacidadEquipoRango(d,h,FD.cuarto,FD.tecnico) - minNoProd);
  const ocup=cap?Math.round(real/cap*100):0;

  const tec=activos.map(t=>{
    const rr=rs.filter(r=>r.tecnicoId===t.id);
    const m=rr.reduce((a,x)=>a+x.minutos,0), s=rr.reduce((a,x)=>a+x.minutosStd,0);
    const u=rr.filter(r=>r.actividadId==="ac_prueba_fin"||r.actividadId==="ac_empaque").reduce((a,x)=>a+x.cantidad,0);
    const np=minutosNoProductivos(rr);
    const capReal=capacidadTecnicoRango(t.id,d,h);        /* su jornada, no la del grupo */
    const capT=Math.max(1, capReal-np);

        <div class="kpi"><div class="l">Productividad</div><div class="v">${cap?Math.round(std/cap*100):0}%</div>

      </div>
    </div></div>

function pSemanal(){
  $("#dd").onchange=e=>{FD.desde=e.target.value;render();};
  $("#dh").onchange=e=>{FD.hasta=e.target.value;render();};
  document.querySelectorAll("[data-rng]").forEach(b=>b.onclick=()=>{

    if(b.dataset.rng==="semana"){ const l=semanaDe(hy); FD.desde=l; FD.hasta=rangoSemana(l)[1]; }

async function modalAuditar(){
  const cx=DB.meta.conexion;
  if(!cx.modo){ toast("Configura primero la conexión"); return; }
  const d1 = await pedirTexto("Auditar cantidades","Desde (aaaa-mm-dd)", (FI.desde||rangoIngresos()[0]));
  if(d1===null) return;
  const d2 = await pedirTexto("Auditar cantidades","Hasta (aaaa-mm-dd)", (FI.hasta||rangoIngresos()[1]));
  if(d2===null) return;
  abrirModal("Auditoría contra la hoja", `<div class="empty">Comparando…</div>`);
  const pinta=h=>{ const b=document.querySelector(".modal:not(.dlg) .bd"); if(b) b.innerHTML=h; };
  try{
    const {filas}=await leerFuente();
    const mapa=cx.mapa||detectarMapa(filas[0]);
    const idx={}; Object.entries(mapa).forEach(([i,c])=>{ if(c!=="ignorar") idx[c]=+i; });
    const compCols=Object.entries(mapa).filter(([,v])=>String(v).indexOf("comp:")===0)
      .map(([i,v])=>({i:+i, tipoId:String(v).slice(5)}));
    /* lo que dice la hoja, sumando sin interpretar nada */
    const hoja={}; let filasUsadas=0;
    filas.slice(1).forEach(f=>{
      const ot=String(f[idx.ot]||"").trim(); if(!ot) return;
      const fIso = idx.fechaIngreso!==undefined ? normFechaEstricta(f[idx.fechaIngreso]) : "";
      if(!fIso || fIso<d1 || fIso>d2) return;
      const cuId = idx.cuarto!==undefined ? cuartoPorNombre(f[idx.cuarto]) : cuartoDeclarado(ot);
      if(FI.cuarto && cuId!==FI.cuarto) return;
      filasUsadas++;
      compCols.forEach(cc=>{
        const q=parseInt(String(f[cc.i]==null?"":f[cc.i]).replace(/[^\d]/g,""),10)||0;
        if(!q) return;
        /* se compara por FAMILIA: la columna INYECT. puede ser inyector
           Common Rail o unitario según el cuarto, y ambas cuentan igual. */
        const fam=familiaDe(nom(DB.tiposComponente,cc.tipoId));
        const k=ot+"|"+cuId+"|"+fam;
        hoja[k]=(hoja[k]||0)+q;
      });
    });
    /* lo que tiene la app */
    const app={}, detalle={};
    DB.ordenes.filter(o=>o.fechaIngreso>=d1 && o.fechaIngreso<=d2 && (!FI.cuarto || cuartosDeOrden(o).has(FI.cuarto)))
      .forEach(o=>{
        DB.componentes.filter(c=>c.ordenId===o.id).forEach(c=>{
          const fam=familiaDe(nom(DB.tiposComponente,c.tipoComponenteId));

        <td class="num mono">${h}</td><td class="num mono">${a}</td>

      </tbody></table></div>
      ${difs.length?`<div class="eyebrow" style="margin-bottom:7px">Dónde está la diferencia · ${difs.length} caso(s)</div>
      <div class="tw" style="max-height:320px;overflow:auto"><table><thead><tr><th>OT</th><th>Cuarto</th><th>Componente</th><th class="num">Hoja</th><th class="num">App</th><th>Qué pasó</th></tr></thead><tbody>
      ${difs.slice(0,80).map(x=>{const [ot,cu,tc]=x.k.split("|");
        const enApp=DB.ordenes.find(o=>o.ot===ot && (o.cuartoDeclaradoId||"")===cu);
        const causa = x.a===0 ? (enApp?"la orden existe pero sin ese componente":"la orden no está en la app")

/* Vuelve a leer una OT de la hoja y rehace SUS componentes desde cero.
   Sirve cuando quedaron mal de sincronizaciones anteriores. */
async function rehacerOrden(ot){
  const cx=DB.meta.conexion;
  if(!cx.modo){ toast("Configura primero la conexión"); return; }
  try{
    toast("Leyendo la hoja…");
    const {filas}=await leerFuente();
    const mapa=cx.mapa||detectarMapa(filas[0]);
    const idx={}; Object.entries(mapa).forEach(([i,c])=>{ if(c!=="ignorar") idx[c]=+i; });
    const hits=filas.slice(1).filter(f=>String(f[idx.ot]||"").trim()===String(ot).trim());
    if(!hits.length){ toast("Esa OT no está en la hoja"); return; }
    const conRegistro=DB.componentes.filter(c=>{
      const o=byId(DB.ordenes,c.ordenId); return o && o.ot===ot && DB.registros.some(r=>r.componenteId===c.id);
    });
    if(!await confirmar("Rehacer la orden "+ot,
      `Se borran sus componentes y se vuelven a crear leyendo la hoja.\n\n`+
      (conRegistro.length? `${conRegistro.length} componente(s) tienen producción registrada y NO se tocan.\n\n`:"")+
      `Úsalo cuando la orden quedó mal de una sincronización anterior.`,"Rehacer")) return;
    await commit(()=>{
      const proteger=new Set(conRegistro.map(c=>c.id));
      const ordIds=DB.ordenes.filter(o=>o.ot===ot).map(o=>o.id);
      DB.componentes=DB.componentes.filter(c=>!ordIds.includes(c.ordenId) || proteger.has(c.id));
      aplicarFilas([filas[0], ...hits], mapa);
    }, "Orden "+ot+" rehecha");
    render();
  }catch(e){ toast("No se pudo: "+(e.message||e)); }
}
async function modalBuscarOT(){
  const txt = await pedirTexto("Rastrear una OT","Escribe el número de OT tal como está en la hoja","");
  if(txt===null || !txt.trim()) return;
  const buscar=sinTildes(txt.trim());
  abrirModal("Rastreando OT "+esc(txt), `<div class="empty">Leyendo la hoja…</div>`);
  const pinta=h=>{ const b=document.querySelector(".modal:not(.dlg) .bd"); if(b) b.innerHTML=h; };
  try{
    const cx=DB.meta.conexion;
    const {filas}=await leerFuente();
    const mapa=cx.mapa||detectarMapa(filas[0]);
    const idx={}; Object.entries(mapa).forEach(([i,c])=>{ if(c!=="ignorar") idx[c]=+i; });
    const iOT=idx.ot;
    const hits=filas.slice(1).map((f,k)=>({f,fila:k+2}))
      .filter(x=>sinTildes(String(x.f[iOT]||"")).indexOf(buscar)>=0);
    if(!hits.length){
      pinta(`<div class="empty">No hay ninguna fila en la hoja cuya columna de OT contenga “${esc(txt)}”.<br><br>

        <button class="btn" id="okB" style="margin-top:11px">Cerrar</button>`);
      document.querySelector("#okB").onclick=cerrarModal; return;
    }
    const desde=cx.desdeFecha||"", omitirSF=(cx.sinFecha||"omitir")==="omitir";
    const cerr=cerrados();
    const filasHtml=hits.map(x=>{
      const f=x.f;
      const ot=String(f[iOT]||"").trim();
      const fIso=idx.fechaIngreso!==undefined?normFechaEstricta(f[idx.fechaIngreso]):"";
      const est=idx.estado!==undefined?String(f[idx.estado]||"").trim():"";
      const mot=idx.motivo!==undefined?String(f[idx.motivo]||"").trim():"";
      const tipo=idx.tipologias!==undefined?String(f[idx.tipologias]||"").trim():"";
      const cants=Object.entries(mapa).filter(([,v])=>String(v).indexOf("comp:")===0)
        .map(([i,v])=>({n:nom(DB.tiposComponente,String(v).slice(5)), q:parseInt(String(f[+i]||"").replace(/[^\d]/g,""),10)||0}))
        .filter(c=>c.q);
      let veredicto, color;
      if(!ot){ veredicto="La celda de OT está vacía: la fila se ignora."; color="c-rojo"; }
      else if(desde && fIso && fIso<desde){ veredicto=`Omitida: su fecha (${fmtFecha(fIso)}) es anterior al corte del ${fmtFecha(desde)}.`; color="c-ambar"; }
      else if(desde && !fIso && omitirSF){ veredicto="Omitida: no tiene fecha legible y configuraste omitir esas filas."; color="c-ambar"; }
      else {
        const enApp=DB.ordenes.find(o=>o.ot===ot);
        if(!enApp){ veredicto="Debería estar importada pero no la encuentro en la app. Sincroniza de nuevo."; color="c-rojo"; }
        else if(cerr.has(enApp.estado)){ veredicto=`Importada, pero su estado “${enApp.estado}” está marcado como cerrado: no la ve el técnico y no cuenta como abierta.`; color="c-azul"; }
        else { veredicto="Importada y activa."; color="c-verde"; }
      }
      return `<tr><td class="mono">${x.fila}</td><td class="mono"><b>${esc(ot)}</b></td>
        <td class="mono">${fIso?fmtFecha(fIso):`<span style="color:var(--red)">sin fecha</span>`}<br><span class="tag">${esc(String(idx.fechaIngreso!==undefined?f[idx.fechaIngreso]||"":""))}</span></td>
        <td>${esc(est)||"—"}</td><td>${esc(mot)||`<span class="tag">sin motivo</span>`}</td>
        <td class="tag">${esc(tipo)||"—"}<br>${cants.map(c=>c.q+"× "+esc(c.n)).join("<br>")||"sin cantidades"}</td>
        <td><span class="chip ${color}">${esc(veredicto)}</span></td></tr>`;
    }).join("");
    pinta(`<p class="hint" style="margin-top:0">${hits.length} fila(s) en la hoja. Corte configurado: ${desde?fmtFecha(desde):"sin corte"} · filas sin fecha: ${omitirSF?"se omiten":"se importan"}.</p>
      <div class="tw"><table><thead><tr><th>Fila</th><th>OT</th><th>Ingreso</th><th>Estado</th><th>Motivo</th><th>TIPO y cantidades</th><th>Qué pasó</th></tr></thead>
      <tbody>${filasHtml}</tbody></table></div>
      <button class="btn" id="okB" style="margin-top:12px">Cerrar</button>`);
    document.querySelector("#okB").onclick=cerrarModal;
  }catch(e){
    pinta(`<div style="border:1px solid #eec4c1;background:#fbecea;color:var(--red);padding:10px 12px;border-radius:var(--r)">${esc(String(e.message||e))}</div>
      <button class="btn" id="okB" style="margin-top:11px">Cerrar</button>`);
    document.querySelector("#okB").onclick=cerrarModal;
  }
}

          DB.repartos.filter(r=>r.actividadId===id).forEach(r=>{ porTipo[r.tipoComponenteId]=(porTipo[r.tipoComponenteId]||0)+(+r.porcentaje||0); });
          DB.repartos=DB.repartos.filter(r=>r.actividadId!==id);
          Object.entries(porTipo).forEach(([tc,p])=>{
            const ex=DB.repartos.find(r=>r.tipoComponenteId===tc && r.actividadId===dest);
            if(ex) ex.porcentaje=(+ex.porcentaje||0)+p;
            else DB.repartos.push({id:uid("rp"),tipoComponenteId:tc,actividadId:dest,porcentaje:p});
          });
          DB.estandares.forEach(e=>{ if(e.actividadId===id) e.actividadId=dest; });
          DB.actividades=DB.actividades.filter(x=>x.id!==id);
        }, `Fusionada en “${da.nombre}”`);
      };
    });
}

/* =========================================================================
   EDITOR DE TIEMPOS POR COMPONENTE
   Una sola pantalla: eliges cuarto y componente, y ves cada actividad con
   sus minutos al frente. Marcar/desmarcar decide si el técnico la ve.
   Los porcentajes ya no se escriben: se deducen de los minutos.
   ========================================================================= */
let TE = {cuarto:"", tipo:"", avanzado:false};

function faseDe(a){
  const f=(a.fase||"").toLowerCase();
  if(f.indexOf("diagn")===0) return "Diagnóstico";
  if(f.indexOf("entrega")===0) return "Entrega";
  if(f.indexOf("apoyo")===0) return "Apoyo";
  return "Reparación";
}
function estandarDe(tc, actId){
  return DB.estandares.find(e=>e.tipoComponenteId===tc && e.tipologiaId==="*" && e.actividadId===actId);
}
function mTiempos(){
  const cuartos=DB.cuartos.filter(c=>c.tipo==="principal"||DB.tiposComponente.some(t=>t.cuartoId===c.id));
  if(!TE.cuarto) TE.cuarto=(cuartos[0]||{}).id||"";
  const tipos=DB.tiposComponente.filter(t=>t.cuartoId===TE.cuarto);
  if(!tipos.some(t=>t.id===TE.tipo)) TE.tipo=(tipos[0]||{}).id||"";
  const tipo=byId(DB.tiposComponente,TE.tipo);

  const cab=`<div class="card"><header><h2>Tiempos por componente</h2>
    <span class="sub">Escribe los minutos de cada paso. Los porcentajes se calculan solos.</span></header>
  <div class="body"><div class="row">
    <label class="f"><span>Cuarto</span><select id="teCuarto">
      ${cuartos.map(c=>`<option value="${c.id}" ${TE.cuarto===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select></label>
    <label class="f"><span>Componente</span><select id="teTipo">
      ${tipos.map(t=>`<option value="${t.id}" ${TE.tipo===t.id?"selected":""}>${esc(t.nombre)}</option>`).join("")}</select></label>
  </div></div></div>`;

  if(!tipo) return cab+`<div class="card"><div class="body"><div class="empty">Este cuarto no tiene componentes. Créalos en Tipos de componente.</div></div></div>`;

  const r=resumenTiempos(tipo.id);
  const meta=+tipo.estandarReparacion||0;         /* lo que la empresa dice que vale la reparación */
  const cuadra = !meta || r.reparacion===meta;
  const acts=actividadesDe(tipo.cuartoId).filter(a=>!a.noProductiva);
  const usados=DB.componentes.filter(c=>c.tipoComponenteId===tipo.id).length;
  const regs=DB.registros.filter(x=>!x.anulado && fotoComponente(x) && fotoComponente(x).tipoComponenteId===tipo.id).length;

  const FASES=["Diagnóstico","Reparación","Entrega"];
  const fila=a=>{
    const e=estandarDe(tipo.id,a.id);
    const min=e?(+e.minutos||0):0;
    const activa=!!e;
    const pct=pesoActividad(tipo.id,a.id);
    return `<tr class="${activa?"":"apagada"}">
      <td style="width:36px"><input type="checkbox" data-teon="${a.id}" ${activa?"checked":""} style="width:18px;height:18px;accent-color:var(--signal)"></td>
      <td><b>${esc(a.nombre)}</b>${esPorOrden(a.id)?' <span class="tag">por orden, no por unidad</span>':""}
        <br><select data-tefase="${a.id}" style="font-size:12px;padding:2px 4px;margin-top:3px">
          ${FASES.map(f=>`<option value="${f}" ${faseDe(a)===f?"selected":""}>${f}</option>`).join("")}</select>
        ${activa?`<label style="font-size:12px;margin-left:8px;white-space:nowrap;cursor:pointer">
          <input type="checkbox" data-teaparte="${a.id}" ${e.aparte?"checked":""} style="vertical-align:-2px"> aparte</label>`:""}</td>
      <td class="num" style="width:110px"><input type="number" min="0" step="1" data-temin="${a.id}" value="${min}" ${activa?"":"disabled"} style="text-align:right"></td>
      <td class="num mono" style="width:70px">${!activa?"—":(e.aparte?'<span class="tag">aparte</span>':(pct?pct.toFixed(1)+"%":"—"))}</td></tr>`;
  };

  const bloque=(titulo,lista,suma,extra)=>lista.length?`
    <tr class="cab"><td></td><td><b>${titulo}</b>${extra||""}</td>
      <td class="num mono"><b>${suma}</b></td><td class="num mono">${r.total?(suma/r.total*100).toFixed(1)+"%":""}</td></tr>
    ${lista.map(fila).join("")}`:"";

  const esAparte=a=>{ const e=estandarDe(tipo.id,a.id); return !!(e && e.aparte); };
  const dg=acts.filter(a=>!esAparte(a) && faseDe(a)==="Diagnóstico");
  const rp=acts.filter(a=>!esAparte(a) && faseDe(a)==="Reparación");
  const en=acts.filter(a=>!esAparte(a) && faseDe(a)==="Entrega");
  const ap=acts.filter(esAparte);

  return cab+`
  <div class="card"><header><h2>${esc(tipo.nombre)}</h2>
    <span class="sub mono">${usados} en órdenes · ${regs} registros</span></header>
  <div class="body">
    <label class="f" style="max-width:340px"><span>Estándar de la empresa para la REPARACIÓN (min)</span>
      <input type="number" min="0" step="1" id="teMeta" value="${meta||""}" placeholder="ej. 60"></label>
    <p class="hint" style="margin-top:-4px">El diagnóstico y la entrega van aparte. Si dejas esto vacío, no se valida nada.</p>

    <div class="tw"><table class="acc"><thead><tr>
      <th style="width:36px">Usa</th><th>Actividad</th><th class="num">Minutos</th><th class="num">% proceso</th>
    </tr></thead><tbody>
      ${bloque("DIAGNÓSTICO",dg,r.diagnostico)}
      ${bloque("REPARACIÓN",rp,r.reparacion, meta?` <span class="chip ${cuadra?"c-verde":"c-rojo"}">${cuadra?"cuadra con "+meta:"deberían ser "+meta+" · "+(r.reparacion>meta?"sobran "+(r.reparacion-meta):"faltan "+(meta-r.reparacion))}</span>`:"")}
      ${bloque("ENTREGA",en,r.entrega)}
      <tr class="cab"><td></td><td><b>TOTAL DEL PROCESO</b></td>
        <td class="num mono"><b>${r.total}</b></td><td class="num mono">${hrs(r.total)} h</td></tr>
      ${ap.length?`<tr class="cab"><td></td><td><b>APARTE</b> <span class="tag">no suman al proceso · el técnico las marca solo cuando aplican</span></td><td></td><td></td></tr>
      ${ap.map(fila).join("")}`:""}
    </tbody></table></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:13px">
      <button class="btn primary" id="teGuardar">Guardar y aplicar a los registros</button>
      <button class="btn" id="teCopiar">Copiar estos tiempos a otro componente…</button>
    </div>
    <p class="hint">Al guardar se recalculan las horas ganadas de los ${regs} registros de este componente, hacia atrás.</p>

    ${(()=>{const tips=DB.estandares.filter(e=>e.tipoComponenteId===tipo.id && e.tipologiaId!=="*" && e.actividadId===ACT_TOTAL);
      return `<hr class="sep"><div class="eyebrow" style="margin-bottom:6px">Variantes que tardan distinto</div>
      <p class="hint" style="margin-top:0">Una tipología puede tener otro total (un biturbo tarda 5 h y no 3). Los pasos se escalan solos.</p>
      ${tips.length?`<div class="tw"><table><tbody>${tips.map(e=>`<tr>
        <td>${esc(nom(DB.tipologias,e.tipologiaId))}</td>
        <td class="num" style="width:110px"><input type="number" min="0" step="1" data-tetip="${e.id}" value="${e.minutos}"></td>
        <td class="num mono" style="width:70px">${hrs(e.minutos)} h</td>
        <td style="width:44px"><button class="btn sm danger" data-tedel="${e.id}">×</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="hint">Ninguna por ahora.</p>`}
      <button class="btn sm" id="teAddTip" style="margin-top:8px">+ Variante</button>`;})()}

    <hr class="sep">
    <details ${TE.avanzado?"open":""}><summary style="cursor:pointer;font-size:13px;font-weight:600">Avanzado · reparto por porcentaje</summary>
      <p class="hint">Solo hace falta cuando de un componente conoces el total pero no el detalle de cada paso.
      Como aquí ya hay minutos escritos, la app deduce los porcentajes sola y esto no se usa.
      ${(DB.repartos||[]).filter(x=>x.tipoComponenteId===tipo.id).length
        ? `Este componente todavía tiene ${(DB.repartos||[]).filter(x=>x.tipoComponenteId===tipo.id).length} porcentaje(s) escritos a mano.
           <br><button class="btn sm warn" id="teLimpiarRep" style="margin-top:8px">Quitarlos</button>`
        : "No tiene porcentajes escritos. Perfecto."}</p>
    </details>
  </div></div>`;
}
function pTiempos(){
  const cu=$("#teCuarto"); if(cu) cu.onchange=e=>{ TE.cuarto=e.target.value; TE.tipo=""; render(); };
  const tp=$("#teTipo");   if(tp) tp.onchange=e=>{ TE.tipo=e.target.value; render(); };

  /* Encender / apagar una actividad para este componente */
  document.querySelectorAll("[data-teon]").forEach(ch=>ch.onchange=()=>{
    const actId=ch.dataset.teon, tc=TE.tipo;
    commitMaestro(()=>{
      if(ch.checked){
        if(!estandarDe(tc,actId)) DB.estandares.push({id:uid("es"),tipoComponenteId:tc,tipologiaId:"*",actividadId:actId,minutos:0});
      } else {
        DB.estandares=DB.estandares.filter(e=>!(e.tipoComponenteId===tc && e.tipologiaId==="*" && e.actividadId===actId));
      }
    }, ch.checked?"Actividad activada":"Actividad quitada de este componente");
  });

  /* Minutos: se escriben sin redibujar hasta salir del campo */
  document.querySelectorAll("[data-temin]").forEach(i=>i.onchange=()=>{
    const actId=i.dataset.temin, tc=TE.tipo, v=Math.max(0,+i.value||0);
    commitMaestro(()=>{
      const e=estandarDe(tc,actId);
      if(e) e.minutos=v;
      else DB.estandares.push({id:uid("es"),tipoComponenteId:tc,tipologiaId:"*",actividadId:actId,minutos:v});
    },"", true);
    render();
  });

  document.querySelectorAll("[data-tefase]").forEach(sel=>sel.onchange=()=>{
    const actId=sel.dataset.tefase, v=sel.value;
    commitMaestro(()=>{ const a=byId(DB.actividades,actId); if(a) a.fase=v; },"Fase actualizada");
  });
  document.querySelectorAll("[data-teaparte]").forEach(ch=>ch.onchange=()=>{
    const actId=ch.dataset.teaparte;
    commitMaestro(()=>{ const e=estandarDe(TE.tipo,actId); if(e) e.aparte=ch.checked; },
      ch.checked?"Queda aparte del proceso":"Vuelve a contar en el proceso");
  });
  const mt=$("#teMeta"); if(mt) mt.onchange=()=>{
    const v=Math.max(0,+mt.value||0);
    commitMaestro(()=>{ const t=byId(DB.tiposComponente,TE.tipo); if(t) t.estandarReparacion=v; },"Estándar guardado");
  };

  document.querySelectorAll("[data-tetip]").forEach(i=>i.onchange=()=>{
    const id=i.dataset.tetip, v=Math.max(0,+i.value||0);
    commitMaestro(()=>{ const e=byId(DB.estandares,id); if(e) e.minutos=v; },"Variante guardada");
  });
  document.querySelectorAll("[data-tedel]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.tedel;
    commitMaestro(()=>{ DB.estandares=DB.estandares.filter(e=>e.id!==id); },"Variante eliminada");
  });
  const at=$("#teAddTip"); if(at) at.onclick=()=>modalVariante(TE.tipo);

  const lr=$("#teLimpiarRep"); if(lr) lr.onclick=()=>commitMaestro(()=>{
    DB.repartos=(DB.repartos||[]).filter(x=>x.tipoComponenteId!==TE.tipo);
  },"Porcentajes quitados · ahora se deducen de los minutos");

  const gd=$("#teGuardar"); if(gd) gd.onclick=()=>recalcularDeTipo(TE.tipo);
  const cp=$("#teCopiar");  if(cp) cp.onclick=()=>modalCopiarTiempos(TE.tipo);
}
/* Recalcula las horas ganadas de todos los registros de un tipo de componente. */
async function recalcularDeTipo(tc){
  const afectados=DB.registros.filter(r=>{ const c=fotoComponente(r); return c && c.tipoComponenteId===tc; });
  let cambian=0;
  afectados.forEach(r=>{ if(stdRegistro(fotoComponente(r), r.actividadId, r.cantidad)!==r.minutosStd) cambian++; });
  if(!afectados.length){ toast("Guardado. Este componente todavía no tiene registros"); return; }
  if(!await confirmar("Aplicar a los registros",
    `${afectados.length} registro(s) de ${nom(DB.tiposComponente,tc)}.\n\nCambiarían las horas ganadas de ${cambian}.\n\nNo se toca el tiempo real que puso el técnico: solo la parte estándar.`,
    "Aplicar")) return;
  await commit(()=>{
    DB.registros.forEach(r=>{
      const c=fotoComponente(r); if(!c || c.tipoComponenteId!==tc) return;
      r.minutosStd=stdRegistro(c, r.actividadId, r.cantidad);
      r.actualizado=new Date().toISOString();
    });
  }, cambian+" registros actualizados");
  empujarRegistros().catch(()=>{});
}

function modalCopiarTiempos(tc){

}

/* Reparto sugerido: distribuye SOLO la bolsa de reparación. Lo que ya tiene
   tiempo propio queda fuera y el resto se ajusta a 100%. */
function repartoSugerido(){
  const plan=[];
  DB.tiposComponente.forEach(t=>{
    const acts=actividadesDe(t.cuartoId).filter(a=>!a.noProductiva);
    const hallar=(...frags)=>{
      for(const f of frags){ const a=acts.find(x=>sinTildes(x.nombre).indexOf(sinTildes(f))>=0); if(a) return a.id; }
      return null;
    };
    const conPropio=new Set(acts.filter(a=>estandarExacto(t.id,"*",a.id)!=null).map(a=>a.id));
    const fam=familiaDe(t.nombre), cu=nom(DB.cuartos,t.cuartoId);
    let pares;
    if(fam==="turbo") pares=[[hallar("sandblast"),18],[hallar("balanceo"),27],
                             [hallar("armado"),42],[hallar("prueba final"),13]];
    else if(/torno/i.test(cu)) pares=[[hallar("torneado","rectific"),100]];
    else if(/soldadura/i.test(cu)) pares=[[hallar("soldadura"),100]];
    else pares=[[hallar("mantenimiento del componente"),60],[hallar("calibraci"),40]];
    const validos=pares.filter(([a,p])=>a && p>0 && !conPropio.has(a));
    const suma=validos.reduce((x,[,p])=>x+p,0);
    if(!suma) return;
    let acum=0;
    validos.forEach(([a,p],k)=>{
      const v = k===validos.length-1 ? 100-acum : Math.round(p*100/suma);
      acum+=v; plan.push({tipoComponenteId:t.id, actividadId:a, porcentaje:v});
    });
  });
  return plan;
}
async function recalcularEstandares(){
  const regs=DB.registros;
  let cambiados=0, ceros=0;
  const nuevos=regs.map(r=>{
    const c=fotoComponente(r);
    const std = stdRegistro(c, r.actividadId, r.cantidad);
    if(std!==r.minutosStd) cambiados++;
    if(!std) ceros++;
    return {id:r.id, std};
  });
  if(!await confirmar("Recalcular horas estándar",
    `Se revisan ${regs.length} registros con los tiempos y repartos que tienes hoy.\n\n`+
    `Cambiarían ${cambiados}.\n`+
    (ceros?`Quedarían en cero ${ceros} (les falta estándar o reparto).\n`:"")+
    `\nNo se toca lo que registró el técnico: solo se recalcula la parte estándar.`,
    "Recalcular")) return;
  await commit(()=>{
    const m={}; nuevos.forEach(x=>m[x.id]=x.std);
    DB.registros.forEach(r=>{ if(m[r.id]!==undefined) r.minutosStd=m[r.id]; });
  }, `${cambiados} registros actualizados`);
  empujarRegistros().catch(()=>{});
}
function mReparto(){
  const tcSel = MFILTRO.tipo || "*";
  const tipo = tcSel==="*"? null : byId(DB.tiposComponente,tcSel);
  const cuartoRef = tipo? tipo.cuartoId : (DB.cuartos[0]&&DB.cuartos[0].id);
  const acts = actividadesDe(cuartoRef).filter(a=>!a.noProductiva);
  const todosRp = DB.repartos || (DB.repartos=[]);
  const propios = todosRp.filter(r=>r.tipoComponenteId===tcSel);
  const hereda = tcSel!=="*" && !propios.length;
  const vigentes = hereda ? todosRp.filter(r=>r.tipoComponenteId==="*") : propios;
  const pct = id => { const r=vigentes.find(x=>x.actividadId===id); return r? r.porcentaje : 0; };
  const suma = vigentes.reduce((a,r)=>a+(+r.porcentaje||0),0);
  const total = tipo? totalProceso(tipo.id,"*") : 0;

  /* Cada actividad cae en uno de tres grupos, y eso es lo único que hay que entender. */
  const conPropio=[], enReparto=[], sinNada=[];
  acts.forEach(a=>{
    const propio = tipo ? estandarExacto(tipo.id,"*",a.id) : null;
    const p = pct(a.id);
    if(propio!=null) conPropio.push({a,min:propio});
    else if(p>0)     enReparto.push({a,p});
    else             sinNada.push({a});
  });

  const filaRep = x => `<tr><td>${esc(x.a.nombre)}</td>
    <td style="width:96px"><input type="number" min="0" max="100" step="1" data-rp="${x.a.id}" value="${x.p}"></td>

    <td><button class="btn sm danger" data-rpdel="${x.a.id}">Sacar</button></td></tr>`;

  return `<div class="card"><header><h2>Reparto del proceso</h2>
    <span class="sub">${suma===100?'<span class="chip c-verde">listo · 100%</span>':suma>100?`<span class="chip c-rojo">te pasaste · ${suma}%</span>`:`<span class="chip c-ambar">falta ${100-suma}%</span>`}</span></header>

      <b>Qué se hace aquí.</b> Tu tabla dice cuánto vale <b>reparar</b> un componente — por ejemplo,
      un inyector CR vale 1 hora. Si esa reparación la hacen entre dos personas, esa hora hay que
      dividirla entre ellas. Aquí decides cómo.<br>
      <span class="tag">El diagnóstico, el lavado y el alistamiento no entran: ya tienen su propio tiempo en tu tabla.</span>
    </div>

    <div class="row">
      <label class="f" style="max-width:340px"><span>¿De qué componente?</span><select id="fTipo">
        <option value="">Todos los que no tengan uno propio</option>
        ${DB.tiposComponente.map(t=>`<option value="${t.id}" ${tcSel===t.id?"selected":""}>${esc(t.nombre)}${todosRp.some(r=>r.tipoComponenteId===t.id)?" ✓":""}</option>`).join("")}
      </select></label>
      ${tipo?`<div style="flex:0 0 auto;align-self:end;margin-bottom:11px">
        <span class="tag">Reparación de este componente: <b class="mono">${total?hrs(total)+" h":"sin definir"}</b></span></div>`:""}
    </div>

    ${hereda?`<div style="border:1px solid #bcd0e2;background:#eaf1f8;color:var(--prussian);padding:9px 11px;border-radius:var(--r);margin-bottom:12px;font-size:13px">
      Este componente usa el reparto general. Si le pones porcentajes propios, dejará de heredarlo.</div>`:""}

    <div class="eyebrow" style="margin-bottom:7px">1 · Se reparten la reparación</div>
    <div style="height:9px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-bottom:8px">
      <i style="display:block;height:100%;width:${Math.min(100,suma)}%;background:${suma===100?"var(--green)":suma>100?"var(--red)":"var(--amber)"}"></i></div>
    ${enReparto.length?`<div class="tw"><table class="acc"><thead><tr><th>Actividad</th><th class="num">% de la reparación</th><th class="num">Le toca</th><th></th></tr></thead>
      <tbody>${enReparto.map(filaRep).join("")}</tbody></table></div>`
      :`<div class="empty">Todavía nadie se reparte la reparación. Agrega alguna abajo.</div>`}
    <p class="hint" style="margin-top:8px">${suma===100?"<b>Está completo.</b> No hay que hacer nada más aquí."
      :suma>100?`<b>Se pasa ${suma-100}%:</b> se pagarían más horas de las que vale el proceso. Baja algún porcentaje.`
      :`<b>Falta ${100-suma}%:</b> parte del tiempo no se le acredita a nadie. Súbelos o usa “Repartir lo que falta”.`}</p>

    ${conPropio.length?`
    <div class="eyebrow" style="margin:18px 0 7px">2 · Ya tienen su propio tiempo · no van aquí</div>
    <div class="tw"><table><tbody>${conPropio.map(x=>`<tr>
      <td>${esc(x.a.nombre)}</td><td class="num mono">${x.min} min/und</td>
      <td class="tag">sale de tu tabla de tiempos</td></tr>`).join("")}</tbody></table></div>`:""}

    ${sinNada.length?`

    <p class="hint" style="margin-top:0">Quien las registre gana <b>cero horas</b>. Dales un % arriba, ponles tiempo en
    <b>Tiempos estándar</b>, o bórralas en <b>Actividades</b> si no se usan.</p>
    <div class="tw"><table><tbody>${sinNada.map(x=>`<tr>
      <td>${esc(x.a.nombre)}</td><td class="tag">${esc(x.a.fase)}</td>
      <td><button class="btn sm" data-rpadd="${x.a.id}">Meterla al reparto</button></td></tr>`).join("")}</tbody></table></div>`:""}

    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="rpGuardar">Guardar</button>
