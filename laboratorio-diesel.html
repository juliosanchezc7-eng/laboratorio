<meta name="theme-color" content="#12181f">

<title>Laboratorio Diesel · Registro y Producción</title>
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#12181f;         /* grafito */
  --ink-2:#33414f;
  --muted:#6b7a89;
  --line:#d3dae1;
  --line-2:#e6ebef;
  --paper:#eaeef1;       /* acero claro */
  --surface:#ffffff;
  --prussian:#1b3a5b;    /* azul de plano */
  --prussian-2:#2b567f;
  --signal:#e0590b;      /* naranja de seguridad */
  --amber:#b8790a;
  --green:#26734b;
  --red:#b3261e;
  --grid:rgba(27,58,91,.055);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:4px;
  --sh:0 1px 0 rgba(18,24,31,.04),0 1px 3px rgba(18,24,31,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--ink);
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============ ESTRUCTURA ============ */
.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff}
.top-in{max-width:1180px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.brand span{font-family:var(--mono);font-size:11px;color:#8fa3b6;white-space:nowrap}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.whoami{font-family:var(--mono);font-size:11.5px;color:#cbd8e4;background:#1e2833;border:1px solid #2c3a48;padding:4px 8px;border-radius:99px;white-space:nowrap;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green);margin-right:5px;vertical-align:1px}
.dot.off{background:var(--signal)}

nav.tabs{background:var(--ink);border-top:1px solid #26313d;position:sticky;top:41px;z-index:39}
nav.tabs .in{max-width:1180px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#93a5b6;padding:9px 14px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:var(--signal)}

main{max-width:1180px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}
.card>header{padding:11px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>header h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.card>header .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.card .body{padding:14px}
.card>header .push{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* etiqueta tipo ficha de banco */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* ============ CONTROLES ============ */
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--prussian-2);outline-offset:-1px;border-color:var(--prussian-2)}
textarea{min-height:74px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--prussian);border-color:var(--prussian);color:#fff}
.btn.primary:hover{background:var(--prussian-2)}
.btn.warn{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--red);border-color:#e8c6c3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 180px;min-width:0}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}

/* ============ KPI / GAUGE (firma) ============ */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;box-shadow:var(--sh)}
.kpi .l{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.kpi .h{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.kpi.alert .v{color:var(--signal)}
.gauge{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:7px}
.gauge i{display:block;height:100%;background:var(--prussian)}
.gauge i.ok{background:var(--green)}.gauge i.warn{background:var(--amber)}.gauge i.bad{background:var(--signal)}

/* barras horizontales */
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(88px,26%) 1fr auto;gap:9px;align-items:center;font-size:13px}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:16px;background:var(--line-2);border-radius:3px;overflow:hidden;position:relative}
.bar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--prussian)}
.bar .track i.b{background:var(--signal);opacity:.85}
.bar .n{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* ============ TABLAS ============ */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:#f7f9fa;position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:#f9fbfc}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
/* columna de acciones siempre visible aunque la tabla se deslice */
.tw table.acc th:last-child,.tw table.acc td:last-child{
  position:sticky;right:0;background:#fff;width:1%;white-space:nowrap;
  box-shadow:-7px 0 8px -7px rgba(18,24,31,.22);
}
.tw table.acc thead th:last-child{background:#f7f9fa;z-index:2}
.tw table.acc tbody tr:hover td:last-child{background:#f9fbfc}
.scroll-hint{font-size:12px;color:var(--muted);margin:0 0 7px}
@media(min-width:900px){.scroll-hint{display:none}}
/* columna de acciones siempre visible aunque la tabla se desplace */
table.acc th:last-child,table.acc td:last-child{position:sticky;right:0;background:#fff;width:1%;white-space:nowrap;box-shadow:-8px 0 8px -8px rgba(18,24,31,.3)}
table.acc thead th:last-child{top:0;background:#f7f9fa;z-index:2}
table.acc tbody tr:hover td:last-child{background:#f9fbfc}

/* ============ CHIPS / ESTADOS ============ */
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid;white-space:nowrap}
.c-gris{color:var(--muted);border-color:var(--line);background:#f4f6f8}
.c-azul{color:var(--prussian);border-color:#bcd0e2;background:#eaf1f8}
.c-ambar{color:var(--amber);border-color:#ecd6a4;background:#fdf5e3}
.c-naranja{color:var(--signal);border-color:#f3ccb0;background:#fdefe5}
.c-verde{color:var(--green);border-color:#b6ddc6;background:#eaf6ef}
.c-rojo{color:var(--red);border-color:#eec4c1;background:#fbecea}

/* ============ PASOS DEL REGISTRO ============ */
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;margin-bottom:14px}
.steps div{flex:1;padding:9px 8px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;border-right:1px solid var(--line-2);position:relative}
.steps div:last-child{border-right:0}
.steps div.on{background:var(--ink);color:#fff}
.steps div.done{background:#eef3f7;color:var(--prussian)}
.steps div b{font-family:var(--mono);margin-right:5px}

.pick{display:grid;gap:8px}
.pick button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.pick button:hover{border-color:var(--prussian-2);background:#f7fafc}
.pick button.sel{border-color:var(--prussian);box-shadow:inset 0 0 0 1px var(--prussian);background:#f2f7fb}
.pick .ot{font-family:var(--mono);font-weight:700;font-size:15px}
.pick .meta{font-size:12px;color:var(--muted)}
.pick .r{margin-left:auto;text-align:right}

.act{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:#fff;margin-bottom:7px}
.act.on{border-color:var(--prussian);background:#f4f8fb;box-shadow:inset 0 0 0 1px var(--prussian)}
.act .hd{display:flex;gap:9px;align-items:center;cursor:pointer}
.act .hd input{width:17px;height:17px;flex:0 0 auto;accent-color:var(--prussian)}
.act .hd .nm{font-weight:600;font-size:14px}
.act .hd .std{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.act .det{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);gap:10px}
.act.on .det{display:flex;flex-wrap:wrap}
.act .det label{flex:1 1 110px;margin:0}
.act .det label span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:3px}

/* barra fija inferior */
.fixbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:10px;align-items:center;z-index:35;box-shadow:0 -2px 10px rgba(18,24,31,.07)}
.fixbar .in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;width:100%}
.fixbar .sum{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.25}
.fixbar .sp{margin-left:auto}

/* misc */
.hint{font-size:12.5px;color:var(--muted)}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r);background:#fbfcfd}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted)}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:14px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.28);opacity:0;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.modal{position:fixed;inset:0;background:rgba(18,24,31,.5);z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.modal{align-items:center;padding:20px}}
.modal .box{background:#fff;border-radius:var(--r) var(--r) 0 0;width:100%;max-width:620px;max-height:88vh;overflow:auto}
@media(min-width:700px){.modal .box{border-radius:var(--r)}}
.modal .box>header{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff}
.modal .box>header h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em}
.modal .box .bd{padding:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--prussian);color:#fff}
details.help{margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
details.help summary{padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600}
details.help .bd{padding:0 14px 14px;font-size:13.5px;color:var(--ink-2)}
@media print{
  .top,nav.tabs,.fixbar,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none}
}
</style>

<script>
"use strict";
/* =========================================================================
   CAPA DE DATOS
   - Si corre dentro de Claude: usa window.storage (compartido = todo el taller
     ve los mismos datos).
   - Si lo publicas en GitHub Pages / lo abres como archivo: usa el
     almacenamiento del navegador. Igual sirve, pero cada equipo por separado.
   - Siempre puedes exportar/importar el JSON completo (respaldo).
   ========================================================================= */
const VERSION_APP = "2026-08-13 · v30";
const KEY = "labdiesel_db_v1";
const KEY_ME = "labdiesel_tecnico_actual";
const hasCloud = typeof window.storage !== "undefined" && window.storage;

const Store = {
  async get(k, shared){
    if(hasCloud){ try{ const r = await window.storage.get(k, !!shared); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
    try{ const v = window.localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async set(k, val, shared){
    if(hasCloud){ try{ await window.storage.set(k, JSON.stringify(val), !!shared); return true; }catch(e){ return false; } }
    try{ window.localStorage.setItem(k, JSON.stringify(val)); return true; }catch(e){ return false; }
  }
};

const uid = p => (p||"id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
/* Fecha en formato AAAA-MM-DD usando SIEMPRE el calendario local.
   Antes se usaba toISOString(), que convierte a UTC: en Colombia (UTC-5)
   después de las 7 pm el día saltaba al siguiente. */
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hoyISO = () => isoLocal(new Date());
const restarDias = (iso,d) => { const x=new Date(iso+"T12:00:00"); x.setDate(x.getDate()-(+d||0)); return isoLocal(x); };

/* ---------- Semillas: TODO es editable desde la pestaña Maestros ---------- */
function semilla(){
  const C = (id,nombre,tipo,grupo)=>({id,nombre,tipo,grupo:grupo||""});
  const cuartos=[
    C("cu_elec","Electrónico","principal","Bancos de prueba"),
    C("cu_unit","Unitario","principal","Bancos de prueba"),
    C("cu_mec","Mecánico","principal","Bancos de prueba"),
    C("cu_turbo","Turbos","principal","Turbos"),
    C("cu_sold","Soldadura","apoyo","Apoyo"),
    C("cu_torno","Torno","apoyo","Apoyo"),
    C("cu_mtto","Mantenimiento general","soporte","Mantenimiento")
  ];
  const plantilla=[["cu_elec",4],["cu_unit",3],["cu_mec",4],["cu_turbo",3],["cu_sold",2],["cu_torno",2],["cu_mtto",1]];
  const tecnicos=[]; let n=0;
  plantilla.forEach(([cu,cant])=>{ for(let i=1;i<=cant;i++){ n++;
    tecnicos.push({id:"te_"+n, nombre:"Técnico "+n, cuartoId:cu, rol:"tecnico", activo:true}); } });
  tecnicos.push({id:"te_coord", nombre:"Coordinador", cuartoId:"cu_mtto", rol:"coordinador", activo:true});

  const tipos=[
    {id:"tc_iny_cr",nombre:"Inyector Common Rail",cuartoId:"cu_elec"},
    {id:"tc_riel",nombre:"Riel Common Rail",cuartoId:"cu_elec"},
    {id:"tc_bomba_alta",nombre:"Bomba de alta presión CR",cuartoId:"cu_elec"},
    {id:"tc_edc",nombre:"Bomba electrónica EDC",cuartoId:"cu_elec"},
    {id:"tc_turbo",nombre:"Turbo",cuartoId:"cu_turbo"},
    {id:"tc_actuador",nombre:"Actuador / VGT",cuartoId:"cu_turbo"},
    {id:"tc_iny_unit",nombre:"Inyector unitario (EUI)",cuartoId:"cu_unit"},
    {id:"tc_heui",nombre:"Inyector HEUI",cuartoId:"cu_unit"},
    {id:"tc_iny_mec",nombre:"Inyector mecánico",cuartoId:"cu_mec"},
    {id:"tc_bomba_lin",nombre:"Bomba lineal",cuartoId:"cu_mec"},
    {id:"tc_bomba_rot",nombre:"Bomba rotativa",cuartoId:"cu_mec"},
    {id:"tc_otro",nombre:"Otro componente",cuartoId:"cu_mec"}
  ];
  /* Tipología = variante. Se acota de dos formas y ambas pueden ir vacías:
     - cuartoId: aparece en todos los componentes de ese cuarto (ISB sirve para
       inyector, riel y bomba de alta: se escribe UNA vez).
     - tipoComponenteId: solo para ese componente (K16 solo aplica a Turbo).
     - las dos vacías: aparece en todo el laboratorio (NQR). */
  const T=(id,nombre,cuartoId,tipoComponenteId,alias)=>({id,nombre,cuartoId:cuartoId||"",tipoComponenteId:tipoComponenteId||"",alias:alias||""});
  const tipologias=[
    T("tp_isb","ISB","cu_elec"), T("tp_isx","ISX","cu_elec"), T("tp_isf","ISF 2.8","cu_elec"),
    T("tp_duramax","Duramax","cu_elec"), T("tp_hilux","Hilux 2KD","cu_elec"),
    T("tp_nqr","NQR"),
    T("tp_detroit","Detroit serie 60","cu_unit"), T("tp_n14","Cummins N14","cu_unit"),
    T("tp_3126","CAT 3126","cu_unit"), T("tp_powerstroke","Power Stroke 7.3","cu_unit"),
    T("tp_cp3","CP3","","tc_bomba_alta"), T("tp_cp4","CP4","","tc_bomba_alta"),
    T("tp_conv","Convencional","","tc_turbo"), T("tp_k16","K16","","tc_turbo"),
    T("tp_hx35","HX35","","tc_turbo"), T("tp_gt2256","GT2256","","tc_turbo"),
    T("tp_lineal","Lineal","","tc_bomba_lin","bomba lineal, pe, bosch pe, in line"),
    T("tp_ve","VE","","tc_bomba_rot","bomba ve, perkins ve, perkins, bosch ve, cav, delphi, cav delphi, dpa, rotativa")
  ];
  /* DIAGNÓSTICO: cada actividad con su propio tiempo, tomado de la tabla.
     REPARACIÓN: una sola bolsa de tiempo que se reparte por porcentaje.
     ENTREGA: alistamiento aparte. Todo editable desde Maestros. */
  const A=(id,nombre,orden,fase,cuartos,extra)=>Object.assign(
    {id,nombre,orden,fase,cuartos:cuartos||[],noProductiva:false,porOrden:false}, extra||{});
  const BANCOS=["cu_elec","cu_unit","cu_mec"];
  const TURBO =["cu_turbo"];
  const actividades=[
    /* --- diagnóstico --- */
    A("ac_desarme","Desarme",1,"Diagnóstico"),
    A("ac_test","Prueba en banco",2,"Diagnóstico",["cu_elec"]),
    A("ac_tobera","Prueba inyector / tobera",3,"Diagnóstico",["cu_unit","cu_mec"]),
    A("ac_informe","Informe técnico",4,"Diagnóstico",null,{porOrden:true}),
    A("ac_lavado","Lavado / limpieza",5,"Lavado"),
    /* --- reparación: se reparte el tiempo total --- */
    A("ac_mtto_comp","Mantenimiento del componente",10,"Reparación",BANCOS),
    A("ac_calibra","Calibración en banco",11,"Reparación",["cu_elec"]),
    A("ac_calibra_t","Calibración en tester",12,"Reparación",["cu_unit","cu_mec"]),
    A("ac_codifica","Codificación / IMA-ISA",13,"Reparación",["cu_elec"]),
    A("ac_sandblast","Sandblasteo y pintura",20,"Reparación",TURBO),
    A("ac_cartridge","Montaje de cartridge",21,"Reparación",TURBO),
    A("ac_balanceo","Balanceo (VSR)",22,"Reparación",TURBO),

/* ---------------------------------------------------------------------------
   TIEMPO ESTÁNDAR DE UNA ACTIVIDAD · tres niveles, gana el más específico:
   1. Estándar escrito para esa actividad exacta (con o sin tipología).
   2. Tiempo TOTAL del proceso × el % que le toca a la actividad (reparto).
   3. Cero si no hay nada definido.
   Así basta cargar "Reparación total inyectores CR = 1 h" y un reparto,
   y cada paso queda valorado sin cronometrarlo por separado.
--------------------------------------------------------------------------- */
const ACT_TOTAL = "TOTAL";
function estandarExacto(tc, tip, act){
  const ex = DB.estandares.find(e=>e.tipoComponenteId===tc && e.actividadId===act && e.tipologiaId===tip);
  if(ex) return ex.minutos;
  const gen = DB.estandares.find(e=>e.tipoComponenteId===tc && e.actividadId===act && e.tipologiaId==="*");
  return gen ? gen.minutos : null;
}
function totalProceso(tc, tip){
  const v = estandarExacto(tc, tip, ACT_TOTAL);
  return v==null ? 0 : v;
}
function repartoDe(tc, act){
  const todos = DB.repartos || (DB.repartos=[]);
  const propios = todos.filter(r=>r.tipoComponenteId===tc);
  const lista = propios.length ? propios : todos.filter(r=>r.tipoComponenteId==="*");
  const r = lista.find(x=>x.actividadId===act);
  return r ? (+r.porcentaje||0) : 0;
}
function sumaReparto(tc){
  const todos = DB.repartos || (DB.repartos=[]);
  const propios = todos.filter(r=>r.tipoComponenteId===tc);
  const lista = propios.length ? propios : todos.filter(r=>r.tipoComponenteId==="*");
  return lista.reduce((a,r)=>a+(+r.porcentaje||0),0);
}
function estandarMin(tipoComponenteId, tipologiaId, actividadId){
  /* 1) Minutos escritos para ESA tipología exacta: mandan sobre todo. */
  if(tipologiaId && tipologiaId!=="*"){
    const propio = DB.estandares.find(e=>e.tipoComponenteId===tipoComponenteId
      && e.actividadId===actividadId && e.tipologiaId===tipologiaId);
    if(propio) return +propio.minutos||0;
  }
  /* 2) Minutos generales de la actividad. Si la tipología tiene su propio
        total (un biturbo son 5 h y no 3), cada paso se escala en proporción. */
  const gen = DB.estandares.find(e=>e.tipoComponenteId===tipoComponenteId
    && e.actividadId===actividadId && e.tipologiaId==="*");
  if(gen){
    const m=+gen.minutos||0;
    if(gen.aparte) return m;                       /* alternativa suelta: no escala */
    const f=factorTipologia(tipoComponenteId, tipologiaId);
    return f===1 ? m : Math.round(m*f);
  }
  /* 3) Plan B: total del proceso × porcentaje del reparto escrito a mano. */
  const total = totalProceso(tipoComponenteId, tipologiaId);
  if(!total) return 0;
  const pct = repartoDe(tipoComponenteId, actividadId);
  return pct ? Math.round(total*pct/100) : 0;
}
/* -------------------------------------------------------------------------
   PESO DE UNA ACTIVIDAD DENTRO DEL PROCESO
   Si el componente tiene minutos escritos por actividad, el porcentaje se
   DEDUCE de ellos: lavado 15 min de 90 = 17% del proceso. Nadie tiene que
   escribir porcentajes. El reparto manual queda solo como plan B para
   componentes de los que únicamente se conoce el total.
------------------------------------------------------------------------- */
function minutosPropios(tc){
  return DB.estandares.filter(e=>e.tipoComponenteId===tc && e.tipologiaId==="*"
    && e.actividadId!==ACT_TOTAL && (+e.minutos||0)>0);
}
/* Hay actividades que NO forman parte del proceso normal: son alternativas o
   servicios sueltos (montaje de cartridge en vez de armar, mantenimiento sin
   reparación). No suman al total ni entran en los porcentajes, pero el técnico
   sí puede marcarlas y ganan sus minutos. */
function minutosDelProceso(tc){ return minutosPropios(tc).filter(e=>!e.aparte); }
/* Cuánto tarda de más (o de menos) una tipología frente al proceso normal.
   Biturbo 335 min sobre un turbo de 215 -> factor 1,56: cada paso se estira. */
function factorTipologia(tc, tipologiaId){
  if(!tipologiaId || tipologiaId==="*") return 1;
  const tt=DB.estandares.find(e=>e.tipoComponenteId===tc && e.actividadId===ACT_TOTAL && e.tipologiaId===tipologiaId);
  if(!tt) return 1;
  const base=resumenTiempos(tc).total;
  if(!base) return 1;
  return (+tt.minutos||0)/base;
}
function pesoActividad(tc, actId){
  const props = minutosDelProceso(tc);
  if(props.length){
    const suma = props.reduce((a,e)=>a+(+e.minutos||0),0);
    const mia  = props.find(e=>e.actividadId===actId);
    return (mia && suma) ? (+mia.minutos/suma*100) : 0;
  }
  return repartoDe(tc, actId);         /* plan B: el reparto escrito a mano */
}
/* Actividades que de verdad se le hacen a un componente: las que tienen
   minutos escritos. Si todavía no hay ninguna configurada, se muestran todas
   las del cuarto para no dejar al técnico sin dónde registrar. */
function actividadesDeComponente(tipoComponenteId, cuartoId){
  const todas = actividadesDe(cuartoId);
  const props = minutosPropios(tipoComponenteId);
  if(!props.length) return todas;
  const con = new Set(props.map(e=>e.actividadId));
  return todas.filter(a=>con.has(a.id) || a.noProductiva);
}
/* Suma por fase, para el resumen en vivo del editor. */
function resumenTiempos(tc){
  const r={diagnostico:0, reparacion:0, entrega:0, apoyo:0, total:0};
  minutosDelProceso(tc).forEach(e=>{
    const a=byId(DB.actividades,e.actividadId); if(!a || a.noProductiva) return;
    const m=+e.minutos||0;
    const f=(a.fase||"").toLowerCase();
    if(f.indexOf("diagn")===0) r.diagnostico+=m;
    else if(f.indexOf("entrega")===0) r.entrega+=m;
    else if(f.indexOf("apoyo")===0) r.apoyo+=m;
    else r.reparacion+=m;                      /* Lavado y Reparación cuentan como reparación */
  });
  r.total=r.diagnostico+r.reparacion+r.entrega;
  return r;
}
/* De dónde salió el número, para mostrarlo al técnico y al coordinador. */
function origenEstandar(tipoComponenteId, tipologiaId, actividadId){
  const gen=DB.estandares.find(e=>e.tipoComponenteId===tipoComponenteId
    && e.actividadId===actividadId && e.tipologiaId==="*");
  if(gen && !gen.aparte && factorTipologia(tipoComponenteId,tipologiaId)!==1) return "escala";
  if(estandarExacto(tipoComponenteId, tipologiaId, actividadId)!=null) return "propio";
  const total=totalProceso(tipoComponenteId, tipologiaId);
  if(total && repartoDe(tipoComponenteId, actividadId)) return "reparto";
  return "sin";
}
/* ---------- horario real: L-M-V 8am-5pm, Ma-J 8am-6pm, break 15 min ---------- */
function horario(){
  const h = DB.meta.horario || {};
  return {dias: h.dias || {0:0,1:480,2:540,3:480,4:540,5:480,6:0}, breakMin: h.breakMin==null?15:h.breakMin, descontarBreak: h.descontarBreak!==false};
}
function esFestivo(iso){ return (DB.festivos||[]).indexOf(iso)>=0; }
function capacidadDia(iso){
  if(esFestivo(iso)) return 0;          /* festivo: no resta ni suma */
  const h=horario(), dow=new Date(iso+"T12:00:00").getDay();
  const bruto = +h.dias[dow] || 0;
  if(!bruto) return 0;
  return Math.max(0, bruto - (h.descontarBreak ? h.breakMin : 0));
}
/* =========================================================================
   AUSENCIAS Y JORNADA
   La jornada disponible no es igual para todos: uno puede estar incapacitado,
   otro llegar a mediodía. Aquí se guarda por rango de fechas, y el rango puede
   quedar ABIERTO cuando todavía no se sabe cuándo vuelve.
   Regla clave: si el técnico registra trabajo un día, ese día cuenta completo
   aunque la ausencia siga abierta. Así el rango se cierra solo cuando vuelve.
   ========================================================================= */
/* =========================================================================
   IDENTIFICADORES ESTABLES
   Antes cada equipo le ponía a la orden un número al azar. La OT 4853 era
   or_msnlhph... en el PC del coordinador y or_msqbg24... en el de Felipe:
   la misma orden con dos nombres. Al llegar el registro de Felipe, aquí no
   existía ese número y quedaba "sin OT".
   Ahora el identificador se CALCULA a partir del contenido (OT + cuarto +
   fecha de ingreso), así que todos los equipos llegan al mismo resultado.
   Es la misma idea de la cédula: se deriva de la persona, no de quién archiva.
   ========================================================================= */
function hash36(txt){
  let a=2166136261, b=2654435761;
  const s=String(txt);
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    a^=c; a=Math.imul(a,16777619);
    b=Math.imul(b^c, 2246822519); b=(b<<13)|(b>>>19);
  }
  return ((a>>>0).toString(36)+(b>>>0).toString(36)).padEnd(13,"0").slice(0,13);
}
const claveOrden = (ot,cuartoDeclaradoId,fechaIngreso)=>
  [String(ot==null?"":ot).trim().toLowerCase(), cuartoDeclaradoId||"", fechaIngreso||""].join("|");
function idOrden(ot, cuartoDeclaradoId, fechaIngreso){
  return "or_"+hash36(claveOrden(ot,cuartoDeclaradoId,fechaIngreso));
}
function idComponente(ordenId, tipoComponenteId, tipologiaId){
  return "cp_"+hash36([ordenId, tipoComponenteId||"", tipologiaId||""].join("|"));
}
function ausenciaEn(tecnicoId, iso){
  return (DB.ausencias||[]).find(a=>a.tecnicoId===tecnicoId
    && iso>=a.desde && (!a.hasta || iso<=a.hasta));
}
function trabajoEse(tecnicoId, iso){
  return DB.registros.some(r=>!r.anulado && r.tecnicoId===tecnicoId && r.fecha===iso);
}
function capacidadTecnicoDia(tecnicoId, iso){
  const base=capacidadDia(iso);
  if(!base) return 0;                       /* festivo o día no laboral */
  const a=ausenciaEn(tecnicoId, iso);
  if(!a) return base;
  if(trabajoEse(tecnicoId, iso)) return base;   /* volvió: la ausencia no aplica */
  return a.tipo==="media" ? Math.round(base/2) : 0;
}
function capacidadTecnicoRango(tecnicoId, desde, hasta){
  let t=0; const a=new Date(desde+"T12:00:00"), b=new Date(hasta+"T12:00:00");
  while(a<=b){ t+=capacidadTecnicoDia(tecnicoId, isoLocal(a)); a.setDate(a.getDate()+1); }
  return t;
}
/* Quién entra en el denominador de los indicadores.
   No todos los técnicos producen horas de reparación: soldadura, torno y
   mantenimiento son cuartos de apoyo y no registran órdenes. Si se cuentan,
   arrastran la productividad hacia abajo sin que nadie haya rendido mal.
   Regla: cuentan los de cuartos PRINCIPALES, y además cualquiera que sí haya
   registrado algo en el periodo (si mañana soldadura empieza a registrar,
   entra sola sin tocar configuración). */
function tecnicosQueCuentan(desde, hasta, cuartoId, tecnicoId){
  const principales=new Set(DB.cuartos.filter(c=>c.tipo==="principal").map(c=>c.id));
  const conRegistro=new Set(DB.registros.filter(r=>!r.anulado && r.fecha>=desde && r.fecha<=hasta).map(r=>r.tecnicoId));
  return DB.tecnicos.filter(t=>{
    if(t.activo===false || t.rol==="coordinador") return false;
    if(tecnicoId && t.id!==tecnicoId) return false;
    if(cuartoId && t.cuartoId!==cuartoId) return false;
    return principales.has(t.cuartoId) || conRegistro.has(t.id);
  });
}
/* Jornada realmente disponible del grupo que se está mirando. */
function capacidadEquipoRango(desde, hasta, cuartoId, tecnicoId){
  return tecnicosQueCuentan(desde,hasta,cuartoId,tecnicoId)
    .reduce((acc,t)=>acc+capacidadTecnicoRango(t.id, desde, hasta), 0);
}
/* Minutos que se perdieron por ausencia en el rango (para el informe). */
function minutosAusencia(desde, hasta){
  return DB.tecnicos.filter(t=>t.activo!==false && t.rol!=="coordinador")
    .reduce((acc,t)=>{
      let p=0; const a=new Date(desde+"T12:00:00"), b=new Date(hasta+"T12:00:00");
      while(a<=b){ const iso=isoLocal(a); p+=capacidadDia(iso)-capacidadTecnicoDia(t.id,iso); a.setDate(a.getDate()+1); }
      return acc+p;
    },0);
}
function capacidadRango(desde, hasta){
  let t=0; const a=new Date(desde+"T12:00:00"), b=new Date(hasta+"T12:00:00");
  while(a<=b){ t+=capacidadDia(isoLocal(a)); a.setDate(a.getDate()+1); }
  return t;
}
/* Tipologías válidas para un tipo de componente.
   Sin restricción = aplica; restringida por cuarto = solo ese cuarto;
   restringida por tipo = solo ese componente. */
/* SUGERIDAS para un componente: las que su cuarto o su tipo hacen probables.
   No es un bloqueo: cualquier tipología puede usarse en cualquier componente.
   Un motor ISB tiene inyectores, riel, bomba y también turbo. */
function tipologiasDe(tipoComponenteId){
  const tc = byId(DB.tiposComponente, tipoComponenteId);
  const cu = tc ? tc.cuartoId : "";
  return DB.tipologias.filter(t=>{
    if(t.tipoComponenteId && t.tipoComponenteId!==tipoComponenteId) return false;
    if(t.cuartoId && t.cuartoId!==cu) return false;
    return true;
  });
}
/* Una tipología puede escribirse de varias formas en la hoja:
   "VE", "PERKINS VE", "BOMBA VE" son la misma bomba rotativa. */
function coincideTipologia(t, texto){
  const x=sinTildes(texto).trim(); if(!x) return false;
  if(sinTildes(t.nombre).trim()===x) return true;
  return String(t.alias||"").split(/[,;|]/).map(a=>sinTildes(a).trim()).filter(Boolean).indexOf(x)>=0;
}
function tipologiasOtras(tipoComponenteId){
  const sug=new Set(tipologiasDe(tipoComponenteId).map(t=>t.id));
  return DB.tipologias.filter(t=>!sug.has(t.id));
}
/* Busca por nombre: primero entre las sugeridas, luego en todas. */
function buscarTipologia(tipoComponenteId, nombre){
  return tipologiasDe(tipoComponenteId).find(x=>coincideTipologia(x,nombre))
      || DB.tipologias.find(x=>coincideTipologia(x,nombre))
      || null;
}
function cuartoDeTipologia(t){
  if(t.cuartoId) return t.cuartoId;
  if(t.tipoComponenteId){ const tc=byId(DB.tiposComponente,t.tipoComponenteId); return tc?tc.cuartoId:""; }
  return "";
}
/* Actividades que aplican a un cuarto. Sin lista de cuartos = aplica a todos. */
const ORDEN_FASE={"Diagnóstico":1,"Lavado":2,"Reparación":3,"Entrega":4,"Apoyo":5};
function actividadesDe(cuartoId){
  return DB.actividades.filter(a=>!a.cuartos || !a.cuartos.length || a.cuartos.includes(cuartoId))
    .sort((a,b)=>((ORDEN_FASE[a.fase]||9)-(ORDEN_FASE[b.fase]||9)) || (a.orden||0)-(b.orden||0));
}
function esCoordinador(){ const me = YO? byId(DB.tecnicos,YO):null; return !!(me && me.rol==="coordinador"); }
/* Los registros nunca se borran: se anulan y quedan con rastro. RA() son los que cuentan. */
function RA(){ return DB.registros.filter(r=>!r.anulado); }
/* Cuántas unidades se han registrado ya de una actividad sobre un componente.
   La hoja define el techo: si la OT trae 5 inyectores, no se pueden entregar 8. */
function yaRegistrado(componenteId, actividadId, excluirId){
  return RA().filter(r=>r.componenteId===componenteId && r.actividadId===actividadId && r.id!==excluirId)
    .reduce((a,r)=>a+(+r.cantidad||0),0);
}
/* Actividades que no producen horas ganadas (aseo, capacitación, mantenimiento
   de equipos). No cuentan como improductividad: descuentan jornada disponible. */
/* Hay actividades que se hacen UNA VEZ por orden, no por pieza: el informe
   técnico de 6 inyectores es uno solo. No se multiplican por la cantidad. */
function esPorOrden(actividadId){ const a=byId(DB.actividades,actividadId); return !!(a && a.porOrden); }
/* El registro guarda una FOTO de lo que se trabajó (tipo, tipología, OT en texto).
   Si mañana la orden se recrea con otro id interno, el registro sigue sabiendo
   qué era: conserva sus horas estándar y sigue apareciendo en el informe. */
function fotoComponente(r){
  const c = byId(DB.componentes, r.componenteId);
  if(c) return c;
  if(r.tipoComponenteId) return {id:null, tipoComponenteId:r.tipoComponenteId,
    tipologiaId:r.tipologiaId||null, cantidad:r.cantidad, cuartoId:r.cuartoId};
  return null;
}
/* Texto de la OT para mostrar, venga de la orden viva o de la foto. */
function otDeRegistro(r){
  const o = byId(DB.ordenes, r.ordenId);
  return o ? o.ot : (r.otTexto||"");
}
function stdRegistro(comp, actividadId, cantidad){
  if(!comp) return 0;
  const u = estandarMin(comp.tipoComponenteId, comp.tipologiaId, actividadId);
  return esPorOrden(actividadId) ? u : u*(+cantidad||0);
}
function esNoProductiva(actividadId){ const a=byId(DB.actividades,actividadId); return !!(a && a.noProductiva); }
function minutosNoProductivos(regs){ return regs.filter(r=>esNoProductiva(r.actividadId)).reduce((a,r)=>a+r.minutos,0); }
/* AVANCE · qué parte del proceso ya se hizo, según el reparto porcentual.
   Es distinto del ESTADO: el estado lo pone coordinación en la hoja, el avance
   lo calcula la app con lo que los técnicos han registrado. */
function avanceComponente(c){
  const porAct={};
  RA().filter(r=>r.componenteId===c.id).forEach(r=>{
    porAct[r.actividadId]=(porAct[r.actividadId]||0)+(+r.cantidad||0);
  });
  let pct=0;
  Object.keys(porAct).forEach(a=>{
    const p=pesoActividad(c.tipoComponenteId,a);
    if(p) pct += p * Math.min(1, c.cantidad? porAct[a]/c.cantidad : 1);
  });
  return Math.min(100, Math.round(pct));
}
function avanceOrden(o){
  const cs=DB.componentes.filter(x=>x.ordenId===o.id);
  if(!cs.length) return null;
  return Math.round(cs.reduce((a,c)=>a+avanceComponente(c),0)/cs.length);
}
function pendientesComponente(c){
  const hechas=new Set(RA().filter(r=>r.componenteId===c.id).map(r=>r.actividadId));
  return actividadesDeComponente(c.tipoComponenteId, c.cuartoId).filter(a=>pesoActividad(c.tipoComponenteId,a.id) && !hechas.has(a.id));
}
function cerrados(){ return new Set(DB.estadosCerrados||["Entregado","Dado de baja"]); }
function estaCerrada(o){ return cerrados().has(o.estado); }
/* Cuarto de una orden: por sus componentes, o deducido del propio número de OT
   (tus OT vienen como "36093-Electrónico"). */
function sinTildes(x){ return String(x==null?"":x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
/* Una OT puede tener componentes de varios cuartos (inyectores + un turbo).
   Devuelve TODOS los cuartos a los que pertenece, no solo el primero. */
/* Familia = a qué grupo pertenece un tipo de componente. Permite que la columna
   INYECT. de la hoja caiga en "Inyector Common Rail" o en "Inyector unitario"
   según diga la celda TIPO (ISB va a CR, STH va a unitario). */
const PALABRAS_COMPONENTE=["inyector","inyectores","bomba","bombas","riel","rieles",
  "turbo","turbos","microfiltro","microfiltros","filtro","filtros","regulador","reguladores",
  "actuador","actuadores","cartridge","kit","varios"];
function esNombreDeComponente(txt){
  const t=sinTildes(txt).trim();
  const sinS=t.replace(/s$/,"");
  if(PALABRAS_COMPONENTE.indexOf(t)>=0 || PALABRAS_COMPONENTE.indexOf(sinS)>=0) return true;
  return DB.tiposComponente.some(tc=>{
    const n=sinTildes(tc.nombre).trim();
    return n===t || n===sinS || n.replace(/s$/,"")===sinS;
  });
}
function familiaDe(nombre){
  const t=sinTildes(nombre);
  if(t.indexOf("inyector")>=0) return "inyector";
  if(t.indexOf("riel")>=0) return "riel";
  if(t.indexOf("bomba")>=0) return "bomba";
  if(t.indexOf("turbo")>=0) return "turbo";
  if(t.indexOf("actuador")>=0||t.indexOf("regulador")>=0||t.indexOf("vgt")>=0) return "regulador";
  return "otro";
}
/* El sufijo de la OT ("36055-Unitario") dice a qué cuarto entró el trabajo.
   Es el dato más confiable de la hoja: lo escribe almacén con formato fijo. */
function cuartoDeclarado(ot){
  const t=sinTildes(ot);
  const c=DB.cuartos.find(x=>{ const nb=sinTildes(x.nombre); return nb && t.indexOf(nb)>=0; });
  return c? c.id : "";
}
/* Busca el cuarto por nombre; lo crea si la hoja trae uno que no existe. */
function cuartoPorNombre(nombre){
  const t=sinTildes(String(nombre||"").trim()); if(!t) return "";
  const c=DB.cuartos.find(x=>sinTildes(x.nombre)===t)
       || DB.cuartos.find(x=>t.indexOf(sinTildes(x.nombre))>=0 || sinTildes(x.nombre).indexOf(t)>=0);
  if(c) return c.id;
  const nuevo={id:uid("cu"),nombre:String(nombre).trim(),tipo:"principal",grupo:""};
  DB.cuartos.push(nuevo); return nuevo.id;
}
/* Elige el componente exacto dentro de su familia. Prioridad:
   1. Que pertenezca al cuarto declarado en la OT  (BOMBAS -> PLD si dice Unitario)
   2. Que alguna tipología de la celda TIPO le calce
   3. El que estaba mapeado en la columna                                        */
function resolverTipo(tipoBase, tokens, usados, cuartoOT){
  const fam=familiaDe(tipoBase.nombre);
  const familia=[tipoBase].concat(DB.tiposComponente.filter(t=>t.id!==tipoBase.id && familiaDe(t.nombre)===fam));
  const delCuarto = cuartoOT ? familia.filter(t=>t.cuartoId===cuartoOT) : [];
  const pref = delCuarto.length ? delCuarto : familia;
  /* 1) Tipología que TÚ ataste a ese componente: manda sobre todo.
        Así "VE → Bomba rotativa" gana a una tipología suelta creada sola. */
  for(const t of pref){
    for(const tk of tokens){
      if(usados.has(tk)) continue;
      const ok=DB.tipologias.find(x=>x.tipoComponenteId===t.id && coincideTipologia(x,tk));
      if(ok) return {tipo:t, tip:ok, token:tk};
    }
  }
  /* 2) Tipología sugerida para ese componente por su cuarto, o libre. */
  for(const t of pref){
    for(const tk of tokens){
      if(usados.has(tk)) continue;
      const ok=tipologiasDe(t.id).find(x=>coincideTipologia(x,tk));
      if(ok) return {tipo:t, tip:ok, token:tk};
    }
  }
  /* 3) Solo las tipologías que NO están atadas a otro componente.
        ISB puede cruzar a un turbo; "Lineal" no puede cruzar a un inyector. */
  for(const t of pref){
    for(const tk of tokens){
      if(usados.has(tk)) continue;
      const ok=DB.tipologias.find(x=>!x.tipoComponenteId && coincideTipologia(x,tk));
      if(ok) return {tipo:t, tip:ok, token:tk};
    }
  }
  /* Última oportunidad: cualquier tipología cuyo nombre o alias coincida.
     Si el usuario ya dijo "esto es una tipología", debe valer siempre. */
  for(const t of pref){
    for(const tk of tokens){
      if(usados.has(tk)) continue;
      const ok=DB.tipologias.find(x=>coincideTipologia(x,tk));
      if(ok){
        const suyo = ok.tipoComponenteId ? byId(DB.tiposComponente,ok.tipoComponenteId) : null;
        /* si está atada a otro componente de la misma familia, se respeta esa */
        if(suyo && familiaDe(suyo.nombre)===fam && (!cuartoOT || suyo.cuartoId===cuartoOT))
          return {tipo:suyo, tip:ok, token:tk};
        if(!suyo) return {tipo:t, tip:ok, token:tk};
      }
    }
  }
  /* Nada calzó. Si algún texto apunta a un componente que existe pero está
     configurado en OTRA sala, se avisa: es un error de configuración. */
  for(const tk of tokens){
    if(usados.has(tk)) continue;
    const tp=DB.tipologias.find(x=>x.tipoComponenteId && coincideTipologia(x,tk));
    if(tp){
      const otro=byId(DB.tiposComponente,tp.tipoComponenteId);
      if(otro && familiaDe(otro.nombre)===fam && cuartoOT && otro.cuartoId!==cuartoOT)
        return {tipo:pref[0]||tipoBase, tip:null, token:null,
                aviso:`"${tk}" apunta a ${otro.nombre}, que está configurado en ${nom(DB.cuartos,otro.cuartoId)} y no en ${nom(DB.cuartos,cuartoOT)}`};
    }
  }
  return {tipo:pref[0]||tipoBase, tip:null, token:null};
}
/* Tus OT vienen como "36059-Unitario": el número es el mismo trabajo y el
   sufijo es el cuarto. Una misma OT genera una fila por cuarto, cada una con
   su propio estado. Estas funciones las relacionan sin fusionarlas. */
function otBase(ot){
  const t=String(ot==null?"":ot).trim();
  const m=t.match(/^([^-\s]+)/);
  return m? m[1] : t;
}
function hermanasDe(o){
  const b=otBase(o.ot);
  return DB.ordenes.filter(x=>x.id!==o.id && otBase(x.ot)===b);
}
/* Etiqueta visible: "36059 · Unitario" cuando la OT vive en varios cuartos. */
function etiquetaOT(o){
  const cu=o.cuartoDeclaradoId?nom(DB.cuartos,o.cuartoDeclaradoId):"";
  let t = cu && sinTildes(o.ot).indexOf(sinTildes(cu))<0 ? o.ot+" · "+cu : o.ot;
  /* Si la misma OT entró al mismo cuarto en fechas distintas, se distingue por
     la fecha: puede ser una pieza que llegó después o un reingreso por garantía. */
  const gemelas=DB.ordenes.filter(x=>x.ot===o.ot && (x.cuartoDeclaradoId||"")===(o.cuartoDeclaradoId||""));
  if(gemelas.length>1) t += " · ingresó "+fmtFecha(o.fechaIngreso);
  return t;
}
/* Cuarto al que pertenece un componente: manda el que declara la orden en la
   hoja. Si el tipo de componente está configurado en otra sala, la hoja gana. */
function cuartoDeComponente(c){
  const o=byId(DB.ordenes,c.ordenId);
  return (o && o.cuartoDeclaradoId) || c.cuartoId || "";
}
function cuartosDeOrden(o){
  /* Si la hoja declara el cuarto, esa es la verdad: la orden pertenece a ese
     cuarto aunque alguno de sus componentes esté mal configurado en otra sala. */
  if(o.cuartoDeclaradoId) return new Set([o.cuartoDeclaradoId]);
  const set = new Set(DB.componentes.filter(c=>c.ordenId===o.id).map(c=>c.cuartoId).filter(Boolean));
  const t = sinTildes(o.ot);
  DB.cuartos.forEach(c=>{ const nb=sinTildes(c.nombre); if(nb && t.indexOf(nb)>=0) set.add(c.id); });
  return set;
}
function cuartoDeOrden(o){ const s=cuartosDeOrden(o); return s.size? [...s][0] : ""; }

/* ---------- persistencia (lee-modifica-escribe para no pisar datos) -------- */
/* Actualiza la estructura de una base ya existente SIN tocar los datos.
   Corre sola al abrir: los campos nuevos se agregan vacíos y todo sigue igual. */
function migrar(){
  let n=0;
  if(!DB.meta.horario){ DB.meta.horario={dias:{0:0,1:480,2:540,3:480,4:540,5:480,6:0},breakMin:15,descontarBreak:false}; n++; }
  if(DB.meta.pin===undefined){ DB.meta.pin=""; n++; }
  if(!DB.meta.conexion){ DB.meta.conexion={modo:"",csvUrl:"",gsUrl:"",autoMin:10,mapa:null,desdeFecha:"",ultimaSync:"",ultimoError:""}; n++; }
  if(DB.meta.conexion.desdeFecha===undefined){ DB.meta.conexion.desdeFecha=""; n++; }
  if(!DB.meta.conexion.sinFecha){ DB.meta.conexion.sinFecha="omitir"; n++; }
  if(DB.meta.jornadaMin!==undefined){ delete DB.meta.jornadaMin; n++; }
  if(!DB.meta.capturaTiempo){ DB.meta.capturaTiempo="simple"; n++; }
  if(!Array.isArray(DB.repartos)){ DB.repartos=[]; n++; }
  if(!DB.estadosCerrados){ DB.estadosCerrados=["Entregado","Dado de baja","No autorizado"]; n++; }
  if(DB.meta.diasRetro===undefined){ DB.meta.diasRetro=2; n++; }
  if(!Array.isArray(DB.meta.tokensIgnorados)){ DB.meta.tokensIgnorados=[]; n++; }
  if(!Array.isArray(DB.motivos)){ DB.motivos=["Reparación","Garantía","Diagnóstico","Mantenimiento"]; n++; }
  if(DB.meta.inicioSemana===undefined){ DB.meta.inicioSemana=5; n++; }
  if(!Array.isArray(DB.festivos)){ DB.festivos=["2026-01-01","2026-01-12","2026-03-23","2026-04-02",
    "2026-04-03","2026-05-01","2026-05-18","2026-06-08","2026-06-15","2026-06-29","2026-07-20",
    "2026-08-07","2026-08-17","2026-10-12","2026-11-02","2026-11-16","2026-12-08","2026-12-25"]; n++; }
  DB.actividades.forEach(a=>{ if(a.porOrden===undefined){ a.porOrden=/informe|cotiza/i.test(a.nombre); n++; } });
  DB.actividades.forEach(a=>{ if(a.noProductiva===undefined){
    a.noProductiva = /aseo|5s|capacit|reuni|mantenimiento de equipo/i.test(a.nombre); n++; } });
  DB.cuartos.forEach(c=>{ if(c.grupo===undefined){c.grupo="";n++;} });
  DB.tecnicos.forEach(t=>{ if(!t.rol){t.rol="tecnico";n++;} if(t.pin===undefined){t.pin="";n++;} });
  DB.actividades.forEach(a=>{ if(!Array.isArray(a.cuartos)){a.cuartos=[];n++;} });
  DB.tipologias.forEach(t=>{ if(t.cuartoId===undefined){t.cuartoId="";n++;} if(t.tipoComponenteId===undefined){t.tipoComponenteId="";n++;} if(t.alias===undefined){t.alias="";n++;} });
  DB.registros.forEach(r=>{ if(!Array.isArray(r.historial)){r.historial=[];n++;} });
  /* Registros cuyo componente desapareció por una sincronización anterior:
     se reconectan al componente equivalente de la misma orden. */
  DB.registros.forEach(r=>{
    if(r.sinOrden) return;
    /* Copia legible: sobrevive aunque la orden o el componente desaparezcan. */
    if(!r.otTexto && r.ordenId){ const o=byId(DB.ordenes,r.ordenId); if(o){ r.otTexto=o.ot; n++; } }
    if(!r.compTexto && r.componenteId){ const c=fotoComponente(r);
      if(c){ r.compTexto=nom(DB.tiposComponente,c.tipoComponenteId,""); n++; } }
    if(!r.ordenId) return;
    /* Equivalencias que compartieron otros equipos al renumerar. */
    const eq=DB.meta.remapeoIds||{};
    if(!byId(DB.ordenes,r.ordenId) && eq[r.ordenId]){ r.ordenId=eq[r.ordenId]; n++; }
    if(r.componenteId && !byId(DB.componentes,r.componenteId) && eq[r.componenteId]){ r.componenteId=eq[r.componenteId]; n++; }
    /* Si la orden se recreó con otro id, se reengancha por el número de OT. */
    if(!byId(DB.ordenes,r.ordenId) && r.otTexto){
      const o=DB.ordenes.find(x=>x.ot===r.otTexto && (!r.cuartoId || (x.cuartoDeclaradoId||"")===r.cuartoId))
           || DB.ordenes.find(x=>x.ot===r.otTexto);
      if(o){ r.ordenId=o.id; n++; }
    }
    if(r.componenteId && byId(DB.componentes,r.componenteId)) return;
    const cands=DB.componentes.filter(c=>c.ordenId===r.ordenId);
    if(!cands.length) return;
    const porNombre = r.compTexto ? cands.find(c=>nom(DB.tiposComponente,c.tipoComponenteId)===r.compTexto) : null;
    const mismo = r.cuartoId ? cands.find(c=>c.cuartoId===r.cuartoId) : null;
    r.componenteId = (porNombre||mismo||cands[0]).id; n++;
  });
  /* --- Ordena las actividades: une duplicados exactos y deja la estructura
     de diagnóstico desglosado. Se ejecuta una sola vez. No toca registros:
     los traslada a la actividad que se conserva. --- */
  if((DB.meta.version||0) < 6){
    const norm=x=>sinTildes(x).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
    /* 1) duplicados con el mismo nombre: gana el primero, el resto se fusiona */
    const porNom={};
    DB.actividades.slice().forEach(a=>{
      const k=norm(a.nombre);
      if(porNom[k]){
        const destino=porNom[k];
        DB.registros.forEach(r=>{ if(r.actividadId===a.id) r.actividadId=destino.id; });
        DB.estandares.forEach(e=>{ if(e.actividadId===a.id) e.actividadId=destino.id; });
        DB.repartos=DB.repartos.filter(r=>r.actividadId!==a.id);
        DB.actividades=DB.actividades.filter(x=>x.id!==a.id); n++;
      } else porNom[k]=a;
    });
    /* 2) estructura canónica */
    const canon=[
      {id:"ac_desarme",  nombre:"Desarme",                      fase:"Diagnóstico", cuartos:[], alias:[]},
      {id:"ac_test",     nombre:"Prueba en banco",              fase:"Diagnóstico", cuartos:["cu_elec"], alias:["diagnostico","prueba inicial en banco","prueba en el banco"]},
      {id:"ac_tobera",   nombre:"Prueba inyector / tobera",     fase:"Diagnóstico", cuartos:["cu_unit","cu_mec"], alias:["prueba inyector","prueba de tobera","prueba en tester"]},
      {id:"ac_t_inspec", nombre:"Inspección y medición",        fase:"Diagnóstico", cuartos:["cu_turbo","cu_sold","cu_torno"], alias:["inspeccion visual","medicion de juegos"]},
      {id:"ac_lavado",   nombre:"Lavado / limpieza",            fase:"Diagnóstico", cuartos:[], alias:["lavado","limpieza","lavado limpieza ultrasonido"]},
      {id:"ac_informe",  nombre:"Informe técnico",              fase:"Diagnóstico", cuartos:[], alias:["informe","cotizacion"], porOrden:true},
      {id:"ac_mtto_comp",nombre:"Mantenimiento del componente", fase:"Reparación",  cuartos:["cu_elec","cu_unit","cu_mec"], alias:["armado","cambio de repuestos","reparacion general"]},
      {id:"ac_calibra",  nombre:"Calibración en banco",         fase:"Reparación",  cuartos:["cu_elec"], alias:["calibracion","calibracion y prueba en banco"]},
      {id:"ac_calibra_t",nombre:"Calibración en tester",        fase:"Reparación",  cuartos:["cu_unit","cu_mec"], alias:[]},
      {id:"ac_alist",    nombre:"Alistamiento y entrega",       fase:"Entrega",     cuartos:[], alias:["alistamiento","empaque y entrega"]}
    ];
    const intocables=new Set(DB.actividades.filter(a=>
      (a.cuartos||[]).indexOf("cu_turbo")>=0 || a.noProductiva).map(a=>a.id));
    const ids={};
    canon.forEach(c=>{
      let destino=DB.actividades.find(a=>a.id===c.id) ||
                  DB.actividades.find(a=>!intocables.has(a.id) && norm(a.nombre)===norm(c.nombre));
      if(!destino){ destino={id:c.id,nombre:c.nombre,orden:1,fase:c.fase,cuartos:c.cuartos,noProductiva:false,porOrden:!!c.porOrden};
        DB.actividades.push(destino); n++; }
      destino.nombre=c.nombre; destino.fase=c.fase; destino.cuartos=c.cuartos;
      destino.porOrden=!!c.porOrden; destino.noProductiva=false;
      ids[c.id]=destino.id;
      DB.actividades.filter(a=>a.id!==destino.id && !intocables.has(a.id) && c.alias.indexOf(norm(a.nombre))>=0)
        .forEach(vieja=>{
          DB.registros.forEach(r=>{ if(r.actividadId===vieja.id) r.actividadId=destino.id; });
          DB.estandares.forEach(e=>{ if(e.actividadId===vieja.id) e.actividadId=destino.id; });
          DB.repartos=DB.repartos.filter(r=>r.actividadId!==vieja.id);
          DB.actividades=DB.actividades.filter(a=>a.id!==vieja.id); n++;
        });
    });
    DB.actividades=DB.actividades.filter(a=>{
      if(/apoyo a otro cuarto/i.test(a.nombre) && !DB.registros.some(r=>r.actividadId===a.id)){ n++; return false; }
      return true;
    });
    /* 3) los tiempos por actividad se recargan del CSV; se conservan los totales */
    DB.estandares=DB.estandares.filter(e=>e.actividadId===ACT_TOTAL);
    /* 4) reparto: solo la hora de reparación */
    const turbo=DB.tiposComponente.find(t=>familiaDe(t.nombre)==="turbo");
    DB.repartos=[{id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_mtto_comp,porcentaje:60},
                 {id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_calibra,porcentaje:40}];
    const bt=f=>{const a=DB.actividades.find(x=>sinTildes(x.nombre).indexOf(f)>=0 && (x.cuartos||[]).indexOf("cu_turbo")>=0); return a?a.id:null;};
    if(turbo) [[bt("sandblast"),18],[bt("balanceo"),27],[bt("armado"),42],[bt("prueba final"),13]]
      .forEach(([a,p])=>{ if(a) DB.repartos.push({id:uid("rp"),tipoComponenteId:turbo.id,actividadId:a,porcentaje:p}); });
    ["cu_unit","cu_mec"].forEach(cu=>{
      DB.tiposComponente.filter(t=>t.cuartoId===cu).forEach(t=>{
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_mtto_comp,porcentaje:60});
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_calibra_t,porcentaje:40});
      });
    });
    n++;
  }
  /* --- Reparto de la bolsa de reparación, componente por componente.
     El peso refleja cuánto del trabajo real se lleva cada paso. --- */
  if((DB.meta.version||0) < 7){
    const act=(frag,cu)=>{
      const a=DB.actividades.find(x=>sinTildes(x.nombre).indexOf(sinTildes(frag))>=0 &&
        (!cu || !(x.cuartos||[]).length || (x.cuartos||[]).indexOf(cu)>=0));
      return a?a.id:null;
    };
    const nuevos=[];
    DB.tiposComponente.forEach(t=>{
      const cu=t.cuartoId, cuNom=sinTildes(nom(DB.cuartos,cu)), nb=sinTildes(t.nombre);
      const fam=familiaDe(t.nombre);
      const mtto=act("mantenimiento del componente",cu);
      const cal = cuNom.indexOf("electronico")>=0 ? act("calibracion en banco",cu)
                : (cuNom.indexOf("unitario")>=0||cuNom.indexOf("mecanico")>=0) ? act("calibracion en tester",cu) || act("calibracion mecanica",cu)
                : null;
      let pares=[];
      if(fam==="turbo"){
        pares=[[act("sandblast",cu),18],[act("balanceo",cu),27],[act("armado",cu),42],[act("prueba final",cu),13]];
      } else if(cuNom.indexOf("soldadura")>=0){
        pares=[[act("soldadura",cu),100]];
      } else if(cuNom.indexOf("torno")>=0){
        pares=[[act("torneado",cu)||act("rectific",cu),100]];
      } else if(/regulador|transferencia|microfiltro|filtro/.test(nb)){
        /* no pasan por banco: todo el tiempo es del mantenimiento */
        pares=[[mtto,100]];
      } else if(/riel/.test(nb)){
        pares=[[mtto,70],[cal,30]];
      } else if(/bomba/.test(nb)){
        pares=[[mtto,65],[cal,35]];
      } else if(/inyector/.test(nb) && cuNom.indexOf("mecanico")>=0){
        /* inyector mecánico: calibrar la tobera es la mitad del trabajo */
        pares=[[mtto,50],[cal,50]];
      } else {
        pares=[[mtto,60],[cal,40]];
      }
      const validos=pares.filter(([a,pc])=>a && pc>0);
      const suma=validos.reduce((x,[,pc])=>x+pc,0);
      if(!suma) return;
      let acum=0;
      validos.forEach(([a,pc],k)=>{
        const v = k===validos.length-1 ? 100-acum : Math.round(pc*100/suma);
        acum+=v; nuevos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:a,porcentaje:v});
      });
    });
    if(nuevos.length){
      const mt=act("mantenimiento del componente"), cb=act("calibracion en banco","cu_elec");
      DB.repartos=nuevos;
      if(mt&&cb) DB.repartos.push({id:uid("rp"),tipoComponenteId:"*",actividadId:mt,porcentaje:60},
                                  {id:uid("rp"),tipoComponenteId:"*",actividadId:cb,porcentaje:40});
      n++;
    }
  }
  /* --- Estructura definitiva de Electrónico y los bancos:
     DIAGNÓSTICO (desarme + montaje a banco + informe) · LAVADO · REPARACIÓN
     (armado + calibración mecánica + calibración en banco) · ALISTAMIENTO --- */
  if((DB.meta.version||0) < 8){
    const norm=x=>sinTildes(x).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
    const BANCOS=["cu_elec","cu_unit","cu_mec"];
    const canon=[
      {id:"ac_diag",     nombre:"Diagnóstico",           fase:"Diagnóstico", cuartos:[],
       alias:["desarme","prueba en banco","montaje a banco","prueba inicial","diagnostico"]},
      {id:"ac_lavado",   nombre:"Lavado / limpieza",     fase:"Diagnóstico", cuartos:[], alias:["lavado","limpieza"]},
      {id:"ac_informe",  nombre:"Informe técnico",       fase:"Diagnóstico", cuartos:[], alias:["informe","cotizacion"], porOrden:true},
      {id:"ac_armado",   nombre:"Armado",                fase:"Reparación",  cuartos:BANCOS,
       alias:["armado","mantenimiento del componente","mantenimiento componente","cambio de repuestos"]},
      {id:"ac_calibra_m",nombre:"Calibración mecánica",  fase:"Reparación",  cuartos:BANCOS,
       alias:["calibracion mecanica","calibracion componente"]},
      {id:"ac_calibra",  nombre:"Calibración en banco",  fase:"Reparación",  cuartos:["cu_elec"],
       alias:["calibracion en banco","calibracion"]},
      {id:"ac_calibra_t",nombre:"Calibración en tester", fase:"Reparación",  cuartos:["cu_unit","cu_mec"], alias:["calibracion en tester"]},
      {id:"ac_alist",    nombre:"Alistamiento y entrega",fase:"Entrega",     cuartos:[], alias:["alistamiento","empaque y entrega"]}
    ];
    const intocables=new Set(DB.actividades.filter(a=>
      (a.cuartos||[]).indexOf("cu_turbo")>=0 || a.noProductiva).map(a=>a.id));
    const ids={};
    canon.forEach(c=>{
      let d=DB.actividades.find(a=>a.id===c.id) ||
            DB.actividades.find(a=>!intocables.has(a.id) && norm(a.nombre)===norm(c.nombre));
      if(!d){ d={id:c.id,nombre:c.nombre,orden:1,fase:c.fase,cuartos:c.cuartos,noProductiva:false,porOrden:!!c.porOrden};
        DB.actividades.push(d); n++; }
      d.nombre=c.nombre; d.fase=c.fase; d.cuartos=c.cuartos; d.porOrden=!!c.porOrden; d.noProductiva=false;
      ids[c.id]=d.id;
      DB.actividades.filter(a=>a.id!==d.id && !intocables.has(a.id) && c.alias.indexOf(norm(a.nombre))>=0)
        .forEach(v=>{
          DB.registros.forEach(r=>{ if(r.actividadId===v.id) r.actividadId=d.id; });
          DB.estandares.forEach(e=>{ if(e.actividadId===v.id) e.actividadId=d.id; });
          DB.repartos=DB.repartos.filter(r=>r.actividadId!==v.id);
          DB.actividades=DB.actividades.filter(a=>a.id!==v.id); n++;
        });
    });
    /* el diagnóstico vuelve a ser UNA actividad con su tiempo completo */
    DB.tiposComponente.forEach(t=>{
      const dg=DB.estandares.filter(e=>e.tipoComponenteId===t.id && e.actividadId===ids.ac_diag);
      if(dg.length>1){ const suma=dg.reduce((a,e)=>a+e.minutos,0);
        DB.estandares=DB.estandares.filter(e=>!(e.tipoComponenteId===t.id && e.actividadId===ids.ac_diag));
        DB.estandares.push({id:uid("es"),tipoComponenteId:t.id,tipologiaId:"*",actividadId:ids.ac_diag,minutos:suma}); n++; }
    });
    /* reparto de la hora: armado, calibración mecánica y calibración en banco */
    const turbo=DB.tiposComponente.find(t=>familiaDe(t.nombre)==="turbo");
    const rpTurbo=DB.repartos.filter(r=>turbo && r.tipoComponenteId===turbo.id);
    DB.repartos=rpTurbo.concat([
      {id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_armado,porcentaje:40},
      {id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_calibra_m,porcentaje:25},
      {id:uid("rp"),tipoComponenteId:"*",actividadId:ids.ac_calibra,porcentaje:35}
    ]);
    ["cu_unit","cu_mec"].forEach(cu=>{
      DB.tiposComponente.filter(t=>t.cuartoId===cu).forEach(t=>{
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_armado,porcentaje:40});
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_calibra_m,porcentaje:25});
        DB.repartos.push({id:uid("rp"),tipoComponenteId:t.id,actividadId:ids.ac_calibra_t,porcentaje:35});
      });
    });
    n++;
  }
  /* --- Lavado pasa a ser su propia fase; el diagnóstico se abre en
     desarme + prueba en banco + informe, y su tiempo se reparte. --- */
  if((DB.meta.version||0) < 9){
    const norm=x=>sinTildes(x).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
    const buscar=nb=>DB.actividades.find(a=>norm(a.nombre)===norm(nb));
    const lav=buscar("Lavado / limpieza"); if(lav) lav.fase="Lavado";
    const diag=buscar("Diagnóstico");
    const crear=(nombre,fase,cuartos,extra)=>{
      let a=buscar(nombre);
      if(!a){ a={id:uid("ac"),nombre,orden:1,fase,cuartos:cuartos||[],noProductiva:false,porOrden:false};
        DB.actividades.push(a); n++; }
      a.fase=fase; a.cuartos=cuartos||[]; Object.assign(a, extra||{});
      return a;
    };
    const des=crear("Desarme","Diagnóstico",[]);
    const test=crear("Prueba en banco","Diagnóstico",["cu_elec"]);
    const tob=crear("Prueba inyector / tobera","Diagnóstico",["cu_unit","cu_mec"]);
    const inf=crear("Informe técnico","Diagnóstico",[],{porOrden:true});
    /* el tiempo del diagnóstico se convierte en el reparto de sus tres pasos */
    if(diag){
      DB.tiposComponente.forEach(t=>{
        const e=DB.estandares.find(x=>x.tipoComponenteId===t.id && x.actividadId===diag.id);
        if(!e) return;
        const prueba = /electronico/.test(sinTildes(nom(DB.cuartos,t.cuartoId))) ? test : tob;
        const total=e.minutos;
        DB.estandares=DB.estandares.filter(x=>x!==e);
        /* desarme 40% · prueba 45% · informe 15%, redondeando al total */
        const d=Math.round(total*0.40), p=Math.round(total*0.45), i=total-d-p;
        if(d) DB.estandares.push({id:uid("es"),tipoComponenteId:t.id,tipologiaId:"*",actividadId:des.id,minutos:d});
        if(p) DB.estandares.push({id:uid("es"),tipoComponenteId:t.id,tipologiaId:"*",actividadId:prueba.id,minutos:p});
        if(i>0 && !DB.estandares.some(x=>x.tipoComponenteId===t.id && x.actividadId===inf.id))
          DB.estandares.push({id:uid("es"),tipoComponenteId:t.id,tipologiaId:"*",actividadId:inf.id,minutos:i});
        n++;
      });
      /* los registros que usaban "Diagnóstico" pasan al desarme */
      DB.registros.forEach(r=>{ if(r.actividadId===diag.id){ r.actividadId=des.id; n++; } });
      DB.actividades=DB.actividades.filter(a=>a.id!==diag.id);
      DB.repartos=DB.repartos.filter(r=>r.actividadId!==diag.id);
    }
    n++;
  }
  /* --- v23: foto del componente en cada registro ---------------------------
     Hasta v22 el registro solo guardaba ids. Si la orden se recreaba (import,
     depuración, sincronización desde otro equipo), el registro quedaba huérfano:
     sin OT, sin componente y con 0 horas estándar. Aquí se rellena la foto de
     todos los que todavía tienen su componente vivo. --------------------- */
  (DB.registros||[]).forEach(r=>{
    const c = byId(DB.componentes, r.componenteId);
    if(c){
      if(!r.tipoComponenteId){ r.tipoComponenteId=c.tipoComponenteId; n++; }
      if(r.tipologiaId===undefined){ r.tipologiaId=c.tipologiaId||null; n++; }
      if(!r.compTexto){ r.compTexto=nom(DB.tiposComponente,c.tipoComponenteId,""); n++; }
    }
    const o = byId(DB.ordenes, r.ordenId);
    if(o && !r.otTexto){ r.otTexto=o.ot; n++; }
    if(!r.cuartoId && c && c.cuartoId){ r.cuartoId=c.cuartoId; n++; }
  });
  /* --- v23: nombres de maestros sin espacios sobrantes ----------------------
     "Balanceo " y "Balanceo" se veían como dos actividades distintas en los
     informes. Se recortan una sola vez. ---------------------------------- */
  if(!Array.isArray(DB.ausencias)){ DB.ausencias=[]; n++; }
  /* --- v25: renumerar órdenes y componentes con identificadores estables ---
     Se recalcula el id de cada orden y componente a partir de su contenido y
     se arrastran las referencias de registros y componentes. A partir de aquí
     todos los equipos coinciden y los registros dejan de quedar "sin OT". */
  if(!DB.meta.idsEstables){
    const mapaO={}, mapaC={}, usadosO=new Set(), usadosC=new Set();
    DB.ordenes.forEach(o=>{
      let nid=idOrden(o.ot,o.cuartoDeclaradoId||"",o.fechaIngreso||"");
      while(usadosO.has(nid)) nid=nid+"x";          /* choque: se desempata */
      usadosO.add(nid); if(nid!==o.id){ mapaO[o.id]=nid; o.id=nid; n++; }
    });
    DB.componentes.forEach(c=>{
      if(mapaO[c.ordenId]) c.ordenId=mapaO[c.ordenId];
      let nid=idComponente(c.ordenId,c.tipoComponenteId,c.tipologiaId||null);
      while(usadosC.has(nid)) nid=nid+"x";
      usadosC.add(nid); if(nid!==c.id){ mapaC[c.id]=nid; c.id=nid; n++; }
    });
    /* Cada equipo arregla SUS registros: los que nacieron aquí conocen la orden
       y quedan apuntando al identificador estable. Se marca la hora para que,
       al sincronizar, esta versión corregida le gane a la rota que tengan los
       demás equipos. Así el arreglo viaja solo y nadie corrige a mano. */
    const ahora=new Date().toISOString();
    DB.registros.forEach(r=>{
      let toco=false;
      if(r.ordenId && mapaO[r.ordenId]){ r.ordenId=mapaO[r.ordenId]; toco=true; }
      if(r.componenteId && mapaC[r.componenteId]){ r.componenteId=mapaC[r.componenteId]; toco=true; }
      if(toco){
        const c=byId(DB.componentes,r.componenteId), o=byId(DB.ordenes,r.ordenId);
        if(c && !r.tipoComponenteId){ r.tipoComponenteId=c.tipoComponenteId; r.tipologiaId=c.tipologiaId||null;
          r.compTexto=r.compTexto||nom(DB.tiposComponente,c.tipoComponenteId,""); }
        if(o && !r.otTexto) r.otTexto=o.ot;
        r.actualizado=ahora;                /* para que gane en la sincronización */
        n++;
      }
    });
    /* Se guarda la equivalencia viejo -> nuevo. Este equipo sabe que su
       or_msonz3w3wymdl era la OT 4854; los demás equipos no tienen forma de
       adivinarlo. Compartiendo el mapa, cada uno repara los registros ajenos
       que le llegaron rotos. */
    DB.meta.remapeoIds = Object.assign({}, DB.meta.remapeoIds||{}, mapaO, mapaC);
    DB.meta.idsEstables=true; n++;
  }
  ["cuartos","tecnicos","tiposComponente","tipologias","actividades","clientes"].forEach(k=>{
    (DB[k]||[]).forEach(x=>{ if(typeof x.nombre==="string" && x.nombre!==x.nombre.trim()){ x.nombre=x.nombre.trim(); n++; } });
  });
  ["estados","estadosCerrados","motivos","tiposNovedad"].forEach(k=>{
    if(Array.isArray(DB[k])){
      const antes=DB[k].join("|");
      DB[k]=[...new Set(DB[k].map(x=>String(x).trim()).filter(Boolean))];
      if(DB[k].join("|")!==antes) n++;
    }
  });
  /* v24: cada tipo de componente recuerda cuánto dice la empresa que vale su
     reparación, para poder avisar cuando los minutos no cuadran. */
  (DB.tiposComponente||[]).forEach(t=>{ if(t.estandarReparacion===undefined){ t.estandarReparacion=0; n++; } });
  DB.meta.version=11;
  return n;
}
async function cargar(){
  const raw = await Store.get(KEY, true);
  DB = raw && raw.meta ? raw : semilla();
  ["ordenes","componentes","registros","cuartos","tecnicos","tiposComponente","tipologias","actividades","estandares","repartos","clientes","estados","estadosCerrados","motivos","festivos","tiposNovedad"].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
  if(!DB.meta.conexion) DB.meta.conexion={modo:"",csvUrl:"",gsUrl:"",autoMin:10,mapa:null,ultimaSync:"",ultimoError:""};
  const ajustes = migrar();
  if(ajustes) await guardar();
  YO = await Store.get(KEY_ME, false);
  /* La coordinación no queda abierta: si hay clave, se vuelve a pedir al abrir. */
  const me = YO ? byId(DB.tecnicos, YO) : null;
  if(me && me.rol==="coordinador" && DB.meta.pin){ YO=null; }
}
async function guardar(){ guardando=true; const ok = await Store.set(KEY, DB, true); guardando=false; if(!ok) toast("No se pudo guardar. Exporta un respaldo."); return ok; }
async function commit(fn, msg){
  const remoto = await Store.get(KEY, true);
  if(remoto && remoto.meta){ DB = remoto; migrar(); }                       // trae lo último del taller
  ["ordenes","componentes","registros"].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
  fn();
  await guardar();
  if(msg) toast(msg);
  render();
}

/* ---- maestros: se guardan sin redibujar (si no, el botón se va antes del clic) ---- */
const MAESTROS=["cuartos","tecnicos","tiposComponente","tipologias","actividades","estandares","repartos","clientes","estados","estadosCerrados","motivos","festivos","tiposNovedad","ausencias"];
/* Las órdenes que vienen de la hoja se reconstruyen igual en cada equipo
   (por eso los identificadores estables). Pero las que alguien crea A MANO
   —porque el componente llegó antes de que bodega lo anotara— solo existen
   en ese equipo. Estas sí tienen que viajar. Son pocas, así que van con la
   configuración y se MEZCLAN por id en vez de reemplazar: así nadie borra
   lo que agregó otro. */
function paqueteMaestros(){
  const p={ts:DB.meta.configTs||0, horario:DB.meta.horario, pin:DB.meta.pin||""};
  MAESTROS.forEach(k=>p[k]=DB[k]);
  p.ordenesManuales   = DB.ordenes.filter(o=>o.origen==="manual");
  p.componentesManuales = DB.componentes.filter(c=>c.origen==="manual");
  p.remapeoIds        = DB.meta.remapeoIds||{};
  return p;
}
function mezclarPorId(lista, entrantes){
  const hay=new Set(lista.map(x=>x.id));
  let n=0;
  (entrantes||[]).forEach(x=>{ if(x && x.id && !hay.has(x.id)){ lista.push(x); hay.add(x.id); n++; } });
  return n;
}
function aplicarMaestros(p){
  if(!p) return false;
  /* Lo creado a mano se mezcla SIEMPRE, aunque la configuración no sea más
     nueva: son datos que se suman, nunca se pisan entre sí. */
  let sumadas = mezclarPorId(DB.ordenes, p.ordenesManuales)
              + mezclarPorId(DB.componentes, p.componentesManuales);
  if(p.remapeoIds){                       /* las equivalencias se suman entre equipos */
    const mio=DB.meta.remapeoIds||{}; let nuevas=0;
    Object.keys(p.remapeoIds).forEach(k=>{ if(!mio[k]){ mio[k]=p.remapeoIds[k]; nuevas++; } });
    if(nuevas){ DB.meta.remapeoIds=mio; sumadas+=nuevas; migrar(); }
  }
  if(!p.ts || (DB.meta.configTs||0)>=p.ts) return sumadas>0;
  MAESTROS.forEach(k=>{ if(Array.isArray(p[k])) DB[k]=p[k]; });
  if(p.horario) DB.meta.horario=p.horario;
  if(p.pin!==undefined) DB.meta.pin=p.pin;
  DB.meta.configTs=p.ts;
  return true;
}
async function commitMaestro(fn, msg, quieto){
  const remoto = await Store.get(KEY, true);
  if(remoto && remoto.meta){ DB = remoto; migrar(); }
  fn();
  DB.meta.configTs = Date.now();
  await guardar();
  empujarConfig().catch(()=>{});
  if(msg) toast(msg);
  if(!quieto) render();
}

/* =========================================================================
   DIÁLOGOS PROPIOS
   Los confirm() y prompt() del navegador se pueden desactivar ("impedir que
   esta página cree más diálogos") y entonces fallan en silencio. Estos no.
   ========================================================================= */
function dialogo(op){
  return new Promise(res=>{
    const conInput = !!op.input;
    const d=document.createElement("div");
    d.className="modal dlg"; d.style.zIndex="90";
    d.innerHTML=`<div class="box" style="max-width:440px">
      <header><h3>${esc(op.titulo||"Confirmar")}</h3></header>
      <div class="bd">
        ${op.mensaje?`<div style="white-space:pre-line;font-size:14px;line-height:1.5;margin-bottom:14px">${esc(op.mensaje)}</div>`:""}
        ${conInput?`<label class="f"><span>${esc(op.input.etiqueta||"")}</span>
          <input type="${op.input.tipo||"text"}" id="dlgIn" value="${esc(op.input.valor||"")}" placeholder="${esc(op.input.placeholder||"")}"></label>`:""}
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
          <button class="btn" data-no>${esc(op.cancelar||"Cancelar")}</button>
          <button class="btn ${op.peligro?"warn":"primary"}" data-si>${esc(op.ok||"Confirmar")}</button>
        </div></div></div>`;
    document.body.appendChild(d);
    const salir=v=>{ d.remove(); res(v); };
    d.querySelector("[data-no]").onclick=()=>salir(conInput?null:false);
    d.querySelector("[data-si]").onclick=()=>salir(conInput?d.querySelector("#dlgIn").value:true);
    d.addEventListener("click",e=>{ if(e.target===d) salir(conInput?null:false); });
    const inp=d.querySelector("#dlgIn");
    if(inp){ setTimeout(()=>{inp.focus();inp.select();},60);
      inp.onkeydown=e=>{ if(e.key==="Enter") d.querySelector("[data-si]").click(); }; }
    else setTimeout(()=>d.querySelector("[data-si]").focus(),60);
  });
}
const confirmar = (titulo,mensaje,ok)=>dialogo({titulo,mensaje,ok:ok||"Eliminar",peligro:true});
const pedirTexto = (titulo,etiqueta,valor,tipo)=>dialogo({titulo,ok:"Aceptar",input:{etiqueta,valor,tipo}});
